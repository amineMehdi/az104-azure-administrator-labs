    validationContext: '$availabilitySet = "avset-$suffix"; $vnet = "vnet-$suffix"; $vmss = "vmss-$suffix"; $autoscale = "autoscale-$suffix"

      $availabilityVnet = "av-vnet-$suffix"; $availabilityNic = "av-nic-$suffix"; $availabilityVm = "av-vm-$suffix"; $moveResourceGroup
      = "rg-az104-l12-move-$RunId"'
    preflightChecks:
    - id: preflight.authored.service
      type: sku
      required: true
      description: Prove verify zone, availability-set, and vmss regional support with LAB-12's authored read-only provider,
        feature, tool, region, and SKU queries.
      command: '$registration = az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Compute is not registered.'' }

        $insights = az provider show --namespace Microsoft.Insights --query registrationState --output tsv

        if ($insights -ne ''Registered'') { throw ''Microsoft.Insights is not registered.'' }

        $zoneSku = az vm list-skus --location $Location --size Standard_B1s --zone --all --query "[?name==''Standard_B1s'']
        | length(@)" --output tsv

        if ([int]$zoneSku -lt 1) { throw ''The selected region does not advertise a zonal Standard_B1s placement.'' }'
      expected: The selected region exposes the documented VM SKU plus the placement capabilities required by the availability-set
        and scale-set designs.
    scenario: 'You are a reliability administrator designing resilient compute. Build and prove this disposable service path: One private VM is placed in an availability set while a separate VMSS feeds
      an autoscale profile; the standalone VM, NIC, disk, VNet, and availability set then move together into a second tagged
      resource-group boundary.'
  13-acr-aci:
    role: A container administrator publishing an approved image and running it in ACI.
    outcome: Use Azure CLI in PowerShell to create the private-admin acr registry, publish and identify the run-owned container
      image, and reconcile image provenance, identity, and container state, with recoverable state and deterministic cleanup.
    primer: ACR is the managed image registry; ACI runs container groups without an orchestrator. The image reference, registry
      authentication, CPU, memory, ports, restart policy, and logs form the operational contract.
    designDecisions:
    - Keep the ACR admin account disabled.
    - Import a known sample into the lab registry.
    - Run ACI from the ACR image using a bounded authentication path.
    architectureWalkthrough: An ACR build produces the run-tagged image, a user-assigned identity receives AcrPull at registry
      scope, and ACI uses that identity to pull and run the image without registry passwords.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB13-CP01
      title: Verify ACR and ACI regional capability
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify acr and aci regional
        capability, without changing Azure state.
      operationalRelevance: 'The change is unsafe when aCI image pulls can fail in a region even when ACR itself is available
        there. This checkpoint therefore proves: The selected region accepts registry and container-group discovery, and required
        providers are registered.'
      objectiveIds:
      - CP-CONTAINERS-01
      command: 'az provider show --namespace Microsoft.ContainerRegistry --query registrationState --output tsv

        az provider show --namespace Microsoft.ContainerInstance --query registrationState --output tsv

        az provider show --namespace Microsoft.ManagedIdentity --query registrationState --output tsv'
      expectedState: The selected region accepts registry and container-group discovery, and required providers are registered.
      representativeOutput: The selected region accepts registry and container-group discovery, and required providers are
        registered.
      positiveCommand: '$registration = az provider show --namespace Microsoft.ContainerRegistry --query registrationState
        --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.ContainerRegistry is not registered.'' }'
      positiveExpected: The selected region accepts registry and container-group discovery, and required providers are registered.
      negativeCommand: '$registration = az provider show --namespace Microsoft.ContainerInstance --query registrationState
        --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.ContainerInstance is not registered.'' }'
      negativeExpected: 'LAB13-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Microsoft.ContainerInstance is not registered.'
      evidence:
      - LAB13-CP01 UTC result for verify acr and aci regional capability.
      - Exact run-owned resource/object ID returned by the commands in LAB13-CP01.
      - 'Positive assertion proving: The selected region accepts registry and container-group discovery, and required providers
        are registered.'
      - 'Negative assertion proving absence of: Microsoft.ContainerInstance is not registered.'
      commonFailure: ACI image pulls can fail in a region even when ACR itself is available there.
      safeRetry: Retry LAB13-CP01 for verify acr and aci regional capability only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB13-CP02, LAB13-CP03, LAB13-CP04, LAB13-CP05, remove the exact manifest IDs created or configured
        by LAB13-CP01 for verify acr and aci regional capability; its residual probe must then return zero active IDs.
    - id: LAB13-CP02
      title: Create the private-admin ACR registry
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the private-admin acr registry,
        so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a globally unique registry-name collision or unregistered ContainerRegistry
        provider blocks creation. This checkpoint therefore proves: The Basic registry is ready, admin credentials remain
        disabled, and its exact login server is recorded.'
      objectiveIds:
      - CP-CONTAINERS-02
      command: '$registry = "acr13$suffix"; $container = "aci-$suffix"; $identity = "id-$suffix"

        az acr create --resource-group $ResourceGroupName --name $registry --sku Basic --admin-enabled false --output none

        az acr import --name $registry --source mcr.microsoft.com/azuredocs/aci-helloworld:latest --image az104/hello:v1 --output
        none

        az identity create --resource-group $ResourceGroupName --name $identity --location $Location --output none'
      expectedState: The Basic registry is ready, admin credentials remain disabled, and its exact login server is recorded.
      representativeOutput: The Basic registry is ready, admin credentials remain disabled, and its exact login server is
        recorded.
      positiveCommand: '$tag = az acr repository show-tags --name $registry --repository az104/hello --query "[?@==''v1'']
        | [0]" --output tsv

        if ($tag -ne ''v1'') { throw ''The v1 image tag is missing.'' }'
      positiveExpected: The Basic registry is ready, admin credentials remain disabled, and its exact login server is recorded.
      negativeCommand: '$admin = az acr show --resource-group $ResourceGroupName --name $registry --query adminUserEnabled
        --output tsv

        if ($admin -ne ''false'') { throw ''The ACR admin account is enabled.'' }'
      negativeExpected: 'LAB13-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        The ACR admin account is enabled.'
      evidence:
      - LAB13-CP02 UTC result for create the private-admin acr registry.
      - Exact run-owned resource/object ID returned by the commands in LAB13-CP02.
      - 'Positive assertion proving: The Basic registry is ready, admin credentials remain disabled, and its exact login server
        is recorded.'
      - 'Negative assertion proving absence of: The ACR admin account is enabled.'
      commonFailure: A globally unique registry-name collision or unregistered ContainerRegistry provider blocks creation.
      safeRetry: Retry LAB13-CP02 for create the private-admin acr registry only after its exact recorded ID and current property
        are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create command,
        then rerun both assertions.
      cleanupDependency: After LAB13-CP03, LAB13-CP04, LAB13-CP05, remove the exact manifest IDs created or configured by
        LAB13-CP02 for create the private-admin acr registry; its residual probe must then return zero active IDs.
    - id: LAB13-CP03
      title: Publish and identify the run-owned container image
      purpose: Configure and independently inspect the control-plane and data-path properties needed to publish and identify
        the run-owned container image.
      operationalRelevance: 'The change is unsafe when a build can fail when the registry cannot reach the build context or
        the tag differs from the deployment reference. This checkpoint therefore proves: The tagged image manifest exists
        in ACR and is addressable by the immutable run-specific repository tag.'
      objectiveIds:
      - CP-CONTAINERS-04
      command: '$acrId = az acr show --resource-group $ResourceGroupName --name $registry --query id --output tsv

        $identityId = az identity show --resource-group $ResourceGroupName --name $identity --query id --output tsv

        $principalId = az identity show --resource-group $ResourceGroupName --name $identity --query principalId --output
        tsv

        az role assignment create --assignee-object-id $principalId --assignee-principal-type ServicePrincipal --role AcrPull
        --scope $acrId --output none

        az container create --resource-group $ResourceGroupName --name $container --image "$registry.azurecr.io/az104/hello:v1"
        --assign-identity $identityId --acr-identity $identityId --registry-login-server "$registry.azurecr.io" --cpu 1 --memory
        1 --restart-policy OnFailure --ports 80 --ip-address Public --dns-name-label "aci-$suffix" --output none'
      expectedState: The tagged image manifest exists in ACR and is addressable by the immutable run-specific repository tag.
      representativeOutput: The tagged image manifest exists in ACR and is addressable by the immutable run-specific repository
        tag.
      positiveCommand: '$image = az container show --resource-group $ResourceGroupName --name $container --query "containers[0].image"
        --output tsv

        if ($image -ne "$registry.azurecr.io/az104/hello:v1") { throw "Unexpected image: $image" }'
      positiveExpected: The tagged image manifest exists in ACR and is addressable by the immutable run-specific repository
        tag.
      negativeCommand: '$admin = az acr show --resource-group $ResourceGroupName --name $registry --query adminUserEnabled
        --output tsv

        if ($admin -ne ''false'') { throw ''The ACR admin account is enabled.'' }'
      negativeExpected: 'LAB13-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        The ACR admin account is enabled.'
      evidence:
      - LAB13-CP03 UTC result for publish and identify the run-owned container image.
      - Exact run-owned resource/object ID returned by the commands in LAB13-CP03.
      - 'Positive assertion proving: The tagged image manifest exists in ACR and is addressable by the immutable run-specific
        repository tag.'
      - 'Negative assertion proving absence of: The ACR admin account is enabled.'
      commonFailure: A build can fail when the registry cannot reach the build context or the tag differs from the deployment
        reference.
      safeRetry: Retry LAB13-CP03 for publish and identify the run-owned container image only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB13-CP04, LAB13-CP05, remove the exact manifest IDs created or configured by LAB13-CP03 for
        publish and identify the run-owned container image; its residual probe must then return zero active IDs.
    - id: LAB13-CP04
      title: Run ACI with managed identity image access
      purpose: Exercise the deterministic operational or denied path needed to run aci with managed identity image access,
