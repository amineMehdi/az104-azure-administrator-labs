  12-vm-resilience-scale-mobility:
    role: A reliability administrator designing resilient compute.
    outcome: Use Azure CLI in PowerShell to place a vm in the run-owned availability set, deploy a resilient vm scale set
      with autoscale, and reconcile placement, scaling, and both ownership boundaries, with recoverable state and deterministic
      cleanup.
    primer: Availability sets, zones, and VM scale sets address different failure and scale boundaries. Autoscale requires
      safe minimum, maximum, and default capacity. Resource move validation predicts blockers but does not move the workload.
    designDecisions:
    - Use bounded autoscale capacity.
    - Separate resilience placement from scaling behavior.
    - Validate a move before requesting it.
    architectureWalkthrough: One private VM is placed in an availability set while a separate VMSS feeds an autoscale profile;
      the standalone VM, NIC, disk, VNet, and availability set then move together into a second tagged resource-group boundary.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB12-CP01
      title: Verify zone, availability-set, and VMSS regional support
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify zone, availability-set,
        and vmss regional support, without changing Azure state.
      operationalRelevance: 'The change is unsafe when a region can list a VM SKU while restricting zones or capacity for
        the subscription. This checkpoint therefore proves: The selected region exposes the documented VM SKU plus the placement
        capabilities required by the availability-set and scale-set designs.'
      objectiveIds:
      - CP-VM-03
      command: 'az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        az provider show --namespace Microsoft.Insights --query registrationState --output tsv

        az vm list-skus --location $Location --size Standard_B1s --all --query ''[?restrictions==null || length(restrictions)==`0`].name''
        --output tsv

        az vm list-skus --location $Location --size Standard_B1s --zone --all --query "[?name==''Standard_B1s''].name" --output
        tsv

        if (-not (Get-Command ssh-keygen -ErrorAction SilentlyContinue)) { throw ''ssh-keygen is required to create the disposable
        key in the run state directory.'' }'
      expectedState: The selected region exposes the documented VM SKU plus the placement capabilities required by the availability-set
        and scale-set designs.
      representativeOutput: The selected region exposes the documented VM SKU plus the placement capabilities required by
        the availability-set and scale-set designs.
      positiveCommand: '$registration = az provider show --namespace Microsoft.Compute --query registrationState --output
        tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Compute is not registered.'' }'
      positiveExpected: The selected region exposes the documented VM SKU plus the placement capabilities required by the
        availability-set and scale-set designs.
