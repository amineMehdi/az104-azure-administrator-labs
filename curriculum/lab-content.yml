    breakFix:
      injection: Route 100 percent of traffic to one revision, removing the intended canary split.
      symptom: The canary revision no longer receives the planned 10 percent sample.
      diagnosis: Compare active revision names with the ingress traffic weights.
      repair: Restore the recorded 90/10 split using exact active revision names.
      injectCommand: '$revisions = @(az containerapp revision list --resource-group $ResourceGroupName --name $app --query
        "[?properties.active].name" --output tsv)

        az containerapp ingress traffic set --resource-group $ResourceGroupName --name $app --revision-weight "$($revisions[0])=100"
        "$($revisions[-1])=0" --output none'
