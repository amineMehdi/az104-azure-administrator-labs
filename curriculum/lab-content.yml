      representativeOutput: The storage private-link resource exposes the blob group ID and the selected region accepts private
        endpoints.
      positiveCommand: '$network = az provider show --namespace Microsoft.Network --query registrationState --output tsv

        if ($network -ne ''Registered'') { throw ''Microsoft.Network is not registered.'' }'
      positiveExpected: The storage private-link resource exposes the blob group ID and the selected region accepts private
        endpoints.
      negativeCommand: '$storageProvider = az provider show --namespace Microsoft.Storage --query registrationState --output
        tsv

        if ($storageProvider -ne ''Registered'') { throw ''Microsoft.Storage is not registered.'' }'
