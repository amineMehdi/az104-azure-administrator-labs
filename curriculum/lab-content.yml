  16-app-service-tls-dns-backup-network:
    role: An application-platform administrator hardening and protecting a web app.
    outcome: Use Azure CLI in PowerShell to create the web app, integration subnet, and backup storage, enforce https and
      integrate outbound traffic with the vnet, and reconcile tls, networking, backup, and dns gates, with recoverable state
      and deterministic cleanup.
    primer: HTTPS policy, custom DNS, certificates, backup, VNet integration, and private access are separate App Service
      controls. DNS and certificate work must be gated because ownership and secret material cannot be fabricated by a lab.
    designDecisions:
    - Enforce HTTPS and minimum TLS first.
    - Delegate only the integration subnet.
    - Keep backup SAS and certificate secrets transient.
    architectureWalkthrough: The web app enforces HTTPS/TLS, sends outbound traffic through a delegated integration subnet,
      writes backups to private Blob storage through a transient SAS, and binds a managed certificate only after the owned
      hostname resolves to the app.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB16-CP01
      title: Verify owned-domain, TLS, backup, and VNet prerequisites
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify owned-domain,
        tls, backup, and vnet prerequisites, without changing Azure state.
      operationalRelevance: 'The change is unsafe when custom hostname or certificate operations fail safely when domain ownership
        cannot be proven. This checkpoint therefore proves: The web-app tier supports backup and VNet integration, and any
        custom-domain lane is explicitly gated by an owned DNS proof.'
      objectiveIds:
      - CP-APP-04
      command: 'az provider show --namespace Microsoft.Web --query registrationState --output tsv

        az provider show --namespace Microsoft.Storage --query registrationState --output tsv

        az appservice list-locations --sku S1 --linux-workers-enabled --query "[?name==''$Location''].name" --output tsv'
      expectedState: The web-app tier supports backup and VNet integration, and any custom-domain lane is explicitly gated
        by an owned DNS proof.
      representativeOutput: The web-app tier supports backup and VNet integration, and any custom-domain lane is explicitly
        gated by an owned DNS proof.
      positiveCommand: '$registration = az provider show --namespace Microsoft.Web --query registrationState --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Web is not registered.'' }'
      positiveExpected: The web-app tier supports backup and VNet integration, and any custom-domain lane is explicitly gated
        by an owned DNS proof.
      negativeCommand: '$supported = az appservice list-locations --sku S1 --linux-workers-enabled --query "[?name==''$Location'']
        | length(@)" --output tsv

        if ([int]$supported -eq 0) { throw ''Linux S1 is unavailable in the selected region.'' }'
      negativeExpected: 'LAB16-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Linux S1 is unavailable in the selected region.'
      evidence:
      - LAB16-CP01 UTC result for verify owned-domain, tls, backup, and vnet prerequisites.
      - Exact run-owned resource/object ID returned by the commands in LAB16-CP01.
      - 'Positive assertion proving: The web-app tier supports backup and VNet integration, and any custom-domain lane is
        explicitly gated by an owned DNS proof.'
      - 'Negative assertion proving absence of: Linux S1 is unavailable in the selected region.'
      commonFailure: Custom hostname or certificate operations fail safely when domain ownership cannot be proven.
      safeRetry: Retry LAB16-CP01 for verify owned-domain, tls, backup, and vnet prerequisites only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB16-CP02, LAB16-CP03, LAB16-CP04, LAB16-CP05, remove the exact manifest IDs created or configured
        by LAB16-CP01 for verify owned-domain, tls, backup, and vnet prerequisites; its residual probe must then return zero
