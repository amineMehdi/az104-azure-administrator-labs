    - id: LAB19-CP02
      title: Create a locked-down storage service and endpoint subnet
      purpose: Provision and immediately inventory the exact run-owned resources needed to create a locked-down storage service
        and endpoint subnet, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when disabling public access before private DNS is ready can make all data-plane
        tests appear broken. This checkpoint therefore proves: The storage account denies public network access and the endpoint
        subnet has private-endpoint policies configured for the design.'
      objectiveIds:
      - CP-APP-07
      command: '$vnet = "vnet-$suffix"; $storage = "st19$suffix"; $endpoint = "pe-$suffix"; $zone = "privatelink.blob.core.windows.net"

        az network vnet create --resource-group $ResourceGroupName --name $vnet --address-prefixes 10.19.0.0/16 --subnet-name
        service --subnet-prefixes 10.19.1.0/24 --output none

        az network vnet subnet update --resource-group $ResourceGroupName --vnet-name $vnet --name service --service-endpoints
        Microsoft.Storage --output none

        az network vnet subnet create --resource-group $ResourceGroupName --vnet-name $vnet --name private --address-prefixes
        10.19.2.0/24 --disable-private-endpoint-network-policies true --output none

        az storage account create --resource-group $ResourceGroupName --name $storage --location $Location --sku Standard_LRS
        --kind StorageV2 --https-only true --allow-blob-public-access false --output none

        $serviceSubnetId = az network vnet subnet show --resource-group $ResourceGroupName --vnet-name $vnet --name service
        --query id --output tsv

        az storage account network-rule add --resource-group $ResourceGroupName --account-name $storage --subnet $serviceSubnetId
        --output none

        az storage account update --resource-group $ResourceGroupName --name $storage --default-action Deny --output none

        $storageId = az storage account show --resource-group $ResourceGroupName --name $storage --query id --output tsv

        az network private-endpoint create --resource-group $ResourceGroupName --name $endpoint --location $Location --vnet-name
        $vnet --subnet private --private-connection-resource-id $storageId --group-id blob --connection-name "conn-$suffix"
        --output none

        az network private-dns zone create --resource-group $ResourceGroupName --name $zone --output none

        az network private-dns link vnet create --resource-group $ResourceGroupName --zone-name $zone --name "link-$suffix"
        --virtual-network $vnet --registration-enabled false --output none'
      expectedState: The storage account denies public network access and the endpoint subnet has private-endpoint policies
