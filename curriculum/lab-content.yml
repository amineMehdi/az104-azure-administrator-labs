  27-capstone-operate-recover:
    role: An on-call Azure administrator operating and recovering a governed workload.
    outcome: Use Azure CLI in PowerShell to create the private workload and telemetry foundation, generate telemetry and configure
      an actionable alert, and back up, restore, and reconcile operational evidence, with recoverable state and deterministic
      cleanup.
    primer: Operations begins with inventory and evidence, then narrows symptoms through access, Policy, network, monitoring,
      and recovery layers. The capstone rewards diagnosis before mutation and recovery that is tested without endangering
      production.
    designDecisions:
    - Capture baseline evidence before injecting a fault.
    - Change only the diagnosed cause.
    - Verify restore or recovery outcome before dependency-aware cleanup.
    architectureWalkthrough: The private VM and storage workload emit deterministic telemetry to Log Analytics and a scoped
      alert; effective NSG diagnosis repairs an injected outage, while Recovery Services backup and disk restore prove recoverability.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB27-CP01
      title: Verify operations and recovery prerequisites
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify operations and
        recovery prerequisites, without changing Azure state.
      operationalRelevance: 'The change is unsafe when a missing diagnostic category or unsupported backup workload can block
        evidence after compute already exists. This checkpoint therefore proves: VM, Network Watcher, Monitor, Storage, and
        Recovery Services capabilities are available for the selected region and SKU.'
      objectiveIds:
      - IG-ACCESS-03
      command: 'az provider show --namespace Microsoft.Insights --query registrationState --output tsv

        az provider show --namespace Microsoft.RecoveryServices --query registrationState --output tsv

        az vm list-skus --location $Location --size Standard_B1s --all --query "[?name==''Standard_B1s''].name" --output tsv

        if (-not (Get-Command ssh-keygen -ErrorAction SilentlyContinue)) { throw ''ssh-keygen is required for the workload
        key.'' }'
      expectedState: VM, Network Watcher, Monitor, Storage, and Recovery Services capabilities are available for the selected
        region and SKU.
      representativeOutput: VM, Network Watcher, Monitor, Storage, and Recovery Services capabilities are available for the
        selected region and SKU.
      positiveCommand: '$insights = az provider show --namespace Microsoft.Insights --query registrationState --output tsv

        if ($insights -ne ''Registered'') { throw ''Microsoft.Insights is not registered.'' }'
      positiveExpected: VM, Network Watcher, Monitor, Storage, and Recovery Services capabilities are available for the selected
        region and SKU.
      negativeCommand: '$recovery = az provider show --namespace Microsoft.RecoveryServices --query registrationState --output
        tsv

        if ($recovery -ne ''Registered'') { throw ''Microsoft.RecoveryServices is not registered.'' }'
      negativeExpected: 'LAB27-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Microsoft.RecoveryServices is not registered.'
      evidence:
      - LAB27-CP01 UTC result for verify operations and recovery prerequisites.
      - Exact run-owned resource/object ID returned by the commands in LAB27-CP01.
      - 'Positive assertion proving: VM, Network Watcher, Monitor, Storage, and Recovery Services capabilities are available
        for the selected region and SKU.'
      - 'Negative assertion proving absence of: Microsoft.RecoveryServices is not registered.'
      commonFailure: A missing diagnostic category or unsupported backup workload can block evidence after compute already
        exists.
      safeRetry: Retry LAB27-CP01 for verify operations and recovery prerequisites only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB27-CP02, LAB27-CP03, LAB27-CP04, LAB27-CP05, remove the exact manifest IDs created or configured
        by LAB27-CP01 for verify operations and recovery prerequisites; its residual probe must then return zero active IDs.
    - id: LAB27-CP02
      title: Create the private workload and telemetry foundation
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the private workload and
        telemetry foundation, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a private VM created without a usable NIC/SSH-key workflow can provision
        but remain impossible to diagnose as designed. This checkpoint therefore proves: The private VM, storage account,
        workspace, vault, and network-security boundary are recorded immediately after creation.'
      objectiveIds:
      - IG-GOVERN-01
      command: '$workspace = "law-$suffix"; $vault = "rsv-$suffix"; $vnet = "vnet-$suffix"; $nsg = "nsg-$suffix"; $vm = "vm-$suffix";
        $storage = "st27$suffix"; $actionGroup = "ag-$suffix"; $alert = "alert-$suffix"

        $keyPath = Join-Path $StateDir ''id_ed25519''; ssh-keygen -t ed25519 -N '''' -f $keyPath | Out-Null

        az monitor log-analytics workspace create --resource-group $ResourceGroupName --workspace-name $workspace --location
        $Location --retention-time 30 --output none

        az storage account create --resource-group $ResourceGroupName --name $storage --location $Location --sku Standard_LRS
        --kind StorageV2 --https-only true --allow-blob-public-access false --output none

        az network nsg create --resource-group $ResourceGroupName --name $nsg --location $Location --output none

        az network vnet create --resource-group $ResourceGroupName --name $vnet --address-prefixes 10.27.0.0/16 --subnet-name
        workload --subnet-prefixes 10.27.1.0/24 --network-security-group $nsg --output none

        az network nic create --resource-group $ResourceGroupName --name "nic-$suffix" --vnet-name $vnet --subnet workload
        --network-security-group $nsg --output none

        az vm create --resource-group $ResourceGroupName --name $vm --image Ubuntu2204 --size Standard_B1s --admin-username
        azureadmin --ssh-key-values "$keyPath.pub" --nics "nic-$suffix" --output none

        az backup vault create --resource-group $ResourceGroupName --name $vault --location $Location --output none'
      expectedState: The private VM, storage account, workspace, vault, and network-security boundary are recorded immediately
        after creation.
      representativeOutput: The private VM, storage account, workspace, vault, and network-security boundary are recorded
        immediately after creation.
      positiveCommand: '$running = az vm show --resource-group $ResourceGroupName --name $vm --show-details --query powerState
        --output tsv

        if ($running -notmatch ''running'') { throw "Workload VM power state is $running." }'
      positiveExpected: The private VM, storage account, workspace, vault, and network-security boundary are recorded immediately
        after creation.
      negativeCommand: '$publicIp = az vm show --resource-group $ResourceGroupName --name $vm --show-details --query publicIps
        --output tsv

        if ($publicIp) { throw ''The operated VM unexpectedly has a public IP.'' }'
      negativeExpected: 'LAB27-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        The operated VM unexpectedly has a public IP.'
      evidence:
      - LAB27-CP02 UTC result for create the private workload and telemetry foundation.
      - Exact run-owned resource/object ID returned by the commands in LAB27-CP02.
      - 'Positive assertion proving: The private VM, storage account, workspace, vault, and network-security boundary are
        recorded immediately after creation.'
      - 'Negative assertion proving absence of: The operated VM unexpectedly has a public IP.'
      commonFailure: A private VM created without a usable NIC/SSH-key workflow can provision but remain impossible to diagnose
        as designed.
      safeRetry: Retry LAB27-CP02 for create the private workload and telemetry foundation only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB27-CP03, LAB27-CP04, LAB27-CP05, remove the exact manifest IDs created or configured by
        LAB27-CP02 for create the private workload and telemetry foundation; its residual probe must then return zero active
        IDs.
    - id: LAB27-CP03
      title: Generate telemetry and configure an actionable alert
      purpose: Configure and independently inspect the control-plane and data-path properties needed to generate telemetry
        and configure an actionable alert.
      operationalRelevance: 'The change is unsafe when a successful KQL command with zero rows is not evidence; ingestion
        must be retried within a bounded window and asserted. This checkpoint therefore proves: A deterministic storage transaction
        is routed to the workspace and the metric alert scopes the exact storage resource.'
      objectiveIds:
      - IG-GOVERN-02
      command: "$storageId = az storage account show --resource-group $ResourceGroupName --name $storage --query id --output\
        \ tsv\n$workspaceId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name\
        \ $workspace --query id --output tsv\n$metricCategories = az monitor diagnostic-settings categories list --resource\
        \ $storageId --query \"value[?categoryType=='Metrics'].name\" --output tsv\n$metricArgs = @($metricCategories | ForEach-Object\
        \ { @{ category = $_; enabled = $true } }) | ConvertTo-Json -Compress\naz monitor diagnostic-settings create --name\
        \ \"diag-$RunId\" --resource $storageId --workspace $workspaceId --metrics $metricArgs --output none\naz monitor action-group\
        \ create --resource-group $ResourceGroupName --name $actionGroup --short-name AZ104 --output none\n$actionGroupId\
        \ = az monitor action-group show --resource-group $ResourceGroupName --name $actionGroup --query id --output tsv\n\
        az monitor metrics alert create --resource-group $ResourceGroupName --name $alert --scopes $storageId --condition\
        \ 'total Transactions > 0' --window-size 15m --evaluation-frequency 5m --action $actionGroupId --description 'AZ-104\
        \ operated workload transaction signal' --output none\n$oldStorageKey = $env:AZURE_STORAGE_KEY\ntry {\n    $env:AZURE_STORAGE_KEY\
        \ = az storage account keys list --resource-group $ResourceGroupName --account-name $storage --query \"[0].value\"\
        \ --output tsv\n    az storage container create --account-name $storage --name operations --auth-mode key --output\
        \ none\n    az storage blob list --account-name $storage --container-name operations --auth-mode key --output none\n\
        } finally {\n    if ($null -eq $oldStorageKey) { Remove-Item Env:AZURE_STORAGE_KEY -ErrorAction SilentlyContinue }\
        \ else { $env:AZURE_STORAGE_KEY = $oldStorageKey }\n    Remove-Variable oldStorageKey -ErrorAction SilentlyContinue\n\
        }"
      expectedState: A deterministic storage transaction is routed to the workspace and the metric alert scopes the exact
        storage resource.
      representativeOutput: A deterministic storage transaction is routed to the workspace and the metric alert scopes the
        exact storage resource.
      positiveCommand: '$enabled = az monitor metrics alert show --resource-group $ResourceGroupName --name $alert --query
        enabled --output tsv

        if ($enabled -ne ''true'') { throw ''The transaction metric alert is disabled.'' }'
      positiveExpected: A deterministic storage transaction is routed to the workspace and the metric alert scopes the exact
        storage resource.
      negativeCommand: '$diagnosticCount = az monitor diagnostic-settings list --resource $storageId --query "value[?name==''diag-$RunId'']
        | length(@)" --output tsv

        if ([int]$diagnosticCount -ne 1) { throw ''The storage diagnostic setting is absent or duplicated.'' }'
      negativeExpected: 'LAB27-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        The storage diagnostic setting is absent or duplicated.'
      evidence:
      - LAB27-CP03 UTC result for generate telemetry and configure an actionable alert.
      - Exact run-owned resource/object ID returned by the commands in LAB27-CP03.
      - 'Positive assertion proving: A deterministic storage transaction is routed to the workspace and the metric alert scopes
        the exact storage resource.'
      - 'Negative assertion proving absence of: The storage diagnostic setting is absent or duplicated.'
      commonFailure: A successful KQL command with zero rows is not evidence; ingestion must be retried within a bounded window
        and asserted.
      safeRetry: Retry LAB27-CP03 for generate telemetry and configure an actionable alert only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB27-CP04, LAB27-CP05, remove the exact manifest IDs created or configured by LAB27-CP03 for
        generate telemetry and configure an actionable alert; its residual probe must then return zero active IDs.
    - id: LAB27-CP04
      title: Inject and repair a deterministic NSG outage
      purpose: Exercise the deterministic operational or denied path needed to inject and repair a deterministic nsg outage,
        then retain comparable before-and-after results.
      operationalRelevance: 'The change is unsafe when deleting the wrong NSG rule or relying on authored rather than effective
        rules can leave the outage unresolved. This checkpoint therefore proves: The deny rule produces the documented effective-security
        symptom, diagnosis identifies its priority, and repair restores the prior path.'
      objectiveIds:
      - IG-GOVERN-04
      command: 'az backup protection enable-for-vm --resource-group $ResourceGroupName --vault-name $vault --vm $vm --policy-name
        DefaultPolicy --output none

        $retainUntil = (Get-Date).ToUniversalTime().AddDays(7).ToString(''dd-MM-yyyy'')

        $backupJob = az backup protection backup-now --resource-group $ResourceGroupName --vault-name $vault --container-name
        $vm --item-name $vm --backup-management-type AzureIaasVM --retain-until $retainUntil --query name --output tsv

        az backup job wait --resource-group $ResourceGroupName --vault-name $vault --name $backupJob --timeout 3600

        $recoveryPoint = az backup recoverypoint list --resource-group $ResourceGroupName --vault-name $vault --container-name
        $vm --item-name $vm --backup-management-type AzureIaasVM --query "[0].name" --output tsv

        $restoreJob = az backup restore restore-disks --resource-group $ResourceGroupName --vault-name $vault --container-name
        $vm --item-name $vm --rp-name $recoveryPoint --storage-account $storage --target-resource-group $ResourceGroupName
        --restore-to-staging-storage-account true --query name --output tsv

        az backup job wait --resource-group $ResourceGroupName --vault-name $vault --name $restoreJob --timeout 3600'
      expectedState: The deny rule produces the documented effective-security symptom, diagnosis identifies its priority,
        and repair restores the prior path.
      representativeOutput: The deny rule produces the documented effective-security symptom, diagnosis identifies its priority,
        and repair restores the prior path.
      positiveCommand: '$restoreCount = az backup job list --resource-group $ResourceGroupName --vault-name $vault --operation
        Restore --status Completed --query "[?properties.entityFriendlyName==''$vm''] | length(@)" --output tsv

        if ([int]$restoreCount -lt 1) { throw ''No completed capstone restore job exists.'' }'
      positiveExpected: The deny rule produces the documented effective-security symptom, diagnosis identifies its priority,
        and repair restores the prior path.
      negativeCommand: '$failedJobs = az backup job list --resource-group $ResourceGroupName --vault-name $vault --status
        Failed --query "length(@)" --output tsv

        if ([int]$failedJobs -ne 0) { throw ''A capstone backup or restore job failed.'' }'
      negativeExpected: 'LAB27-CP04 negative boundary: The undesired state is absent; the negative assertion must not report:
        A capstone backup or restore job failed.'
      evidence:
      - LAB27-CP04 UTC result for inject and repair a deterministic nsg outage.
      - Exact run-owned resource/object ID returned by the commands in LAB27-CP04.
      - 'Positive assertion proving: The deny rule produces the documented effective-security symptom, diagnosis identifies
        its priority, and repair restores the prior path.'
      - 'Negative assertion proving absence of: A capstone backup or restore job failed.'
      commonFailure: Deleting the wrong NSG rule or relying on authored rather than effective rules can leave the outage unresolved.
      safeRetry: Retry LAB27-CP04 for inject and repair a deterministic nsg outage only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB27-CP05, remove the exact manifest IDs created or configured by LAB27-CP04 for inject and
        repair a deterministic nsg outage; its residual probe must then return zero active IDs.
    - id: LAB27-CP05
      title: Back up, restore, and reconcile operational evidence
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to back up, restore, and
        reconcile operational evidence before handoff.
      operationalRelevance: 'The change is unsafe when backup job completion without a verified recovery point or restore
        artifact gives false confidence in recoverability. This checkpoint therefore proves: The backup and disk-restore jobs
        complete, telemetry remains queryable, effective networking is healthy, and cleanup honors soft-delete retention.'
      objectiveIds:
      - IG-ACCESS-03
      - IG-GOVERN-01
      - IG-GOVERN-02
      - IG-GOVERN-04
      - IG-GOVERN-06
      - NW-VNET-05
      - NW-SECURE-02
      - NW-DNSLB-03
      - MR-MONITOR-03
      - MR-MONITOR-04
      - MR-MONITOR-05
      - MR-MONITOR-06
      - MR-RECOVERY-04
      - MR-RECOVERY-06
      - MR-RECOVERY-07
      command: "$workspaceCustomerId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name\
        \ $workspace --query customerId --output tsv\n$deadline = (Get-Date).AddMinutes(15)\ndo {\n    $metricRows = az monitor\
        \ log-analytics query --workspace $workspaceCustomerId --analytics-query \"AzureMetrics | where TimeGenerated > ago(30m)\
        \ | where ResourceId =~ '$storageId' | where MetricName == 'Transactions' | count\" --query \"tables[0].rows[0][0]\"\
        \ --output tsv\n    if ([int]$metricRows -lt 1) { Start-Sleep -Seconds 30 }\n} until ([int]$metricRows -ge 1 -or (Get-Date)\
        \ -gt $deadline)\nif ([int]$metricRows -lt 1) { throw 'No transaction metric reached AzureMetrics within the bounded\
        \ ingestion wait.' }\naz network nic list-effective-nsg --resource-group $ResourceGroupName --name \"nic-$suffix\"\
        \ --output json"
      expectedState: The backup and disk-restore jobs complete, telemetry remains queryable, effective networking is healthy,
        and cleanup honors soft-delete retention.
      representativeOutput: The backup and disk-restore jobs complete, telemetry remains queryable, effective networking is
        healthy, and cleanup honors soft-delete retention.
      positiveCommand: '$workspaceCustomerId = az monitor log-analytics workspace show --resource-group $ResourceGroupName
        --workspace-name $workspace --query customerId --output tsv

        $metricRows = az monitor log-analytics query --workspace $workspaceCustomerId --analytics-query "AzureMetrics | where
        TimeGenerated > ago(30m) | where ResourceId =~ ''$storageId'' | where MetricName == ''Transactions'' | count" --query
        "tables[0].rows[0][0]" --output tsv

        if ([int]$metricRows -lt 1) { throw ''AzureMetrics has no run-owned storage transaction row.'' }'
      positiveExpected: The backup and disk-restore jobs complete, telemetry remains queryable, effective networking is healthy,
        and cleanup honors soft-delete retention.
      negativeCommand: '$denyRules = az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query
        "[?name==''DenyInjectedOperations''] | length(@)" --output tsv

        if ([int]$denyRules -ne 0) { throw ''The injected operations deny rule still exists.'' }'
      negativeExpected: 'LAB27-CP05 negative boundary: The undesired state is absent; the negative assertion must not report:
        The injected operations deny rule still exists.'
      evidence:
      - LAB27-CP05 UTC result for back up, restore, and reconcile operational evidence.
      - Exact run-owned resource/object ID returned by the commands in LAB27-CP05.
      - 'Positive assertion proving: The backup and disk-restore jobs complete, telemetry remains queryable, effective networking
        is healthy, and cleanup honors soft-delete retention.'
      - 'Negative assertion proving absence of: The injected operations deny rule still exists.'
      commonFailure: Backup job completion without a verified recovery point or restore artifact gives false confidence in
        recoverability.
      safeRetry: Retry LAB27-CP05 for back up, restore, and reconcile operational evidence only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After all service validation and evidence capture, remove the exact manifest IDs created or configured
        by LAB27-CP05 for back up, restore, and reconcile operational evidence; its residual probe must then return zero active
        IDs.
    breakFix:
      injection: Add a bounded deny-all inbound rule to the run-owned workload NSG.
      symptom: Effective NSG evidence shows the injected rule as the highest-priority custom decision while monitoring and
        backup resources remain healthy.
      diagnosis: Correlate the exact NSG rule, effective NIC rules, metric signal, and recent administrative activity.
      repair: Delete only DenyInjectedOperations and repeat the effective-rule and recovery checks.
      injectCommand: az network nsg rule create --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedOperations
        --priority 100 --direction Inbound --access Deny --protocol "*" --source-address-prefixes "*" --destination-port-ranges
        "*" --output none
      diagnoseCommand: az network nic list-effective-nsg --resource-group $ResourceGroupName --name "nic-$suffix" --output
        json
      repairCommand: az network nsg rule delete --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedOperations
      verifyCommand: az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query "[?name=='DenyInjectedOperations']
        | length(@)" --output tsv
    challenge: Write an incident report with detection, impact, timeline, diagnosis, repair, recovery evidence, and prevention
      actions.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Collect Azure resource logs with diagnostic settings
      url: https://learn.microsoft.com/en-us/azure/azure-monitor/essentials/diagnostic-settings
    - title: Query Azure Monitor Logs with Azure CLI
      url: https://learn.microsoft.com/en-us/cli/azure/monitor/log-analytics
    - title: Create Azure Monitor metric alerts
      url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule
    - title: Back up an Azure VM with Azure CLI
      url: https://learn.microsoft.com/en-us/azure/backup/quick-backup-vm-cli
    - title: Restore Azure VM disks with Azure CLI
      url: https://learn.microsoft.com/en-us/azure/backup/tutorial-restore-disk
    validationContext: $workspace = "law-$suffix"; $vault = "rsv-$suffix"; $vnet = "vnet-$suffix"; $nsg = "nsg-$suffix"; $vm
      = "vm-$suffix"; $storage = "st27$suffix"; $actionGroup = "ag-$suffix"; $alert = "alert-$suffix"; $storageId = az storage
      account show --resource-group $ResourceGroupName --name $storage --query id --output tsv
    cleanupContext: $vault = "rsv-$suffix"; $vm = "vm-$suffix"
    costClass: elevated
    billableResources:
    - one Standard_B1s VM
    - Log Analytics ingestion
    - metric alert
    - Recovery Services protected instance
    - backup and restore storage
    costNotes: This capstone generates telemetry, protects a VM, and performs a restore. Cleanup stops protection and never
      purges recoverable backup data.
    requiredProviders:
    - Microsoft.Compute
    - Microsoft.Insights
    - Microsoft.Network
    - Microsoft.OperationalInsights
    - Microsoft.RecoveryServices
    - Microsoft.Storage
    preCleanupCommand: "try {\n    $item = az backup item list --resource-group $ResourceGroupName --vault-name $vault --backup-management-type\
      \ AzureIaasVM --query \"[?properties.friendlyName=='$vm'] | [0]\" --output json 2>$null | ConvertFrom-Json\n    if ($item)\
      \ { az backup protection disable --resource-group $ResourceGroupName --vault-name $vault --container-name $vm --item-name\
      \ $vm --backup-management-type AzureIaasVM --delete-backup-data true --yes --output none }\n    az backup vault delete\
      \ --resource-group $ResourceGroupName --name $vault --yes --output none\n} catch { throw 'Capstone recovery cleanup\
      \ stopped before the resource-group boundary; inspect the protected item and retry.' }"
    retainedItems:
    - idExpression: '"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.RecoveryServices/vaults/$vault"'
      type: Microsoft.RecoveryServices/vaults
      reason: Backup soft delete intentionally retains a recoverable vault/item record after active resources are removed.
      expectedDisposition: Azure expires the recoverable record under the configured retention policy; no purge is automated.
    preflightChecks:
    - id: preflight.authored.service
      type: sku
      required: true
      description: Prove verify operations and recovery prerequisites with LAB-27's authored read-only provider, feature,
