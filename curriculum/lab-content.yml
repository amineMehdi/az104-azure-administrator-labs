    - id: LAB16-CP02
      title: Create the web app, integration subnet, and backup storage
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the web app, integration
        subnet, and backup storage, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when subnet delegation or storage data-plane RBAC can be missing even when
        ARM creation succeeds. This checkpoint therefore proves: The app, delegated subnet, and private backup container are
        run-owned and recorded before configuration begins.'
      objectiveIds:
      - CP-APP-05
      command: '$plan = "plan-$suffix"; $app = "app-$suffix"; $storage = "st16$suffix"; $vnet = "vnet-$suffix"

