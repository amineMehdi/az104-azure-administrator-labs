    - id: preflight.authored.service
      type: sku
      required: true
      description: Prove verify load-balancer and network watcher diagnostics support with LAB-21's authored read-only provider,
        feature, tool, region, and SKU queries.
      command: '$network = az provider show --namespace Microsoft.Network --query registrationState --output tsv

        if ($network -ne ''Registered'') { throw ''Microsoft.Network is not registered.'' }

        $watchers = az network watcher list --query "[?location==''$Location''] | length(@)" --output tsv

        if ([int]$watchers -lt 1) { throw ''Network Watcher is not available in the selected region.'' }'
      expected: The Standard load-balancer SKU and Network Watcher diagnostic commands are available in the selected region.
    cleanupContext: '$connectionMonitorId = $state.inputs[''external-connection-monitor-id'']

      $connectionMonitorName = $state.inputs[''external-connection-monitor-name'']'
    preCleanupCommand: "if ($connectionMonitorId -and $connectionMonitorName) {\n    $probePreference = $PSNativeCommandUseErrorActionPreference\n\
      \    $PSNativeCommandUseErrorActionPreference = $false\n    try {\n        $liveMonitorId = az network watcher connection-monitor\
      \ show --location $Location --name $connectionMonitorName --query id --output tsv 2>$null\n        if ($LASTEXITCODE\
      \ -eq 0) {\n            if (-not [string]::Equals($liveMonitorId, $connectionMonitorId, [StringComparison]::OrdinalIgnoreCase))\
      \ { throw 'Connection Monitor cleanup refused because its exact ID changed.' }\n            $PSNativeCommandUseErrorActionPreference\
      \ = $true\n            az network watcher connection-monitor delete --location $Location --name $connectionMonitorName\
      \ --output none\n        }\n    } finally {\n        $PSNativeCommandUseErrorActionPreference = $probePreference\n \
      \   }\n}"
    scenario: 'You are a network operations administrator publishing a resilient http backend. Build and prove this disposable service path: A Standard public frontend and outbound rule connect to two private
      backend NICs; probe and rule traffic traverse the NSG, Network Watcher agents run on both VMs, and Connection Monitor
      measures the VM-to-VM TCP path.'
  22-azure-monitor-logs-insights:
    role: A monitoring administrator building an evidence-based service view.
    outcome: Use Azure CLI in PowerShell to create the monitored storage account and workspace, route resource metrics into
      log analytics, and reconcile diagnostic configuration and ingested telemetry, with recoverable state and deterministic
      cleanup.
    primer: Platform metrics are numeric time series; resource logs require diagnostic settings; Log Analytics stores queryable
      tables; Insights layers curated workbooks and dependencies over those signals. Ingestion latency must be handled explicitly.
    designDecisions:
    - Discover supported diagnostic categories before configuring them.
    - Use bounded workspace retention.
    - Treat an empty fresh KQL result as pending evidence, not automatic failure.
    architectureWalkthrough: A storage transaction enters Azure Monitor through the account diagnostic setting, routes to
      the run-owned Log Analytics workspace, and is located by a bounded KQL assertion against the exact storage resource
      ID.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
