  23-monitor-alerts-actions:
    role: A monitoring administrator routing and suppressing actionable alerts.
    outcome: Use Azure CLI in PowerShell to create the monitored target and action group, create a scoped metric alert, and
      reconcile alert scope, criteria, actions, and suppression, with recoverable state and deterministic cleanup.
    primer: Alert rules evaluate signals; action groups deliver notifications; the common alert schema standardizes payloads;
      processing rules suppress or add actions without preventing alert evaluation.
    designDecisions:
    - Use explicit aggregation, window, and frequency.
    - Create a receiver only with approved contact data.
    - Time-bound suppression during maintenance.
    architectureWalkthrough: Storage metrics and activity events feed scoped alert rules, the action group provides the notification
      boundary, and a time-bounded processing rule suppresses actions only for the run-owned target.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
