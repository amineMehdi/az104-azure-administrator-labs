    validationContext: $storage = "st26$suffix"; $vnet = "vnet-$suffix"; $workspace = "law-$suffix"; $loadBalancer = "lb-$suffix";
      $nsg = "nsg-$suffix"; $vm1 = "vm-1-$suffix"; $vm2 = "vm-2-$suffix"; $privateEndpoint = "pe-$suffix"
    costClass: elevated
    billableResources:
