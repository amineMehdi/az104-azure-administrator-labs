      type: sku
      required: true
      description: Prove verify governed workload deployment prerequisites with LAB-26's authored read-only provider, feature,
        tool, region, and SKU queries.
      command: '$compute = az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        if ($compute -ne ''Registered'') { throw ''Microsoft.Compute is not registered.'' }

        $sku = az vm list-skus --location $Location --size Standard_B1s --all --query ''[?name==`Standard_B1s` && (restrictions==null
        || length(restrictions)==`0`)] | length(@)'' --output tsv

        if ([int]$sku -lt 1) { throw ''Standard_B1s is restricted in this region.'' }'
      expected: Bicep, VM SKU, private-link, load-balancer, Policy, RBAC, and diagnostic APIs are available before the capstone
        mutates Azure.
    scenario: 'You are a platform engineer building a governed, secure, observable workload. Build and prove this disposable service path: Bicep creates the governed network, data, and telemetry foundation;
      two private VMs join the load-balancer pool, Blob access follows private endpoint/DNS, and Policy, diagnostics, and
