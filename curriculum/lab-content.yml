        revision is healthy.
      positiveCommand: '$stateValue = az containerapp show --resource-group $ResourceGroupName --name $app --query properties.provisioningState
        --output tsv

        if ($stateValue -ne ''Succeeded'') { throw "Container App state is $stateValue." }'
      positiveExpected: The environment and app are provisioned, external ingress targets the declared port, and the first
        revision is healthy.
