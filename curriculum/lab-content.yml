    - id: LAB12-CP03
      title: Deploy a resilient VM scale set with autoscale
      purpose: Configure and independently inspect the control-plane and data-path properties needed to deploy a resilient
        vm scale set with autoscale.
      operationalRelevance: 'The change is unsafe when autoscale fails when its target resource ID or metric namespace does
        not match the VMSS. This checkpoint therefore proves: The VMSS has the requested capacity and the autoscale profile
        contains bounded minimum, default, and maximum instance counts.'
      objectiveIds:
      - CP-VM-06
      command: '$vmssId = az vmss show --resource-group $ResourceGroupName --name $vmss --query id --output tsv

        az monitor autoscale create --resource-group $ResourceGroupName --name $autoscale --resource $vmssId --resource-type
        Microsoft.Compute/virtualMachineScaleSets --min-count 1 --max-count 3 --count 1 --output none

        az monitor autoscale rule create --resource-group $ResourceGroupName --autoscale-name $autoscale --condition ''Percentage
        CPU > 70 avg 10m'' --scale out 1 --cooldown 5 --output none

        az monitor autoscale rule create --resource-group $ResourceGroupName --autoscale-name $autoscale --condition ''Percentage
        CPU < 30 avg 10m'' --scale in 1 --cooldown 5 --output none'
      expectedState: The VMSS has the requested capacity and the autoscale profile contains bounded minimum, default, and
        maximum instance counts.
      representativeOutput: The VMSS has the requested capacity and the autoscale profile contains bounded minimum, default,
        and maximum instance counts.
      positiveCommand: '$maximum = az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query
        "profiles[0].capacity.maximum" --output tsv

        if ([int]$maximum -ne 3) { throw "Autoscale maximum is $maximum." }'
      positiveExpected: The VMSS has the requested capacity and the autoscale profile contains bounded minimum, default, and
