      command: "$previousStorageKey = $env:AZURE_STORAGE_KEY\ntry {\n    $env:AZURE_STORAGE_KEY = az storage account keys\
        \ list --resource-group $ResourceGroupName --account-name $storage --query \"[0].value\" --output tsv\n    az storage\
        \ container create --account-name $storage --name backups --auth-mode key --output none\n    $expiry = (Get-Date).ToUniversalTime().AddHours(4).ToString('yyyy-MM-ddTHH:mmZ')\n\
        \    $sas = az storage container generate-sas --account-name $storage --name backups --permissions rwdl --expiry $expiry\
        \ --https-only --auth-mode key --output tsv\n    if (-not $sas) { throw 'A redacted backup SAS could not be created.'\
        \ }\n    $backupUrl = \"https://$storage.blob.core.windows.net/backups?$sas\"\n    az webapp config backup create\
