    - id: LAB21-CP05
      title: Reconcile frontend, backend health, and diagnostic evidence
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile frontend,
        backend health, and diagnostic evidence before handoff.
      operationalRelevance: 'The change is unsafe when a provisioned load balancer can still have zero healthy backends and
