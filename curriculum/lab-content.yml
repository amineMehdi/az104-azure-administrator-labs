        json
      repairCommand: az network nsg rule delete --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjected443
      verifyCommand: az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query "[?destinationPortRange=='443'].{name:name,priority:priority,access:access}"
