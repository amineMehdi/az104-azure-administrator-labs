    breakFix:
      injection: Add a higher-priority NSG deny for the probe and backend port.
      symptom: Backends become unhealthy and the frontend stops distributing traffic.
      diagnosis: Inspect probe status, NSG effective rules, and connection troubleshoot output.
      repair: Remove the injected rule and wait for healthy probes.
      injectCommand: az network nsg rule create --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedSsh
        --priority 100 --direction Inbound --access Deny --protocol Tcp --source-address-prefixes "*" --destination-port-ranges
        22 --output none
      diagnoseCommand: 'az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query "[].{name:name,priority:priority,access:access,port:destinationPortRange}"
        --output table

        az network lb probe show --resource-group $ResourceGroupName --lb-name $loadBalancer --name ssh --output json'
      repairCommand: az network nsg rule delete --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedSsh
      verifyCommand: az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query "[?destinationPortRange=='22'].{name:name,priority:priority,access:access}"
        --output table
