    - id: LAB14-CP02
      title: Create the managed environment and ingress application
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the managed environment
        and ingress application, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when environment provisioning can stall when Log Analytics or regional Container
        Apps capacity is unavailable. This checkpoint therefore proves: The environment and app are provisioned, external
        ingress targets the declared port, and the first revision is healthy.'
      objectiveIds:
      - CP-CONTAINERS-04
      command: '$workspace = "law-$suffix"; $environment = "cae-$suffix"; $app = "ca-$suffix"

        az monitor log-analytics workspace create --resource-group $ResourceGroupName --workspace-name $workspace --location
        $Location --output none

        $customerId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name $workspace
        --query customerId --output tsv

        $sharedKey = az monitor log-analytics workspace get-shared-keys --resource-group $ResourceGroupName --workspace-name
        $workspace --query primarySharedKey --output tsv

        az containerapp env create --resource-group $ResourceGroupName --name $environment --location $Location --logs-workspace-id
        $customerId --logs-workspace-key $sharedKey --output none

        Remove-Variable sharedKey -ErrorAction SilentlyContinue

        az containerapp create --resource-group $ResourceGroupName --name $app --environment $environment --image mcr.microsoft.com/k8se/quickstart:latest
