  25-site-recovery-failover:
    role: A disaster-recovery administrator piloting Azure-to-Azure replication.
    outcome: Use Azure CLI in PowerShell to create the source vm and isolated recovery network, configure azure-to-azure replication
      behind explicit approval, and reconcile replication health, recovery mapping, and cleanup order, with recoverable state
      and deterministic cleanup.
    primer: Site Recovery requires source and target fabrics, protection containers, policy, network mapping, replication-protected
      items, and healthy synchronization. Test failover must use an isolated network and be cleaned up before protection is
      removed.
    designDecisions:
    - Use non-overlapping primary and recovery networks.
    - Gate elevated cost and secondary-region input.
    - Run test failover only after protected health is ready.
    architectureWalkthrough: The source VM and cache account feed Azure-to-Azure replication through paired fabrics, protection
      containers, policy, and network mapping; an exactly gated test failover targets only the isolated recovery VNet and
      is cleaned up asynchronously.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB25-CP01
      title: Verify paired-region and Site Recovery prerequisites
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify paired-region
        and site recovery prerequisites, without changing Azure state.
      operationalRelevance: 'The change is unsafe when replication cannot start when source and target regions are equal or
        an ASR provider is unregistered. This checkpoint therefore proves: Source and recovery regions differ, the VM SKU
        is available, and the site-recovery extension/provider commands are ready.'
      objectiveIds:
      - MR-RECOVERY-05
      command: 'if (-not $SecondaryLocation -or $SecondaryLocation -eq $Location) { throw ''Supply a distinct approved secondary
        region.'' }

        az extension show --name site-recovery --query version --output tsv

        az provider show --namespace Microsoft.RecoveryServices --query registrationState --output tsv

        az vm list-skus --location $Location --size Standard_B1s --all --query "[?name==''Standard_B1s''].name" --output tsv

        if (-not (Get-Command ssh-keygen -ErrorAction SilentlyContinue)) { throw ''ssh-keygen is required for the source VM
        key.'' }'
      expectedState: Source and recovery regions differ, the VM SKU is available, and the site-recovery extension/provider
        commands are ready.
      representativeOutput: Source and recovery regions differ, the VM SKU is available, and the site-recovery extension/provider
        commands are ready.
      positiveCommand: '$extension = az extension show --name site-recovery --query version --output tsv

        if (-not $extension) { throw ''The site-recovery Azure CLI extension is not installed.'' }'
      positiveExpected: Source and recovery regions differ, the VM SKU is available, and the site-recovery extension/provider
        commands are ready.
      negativeCommand: |
        $recoveryRegion = az account list-locations --query "[?name=='$SecondaryLocation'].name | [0]" --output tsv
        if (-not $recoveryRegion -or $SecondaryLocation -eq $Location) {
          throw 'Primary and recovery locations must be distinct, available Azure regions.'
        }
        $recoveryRegion
      negativeExpected: 'LAB25-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Primary and recovery locations must be distinct.'
      evidence:
      - LAB25-CP01 UTC result for verify paired-region and site recovery prerequisites.
      - Exact run-owned resource/object ID returned by the commands in LAB25-CP01.
      - 'Positive assertion proving: Source and recovery regions differ, the VM SKU is available, and the site-recovery extension/provider
        commands are ready.'
      - 'Negative assertion proving absence of: Primary and recovery locations must be distinct.'
      commonFailure: Replication cannot start when source and target regions are equal or an ASR provider is unregistered.
      safeRetry: Retry LAB25-CP01 for verify paired-region and site recovery prerequisites only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB25-CP02, LAB25-CP03, LAB25-CP04, LAB25-CP05, remove the exact manifest IDs created or configured
        by LAB25-CP01 for verify paired-region and site recovery prerequisites; its residual probe must then return zero active
        IDs.
    - id: LAB25-CP02
      title: Create the source VM and isolated recovery network
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the source vm and isolated
        recovery network, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a cache account in an unsupported region or a target VNet with overlapping
        address space blocks replication setup. This checkpoint therefore proves: The private source VM, cache storage, source/recovery
        VNets, and vault are recorded before replication is gated.'
      objectiveIds:
      - MR-RECOVERY-06
      command: '$vault = "asr-$suffix"; $vm = "vm-$suffix"; $sourceVnet = "source-$suffix"; $recoveryVnet = "recovery-$suffix";
        $testVnet = "test-$suffix"; $cache = "st25$suffix"

        $keyPath = Join-Path $StateDir ''id_ed25519''; ssh-keygen -t ed25519 -N '''' -f $keyPath | Out-Null

        az network vnet create --resource-group $ResourceGroupName --name $sourceVnet --location $Location --address-prefixes
        10.25.0.0/16 --subnet-name workload --subnet-prefixes 10.25.1.0/24 --output none

        az network nic create --resource-group $ResourceGroupName --name "nic-$suffix" --location $Location --vnet-name $sourceVnet
        --subnet workload --output none

        az vm create --resource-group $ResourceGroupName --name $vm --location $Location --image Ubuntu2204 --size Standard_B1s
        --admin-username azureadmin --ssh-key-values "$keyPath.pub" --nics "nic-$suffix" --output none

        az network vnet create --resource-group $ResourceGroupName --name $recoveryVnet --location $SecondaryLocation --address-prefixes
        10.26.0.0/16 --subnet-name recovery --subnet-prefixes 10.26.1.0/24 --output none

        az network vnet create --resource-group $ResourceGroupName --name $testVnet --location $SecondaryLocation --address-prefixes
        10.126.0.0/16 --subnet-name isolated --subnet-prefixes 10.126.1.0/24 --output none

        az storage account create --resource-group $ResourceGroupName --name $cache --location $Location --sku Standard_LRS
        --kind StorageV2 --https-only true --allow-blob-public-access false --output none

        az backup vault create --resource-group $ResourceGroupName --name $vault --location $SecondaryLocation --output none'
      expectedState: The private source VM, cache storage, source/recovery VNets, and vault are recorded before replication
        is gated.
      representativeOutput: The private source VM, cache storage, source/recovery VNets, and vault are recorded before replication
        is gated.
      positiveCommand: '$vnetCount = az network vnet list --resource-group $ResourceGroupName --query "[?name==''$sourceVnet''
        || name==''$recoveryVnet'' || name==''$testVnet''] | length(@)" --output tsv

        if ([int]$vnetCount -ne 3) { throw ''The source, recovery, and isolated test VNets are not all present.'' }'
      positiveExpected: The private source VM, cache storage, source/recovery VNets, and vault are recorded before replication
        is gated.
      negativeCommand: '$peerings = az network vnet peering list --resource-group $ResourceGroupName --vnet-name $testVnet
        --query "length(@)" --output tsv

        if ([int]$peerings -ne 0) { throw ''The test-failover VNet is peered and is not isolated.'' }'
      negativeExpected: 'LAB25-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        The test-failover VNet is peered and is not isolated.'
      evidence:
      - LAB25-CP02 UTC result for create the source vm and isolated recovery network.
      - Exact run-owned resource/object ID returned by the commands in LAB25-CP02.
      - 'Positive assertion proving: The private source VM, cache storage, source/recovery VNets, and vault are recorded before
        replication is gated.'
      - 'Negative assertion proving absence of: The test-failover VNet is peered and is not isolated.'
      commonFailure: A cache account in an unsupported region or a target VNet with overlapping address space blocks replication
        setup.
      safeRetry: Retry LAB25-CP02 for create the source vm and isolated recovery network only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB25-CP03, LAB25-CP04, LAB25-CP05, remove the exact manifest IDs created or configured by
        LAB25-CP02 for create the source vm and isolated recovery network; its residual probe must then return zero active
        IDs.
    - id: LAB25-CP03
      title: Configure Azure-to-Azure replication behind explicit approval
      purpose: Configure and independently inspect the control-plane and data-path properties needed to configure azure-to-azure
        replication behind explicit approval.
      operationalRelevance: 'The change is unsafe when a non-affirmative gate value must never start costly replication, and
        partial configuration can take many minutes to converge. This checkpoint therefore proves: When AZ104_ENABLE_ASR=YES,
        fabric, containers, policy, mapping, and protected item converge to a protected state; otherwise the optional checkpoint
        is skipped.'
      objectiveIds:
      - MR-RECOVERY-05
      command: '$sourceFabric = "fabric-source-$suffix"; $recoveryFabric = "fabric-recovery-$suffix"; $sourceContainer = "container-source-$suffix";
        $recoveryContainer = "container-recovery-$suffix"; $mapping = "mapping-$suffix"; $policy = "policy-$suffix"; $protectedItem
        = "protected-$suffix"

        az site-recovery fabric create --resource-group $ResourceGroupName --vault-name $vault --name $sourceFabric --custom-details
        "{azure:{location:$Location}}" --output none

        az site-recovery fabric create --resource-group $ResourceGroupName --vault-name $vault --name $recoveryFabric --custom-details
        "{azure:{location:$SecondaryLocation}}" --output none

        az site-recovery protection-container create --resource-group $ResourceGroupName --vault-name $vault --fabric-name
        $sourceFabric --name $sourceContainer --provider-input ''[{instance-type:A2A}]'' --output none

        az site-recovery protection-container create --resource-group $ResourceGroupName --vault-name $vault --fabric-name
        $recoveryFabric --name $recoveryContainer --provider-input ''[{instance-type:A2A}]'' --output none

        az site-recovery policy create --resource-group $ResourceGroupName --vault-name $vault --name $policy --provider-specific-input
        ''{a2a:{multi-vm-sync-status:Enable}}'' --output none

        $policyId = az site-recovery policy show --resource-group $ResourceGroupName --vault-name $vault --name $policy --query
        id --output tsv

        $recoveryContainerId = az site-recovery protection-container show --resource-group $ResourceGroupName --vault-name
        $vault --fabric-name $recoveryFabric --name $recoveryContainer --query id --output tsv

        az site-recovery protection-container mapping create --resource-group $ResourceGroupName --vault-name $vault --fabric-name
        $sourceFabric --protection-container $sourceContainer --name $mapping --policy-id $policyId --target-container $recoveryContainerId
        --provider-input ''{a2a:{agent-auto-update-status:Disabled}}'' --output none

        $vmId = az vm show --resource-group $ResourceGroupName --name $vm --query id --output tsv

        $osDiskId = az vm show --resource-group $ResourceGroupName --name $vm --query storageProfile.osDisk.managedDisk.id
        --output tsv

        $cacheId = az storage account show --resource-group $ResourceGroupName --name "st25$suffix" --query id --output tsv

        $recoveryVnetId = az network vnet show --resource-group $ResourceGroupName --name $recoveryVnet --query id --output
        tsv

        $recoveryGroupId = az group show --name $ResourceGroupName --query id --output tsv

        $providerDetails = @{ a2a = @{ ''fabric-object-id'' = $vmId; ''vm-managed-disks'' = @(@{ ''disk-id'' = $osDiskId;
        ''primary-staging-azure-storage-account-id'' = $cacheId; ''recovery-resource-group-id'' = $recoveryGroupId }); ''recovery-azure-network-id''
        = $recoveryVnetId; ''recovery-container-id'' = $recoveryContainerId; ''recovery-resource-group-id'' = $recoveryGroupId;
        ''recovery-subnet-name'' = ''recovery'' } } | ConvertTo-Json -Depth 10 -Compress

        az site-recovery protected-item create --resource-group $ResourceGroupName --vault-name $vault --fabric-name $sourceFabric
        --protection-container $sourceContainer --name $protectedItem --policy-id $policyId --provider-details $providerDetails
        --output none

        $deadline = (Get-Date).AddMinutes(90)

        do { Start-Sleep -Seconds 30; $protectionState = az site-recovery protected-item show --resource-group $ResourceGroupName
        --vault-name $vault --fabric-name $sourceFabric --protection-container $sourceContainer --name $protectedItem --query
        properties.protectionState --output tsv } until ($protectionState -eq ''Protected'' -or (Get-Date) -gt $deadline)

        if ($protectionState -ne ''Protected'') { throw "Site Recovery did not reach Protected within the bounded wait; current
        state is $protectionState." }'
      expectedState: When AZ104_ENABLE_ASR=YES, fabric, containers, policy, mapping, and protected item converge to a protected
        state; otherwise the optional checkpoint is skipped.
      representativeOutput: When AZ104_ENABLE_ASR=YES, fabric, containers, policy, mapping, and protected item converge to
        a protected state; otherwise the optional checkpoint is skipped.
      positiveCommand: '$stateValue = az site-recovery protected-item show --resource-group $ResourceGroupName --vault-name
        $vault --fabric-name $sourceFabric --protection-container $sourceContainer --name $protectedItem --query properties.protectionState
        --output tsv

        if ($stateValue -ne ''Protected'') { throw "Replication protection state is $stateValue." }'
      positiveExpected: When AZ104_ENABLE_ASR=YES, fabric, containers, policy, mapping, and protected item converge to a protected
        state; otherwise the optional checkpoint is skipped.
      negativeCommand: '$health = az site-recovery protected-item show --resource-group $ResourceGroupName --vault-name $vault
        --fabric-name $sourceFabric --protection-container $sourceContainer --name $protectedItem --query properties.replicationHealth
        --output tsv

        if ($health -notin @(''Normal'',''Healthy'')) { throw "Replication health is $health." }'
      negativeExpected: 'LAB25-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        Replication health is reported health.'
      evidence:
      - LAB25-CP03 UTC result for configure azure-to-azure replication behind explicit approval.
      - Exact run-owned resource/object ID returned by the commands in LAB25-CP03.
      - 'Positive assertion proving: When AZ104_ENABLE_ASR=YES, fabric, containers, policy, mapping, and protected item converge
        to a protected state; otherwise the optional checkpoint is skipped.'
      - 'Negative assertion proving absence of: Replication health is reported health.'
      commonFailure: A non-affirmative gate value must never start costly replication, and partial configuration can take
        many minutes to converge.
      safeRetry: Retry LAB25-CP03 for configure azure-to-azure replication behind explicit approval only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB25-CP04, LAB25-CP05, remove the exact manifest IDs created or configured by LAB25-CP03 for
        configure azure-to-azure replication behind explicit approval; its residual probe must then return zero active IDs.
      required: false
      gateEnvironmentValues:
        AZ104_ENABLE_ASR: 'YES'
    - id: LAB25-CP04
      title: Run and clean up an isolated test failover
      purpose: Exercise the deterministic operational or denied path needed to run and clean up an isolated test failover,
        then retain comparable before-and-after results.
      operationalRelevance: 'The change is unsafe when a test failover can be blocked while replication health is not Normal
        or a previous test VM still exists. This checkpoint therefore proves: When AZ104_RUN_ASR_TEST_FAILOVER=YES, the test
        uses only the isolated recovery VNet and cleanup removes the test VM before checkpoint completion.'
      objectiveIds:
      - MR-RECOVERY-06
      command: "$testVnetId = az network vnet show --resource-group $ResourceGroupName --name $testVnet --query id --output\
        \ tsv\n$protectedItemUrl = \"https://management.azure.com/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.RecoveryServices/vaults/$vault/replicationFabrics/$sourceFabric/replicationProtectionContainers/$sourceContainer/replicationProtectedItems/$protectedItem\"\
        \n$apiVersion = '2026-02-01'\n$testSubmittedAt = (Get-Date).ToUniversalTime()\n$testBody = @{ properties = @{ failoverDirection\
        \ = 'PrimaryToRecovery'; networkId = $testVnetId; networkType = 'VmNetworkAsInput'; providerSpecificDetails = @{ instanceType\
        \ = 'A2A' } } } | ConvertTo-Json -Depth 10 -Compress\nif (($testBody | ConvertFrom-Json).properties.networkId -ne\
        \ $testVnetId) { throw 'The test-failover request body does not contain the isolated VNet ID.' }\naz rest --method\
        \ post --url \"${protectedItemUrl}/testFailover?api-version=$apiVersion\" --body $testBody --headers 'Content-Type=application/json'\
        \ --output none\n$deadline = (Get-Date).AddMinutes(60)\n$observedAsyncState = $false\ndo {\n    Start-Sleep -Seconds\
        \ 30\n    $testState = az rest --method get --url \"${protectedItemUrl}?api-version=$apiVersion\" --query properties.testFailoverState\
        \ --output tsv\n    if ($testState -match 'InProgress|Waiting|Completed') { $observedAsyncState = $true }\n} until\
        \ ($testState -match 'WaitingForCompletion|Completed' -or (Get-Date) -gt $deadline)\nif (-not $observedAsyncState\
        \ -or $testState -notmatch 'WaitingForCompletion|Completed') { throw \"Test failover did not complete its asynchronous\
        \ operation; current state is $testState.\" }\n$cleanupBody = @{ properties = @{ comments = \"AZ-104 $RunId isolated\
        \ drill complete\" } } | ConvertTo-Json -Depth 5 -Compress\naz rest --method post --url \"${protectedItemUrl}/testFailoverCleanup?api-version=$apiVersion\"\
        \ --body $cleanupBody --headers 'Content-Type=application/json' --output none\n$cleanupDeadline = (Get-Date).AddMinutes(60)\n\
        do {\n    Start-Sleep -Seconds 30\n    $cleanupState = az rest --method get --url \"${protectedItemUrl}?api-version=$apiVersion\"\
        \ --query properties.testFailoverState --output tsv\n} until ([string]::IsNullOrWhiteSpace($cleanupState) -or $cleanupState\
        \ -match 'None|Cleaned|Completed' -or (Get-Date) -gt $cleanupDeadline)\n$lastTest = az rest --method get --url \"\
        ${protectedItemUrl}?api-version=$apiVersion\" --query properties.lastSuccessfulTestFailoverTime --output tsv\nif (-not\
        \ $lastTest -or [datetime]$lastTest -lt $testSubmittedAt) { throw 'The protected item does not record this successful\
        \ test failover.' }\nif (-not [string]::IsNullOrWhiteSpace($cleanupState) -and $cleanupState -notmatch 'None|Cleaned|Completed')\
        \ { throw \"Test-failover cleanup did not complete; current state is $cleanupState.\" }"
      expectedState: When AZ104_RUN_ASR_TEST_FAILOVER=YES, the test uses only the isolated recovery VNet and cleanup removes
        the test VM before checkpoint completion.
      representativeOutput: When AZ104_RUN_ASR_TEST_FAILOVER=YES, the test uses only the isolated recovery VNet and cleanup
        removes the test VM before checkpoint completion.
      positiveCommand: '$lastTest = az site-recovery protected-item show --resource-group $ResourceGroupName --vault-name
        $vault --fabric-name $sourceFabric --protection-container $sourceContainer --name $protectedItem --query properties.lastSuccessfulTestFailoverTime
        --output tsv

        if (-not $lastTest) { throw ''No successful test-failover timestamp is recorded.'' }'
      positiveExpected: When AZ104_RUN_ASR_TEST_FAILOVER=YES, the test uses only the isolated recovery VNet and cleanup removes
        the test VM before checkpoint completion.
      negativeCommand: '$peerings = az network vnet peering list --resource-group $ResourceGroupName --vnet-name $testVnet
        --query "length(@)" --output tsv

        if ([int]$peerings -ne 0) { throw ''The drill network is connected to another VNet.'' }'
      negativeExpected: 'LAB25-CP04 negative boundary: The undesired state is absent; the negative assertion must not report:
        The drill network is connected to another VNet.'
      evidence:
      - LAB25-CP04 UTC result for run and clean up an isolated test failover.
      - Exact run-owned resource/object ID returned by the commands in LAB25-CP04.
      - 'Positive assertion proving: When AZ104_RUN_ASR_TEST_FAILOVER=YES, the test uses only the isolated recovery VNet and
        cleanup removes the test VM before checkpoint completion.'
      - 'Negative assertion proving absence of: The drill network is connected to another VNet.'
      commonFailure: A test failover can be blocked while replication health is not Normal or a previous test VM still exists.
      safeRetry: Retry LAB25-CP04 for run and clean up an isolated test failover only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB25-CP05, remove the exact manifest IDs created or configured by LAB25-CP04 for run and clean
        up an isolated test failover; its residual probe must then return zero active IDs.
      required: false
      gateEnvironmentValues:
        AZ104_ENABLE_ASR: 'YES'
        AZ104_RUN_ASR_TEST_FAILOVER: 'YES'
    - id: LAB25-CP05
      title: Reconcile replication health, recovery mapping, and cleanup order
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile replication
        health, recovery mapping, and cleanup order before handoff.
      operationalRelevance: 'The change is unsafe when removing fabric or policy before disabling protection leaves dependent
        ASR objects and prevents vault deletion. This checkpoint therefore proves: Optional gate status, protected-item health,
        network mapping, test-failover cleanup, and retained-vault expectations are explicit.'
      objectiveIds:
      - MR-RECOVERY-05
      - MR-RECOVERY-06
      command: 'az backup vault show --resource-group $ResourceGroupName --name $vault --query "{state:properties.provisioningState,location:location}"
        --output json

        az network vnet list --resource-group $ResourceGroupName --query "[].{name:name,location:location,prefix:addressSpace.addressPrefixes[0],peerings:length(virtualNetworkPeerings)}"
        --output table'
      expectedState: Optional gate status, protected-item health, network mapping, test-failover cleanup, and retained-vault
        expectations are explicit.
      representativeOutput: Optional gate status, protected-item health, network mapping, test-failover cleanup, and retained-vault
        expectations are explicit.
      positiveCommand: '$vaultState = az backup vault show --resource-group $ResourceGroupName --name $vault --query properties.provisioningState
        --output tsv

        if ($vaultState -ne ''Succeeded'') { throw "Site Recovery vault state is $vaultState." }'
      positiveExpected: Optional gate status, protected-item health, network mapping, test-failover cleanup, and retained-vault
        expectations are explicit.
      negativeCommand: '$overlap = az network vnet show --resource-group $ResourceGroupName --name $testVnet --query "addressSpace.addressPrefixes[0]"
        --output tsv

        if ($overlap -ne ''10.126.0.0/16'') { throw ''The test-failover VNet is not the recorded isolated range.'' }'
      negativeExpected: 'LAB25-CP05 negative boundary: The undesired state is absent; the negative assertion must not report:
        The test-failover VNet is not the recorded isolated range.'
      evidence:
      - LAB25-CP05 UTC result for reconcile replication health, recovery mapping, and cleanup order.
      - Exact run-owned resource/object ID returned by the commands in LAB25-CP05.
      - 'Positive assertion proving: Optional gate status, protected-item health, network mapping, test-failover cleanup,
        and retained-vault expectations are explicit.'
      - 'Negative assertion proving absence of: The test-failover VNet is not the recorded isolated range.'
      commonFailure: Removing fabric or policy before disabling protection leaves dependent ASR objects and prevents vault
        deletion.
      safeRetry: Retry LAB25-CP05 for reconcile replication health, recovery mapping, and cleanup order only after its exact
        recorded ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent,
        repeat only the owning create command, then rerun both assertions.
      cleanupDependency: After all service validation and evidence capture, remove the exact manifest IDs created or configured
        by LAB25-CP05 for reconcile replication health, recovery mapping, and cleanup order; its residual probe must then
        return zero active IDs.
    breakFix:
      injection: Attempt to use the recovery VNet rather than the isolated test VNet for a drill request.
      symptom: The lab safety assertion refuses the drill because the requested network is not the recorded isolated range.
      diagnosis: Compare exact VNet IDs, address spaces, and peerings before submitting test failover.
      repair: Use only the unpeered test VNet ID and re-run the gated test-failover request.
      injectCommand: '$candidateNetworkId = az network vnet show --resource-group $ResourceGroupName --name $recoveryVnet
        --query id --output tsv; if ($candidateNetworkId -notmatch "/virtualNetworks/$testVnet$") { throw "Safety gate: candidate
        is not the isolated test VNet." }'
      diagnoseCommand: az network vnet list --resource-group $ResourceGroupName --query "[].{name:name,prefix:addressSpace.addressPrefixes[0],peerings:length(virtualNetworkPeerings)}"
        --output table
      repairCommand: $candidateNetworkId = az network vnet show --resource-group $ResourceGroupName --name $testVnet --query
        id --output tsv
      verifyCommand: if ($candidateNetworkId -notmatch "/virtualNetworks/$testVnet$") { throw "The isolated test VNet is not
        selected." }
    challenge: Draft a failover decision tree covering test, planned, unplanned, commit, reprotect, and failback.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Azure CLI Site Recovery extension
      url: https://learn.microsoft.com/en-us/cli/azure/site-recovery
    - title: Enable an Azure-to-Azure protected item with Azure CLI
      url: https://learn.microsoft.com/en-us/cli/azure/site-recovery/protected-item
    - title: Run an isolated Site Recovery test failover
      url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
    - title: Site Recovery test-failover REST operation
      url: https://learn.microsoft.com/en-us/rest/api/site-recovery/replication-protected-items/test-failover
    validationContext: '$vault = "asr-$suffix"; $vm = "vm-$suffix"; $sourceVnet = "source-$suffix"; $recoveryVnet = "recovery-$suffix";
      $testVnet = "test-$suffix"

      $sourceFabric = "fabric-source-$suffix"; $recoveryFabric = "fabric-recovery-$suffix"; $sourceContainer = "container-source-$suffix";
      $recoveryContainer = "container-recovery-$suffix"; $protectedItem = "protected-$suffix"'
    cleanupContext: $vault = "asr-$suffix"; $sourceFabric = "fabric-source-$suffix"; $recoveryFabric = "fabric-recovery-$suffix";
      $sourceContainer = "container-source-$suffix"; $recoveryContainer = "container-recovery-$suffix"; $protectedItem = "protected-$suffix";
      $mapping = "mapping-$suffix"; $policy = "policy-$suffix"
    costClass: elevated
    billableResources:
    - source Standard_B1s VM
    - Site Recovery protected instance
    - replica managed disks
    - cache storage
    - test-failover VM
    costNotes: Replication and the isolated test failover are optional exact-YES gates because they can run for an extended
      period and create billable replicas.
    requiredProviders:
    - Microsoft.Compute
    - Microsoft.Network
    - Microsoft.RecoveryServices
    - Microsoft.Storage
    preCleanupCommand: "function Test-AsrObject {\n    param([scriptblock]$Probe)\n    $preference = $PSNativeCommandUseErrorActionPreference\n\
      \    $PSNativeCommandUseErrorActionPreference = $false\n    try { & $Probe *> $null; return ($LASTEXITCODE -eq 0) }\
      \ finally { $PSNativeCommandUseErrorActionPreference = $preference }\n}\nfunction Wait-AsrAbsent {\n    param([scriptblock]$Probe,\
      \ [string]$Label, [int]$TimeoutMinutes = 60)\n    $deadline = (Get-Date).AddMinutes($TimeoutMinutes)\n    do {\n   \
      \     if (-not (Test-AsrObject -Probe $Probe)) { return }\n        Start-Sleep -Seconds 30\n    } until ((Get-Date)\
      \ -gt $deadline)\n    throw \"Site Recovery cleanup timed out waiting for $Label to become absent.\"\n}\n\n$protectedProbe\
      \ = { az site-recovery protected-item show --resource-group $ResourceGroupName --vault-name $vault --fabric-name $sourceFabric\
      \ --protection-container $sourceContainer --name $protectedItem --output none }\nif (Test-AsrObject -Probe $protectedProbe)\
      \ {\n    $protectedItemUrl = \"https://management.azure.com/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.RecoveryServices/vaults/$vault/replicationFabrics/$sourceFabric/replicationProtectionContainers/$sourceContainer/replicationProtectedItems/$protectedItem\"\
      \n    $apiVersion = '2026-02-01'\n    $testState = az rest --method get --url \"${protectedItemUrl}?api-version=$apiVersion\"\
      \ --query properties.testFailoverState --output tsv\n    if ($testState -and $testState -notmatch 'None|Cleaned') {\n\
      \        $cleanupBody = @{ properties = @{ comments = \"AZ-104 $RunId cleanup retry\" } } | ConvertTo-Json -Compress\n\
      \        az rest --method post --url \"${protectedItemUrl}/testFailoverCleanup?api-version=$apiVersion\" --body $cleanupBody\
      \ --headers 'Content-Type=application/json' --output none\n        $testDeadline = (Get-Date).AddMinutes(60)\n     \
      \   do {\n            Start-Sleep -Seconds 30\n            $testState = az rest --method get --url \"${protectedItemUrl}?api-version=$apiVersion\"\
      \ --query properties.testFailoverState --output tsv\n        } until ([string]::IsNullOrWhiteSpace($testState) -or $testState\
      \ -match 'None|Cleaned' -or (Get-Date) -gt $testDeadline)\n        if (-not [string]::IsNullOrWhiteSpace($testState)\
      \ -and $testState -notmatch 'None|Cleaned') { throw \"Test-failover cleanup timed out in state $testState.\" }\n   \
      \ }\n    az site-recovery protected-item remove --resource-group $ResourceGroupName --vault-name $vault --fabric-name\
      \ $sourceFabric --protection-container $sourceContainer --name $protectedItem --disable-protection-reason NotSpecified\
      \ --output none\n    Wait-AsrAbsent -Probe $protectedProbe -Label 'replication protected item'\n}\n\n$mappingProbe =\
      \ { az site-recovery protection-container mapping show --resource-group $ResourceGroupName --vault-name $vault --fabric-name\
      \ $sourceFabric --protection-container $sourceContainer --name $mapping --output none }\nif (Test-AsrObject -Probe $mappingProbe)\
      \ {\n    az site-recovery protection-container mapping remove --resource-group $ResourceGroupName --vault-name $vault\
      \ --fabric-name $sourceFabric --protection-container $sourceContainer --name $mapping --output none\n    Wait-AsrAbsent\
      \ -Probe $mappingProbe -Label 'protection-container mapping'\n}\n\n$sourceContainerProbe = { az site-recovery protection-container\
      \ show --resource-group $ResourceGroupName --vault-name $vault --fabric-name $sourceFabric --name $sourceContainer --output\
      \ none }\nif (Test-AsrObject -Probe $sourceContainerProbe) {\n    az site-recovery protection-container remove --resource-group\
      \ $ResourceGroupName --vault-name $vault --fabric-name $sourceFabric --name $sourceContainer --output none\n    Wait-AsrAbsent\
      \ -Probe $sourceContainerProbe -Label 'source protection container'\n}\n$recoveryContainerProbe = { az site-recovery\
      \ protection-container show --resource-group $ResourceGroupName --vault-name $vault --fabric-name $recoveryFabric --name\
      \ $recoveryContainer --output none }\nif (Test-AsrObject -Probe $recoveryContainerProbe) {\n    az site-recovery protection-container\
      \ remove --resource-group $ResourceGroupName --vault-name $vault --fabric-name $recoveryFabric --name $recoveryContainer\
      \ --output none\n    Wait-AsrAbsent -Probe $recoveryContainerProbe -Label 'recovery protection container'\n}\n\n$sourceFabricProbe\
      \ = { az site-recovery fabric show --resource-group $ResourceGroupName --vault-name $vault --name $sourceFabric --output\
      \ none }\nif (Test-AsrObject -Probe $sourceFabricProbe) {\n    az site-recovery fabric remove --resource-group $ResourceGroupName\
      \ --vault-name $vault --name $sourceFabric --output none\n    Wait-AsrAbsent -Probe $sourceFabricProbe -Label 'source\
      \ fabric'\n}\n$recoveryFabricProbe = { az site-recovery fabric show --resource-group $ResourceGroupName --vault-name\
      \ $vault --name $recoveryFabric --output none }\nif (Test-AsrObject -Probe $recoveryFabricProbe) {\n    az site-recovery\
      \ fabric remove --resource-group $ResourceGroupName --vault-name $vault --name $recoveryFabric --output none\n    Wait-AsrAbsent\
      \ -Probe $recoveryFabricProbe -Label 'recovery fabric'\n}\n\n$policyProbe = { az site-recovery policy show --resource-group\
      \ $ResourceGroupName --vault-name $vault --name $policy --output none }\nif (Test-AsrObject -Probe $policyProbe) {\n\
      \    az site-recovery policy delete --resource-group $ResourceGroupName --vault-name $vault --name $policy --yes --output\
      \ none\n    Wait-AsrAbsent -Probe $policyProbe -Label 'replication policy'\n}\naz backup vault delete --resource-group\
      \ $ResourceGroupName --name $vault --yes --output none"
    retainedItems:
    - idExpression: '"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName/providers/Microsoft.RecoveryServices/vaults/$vault"'
      type: Microsoft.RecoveryServices/vaults
      reason: The Recovery Services vault may remain recoverable under service soft-delete controls.
      expectedDisposition: Azure removes the recoverable record after its configured retention period; no purge is automated.
    preflightChecks:
    - id: preflight.authored.service
      type: sku
      required: true
      description: Prove verify paired-region and site recovery prerequisites with LAB-25's authored read-only provider, feature,
        tool, region, and SKU queries.
      command: '$extension = az extension show --name site-recovery --query version --output tsv

        if (-not $extension) { throw ''The site-recovery Azure CLI extension is not installed.'' }

        if (-not $SecondaryLocation -or $SecondaryLocation -eq $Location) { throw ''Primary and recovery locations must be
        distinct.'' }'
      expected: Source and recovery regions differ, the VM SKU is available, and the site-recovery extension/provider commands
        are ready.
    scenario: 'You are a disaster-recovery administrator piloting azure-to-azure replication. Build and prove this disposable service path: The source VM and cache account feed Azure-to-Azure replication through
      paired fabrics, protection containers, policy, and network mapping; an exactly gated test failover targets only the
      isolated recovery VNet and is cleaned up asynchronously.'
  26-capstone-build:
    role: A platform engineer building a governed, secure, observable workload.
    outcome: Use Azure CLI in PowerShell to deploy the governed network, compute, and data foundation, build the private load-balanced
      application path, and reconcile the end-to-end governed workload, with recoverable state and deterministic cleanup.
    primer: The build capstone integrates infrastructure as code, segmentation, resilient compute, private data access, RBAC,
      Policy, diagnostics, and alerts. Success means the components work together and can be removed from the recorded ownership
      boundary.
    designDecisions:
    - Use Bicep build and what-if as release gates.
    - Keep data private and compute resilient.
    - Validate governance and observability before handoff.
    architectureWalkthrough: Bicep creates the governed network, data, and telemetry foundation; two private VMs join the
      load-balancer pool, Blob access follows private endpoint/DNS, and Policy, diagnostics, and optional RBAC remain bounded
      to recorded IDs.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB26-CP01
      title: Verify governed workload deployment prerequisites
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify governed workload
        deployment prerequisites, without changing Azure state.
      operationalRelevance: 'The change is unsafe when one missing provider or role can allow early resources to deploy but
        block governance or observability later. This checkpoint therefore proves: Bicep, VM SKU, private-link, load-balancer,
        Policy, RBAC, and diagnostic APIs are available before the capstone mutates Azure.'
      objectiveIds:
      - IG-ACCESS-01
      command: 'az bicep build --file "$LabRoot/artifacts/main.bicep" --outfile "$StateDir/main.json"

        az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        az vm list-skus --location $Location --size Standard_B1s --all --query "[?name==''Standard_B1s''].name" --output tsv

        if (-not (Get-Command ssh-keygen -ErrorAction SilentlyContinue)) { throw ''ssh-keygen is required for the backend
        keys.'' }'
      expectedState: Bicep, VM SKU, private-link, load-balancer, Policy, RBAC, and diagnostic APIs are available before the
        capstone mutates Azure.
      representativeOutput: Bicep, VM SKU, private-link, load-balancer, Policy, RBAC, and diagnostic APIs are available before
        the capstone mutates Azure.
      positiveCommand: '$compute = az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        if ($compute -ne ''Registered'') { throw ''Microsoft.Compute is not registered.'' }'
      positiveExpected: Bicep, VM SKU, private-link, load-balancer, Policy, RBAC, and diagnostic APIs are available before
        the capstone mutates Azure.
      negativeCommand: '$sku = az vm list-skus --location $Location --size Standard_B1s --all --query ''[?name==`Standard_B1s`
        && (restrictions==null || length(restrictions)==`0`)] | length(@)'' --output tsv

        if ([int]$sku -lt 1) { throw ''Standard_B1s is restricted in this region.'' }'
      negativeExpected: 'LAB26-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Standard_B1s is restricted in this region.'
      evidence:
      - LAB26-CP01 UTC result for verify governed workload deployment prerequisites.
      - Exact run-owned resource/object ID returned by the commands in LAB26-CP01.
      - 'Positive assertion proving: Bicep, VM SKU, private-link, load-balancer, Policy, RBAC, and diagnostic APIs are available
        before the capstone mutates Azure.'
      - 'Negative assertion proving absence of: Standard_B1s is restricted in this region.'
      commonFailure: One missing provider or role can allow early resources to deploy but block governance or observability
        later.
      safeRetry: Retry LAB26-CP01 for verify governed workload deployment prerequisites only after its exact recorded ID and
        current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the
        owning create command, then rerun both assertions.
      cleanupDependency: After LAB26-CP02, LAB26-CP03, LAB26-CP04, LAB26-CP05, remove the exact manifest IDs created or configured
        by LAB26-CP01 for verify governed workload deployment prerequisites; its residual probe must then return zero active
        IDs.
    - id: LAB26-CP02
      title: Deploy the governed network, compute, and data foundation
      purpose: Provision and immediately inventory the exact run-owned resources needed to deploy the governed network, compute,
        and data foundation, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a storage-name collision or Bicep what-if discrepancy must be resolved
        before continuing to dependent resources. This checkpoint therefore proves: The Bicep deployment creates tagged network,
        storage, workspace, and security boundaries whose returned IDs are recorded.'
      objectiveIds:
      - IG-ACCESS-02
      command: '$storage = "st26$suffix"; $vnet = "vnet-$suffix"; $workspace = "law-$suffix"; $loadBalancer = "lb-$suffix";
        $nsg = "nsg-$suffix"; $vm1 = "vm-1-$suffix"; $vm2 = "vm-2-$suffix"; $privateEndpoint = "pe-$suffix"

        az deployment group what-if --resource-group $ResourceGroupName --template-file "$LabRoot/artifacts/main.bicep" --parameters
        suffix=$suffix storageName=$storage --result-format ResourceIdOnly --no-pretty-print | Set-Content -LiteralPath "$StateDir/what-if.txt"

        az deployment group create --resource-group $ResourceGroupName --name "capstone-$RunId" --template-file "$LabRoot/artifacts/main.bicep"
        --parameters suffix=$suffix storageName=$storage --output none

        az network nsg create --resource-group $ResourceGroupName --name $nsg --location $Location --output none

        az network nsg rule create --resource-group $ResourceGroupName --nsg-name $nsg --name AllowLoadBalancerSsh --priority
        200 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes AzureLoadBalancer --destination-port-ranges
        22 --output none

        az network vnet subnet update --resource-group $ResourceGroupName --vnet-name $vnet --name web --network-security-group
        $nsg --output none

        az network lb address-pool create --resource-group $ResourceGroupName --lb-name $loadBalancer --name backends --output
        none

        az network lb probe create --resource-group $ResourceGroupName --lb-name $loadBalancer --name ssh --protocol Tcp --port
        22 --interval 5 --threshold 2 --output none

        az network lb rule create --resource-group $ResourceGroupName --lb-name $loadBalancer --name ssh --protocol Tcp --frontend-port
        2222 --backend-port 22 --frontend-ip-name frontend --backend-pool-name backends --probe-name ssh --disable-outbound-snat
        true --output none'
      expectedState: The Bicep deployment creates tagged network, storage, workspace, and security boundaries whose returned
        IDs are recorded.
      representativeOutput: The Bicep deployment creates tagged network, storage, workspace, and security boundaries whose
        returned IDs are recorded.
      positiveCommand: '$deployment = az deployment group show --resource-group $ResourceGroupName --name "capstone-$RunId"
        --query properties.provisioningState --output tsv

        if ($deployment -ne ''Succeeded'') { throw "Capstone Bicep deployment state is $deployment." }'
      positiveExpected: The Bicep deployment creates tagged network, storage, workspace, and security boundaries whose returned
        IDs are recorded.
      negativeCommand: '$publicAccess = az storage account show --resource-group $ResourceGroupName --name $storage --query
        publicNetworkAccess --output tsv

        if ($publicAccess -ne ''Disabled'') { throw ''Capstone storage public network access is enabled.'' }'
      negativeExpected: 'LAB26-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        Capstone storage public network access is enabled.'
      evidence:
      - LAB26-CP02 UTC result for deploy the governed network, compute, and data foundation.
      - Exact run-owned resource/object ID returned by the commands in LAB26-CP02.
      - 'Positive assertion proving: The Bicep deployment creates tagged network, storage, workspace, and security boundaries
        whose returned IDs are recorded.'
      - 'Negative assertion proving absence of: Capstone storage public network access is enabled.'
      commonFailure: A storage-name collision or Bicep what-if discrepancy must be resolved before continuing to dependent
        resources.
      safeRetry: Retry LAB26-CP02 for deploy the governed network, compute, and data foundation only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB26-CP03, LAB26-CP04, LAB26-CP05, remove the exact manifest IDs created or configured by
        LAB26-CP02 for deploy the governed network, compute, and data foundation; its residual probe must then return zero
        active IDs.
    - id: LAB26-CP03
      title: Build the private load-balanced application path
      purpose: Configure and independently inspect the control-plane and data-path properties needed to build the private
        load-balanced application path.
      operationalRelevance: 'The change is unsafe when disabling public storage access before private endpoint/DNS convergence
        can make validation appear to lose the data service. This checkpoint therefore proves: Two private VM NICs join the
        backend pool, the health probe/rule are consistent, and storage uses a private endpoint plus linked DNS.'
      objectiveIds:
      - IG-GOVERN-01
      command: "$keyPath = Join-Path $StateDir 'id_ed25519'; ssh-keygen -t ed25519 -N '' -f $keyPath | Out-Null\nforeach ($index\
        \ in 1..2) {\n    $nic = \"nic-$index-$suffix\"; $vm = \"vm-$index-$suffix\"\n    az network nic create --resource-group\
        \ $ResourceGroupName --name $nic --vnet-name $vnet --subnet web --network-security-group $nsg --output none\n    az\
        \ network nic ip-config address-pool add --resource-group $ResourceGroupName --nic-name $nic --ip-config-name ipconfig1\
        \ --lb-name $loadBalancer --address-pool backends --output none\n    az vm create --resource-group $ResourceGroupName\
        \ --name $vm --image Ubuntu2204 --size Standard_B1s --admin-username azureadmin --ssh-key-values \"$keyPath.pub\"\
        \ --nics $nic --output none\n}\n$storageId = az storage account show --resource-group $ResourceGroupName --name $storage\
        \ --query id --output tsv\naz network private-endpoint create --resource-group $ResourceGroupName --name $privateEndpoint\
        \ --location $Location --vnet-name $vnet --subnet private-endpoints --private-connection-resource-id $storageId --group-id\
        \ blob --connection-name \"storage-$suffix\" --output none\naz network private-dns zone create --resource-group $ResourceGroupName\
        \ --name privatelink.blob.core.windows.net --output none\naz network private-dns link vnet create --resource-group\
        \ $ResourceGroupName --zone-name privatelink.blob.core.windows.net --name \"link-$suffix\" --virtual-network $vnet\
        \ --registration-enabled false --output none\naz network private-endpoint dns-zone-group create --resource-group $ResourceGroupName\
        \ --endpoint-name $privateEndpoint --name default --private-dns-zone privatelink.blob.core.windows.net --zone-name\
        \ blob --output none\n$workspaceId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name\
        \ $workspace --query id --output tsv\n$metricCategories = az monitor diagnostic-settings categories list --resource\
        \ $storageId --query \"value[?categoryType=='Metrics'].name\" --output tsv\n$metricArgs = @($metricCategories | ForEach-Object\
        \ { @{ category = $_; enabled = $true } }) | ConvertTo-Json -Compress\naz monitor diagnostic-settings create --name\
        \ \"diag-$RunId\" --resource $storageId --workspace $workspaceId --metrics $metricArgs --output none\n$policyName\
        \ = az policy definition list --query \"[?displayName=='Audit VMs that do not use managed disks'].name | [0]\" --output\
        \ tsv\nif (-not $policyName) { throw 'The built-in managed-disk audit policy definition was not found.' }\naz policy\
        \ assignment create --name \"managed-disks-$suffix\" --display-name 'AZ-104 managed disk audit' --policy $policyName\
        \ --scope \"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName\" --output none"
      expectedState: Two private VM NICs join the backend pool, the health probe/rule are consistent, and storage uses a private
        endpoint plus linked DNS.
      representativeOutput: Two private VM NICs join the backend pool, the health probe/rule are consistent, and storage uses
        a private endpoint plus linked DNS.
      positiveCommand: '$poolMembers = az network lb address-pool show --resource-group $ResourceGroupName --lb-name $loadBalancer
        --name backends --query "backendIPConfigurations | length(@)" --output tsv

        if ([int]$poolMembers -ne 2) { throw "Load Balancer backend count is $poolMembers." }'
      positiveExpected: Two private VM NICs join the backend pool, the health probe/rule are consistent, and storage uses
        a private endpoint plus linked DNS.
      negativeCommand: '$connection = az network private-endpoint show --resource-group $ResourceGroupName --name $privateEndpoint
        --query "privateLinkServiceConnections[0].privateLinkServiceConnectionState.status" --output tsv

        if ($connection -ne ''Approved'') { throw "Private endpoint state is $connection." }'
      negativeExpected: 'LAB26-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        Private endpoint state is reported connection.'
      evidence:
      - LAB26-CP03 UTC result for build the private load-balanced application path.
      - Exact run-owned resource/object ID returned by the commands in LAB26-CP03.
      - 'Positive assertion proving: Two private VM NICs join the backend pool, the health probe/rule are consistent, and
        storage uses a private endpoint plus linked DNS.'
      - 'Negative assertion proving absence of: Private endpoint state is reported connection.'
      commonFailure: Disabling public storage access before private endpoint/DNS convergence can make validation appear to
        lose the data service.
      safeRetry: Retry LAB26-CP03 for build the private load-balanced application path only after its exact recorded ID and
        current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the
        owning create command, then rerun both assertions.
      cleanupDependency: After LAB26-CP04, LAB26-CP05, remove the exact manifest IDs created or configured by LAB26-CP03 for
        build the private load-balanced application path; its residual probe must then return zero active IDs.
    - id: LAB26-CP04
      title: Apply governance, observability, and least-privilege access
      purpose: Exercise the deterministic operational or denied path needed to apply governance, observability, and least-privilege
        access, then retain comparable before-and-after results.
      operationalRelevance: 'The change is unsafe when an empty or incorrect principal ID must skip the optional RBAC checkpoint
        rather than create a broader assignment. This checkpoint therefore proves: Diagnostic settings target the run-owned
        workspace, Policy scope is bounded, and optional RBAC targets only the supplied principal and resource scope.'
      objectiveIds:
      - IG-GOVERN-03
      command: '$scope = "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName"

        $external[''capstoneRoleAssignmentId''] = az role assignment create --assignee-object-id $env:AZ104_PRINCIPAL_OBJECT_ID
        --assignee-principal-type User --role Reader --scope $scope --query id --output tsv'
      expectedState: Diagnostic settings target the run-owned workspace, Policy scope is bounded, and optional RBAC targets
        only the supplied principal and resource scope.
      representativeOutput: Diagnostic settings target the run-owned workspace, Policy scope is bounded, and optional RBAC
        targets only the supplied principal and resource scope.
      positiveCommand: '$assignments = az role assignment list --assignee $env:AZ104_PRINCIPAL_OBJECT_ID --scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName"
        --query "[?roleDefinitionName==''Reader''] | length(@)" --output tsv

        if ([int]$assignments -ne 1) { throw ''The optional capstone Reader assignment is absent or duplicated.'' }'
      positiveExpected: Diagnostic settings target the run-owned workspace, Policy scope is bounded, and optional RBAC targets
        only the supplied principal and resource scope.
      negativeCommand: '$owner = az role assignment list --assignee $env:AZ104_PRINCIPAL_OBJECT_ID --scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName"
        --query "[?roleDefinitionName==''Owner''] | length(@)" --output tsv

        if ([int]$owner -ne 0) { throw ''The optional principal has an overbroad Owner assignment.'' }'
      negativeExpected: 'LAB26-CP04 negative boundary: The undesired state is absent; the negative assertion must not report:
        The optional principal has an overbroad Owner assignment.'
      evidence:
      - LAB26-CP04 UTC result for apply governance, observability, and least-privilege access.
      - Exact run-owned resource/object ID returned by the commands in LAB26-CP04.
      - 'Positive assertion proving: Diagnostic settings target the run-owned workspace, Policy scope is bounded, and optional
        RBAC targets only the supplied principal and resource scope.'
      - 'Negative assertion proving absence of: The optional principal has an overbroad Owner assignment.'
      commonFailure: An empty or incorrect principal ID must skip the optional RBAC checkpoint rather than create a broader
        assignment.
      safeRetry: Retry LAB26-CP04 for apply governance, observability, and least-privilege access only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB26-CP05, remove the exact manifest IDs created or configured by LAB26-CP04 for apply governance,
        observability, and least-privilege access; its residual probe must then return zero active IDs.
      required: false
      gateEnvironmentVariables:
      - AZ104_PRINCIPAL_OBJECT_ID
    - id: LAB26-CP05
      title: Reconcile the end-to-end governed workload
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile the end-to-end
        governed workload before handoff.
      operationalRelevance: 'The change is unsafe when validating each service separately can miss a broken cross-service
        ID, DNS link, or scope boundary. This checkpoint therefore proves: Traffic, private data access, diagnostics, Policy,
        tags, optional RBAC, and cleanup dependencies all resolve to one manifest-owned environment.'
      objectiveIds:
      - IG-ACCESS-01
      - IG-ACCESS-02
      - IG-GOVERN-01
      - IG-GOVERN-03
      - IG-GOVERN-04
      - ST-ACCOUNTS-01
      - CP-IAC-04
      - CP-VM-01
      - CP-VM-06
      - CP-VM-07
      - NW-VNET-01
      - NW-SECURE-01
      - NW-SECURE-05
      - NW-DNSLB-02
      - MR-MONITOR-02
      - MR-MONITOR-04
      command: 'az network lb show --resource-group $ResourceGroupName --name $loadBalancer --query "{sku:sku.name,frontend:frontendIPConfigurations[0].name,pool:backendAddressPools[0].name,probe:probes[0].port,rule:loadBalancingRules[0].frontendPort}"
        --output json

        az vm list --resource-group $ResourceGroupName --show-details --query "[].{name:name,power:powerState,publicIp:publicIps}"
        --output table

        az policy assignment show --name "managed-disks-$suffix" --scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName"
        --output json'
      expectedState: Traffic, private data access, diagnostics, Policy, tags, optional RBAC, and cleanup dependencies all
        resolve to one manifest-owned environment.
      representativeOutput: Traffic, private data access, diagnostics, Policy, tags, optional RBAC, and cleanup dependencies
        all resolve to one manifest-owned environment.
      positiveCommand: '$running = az vm list --resource-group $ResourceGroupName --show-details --query "[?powerState==''VM
        running''] | length(@)" --output tsv

        if ([int]$running -ne 2) { throw "Expected two running capstone backends; found $running." }'
      positiveExpected: Traffic, private data access, diagnostics, Policy, tags, optional RBAC, and cleanup dependencies all
        resolve to one manifest-owned environment.
      negativeCommand: '$publicBackends = az vm list --resource-group $ResourceGroupName --show-details --query "[?publicIps!=null
        && publicIps!=''''] | length(@)" --output tsv

        if ([int]$publicBackends -ne 0) { throw ''A backend VM has a public IP.'' }'
      negativeExpected: 'LAB26-CP05 negative boundary: The undesired state is absent; the negative assertion must not report:
        A backend VM has a public IP.'
      evidence:
      - LAB26-CP05 UTC result for reconcile the end-to-end governed workload.
      - Exact run-owned resource/object ID returned by the commands in LAB26-CP05.
      - 'Positive assertion proving: Traffic, private data access, diagnostics, Policy, tags, optional RBAC, and cleanup dependencies
        all resolve to one manifest-owned environment.'
      - 'Negative assertion proving absence of: A backend VM has a public IP.'
      commonFailure: Validating each service separately can miss a broken cross-service ID, DNS link, or scope boundary.
      safeRetry: Retry LAB26-CP05 for reconcile the end-to-end governed workload only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After all service validation and evidence capture, remove the exact manifest IDs created or configured
        by LAB26-CP05 for reconcile the end-to-end governed workload; its residual probe must then return zero active IDs.
    breakFix:
      injection: Add a higher-priority inbound deny for the backend probe and SSH service.
      symptom: The Load Balancer probe cannot reach either backend although ARM provisioning remains successful.
      diagnosis: Compare the custom NSG rule priority with the AzureLoadBalancer allow and inspect effective rules on a backend
        NIC.
      repair: Delete only the injected rule and retain the run-owned probe allow.
      injectCommand: az network nsg rule create --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedProbe
        --priority 100 --direction Inbound --access Deny --protocol Tcp --source-address-prefixes AzureLoadBalancer --destination-port-ranges
        22 --output none
      diagnoseCommand: az network nic list-effective-nsg --resource-group $ResourceGroupName --name "nic-1-$suffix" --output
        json
      repairCommand: az network nsg rule delete --resource-group $ResourceGroupName --nsg-name $nsg --name DenyInjectedProbe
      verifyCommand: az network nsg rule list --resource-group $ResourceGroupName --nsg-name $nsg --query "[?destinationPortRange=='22'].{name:name,priority:priority,access:access}"
        --output table
    challenge: Prepare a job-style handoff containing architecture, risks, validation, cost controls, operations, and rollback.
    sources:
