      negativeCommand: '$extensionVersion = az extension show --name containerapp --query version --output tsv

        if (-not $extensionVersion) { throw ''The containerapp extension is missing.'' }'
      negativeExpected: 'LAB14-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
