    validationContext: $vnet = "vnet-$suffix"; $publicIp = "pip-$suffix"; $loadBalancer = "lb-$suffix"; $nsg = "nsg-$suffix";
      $vm1 = "vm-1-$suffix"; $vm2 = "vm-2-$suffix"
