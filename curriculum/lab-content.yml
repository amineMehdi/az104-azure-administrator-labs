schemaVersion: 1.0.0
labs:
  00-safe-bootstrap:
    role: A new Azure administrator preparing a safe, repeatable workstation.
    outcome: Prove workstation readiness, select Azure context deliberately, establish a safe run boundary, and rehearse cleanup
      before a billable lab.
    primer: A reliable Azure change starts with context, prerequisites, deterministic naming, and an ownership record. The
      bootstrap lab establishes those habits before a billable or tenant-scoped operation is attempted.
    designDecisions:
    - Context is displayed and compared, never silently changed.
    - Preview is the default for every mutating lifecycle command.
    - Run IDs, tags, and local state define the cleanup boundary.
    architectureWalkthrough: The administrator starts with local tools, confirms one explicit Azure context, writes an ignored
      run manifest, and uses that manifest as the only cleanup authority. Read-only discovery never creates an Azure resource.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB00-CP01
      title: Confirm the local Azure CLI, PowerShell, Bicep, AzCopy, Python, and Node toolchain
      purpose: Inventory every executable used by later labs and record its version without installing or changing software.
      operationalRelevance: A missing or shadowed executable is cheaper to diagnose before a deployment than during a partial
        failure.
      objectiveIds:
      - FD-TOOLS-01
      command: "$versions = [ordered]@{\n    PowerShell = $PSVersionTable.PSVersion.ToString()\n    AzureCLI  = (az version\
        \ --query '\"azure-cli\"' --output tsv)\n    Bicep     = ((az bicep version) -join '')\n    AzCopy    = ((azcopy --version)\
        \ -join '')\n    Python    = ((python --version) -join '')\n    Node      = ((node --version) -join '')\n}\n$versions\
        \ | ConvertTo-Json\n"
      expectedState: PowerShell, Azure CLI, Bicep through Azure CLI, AzCopy, Python, and Node all return versions from the
        intended PATH.
      representativeOutput: '{"PowerShell":"7.4.x","AzureCLI":"2.88.x","Bicep":"Bicep CLI version 0.x","AzCopy":"azcopy version
        10.x","Python":"Python 3.12.x","Node":"v22.x"}'
      positiveCommand: |
        $azureCliVersion = az version --query '"azure-cli"' --output tsv
        $bicepVersion = (az bicep version) -join ''
        if (-not $azureCliVersion -or -not $bicepVersion) {
          throw 'Azure CLI or the Bicep subcommand did not return a version.'
        }
        [pscustomobject]@{ azureCli = $azureCliVersion; bicep = $bicepVersion }
      positiveExpected: Azure CLI returns its version record and the Bicep subcommand returns a version without installation.
      negativeCommand: |
        $missingTools = @('az', 'azcopy', 'python', 'node', 'pwsh') | Where-Object {
          -not (Get-Command $_ -ErrorAction SilentlyContinue)
        }
        if (@($missingTools).Count -gt 0) {
          throw "Required tools are missing: $($missingTools -join ', ')."
        }
        $missingTools
      negativeExpected: The missing-tool list is empty.
      evidence:
      - checkpoint ID, UTC time, and non-secret version map
      - empty missing-tool result
      commonFailure: An executable is absent, too old, or resolved from an unexpected PATH entry.
      safeRetry: Correct the local installation outside the lab, open a new PowerShell session, and rerun the version inventory.
      cleanupDependency: Tool discovery is read-only; retain only the redacted version record.
    - id: LAB00-CP02
      title: Sign in deliberately and confirm tenant, subscription, and cloud context
      purpose: Compare the active Azure CLI context with the explicitly supplied sandbox subscription before any later mutation.
      operationalRelevance: Azure CLI remembers context across terminals, so a successful command can still target the wrong
        environment.
      objectiveIds:
      - FD-CONTEXT-01
      command: "$context = az account show --query '{cloud:environmentName,subscription:id,tenant:tenantId,isDefault:isDefault}'\
        \ --output json | ConvertFrom-Json\nif ($SubscriptionId -and $context.subscription -ne $SubscriptionId) {\n    throw\
        \ 'The active subscription does not match the supplied sandbox subscription.'\n}\n$context | ConvertTo-Json\n"
      expectedState: Exactly one active default context matches the supplied subscription and reports AzureCloud.
      representativeOutput: '{"cloud":"AzureCloud","subscription":"<redacted>","tenant":"<redacted>","isDefault":true}'
      positiveCommand: |
        $context = az account show --query '{cloud:environmentName,id:id,isDefault:isDefault}' --output json | ConvertFrom-Json
        if ($context.cloud -ne 'AzureCloud' -or -not $context.isDefault -or ($SubscriptionId -and $context.id -ne $SubscriptionId)) {
          throw 'The active Azure CLI context does not match the approved default AzureCloud subscription.'
        }
        $context
      positiveExpected: The active context is AzureCloud, is the default, and has the expected redacted subscription ID.
      negativeCommand: |
        $mismatches = @(az account list --query "[?isDefault && id!='$SubscriptionId'].{id:id,name:name}" --output json | ConvertFrom-Json)
        if ($mismatches.Count -gt 0) {
          throw 'A different subscription is still marked as the default context.'
        }
        $mismatches
      negativeExpected: The mismatched-default query returns an empty list.
      evidence:
      - redacted cloud, subscription, and default-state fields
      - empty mismatched-default result
      commonFailure: The cached Azure CLI context points to a different tenant, cloud, or subscription.
      safeRetry: Stop, select the approved context yourself with `az account set --subscription <approved-id>`, then rerun
        preflight.
      cleanupDependency: Context discovery is read-only and creates nothing to remove.
    - id: LAB00-CP03
      title: Create a safe run ID, deterministic names, tags, and a local state boundary
      purpose: Derive predictable names and ownership tags, then verify that the ignored manifest uniquely identifies this
        run.
      operationalRelevance: Names help humans, while IDs, tags, and the manifest give cleanup a machine-verifiable boundary.
      objectiveIds:
      - FD-SAFETY-01
      command: |
        $namePreview = [ordered]@{
          resourceGroup = "rg-az104-lab-$RunId"
          tags = [ordered]@{ purpose = 'az104-lab'; labId = '00'; runId = $RunId }
          manifest = $Manifest
        }
        az account show --query id --output tsv | Out-Null
        $namePreview | ConvertTo-Json -Depth 4
        if (-not (Test-Path -LiteralPath $Manifest)) {
          throw 'The run manifest was not persisted before checkpoint work.'
        }
      expectedState: The name and tags contain the run ID, and `.state/<run-id>/run.json` already exists outside version control.
      representativeOutput: '{"resourceGroup":"rg-az104-lab-az104l00-01","tags":{"purpose":"az104-lab","labId":"00","runId":"az104l00-01"},"manifest":"<repo>/labs/00-safe-bootstrap/.state/az104l00-01/run.json"}'
      positiveCommand: |
        if (-not (Test-Path -LiteralPath $Manifest)) {
          throw 'The run manifest is missing.'
        }
        $runState = Get-Content -LiteralPath $Manifest -Raw | ConvertFrom-Json
        if ($runState.labId -ne 'LAB-00' -or $runState.runId -ne $RunId) {
          throw 'The run manifest identity does not match this execution.'
        }
        $runState | Select-Object labId, runId, status
      positiveExpected: The manifest exists and its lab ID and run ID exactly match this execution.
      negativeCommand: |
        $unexpectedArtifacts = @(Get-ChildItem -LiteralPath $StateDir -Filter '*.json' | Where-Object {
          $_.Name -notin @('run.json', 'validation.json', 'cleanup.json')
        })
        if ($unexpectedArtifacts.Count -gt 0) {
          throw 'An unrecognized JSON artifact exists inside the run boundary.'
        }
        $unexpectedArtifacts
      negativeExpected: No unrecognized state artifact exists inside the run boundary.
      evidence:
      - deterministic name and ownership-tag preview
      - manifest lab ID, run ID, and lifecycle status
      commonFailure: The run ID was reused, the state path is tracked by Git, or manifest identity differs from the command
        input.
      safeRetry: Preserve the conflicting state for investigation and restart with a new lowercase run ID.
      cleanupDependency: Validation and cleanup artifacts remain local; they contain no credentials and document the completed
        run.
    - id: LAB00-CP04
      title: Preview cost gates, ownership checks, cleanup, and residual queries
      purpose: Verify region and provider readiness, inventory any matching lab resources, and review the exact residual query
        before deployment.
      operationalRelevance: A cost acknowledgement is meaningful only after the learner understands SKU, quota, ownership,
        and same-session cleanup.
      objectiveIds:
      - FD-COST-01
      - FD-CLEANUP-01
      command: "az account list-locations --query \"[?name=='$Location'].{name:name,displayName:displayName}\" --output table\n\
        foreach ($namespace in @('Microsoft.Compute', 'Microsoft.Network', 'Microsoft.Storage')) {\n    az provider show --namespace\
        \ $namespace --query '{namespace:namespace,state:registrationState}' --output json\n}\naz group list --tag runId=$RunId\
        \ --query '[].{id:id,purpose:tags.purpose,labId:tags.labId,runId:tags.runId}' --output json\n"
      expectedState: The region exists, required providers are observable, and no Azure resource is falsely claimed by this
        non-mutating bootstrap run.
      representativeOutput: 'Region westeurope present; provider states reported; run-owned resource-group list: []'
      positiveCommand: |
        $selectedRegion = az account list-locations --query "[?name=='$Location'].name | [0]" --output tsv
        if ($selectedRegion -ne $Location) {
          throw 'The selected region is not available in the active subscription.'
        }
        $selectedRegion
      positiveExpected: The selected region name is returned exactly once.
      negativeCommand: |
        $unsafeGroups = @(az group list --tag runId=$RunId --query "[?tags.purpose!='az104-lab' || tags.labId!='00'].id" --output json | ConvertFrom-Json)
        if ($unsafeGroups.Count -gt 0) {
          throw 'A resource group reuses the run ID without the complete Lab 00 ownership tags.'
        }
        $unsafeGroups
      negativeExpected: No group with this run ID violates the documented ownership tags.
      evidence:
      - region and provider-readiness summary
      - empty or fully owned run-tag inventory
      commonFailure: The chosen region is unavailable, a provider is unregistered, or an old resource reuses the run tag.
      safeRetry: Do not register providers or delete the conflicting resource automatically; choose an approved region or
        new run ID.
      cleanupDependency: Because this lab creates no Azure resources, post-cleanup must still prove the run-tag inventory
        is empty.
    - id: LAB00-CP05
      title: Run the blocking readiness report and interpret every result
      purpose: Run the repository readiness contract as one command and investigate any required check that does not pass.
      operationalRelevance: A machine-readable readiness report prevents an optional tool or failed sign-in from being mistaken
        for a ready lab environment.
      objectiveIds:
      - FD-TOOLS-01
      - FD-CONTEXT-01
      - FD-COST-01
      - FD-SAFETY-01
      - FD-CLEANUP-01
      command: '$readinessScript = (Resolve-Path (Join-Path $LabRoot ''../../tools/Test-LabEnvironment.ps1'')).Path

        az account show --query environmentName --output tsv

        & pwsh -NoLogo -NoProfile -File $readinessScript -LabId ''LAB-00''

        if ($LASTEXITCODE -ne 0) { throw ''Readiness reported a required failure.'' }

        '
      expectedState: Every required tool, Azure CLI sign-in, Bicep, extension, region, and Lab 00 prerequisite check passes.
      representativeOutput: 'Readiness result: pass; required failures: 0; report: <repo>/.state/readiness.json'
      positiveCommand: |
        $readinessPath = Join-Path $LabRoot '../../.state/readiness.json'
        if (-not (Test-Path -LiteralPath $readinessPath)) {
          throw 'The readiness report is missing.'
        }
        $readiness = Get-Content -LiteralPath $readinessPath -Raw | ConvertFrom-Json
        if ($readiness.result -ne 'pass') {
          throw 'The readiness report does not contain a pass result.'
        }
        $readiness | Select-Object result, generatedAt
      positiveExpected: The current readiness artifact reports `pass` and contains no tenant, subscription, user, or token
        value.
      negativeCommand: |
        $readinessPath = Join-Path $LabRoot '../../.state/readiness.json'
        if (-not (Test-Path -LiteralPath $readinessPath)) {
          throw 'The readiness report is missing.'
        }
        $blockingFailures = @((Get-Content -LiteralPath $readinessPath -Raw | ConvertFrom-Json).checks | Where-Object { $_.status -eq 'fail' })
        if ($blockingFailures.Count -gt 0) {
          throw 'The readiness report still contains blocking failures.'
        }
        $blockingFailures
      negativeExpected: The blocking-failure list is empty.
      evidence:
      - readiness result and UTC generation time
      - empty required-failure list
      commonFailure: A required executable, Azure CLI session, extension, or lab-specific prerequisite is missing.
      safeRetry: Resolve the named prerequisite deliberately, then rerun only the readiness script; never hide a required
        failure.
      cleanupDependency: Keep the non-secret readiness report locally or remove it after review; it is ignored by Git.
    breakFix:
      injection: Set a deliberately incorrect expected subscription ID.
      symptom: Preflight reports a context mismatch before any mutation.
      diagnosis: Compare the active account ID with the supplied value.
      repair: Select the intended context yourself, then rerun preflight.
    challenge: Write a two-minute change brief that names the tenant, subscription, region, expected cost class, owner, expiry,
      and rollback boundary for a future lab.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Get started with Azure CLI
      url: https://learn.microsoft.com/en-us/cli/azure/get-started-with-azure-cli
    - title: Manage Azure subscriptions with Azure CLI
      url: https://learn.microsoft.com/en-us/cli/azure/manage-azure-subscriptions-azure-cli
    - title: Use tags to organize Azure resources
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources-cli
  01-entra-users-groups:
    role: An identity administrator onboarding a small operations team.
    outcome: Create, operate, validate, and retire two cloud-only users and their member and owner relationships by using
      Microsoft Graph through Azure CLI.
    primer: Microsoft Entra users are security principals, while groups provide a maintainable authorization boundary. Object
      IDs are immutable references; display names and user principal names can change. A recoverable identity workflow records
      each returned ID before starting the next mutation, because a partial failure can otherwise leave an unknown tenant
      object.
    designDecisions:
    - Use disposable cloud-only identities for practice.
    - Persist every returned user and group ID immediately in run.json before adding relationships.
    - Make one user a member and the other an owner so learners can prove that the relationships are independent.
    architectureWalkthrough: The administrator calls Microsoft Graph through az rest. Two cloud-only users connect to one
      security group through separate member and owner references. The local run manifest is the authoritative cleanup boundary.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$tenantDomain = [Environment]::GetEnvironmentVariable(''AZ104_TENANT_DOMAIN'')

      $initialPassword = [Environment]::GetEnvironmentVariable(''AZ104_LAB_INITIAL_PASSWORD'')

      '
    preflightChecks:
    - id: preflight.authored.lab01.graph-domain
      type: permission
      required: true
      description: Resolve the supplied UPN suffix as one verified domain through Microsoft Graph.
      command: '$domains = @(az rest --method get --url ''https://graph.microsoft.com/v1.0/domains?$select=id,isVerified''
        --output json | ConvertFrom-Json).value

        if (@($domains | Where-Object { $_.id -eq $tenantDomain -and $_.isVerified }).Count -ne 1) { throw ''The supplied
        tenant domain is not verified in the active tenant.'' }

        '
      expected: Exactly one verified Graph domain matches AZ104_TENANT_DOMAIN.
    - id: preflight.authored.lab01.password-policy
      type: input
      required: true
      description: Validate the secret locally without printing or persisting it.
      command: 'if (-not (Test-Path Env:AZ104_LAB_INITIAL_PASSWORD) -or [string]::IsNullOrWhiteSpace($initialPassword) -or
        $initialPassword.Length -lt 12) { throw ''The temporary password must contain at least 12 characters.'' }

        '
      expected: The secret is present and meets the lab's minimum local length check; its value remains redacted.
    validationContext: '$external = @{}

      $userRecords = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/user'' -and $_.lifecycleStatus
      -eq ''active'' })

      $groupRecords = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/group'' -and $_.lifecycleStatus
      -eq ''active'' })

      $alexRecord = @($userRecords | Where-Object name -like ''*-Alex'')

      $blairRecord = @($userRecords | Where-Object name -like ''*-Blair'')

      $external[''userIds''] = @($(if ($alexRecord.Count -eq 1) { [string]$alexRecord[0].id } else { '''' }), $(if ($blairRecord.Count
      -eq 1) { [string]$blairRecord[0].id } else { '''' }))

      $external[''groupId''] = $(if ($groupRecords.Count -eq 1) { [string]$groupRecords[0].id } else { '''' })

      '
    tasks:
    - id: LAB01-CP01
      title: Prove Graph access and validate the verified UPN domain
      purpose: Confirm the active tenant, enumerate only verified domains, and stop if the supplied domain cannot host a cloud-only
        user.
      operationalRelevance: A valid subscription context does not prove Microsoft Graph permissions or a usable UPN suffix.
      objectiveIds:
      - IG-USERS-01
      command: '$tenant = az account show --query tenantId --output tsv

        $domains = @(az rest --method get --url ''https://graph.microsoft.com/v1.0/domains?$select=id,isVerified,isDefault''
        --output json | ConvertFrom-Json).value

        $domain = @($domains | Where-Object { $_.id -eq $env:AZ104_TENANT_DOMAIN -and $_.isVerified })

        if ($domain.Count -ne 1) { throw ''AZ104_TENANT_DOMAIN must name one verified domain in the active tenant.'' }

        [pscustomobject]@{ tenant = ''<redacted>''; domain = $domain[0].id; verified = $domain[0].isVerified }

        '
      expectedState: The supplied domain appears exactly once with isVerified true, and the Graph request succeeds in the
        active tenant.
      representativeOutput: tenant=<redacted>; domain=contoso-lab.onmicrosoft.com; verified=True
      positiveCommand: '$domain = az rest --method get --url "https://graph.microsoft.com/v1.0/domains/$($env:AZ104_TENANT_DOMAIN)?%24select=id,isVerified"
        --output json | ConvertFrom-Json

        if ($domain.id -ne $env:AZ104_TENANT_DOMAIN -or -not $domain.isVerified) { throw ''Selected UPN domain is not verified.''
        }

        $domain

        '
      positiveExpected: The selected domain exists and is verified.
      negativeCommand: '$users = @(az rest --method get --url "https://graph.microsoft.com/v1.0/users?%24filter=startswith(displayName,''AZ104-L01-$RunId-'')&%24select=id"
        --output json | ConvertFrom-Json).value

        $unexpected = @($users | Where-Object id -notin $external.userIds)

        if ($users.Count -ne 2 -or $unexpected.Count -ne 0) { throw ''Run-specific user inventory contains a missing or unowned
        object.'' }

        ''Run-specific users=2; unowned users=0''

        '
      negativeExpected: During deployment, exactly the two manifest IDs exist and no third run-specific user is present.
      evidence:
      - checkpoint ID and UTC time
      - exact query with tenant and object identifiers redacted
      - observed property and expected value
      - negative-check result
      commonFailure: Graph returns Authorization_RequestDenied, or the domain is unverified or belongs to another tenant.
      safeRetry: Correct the active tenant or delegated Graph permission, then rerun this read-only checkpoint without changing
        context in the script.
      cleanupDependency: This checkpoint is read-only and has no Azure cleanup dependency.
    - id: LAB01-CP02
      title: Create two cloud-only users and persist each ID immediately
      purpose: Create Alex and Blair one at a time, recording each immutable object ID before attempting the next user.
      operationalRelevance: Immediate persistence lets cleanup recover the first user if creation of the second user fails.
      objectiveIds:
      - IG-USERS-02
      command: "if ($env:AZ104_LAB_INITIAL_PASSWORD.Length -lt 12) { throw 'The temporary password must contain at least 12\
        \ characters.' }\n$domain = $env:AZ104_TENANT_DOMAIN\n$userIds = @()\n$users = @(\n    @{ alias = \"az104l01a$suffix\"\
        ; displayName = \"AZ104-L01-$RunId-Alex\"; department = 'Operations' },\n    @{ alias = \"az104l01b$suffix\"; displayName\
        \ = \"AZ104-L01-$RunId-Blair\"; department = 'Operations' }\n)\nforeach ($user in $users) {\n    $bodyPath = Join-Path\
        \ $StateDir \".user-$($user.alias).json\"\n    $body = @{\n        accountEnabled = $true\n        displayName = $user.displayName\n\
        \        mailNickname = $user.alias\n        userPrincipalName = \"$($user.alias)@$domain\"\n        department =\
        \ $user.department\n        passwordProfile = @{ forceChangePasswordNextSignIn = $true; password = $env:AZ104_LAB_INITIAL_PASSWORD\
        \ }\n    }\n    try {\n        $body | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $bodyPath -Encoding utf8\n\
        \        $created = az rest --method post --url 'https://graph.microsoft.com/v1.0/users' --body \"@$bodyPath\" --output\
        \ json | ConvertFrom-Json\n    } finally {\n        Remove-Item -LiteralPath $bodyPath -Force -ErrorAction SilentlyContinue\n\
        \    }\n    $userIds += [string]$created.id\n    $external['userIds'] = @($userIds)\n    Add-ManagedObject -CheckpointId\
        \ 'LAB01-CP02' -Kind 'entra-object' -Id ([string]$created.id) -Name $user.displayName -Type 'Microsoft.Graph/user'\
        \ -Scope $state.context.tenantId -OwnershipMethod 'manifest-id'\n}\nRemove-Item Env:AZ104_LAB_INITIAL_PASSWORD -ErrorAction\
        \ SilentlyContinue\n"
      expectedState: Two enabled cloud-only users exist with unique UPNs, Operations department, and IDs already present in
        run.json.
      representativeOutput: createdUsers=2; enabled=2; manifestIds=2 (IDs and UPNs redacted)
      positiveCommand: '$users = @(az rest --method get --url "https://graph.microsoft.com/v1.0/users?%24filter=startswith(displayName,''AZ104-L01-$RunId-'')&%24select=id,displayName,accountEnabled,department"
        --output json | ConvertFrom-Json).value

        if ($users.Count -ne 2 -or @($users | Where-Object { -not $_.accountEnabled -or $_.department -ne ''Operations'' }).Count
        -ne 0) { throw ''Created-user state mismatch.'' }

        $users

        '
      positiveExpected: Exactly two run-specific users are enabled and assigned to Operations.
      negativeCommand: '$users = @(az rest --method get --url "https://graph.microsoft.com/v1.0/users?%24filter=startswith(displayName,''AZ104-L01-$RunId-'')&%24select=id,userType"
        --output json | ConvertFrom-Json).value

        if ($users.Count -ne 2 -or @($users | Where-Object userType -ne ''Member'').Count -ne 0) { throw ''Expected exactly
        two member users.'' }

        $users

        '
      negativeExpected: The inventory contains no third run-specific user and each created object has userType Member.
      evidence:
      - checkpoint ID and UTC time
      - exact query with tenant and object identifiers redacted
      - observed property and expected value
      - negative-check result
      commonFailure: The UPN already exists, the password violates tenant policy, or User.ReadWrite.All is unavailable.
      safeRetry: Query by the deterministic UPNs first; never create replacements until run.json and the tenant inventory
        agree.
      cleanupDependency: Remove group owner and member references before deleting either user.
    - id: LAB01-CP03
      title: Create the security group and add Alex as a member
      purpose: Establish a reusable authorization boundary and add only the first recorded user through an object-ID reference.
      operationalRelevance: Group membership should be proven by immutable IDs rather than display-name matching.
      objectiveIds:
      - IG-USERS-01
      command: "$groupBodyPath = Join-Path $StateDir '.group.json'\n@{ displayName = \"AZ104-L01-$RunId-Operators\"; mailEnabled\
        \ = $false; mailNickname = \"az104l01g$suffix\"; securityEnabled = $true } |\n    ConvertTo-Json | Set-Content -LiteralPath\
        \ $groupBodyPath -Encoding utf8\ntry {\n    $group = az rest --method post --url 'https://graph.microsoft.com/v1.0/groups'\
        \ --body \"@$groupBodyPath\" --output json | ConvertFrom-Json\n} finally {\n    Remove-Item -LiteralPath $groupBodyPath\
        \ -Force -ErrorAction SilentlyContinue\n}\n$external['groupId'] = [string]$group.id\nAdd-ManagedObject -CheckpointId\
        \ 'LAB01-CP03' -Kind 'entra-object' -Id ([string]$group.id) -Name ([string]$group.displayName) -Type 'Microsoft.Graph/group'\
        \ -Scope $state.context.tenantId -OwnershipMethod 'manifest-id'\n$memberBody = @{ '@odata.id' = \"https://graph.microsoft.com/v1.0/directoryObjects/$($external.userIds[0])\"\
        \ } | ConvertTo-Json -Compress\naz rest --method post --url \"https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members/`$ref\"\
        \ --body $memberBody --output none\n"
      expectedState: One security-enabled group exists and its direct members collection contains Alex but not Blair.
      representativeOutput: group.securityEnabled=True; directMembers=1; Alex=True; Blair=False
      positiveCommand: '$members = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id,displayName"
        --output json | ConvertFrom-Json).value

        if ($members.Count -ne 1 -or $members[0].id -ne $external.userIds[0]) { throw ''Alex is not the sole direct member.''
        }

        $members

        '
      positiveExpected: The member list contains only Alex's recorded object ID.
      negativeCommand: '$members = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id"
        --output json | ConvertFrom-Json).value

        if ($external.userIds[1] -in @($members.id)) { throw ''Blair received unintended membership.'' }

        ''Blair direct membership=False''

        '
      negativeExpected: Blair's owner candidate ID is absent from direct membership.
      evidence:
      - checkpoint ID and UTC time
      - exact query with tenant and object identifiers redacted
      - observed property and expected value
      - negative-check result
      commonFailure: Group propagation is incomplete or the member reference uses a UPN instead of the recorded object ID.
      safeRetry: Query the group and direct members by ID; repeat the idempotent relationship call only when the member is
        absent.
      cleanupDependency: Delete the group before deleting its member and owner users.
    - id: LAB01-CP04
      title: Assign Blair as owner without making Blair a member
      purpose: Add the second user to the owners reference and prove that ownership does not imply membership.
      operationalRelevance: Owners administer group composition; members receive group-based access, so conflating them creates
        excess access.
      objectiveIds:
      - IG-USERS-02
      command: '$ownerBody = @{ ''@odata.id'' = "https://graph.microsoft.com/v1.0/users/$($external.userIds[1])" } | ConvertTo-Json
        -Compress

        az rest --method post --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/owners/`$ref" --body $ownerBody
        --output none

        $members = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?`$select=id"
        --output json | ConvertFrom-Json).value.id

        if ($external.userIds[1] -in $members) { throw ''Blair must be an owner only for this checkpoint.'' }

        '
      expectedState: Blair is the sole explicit owner, Alex is the sole member, and the two object-ID sets do not overlap.
      representativeOutput: owners=1; members=1; overlap=0
      positiveCommand: '$owners = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/owners?%24select=id,displayName"
        --output json | ConvertFrom-Json).value

        if ($owners.Count -ne 1 -or $owners[0].id -ne $external.userIds[1]) { throw ''Blair is not the sole explicit owner.''
        }

        $owners

        '
      positiveExpected: The owners collection contains Blair's recorded object ID.
      negativeCommand: '$members = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id"
        --output json | ConvertFrom-Json).value

        if ($external.userIds[1] -in @($members.id)) { throw ''Ownership leaked into membership.'' }

        ''Owner/member overlap=0''

        '
      negativeExpected: Blair's owner ID is absent from the direct members collection.
      evidence:
      - checkpoint ID and UTC time
      - exact query with tenant and object identifiers redacted
      - observed property and expected value
      - negative-check result
      commonFailure: The owner call uses a directoryObjects URL unsupported for this relationship or Blair was also added
        as a member.
      safeRetry: Compare direct owner and member ID sets, remove only the unintended relationship, and rerun the exact-ID
        query.
      cleanupDependency: Remove or delete the group before deleting Blair.
    - id: LAB01-CP05
      title: Operate the user lifecycle and reconcile the final identity inventory
      purpose: Update Alex's job title, disable and re-enable Blair, then reconcile users, membership, ownership, and run.json
        by immutable ID.
      operationalRelevance: Day-two identity administration includes property and sign-in-state changes, not only object creation.
      objectiveIds:
      - IG-USERS-01
      - IG-USERS-02
      command: 'az rest --method patch --url "https://graph.microsoft.com/v1.0/users/$($external.userIds[0])" --body ''{"jobTitle":"Cloud
        Operations Analyst"}'' --output none

        az rest --method patch --url "https://graph.microsoft.com/v1.0/users/$($external.userIds[1])" --body ''{"accountEnabled":false}''
        --output none

        $disabled = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.userIds[1])?`$select=accountEnabled"
        --query accountEnabled --output tsv

        if ($disabled -ne ''false'') { throw ''The disabled-state validation did not converge.'' }

        az rest --method patch --url "https://graph.microsoft.com/v1.0/users/$($external.userIds[1])" --body ''{"accountEnabled":true}''
        --output none

        az rest --method delete --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members/$($external.userIds[0])/%24ref"
        --output none

        $faultMembers = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id"
        --output json | ConvertFrom-Json).value

        if ($external.userIds[0] -in @($faultMembers.id)) { throw ''The missing-membership fault was not established.'' }

        $memberBody = @{ ''@odata.id'' = "https://graph.microsoft.com/v1.0/directoryObjects/$($external.userIds[0])" } | ConvertTo-Json
        -Compress

        az rest --method post --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members/%24ref" --body $memberBody
        --output none

        $repairedMembers = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id"
        --output json | ConvertFrom-Json).value

        if ($repairedMembers.Count -ne 1 -or $repairedMembers[0].id -ne $external.userIds[0]) { throw ''Alex membership repair
        failed.'' }

        '
      expectedState: Alex has the new job title, Blair is enabled again, and the final relationship inventory still has one
        distinct member and owner.
      representativeOutput: Alex.jobTitle=Cloud Operations Analyst; Blair.accountEnabled=True; memberOwnerOverlap=0
      positiveCommand: '$alex = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.userIds[0])?%24select=id,jobTitle,department,accountEnabled"
        --output json | ConvertFrom-Json

        if ($alex.id -ne $external.userIds[0] -or $alex.jobTitle -ne ''Cloud Operations Analyst'' -or $alex.department -ne
        ''Operations'' -or -not $alex.accountEnabled) { throw ''Alex lifecycle state mismatch.'' }

        $alex

        '
      positiveExpected: Alex is enabled with the expected job title and department.
      negativeCommand: '$group = az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)?%24select=id,deletedDateTime"
        --output json | ConvertFrom-Json

        $members = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?%24select=id"
        --output json | ConvertFrom-Json).value

        $owners = @(az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/owners?%24select=id"
        --output json | ConvertFrom-Json).value

        if ($group.id -ne $external.groupId -or $group.deletedDateTime) { throw ''Group is missing or deleted.'' }

        if ($members.Count -ne 1 -or $members[0].id -ne $external.userIds[0] -or $owners.Count -ne 1 -or $owners[0].id -ne
        $external.userIds[1]) { throw ''Final member/owner reconciliation failed.'' }

        if (@($state.managedObjects | Where-Object { $_.type -in @(''Microsoft.Graph/user'',''Microsoft.Graph/group'') -and
        $_.lifecycleStatus -eq ''active'' }).Count -ne 3) { throw ''Manifest identity inventory is incomplete.'' }

        ''Final users=2; groups=1; members=1; owners=1''

        '
      negativeExpected: The group is active, has no deletedDateTime, and every run-owned ID is represented once in run.json.
      evidence:
      - checkpoint ID and UTC time
      - exact query with tenant and object identifiers redacted
      - observed property and expected value
      - negative-check result
      commonFailure: A PATCH has not converged, or a transient relationship update left the final inventory inconsistent.
      safeRetry: Requery the exact user and group IDs; repeat only the missing property or relationship change.
      cleanupDependency: Cleanup deletes the group first, then the two exact manifest-recorded users, and verifies each ID
        returns not found.
    breakFix:
      injection: Delete Alex's direct member reference while leaving Blair's owner reference unchanged.
      symptom: The group still has an owner but the member query is empty, so group-based workload access disappears.
      diagnosis: Compare the exact owner and member collections with the two IDs in run.json; do not infer either relationship
        from display names.
      repair: POST Alex's recorded directory-object reference back to the group's members/$ref endpoint and rerun both collections.
    challenge: Create a second role-appropriate group, transfer Alex's membership, and submit a before/after inventory that
      proves ownership did not move.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Microsoft Graph user resource type
      url: https://learn.microsoft.com/en-us/graph/api/resources/user
    - title: Microsoft Graph group members and owners overview
      url: https://learn.microsoft.com/en-us/graph/api/resources/groups-overview
  02-entra-licenses-guests-sspr:
    role: An identity administrator preparing a controlled external-collaboration and SSPR pilot.
    outcome: Build a reversible guest and licensing pilot, assess supported SSPR readiness, and preserve every tenant setting
      required for recovery.
    primer: Guest invitation, license assignment, and password-reset policy are separate control planes with different permissions
      and prerequisites. A user needs usageLocation before most license assignments. Microsoft Graph does not expose the Entra
      selected-group SSPR scope setting, so this lab never calls an undocumented endpoint. It builds the pilot group, queries
      supported registration reports, and gates a reversible administrator-SSPR authorizationPolicy exercise separately.
    designDecisions:
    - Invitation, license assignment, and the administrator SSPR policy change are independent optional gates.
    - Validate SKU capacity and usageLocation before calling assignLicense.
    - Persist the original allowedToUseSSPR value before PATCH and restore it before deleting pilot objects.
    architectureWalkthrough: Microsoft Graph creates the pilot group and optional guest, links membership, and assigns an
      approved SKU. Authorization policy and registration reports are queried independently so administrator SSPR is never
      misrepresented as the unsupported selected-group scope.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$guestEmail = [Environment]::GetEnvironmentVariable(''AZ104_GUEST_EMAIL'')

      $usageLocation = [Environment]::GetEnvironmentVariable(''AZ104_USAGE_LOCATION'')

      $licenseSkuId = [Environment]::GetEnvironmentVariable(''AZ104_LICENSE_SKU_ID'')

      $ssprAuthorization = [Environment]::GetEnvironmentVariable(''AZ104_ALLOW_SSPR_POLICY_CHANGE'')

      '
    preflightChecks:
    - id: preflight.authored.lab02.graph-surfaces
      type: permission
      required: true
      description: Read invitation policy and subscribed-license inventory without changing the tenant.
      command: '$policy = az rest --method get --url ''https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=allowInvitesFrom,allowedToUseSSPR''
        --output json | ConvertFrom-Json

        $skus = az rest --method get --url ''https://graph.microsoft.com/v1.0/subscribedSkus?$select=id,consumedUnits,prepaidUnits''
        --output json | ConvertFrom-Json

        if (-not $policy.id -or $null -eq $skus.value) { throw ''Required Graph policy or SKU inventory is unavailable.''
        }

        '
      expected: Authorization policy and subscribed SKU collection are readable.
    - id: preflight.authored.lab02.guest-gate
      type: permission
      required: false
      description: When a guest email is supplied, prove tenant invitation policy is not disabled.
      command: "if ($guestEmail) {\n    $policy = az rest --method get --url 'https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=allowInvitesFrom'\
        \ --output json | ConvertFrom-Json\n    if ($policy.allowInvitesFrom -eq 'none') { throw 'Tenant invitation policy\
        \ disables the requested guest lane.' }\n}\n"
      expected: The guest lane is absent or tenant invitation policy allows an authorized inviter.
    - id: preflight.authored.lab02.license-gate
      type: capacity
      required: false
      description: When any license input is supplied, require the complete tuple and an available unit for the exact SKU
        ID.
      command: "if ($guestEmail -or $usageLocation -or $licenseSkuId) {\n    if (-not $guestEmail -or -not $licenseSkuId -or\
        \ $usageLocation -notmatch '^[A-Za-z]{2}$') { throw 'Guest email, exact SKU ID, and two-letter usage location must\
        \ be supplied together for licensing.' }\n    $skus = @(az rest --method get --url 'https://graph.microsoft.com/v1.0/subscribedSkus'\
        \ --output json | ConvertFrom-Json).value\n    $selected = @($skus | Where-Object id -eq $licenseSkuId)\n    if ($selected.Count\
        \ -ne 1 -or ($selected[0].prepaidUnits.enabled - $selected[0].consumedUnits) -lt 1) { throw 'The exact license SKU\
        \ is absent or has no enabled unit available.' }\n}\n"
      expected: The license lane is absent or all dependent inputs and one available unit are present.
    - id: preflight.authored.lab02.sspr-gate
      type: permission
      required: false
      description: For an exact YES authorization, prove the supported administrator SSPR property is readable before mutation.
      command: "if ($ssprAuthorization -eq 'YES') {\n    $policy = az rest --method get --url 'https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=id,allowedToUseSSPR'\
        \ --output json | ConvertFrom-Json\n    if (-not $policy.id -or $null -eq $policy.allowedToUseSSPR) { throw 'allowedToUseSSPR\
        \ cannot be read for recovery.' }\n}\n"
      expected: The SSPR lane is absent or its exact recoverable Boolean is readable.
    validationContext: '$external = @{}

      $groupRecord = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/group'' } | Select-Object -First
      1)

      $guestRecord = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/user'' } | Select-Object -First
      1)

      $external[''groupId''] = $(if ($groupRecord.Count -eq 1) { [string]$groupRecord[0].id } else { '''' })

      $external[''guestUserId''] = $(if ($guestRecord.Count -eq 1) { [string]$guestRecord[0].id } else { '''' })

      '
    cleanupContext: '$guestRecord = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/user'' -and $_.lifecycleStatus
      -eq ''active'' } | Select-Object -First 1)

      $guestUserId = $(if ($guestRecord.Count -eq 1) { [string]$guestRecord[0].id } else { '''' })

      $licenseSkuId = [string]$state.inputs[''license-sku-id'']

      '
    preCleanupCommand: "if ($guestUserId -and $licenseSkuId) {\n    $removeBody = @{ addLicenses = @(); removeLicenses = @($licenseSkuId)\
      \ } | ConvertTo-Json -Depth 5 -Compress\n    az rest --method post --url \"https://graph.microsoft.com/v1.0/users/$guestUserId/assignLicense\"\
      \ --body $removeBody --output none\n    $remainingLicenses = az rest --method get --url \"https://graph.microsoft.com/v1.0/users/$guestUserId?%24select=assignedLicenses\"\
      \ --output json | ConvertFrom-Json\n    if ($licenseSkuId -in @($remainingLicenses.assignedLicenses.skuId)) { throw\
      \ 'Cleanup stopped because the recorded guest license was not removed.' }\n}\n"
    tasks:
    - id: LAB02-CP01
      title: Inventory invitation policy, license capacity, and SSPR reporting access
      purpose: Read the three independent service surfaces before deciding which optional gates can execute.
      operationalRelevance: A tenant role that can invite guests might not be able to assign licenses, read reports, or update
        authorization policy.
      objectiveIds:
      - IG-USERS-03
      command: '$policy = az rest --method get --url ''https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=allowInvitesFrom,allowedToUseSSPR''
        --output json | ConvertFrom-Json

        $skus = @(az rest --method get --url ''https://graph.microsoft.com/v1.0/subscribedSkus?$select=id,skuPartNumber,consumedUnits,prepaidUnits''
        --output json | ConvertFrom-Json).value

        $registrationAccess = $true

        try { $null = az rest --method get --url ''https://graph.microsoft.com/v1.0/reports/authenticationMethods/userRegistrationDetails?$top=1''
        --output none } catch { $registrationAccess = $false }

        [pscustomobject]@{ invitePolicy = $policy.allowInvitesFrom; subscribedSkus = $skus.Count; registrationReportAccess
        = $registrationAccess }

        '
      expectedState: Invitation policy and subscribed SKUs are readable; registration-report access is explicitly true or
        recorded as an optional unavailable gate.
      representativeOutput: invitePolicy=adminsAndGuestInvitersAndAllMembers; subscribedSkus=3; registrationReportAccess=True
      positiveCommand: '$skuResult = az rest --method get --url ''https://graph.microsoft.com/v1.0/subscribedSkus?$select=id,skuPartNumber,consumedUnits,prepaidUnits''
        --output json | ConvertFrom-Json

        if ($null -eq $skuResult.value) { throw ''subscribedSkus did not return a value collection.'' }

        $skuResult.value | Select-Object id,skuPartNumber,consumedUnits,prepaidUnits

        '
      positiveExpected: A value collection is returned; it may be empty in an unlicensed tenant but every item exposes capacity
        fields.
      negativeCommand: '$policyResult = az rest --method get --url ''https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=allowInvitesFrom,allowedToUseSSPR''
        --output json | ConvertFrom-Json

        if ($policyResult.allowInvitesFrom -notin @(''none'',''adminsAndGuestInviters'',''adminsGuestInvitersAndAllMembers'',''everyone''))
        { throw ''Invitation policy returned an unknown state.'' }

        $policyResult | Select-Object allowInvitesFrom,allowedToUseSSPR

        '
      negativeExpected: A known invitation-policy state is observed without changing it.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The signed-in identity lacks directory, organization, or reports read permission for a selected gate.
      safeRetry: Treat unavailable optional permissions as skipped, obtain authorization outside the lab, and rerun only the
        affected read-only query.
      cleanupDependency: This checkpoint is read-only.
    - id: LAB02-CP02
      title: Create and persist the required pilot group
      purpose: Create the security group independently of every optional gate and persist its concrete Graph collection and
        ID immediately.
      operationalRelevance: The group is the stable pilot boundary; an unavailable guest, license, or policy gate must not
        make its ownership ambiguous.
      objectiveIds:
      - IG-USERS-04
      command: '$group = az ad group create --display-name "AZ104-L02-$RunId-SSPR-Pilot" --mail-nickname "az104l02$suffix"
        --output json | ConvertFrom-Json

        $external[''groupId''] = [string]$group.id

        Add-ManagedObject -CheckpointId ''LAB02-CP02'' -Kind ''entra-object'' -Id ([string]$group.id) -Name ([string]$group.displayName)
        -Type ''Microsoft.Graph/group'' -Scope $state.context.tenantId -OwnershipMethod ''manifest-id''

        '
      expectedState: Exactly one run-specific security group exists and its ID is manifest-recorded as Microsoft.Graph/group
        before any optional task.
      representativeOutput: pilotGroups=1; securityEnabled=True; manifestType=Microsoft.Graph/group
      positiveCommand: '$groupResult = az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)?`$select=id,displayName,securityEnabled"
        --output json | ConvertFrom-Json

        if ($groupResult.id -ne $external.groupId -or -not $groupResult.securityEnabled) { throw ''Pilot group does not match
        the manifest.'' }

        $groupResult

        '
      positiveExpected: The exact manifest-recorded group exists and is security-enabled.
      negativeCommand: '$groupResult = az rest --method get --url "https://graph.microsoft.com/v1.0/groups?`$filter=startswith(displayName,''AZ104-L02-$RunId-'')&`$select=id"
        --output json | ConvertFrom-Json

        if (@($groupResult.value).Count -ne 1) { throw ''Expected exactly one run-specific pilot group.'' }

        $groupResult.value

        '
      negativeExpected: Exactly one run-specific pilot group exists; no retry-created duplicate is present.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A prior partial run created the deterministic group but its ID was not reconciled before retry.
      safeRetry: Search by the run-specific display-name prefix, record the one exact ID, and never create a second pilot
        group.
      cleanupDependency: Delete the exact group after restoring tenant policy and removing any guest license; then verify
        its ID is not found.
    - id: LAB02-CP03
      title: Invite and directly link the optional guest
      purpose: Invite one supplied address without sending mail, persist the returned concrete user ID immediately, and add
        that exact object to the pilot group.
      operationalRelevance: Invitation can succeed while a later relationship call fails, so cleanup and retry must not depend
        on an email lookup.
      objectiveIds:
      - IG-USERS-04
      required: false
      gateEnvironmentVariables:
      - AZ104_GUEST_EMAIL
      command: '$inviteBody = @{ invitedUserEmailAddress = $env:AZ104_GUEST_EMAIL; inviteRedirectUrl = ''https://myapps.microsoft.com'';
        sendInvitationMessage = $false } | ConvertTo-Json -Compress

        $invitation = az rest --method post --url ''https://graph.microsoft.com/v1.0/invitations'' --body $inviteBody --output
        json | ConvertFrom-Json

        $external[''guestUserId''] = [string]$invitation.invitedUser.id

        if (-not $external.guestUserId) { throw ''Invitation returned no guest user ID.'' }

        Add-ManagedObject -CheckpointId ''LAB02-CP03'' -Kind ''entra-object'' -Id ([string]$external.guestUserId) -Name ''invited-guest''
        -Type ''Microsoft.Graph/user'' -Scope $state.context.tenantId -OwnershipMethod ''manifest-id''

        $state.inputs[''guest-email''] = [string]$env:AZ104_GUEST_EMAIL

        Save-RunState

        $memberBody = @{ ''@odata.id'' = "https://graph.microsoft.com/v1.0/directoryObjects/$($external.guestUserId)" } |
        ConvertTo-Json -Compress

        az rest --method post --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members/`$ref" --body $memberBody
        --output none

        '
      expectedState: One manifest-recorded userType Guest exists and is a direct member of the exact pilot group.
      representativeOutput: guestGate=pass; userType=Guest; guestId=<redacted>; directMember=True
      positiveCommand: '$guestResult = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)?`$select=id,userType,mail"
        --output json | ConvertFrom-Json

        $memberResult = az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?`$select=id"
        --output json | ConvertFrom-Json

        if ($guestResult.userType -ne ''Guest'' -or $guestResult.id -notin @($memberResult.value.id)) { throw ''Guest type
        or direct membership mismatch.'' }

        [pscustomobject]@{ guestId = $guestResult.id; userType = $guestResult.userType; directMember = $true }

        '
      positiveExpected: The exact recorded object is userType Guest and appears in the group's direct members collection.
      negativeCommand: |
        $guestObjectId = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)?%24select=id" --query id --output tsv
        $guestRecords = @($state.managedObjects | Where-Object {
          $_.type -eq 'Microsoft.Graph/user' -and $_.lifecycleStatus -eq 'active'
        })
        if ($guestObjectId -ne $external.guestUserId -or $guestRecords.Count -ne 1 -or $guestRecords[0].id -ne $external.guestUserId) {
          throw 'The live guest and manifest guest inventory do not identify one exact object.'
        }
        'Active live and manifest-recorded guest objects: 1'
      negativeExpected: The manifest contains exactly one active concrete Graph user ID for the optional guest lane.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Invitation succeeds but membership fails, or the email already maps to an existing external object.
      safeRetry: Reconcile the returned or existing user ID into run.json, then retry only the missing membership reference.
      cleanupDependency: Remove any recorded license, then delete the exact manifest-recorded user after the pilot group.
    - id: LAB02-CP04
      title: Inject a license denial, then set usage location and assign the approved SKU
      purpose: Prove an invalid SKU is denied without mutation, normalize the guest's two-letter usage location, validate
        exact capacity, and assign only the approved SKU.
      operationalRelevance: License calls fail without usageLocation and friendly-name matching can consume the wrong subscribed
        product.
      objectiveIds:
      - IG-USERS-05
      required: false
      gateEnvironmentVariables:
      - AZ104_GUEST_EMAIL
      - AZ104_LICENSE_SKU_ID
      - AZ104_USAGE_LOCATION
      command: 'if ($env:AZ104_USAGE_LOCATION -notmatch ''^[A-Za-z]{2}$'') { throw ''AZ104_USAGE_LOCATION must be a two-letter
        ISO country code.'' }

        if (-not $external.guestUserId) { throw ''The guest checkpoint must complete before licensing.'' }

        $PSNativeCommandUseErrorActionPreference = $false

        $denied = az rest --method post --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)/assignLicense"
        --body ''{"addLicenses":[{"skuId":"00000000-0000-0000-0000-000000000000"}],"removeLicenses":[]}'' --output none 2>&1

        $deniedExit = $LASTEXITCODE

        $PSNativeCommandUseErrorActionPreference = $true

        if ($deniedExit -eq 0) { throw ''The invalid-SKU break/fix request unexpectedly succeeded.'' }

        $locationBody = @{ usageLocation = $env:AZ104_USAGE_LOCATION.ToUpperInvariant() } | ConvertTo-Json -Compress

        az rest --method patch --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)" --body $locationBody
        --output none

        $state.inputs[''usage-location''] = $env:AZ104_USAGE_LOCATION.ToUpperInvariant()

        Save-RunState

        $skus = @(az rest --method get --url ''https://graph.microsoft.com/v1.0/subscribedSkus'' --output json | ConvertFrom-Json).value

        $sku = @($skus | Where-Object id -eq $env:AZ104_LICENSE_SKU_ID)

        if ($sku.Count -ne 1) { throw ''AZ104_LICENSE_SKU_ID is not a subscribed tenant SKU.'' }

        if (($sku[0].prepaidUnits.enabled - $sku[0].consumedUnits) -lt 1) { throw ''The selected SKU has no enabled unit available.''
        }

        $licenseBody = @{ addLicenses = @(@{ skuId = $env:AZ104_LICENSE_SKU_ID }); removeLicenses = @() } | ConvertTo-Json
        -Depth 6 -Compress

        $assignmentResult = az rest --method post --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)/assignLicense"
        --body $licenseBody --output json | ConvertFrom-Json

        $state.inputs[''license-sku-id''] = [string]$env:AZ104_LICENSE_SKU_ID

        Save-RunState

        if ($state.inputs[''license-sku-id''] -notin @($assignmentResult.assignedLicenses.skuId)) { throw ''assignLicense
        did not return the approved SKU.'' }

        '
      expectedState: The impossible SKU is denied, usageLocation is uppercase and persisted, and exactly the approved subscribed
        SKU is assigned.
      representativeOutput: invalidSkuDenied=True; usageLocation=DE; approvedSku=<redacted>; assigned=True
      positiveCommand: '$licenseResult = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)/licenseDetails?`$select=skuId,skuPartNumber"
        --output json | ConvertFrom-Json

        if (@($licenseResult.value | Where-Object skuId -eq $state.inputs[''license-sku-id'']).Count -ne 1) { throw ''The
        approved SKU is not assigned exactly once.'' }

        $licenseResult.value

        '
      positiveExpected: licenseDetails contains the exact recorded SKU once.
      negativeCommand: '$guestResult = az rest --method get --url "https://graph.microsoft.com/v1.0/users/$($external.guestUserId)?`$select=usageLocation,assignedLicenses"
        --output json | ConvertFrom-Json

        if ($guestResult.usageLocation -ne $state.inputs[''usage-location'']) { throw ''Guest usageLocation does not match
        the recorded value.'' }

        $unexpected = @($guestResult.assignedLicenses | Where-Object skuId -ne $state.inputs[''license-sku-id''])

        if ($unexpected.Count -ne 0) { throw ''An unapproved SKU is assigned to the lab-created guest.'' }

        [pscustomobject]@{ usageLocation = $guestResult.usageLocation; unexpectedSkus = $unexpected.Count }

        '
      negativeExpected: The guest has a usageLocation and no unapproved license SKU.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Capacity changed after preflight, the location is not an ISO code, or the operator supplied a product
        name instead of the SKU GUID.
      safeRetry: Query the exact guest licenseDetails and subscribedSkus, then add only the missing approved SKU without removing
        unrelated tenant data.
      cleanupDependency: Remove only state.inputs license-sku-id from the exact guest before deleting the guest object.
    - id: LAB02-CP05
      title: Record, exercise, and reconcile the supported administrator SSPR gate
      purpose: Persist allowedToUseSSPR before an exact-authorized PATCH, then reconcile policy, group, guest, license, and
        registration evidence without claiming selected-group SSPR configuration.
      operationalRelevance: Cleanup cannot restore a tenant policy from memory, and pilot-group membership is not evidence
        that a user is SSPR-capable.
      objectiveIds:
      - IG-USERS-03
      - IG-USERS-04
      - IG-USERS-05
      required: false
      gateEnvironmentValues:
        AZ104_ALLOW_SSPR_POLICY_CHANGE: 'YES'
      command: "if ($env:AZ104_ALLOW_SSPR_POLICY_CHANGE -cne 'YES') { throw 'Administrator SSPR mutation requires the exact\
        \ YES authorization value.' }\n$policy = az rest --method get --url 'https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=id,allowedToUseSSPR'\
        \ --output json | ConvertFrom-Json\nif (-not @($state.originalSettings | Where-Object property -eq 'allowedToUseSSPR'))\
        \ {\n    $state.originalSettings += @{\n        checkpointId = 'LAB02-CP05'; targetId = 'authorizationPolicy'; property\
        \ = 'allowedToUseSSPR'\n        value = [bool]$policy.allowedToUseSSPR; recordedAt = (Get-Date).ToUniversalTime().ToString('o')\n\
        \    }\n    Save-RunState\n}\naz rest --method patch --url 'https://graph.microsoft.com/v1.0/policies/authorizationPolicy'\
        \ --body '{\"allowedToUseSSPR\":true}' --output none\n$members = az rest --method get --url \"https://graph.microsoft.com/v1.0/groups/$($external.groupId)/members?`$select=id,userType,usageLocation,assignedLicenses\"\
        \ --output json | ConvertFrom-Json\n$baseline = @($state.originalSettings | Where-Object property -eq 'allowedToUseSSPR')\n\
        if ($baseline.Count -ne 1) { throw 'Exactly one recoverable allowedToUseSSPR baseline is required.' }\n$registrationAccess\
        \ = $true\ntry { $registration = az rest --method get --url 'https://graph.microsoft.com/v1.0/reports/authenticationMethods/userRegistrationDetails?$top=1'\
        \ --output json | ConvertFrom-Json } catch { $registrationAccess = $false }\n[pscustomobject]@{ memberCount = $members.value.Count;\
        \ adminSspr = $true; recoverableBaselines = $baseline.Count; registrationReportAccess = $registrationAccess; selectedGroupScopeMutation\
        \ = $false }\n"
      expectedState: The supported administrator property is true, exactly one prior Boolean is durable, and reconciliation
        explicitly reports that no selected-group scope endpoint was mutated.
      representativeOutput: adminSspr=True; recoverableBaselines=1; registrationReportAccess=True|False; selectedGroupScopeMutation=False
      positiveCommand: '$ssprResult = az rest --method get --url ''https://graph.microsoft.com/v1.0/policies/authorizationPolicy?$select=id,allowedToUseSSPR''
        --output json | ConvertFrom-Json

        $baseline = @($state.originalSettings | Where-Object property -eq ''allowedToUseSSPR'')

        if (-not $ssprResult.allowedToUseSSPR -or $baseline.Count -ne 1) { throw ''Administrator SSPR or its recovery baseline
        is incomplete.'' }

        [pscustomobject]@{ allowedToUseSSPR = $ssprResult.allowedToUseSSPR; recoverableBaselines = $baseline.Count }

        '
      positiveExpected: allowedToUseSSPR is true and exactly one original Boolean remains available for cleanup.
      negativeCommand: '$pilot = az rest --method get --url "https://graph.microsoft.com/v1.0/groups/$($external.groupId)?`$select=id,securityEnabled"
        --output json | ConvertFrom-Json

        if ($pilot.id -ne $external.groupId -or -not $pilot.securityEnabled) { throw ''Pilot group no longer matches the manifest.''
        }

        $guestObjects = @($state.managedObjects | Where-Object { $_.type -eq ''Microsoft.Graph/user'' -and $_.lifecycleStatus
        -eq ''active'' })

        if ($guestObjects.Count -gt 1) { throw ''More than one guest object is owned by the run.'' }

        [pscustomobject]@{ selectedGroupScopeMutation = $false; activeGuestObjects = $guestObjects.Count }

        '
      negativeExpected: No unsupported selected-group mutation is claimed and at most the one intended guest is manifest-owned.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Policy write permission is unavailable, registration reports require extra licensing, or a retry occurs
        without a durable original Boolean.
      safeRetry: Confirm originalSettings contains exactly one baseline before retrying; never PATCH when the prior setting
        cannot be recovered.
      cleanupDependency: Restore policy, remove the recorded SKU, delete the exact group, then delete the exact guest and
        query all IDs again.
    breakFix:
      injection: Supply a SKU ID that is not subscribed in the tenant.
      symptom: The license call fails without changing the guest's existing assignments.
      diagnosis: Compare the requested ID with subscribedSkus and available units.
      repair: Set the exact approved SKU ID, confirm usageLocation and capacity, then call assignLicense without removing
        existing assignments.
    challenge: Produce a pilot matrix that separates invitation, redemption, usageLocation, license, group membership, registration
      capability, and administrator SSPR policy.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Add or update a user's profile information in Microsoft Entra ID
      url: https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info
    - title: Microsoft Graph invitation API
      url: https://learn.microsoft.com/en-us/graph/api/invitation-post
    - title: Microsoft Graph assignLicense API
      url: https://learn.microsoft.com/en-us/graph/api/user-assignlicense
    - title: Microsoft Graph authorizationPolicy resource
      url: https://learn.microsoft.com/en-us/graph/api/resources/authorizationpolicy
    - title: Deploy Microsoft Entra self-service password reset
      url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-deploy
  03-azure-rbac-scopes:
    role: A platform administrator granting least-privilege access to a workload team.
    outcome: Build and interpret direct and inherited Azure RBAC assignments across resource-group and resource scopes, including
      a remediated over-privilege fault.
    primer: Azure RBAC evaluation combines role definition, principal, scope, and inheritance. A role assignment is effective
      below its scope, while deny assignments and management-group inheritance can change the final result.
    designDecisions:
    - Use built-in roles before considering custom roles.
    - Assign Reader at resource-group scope and Storage Blob Data Reader at one storage-account scope.
    - Interpret control-plane actions, dataActions, direct assignments, and inheritance separately.
    architectureWalkthrough: The principal receives Reader at the resource group. A child storage account inherits Reader
      and also receives a direct blob data-plane role. A temporary Contributor assignment demonstrates how scope and role
      definition combine to create excess access before exact-ID remediation.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$principalObjectId = [Environment]::GetEnvironmentVariable(''AZ104_PRINCIPAL_OBJECT_ID'')

      $storage = "st03$suffix"

      '
    preflightChecks:
    - id: preflight.authored.lab03.principal-and-roles
      type: permission
      required: true
      description: Resolve the disposable principal and both built-in role definitions without assigning access.
      command: "$principal = az rest --method get --url \"https://graph.microsoft.com/v1.0/directoryObjects/$principalObjectId?%24select=id\"\
        \ --output json | ConvertFrom-Json\nif ($principal.id -ne $principalObjectId) { throw 'The supplied principal does\
        \ not resolve in the active tenant.' }\nforeach ($role in @('Reader','Storage Blob Data Reader')) {\n    if (@(az\
        \ role definition list --name $role --output json | ConvertFrom-Json).Count -ne 1) { throw \"Built-in role not resolved:\
        \ $role\" }\n}\n"
      expected: The principal and both exact built-in roles resolve once.
    - id: preflight.authored.lab03.storage-name
      type: service
      required: true
      description: Confirm the deterministic storage-account name is available before role-scoped resource creation.
      command: '$availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        '
      expected: The deterministic account name is globally available.
    validationContext: '$principalObjectId = [string]$state.inputs[''principal-object-id'']

      $scope = "/subscriptions/$($state.context.subscriptionId)/resourceGroups/$ResourceGroupName"

      $storage = "st03$suffix"

      '
    tasks:
    - id: LAB03-CP01
      title: Resolve the principal and inspect existing scope inheritance
      purpose: Verify the exact principal object, built-in roles, and pre-existing assignments before creating new access.
      operationalRelevance: Display-name ambiguity and inherited access are common causes of incorrect RBAC conclusions.
      objectiveIds:
      - IG-ACCESS-01
      command: '$principal = az rest --method get --url "https://graph.microsoft.com/v1.0/directoryObjects/$($env:AZ104_PRINCIPAL_OBJECT_ID)"
        --output json | ConvertFrom-Json

        if (-not $principal.id) { throw ''The supplied principal object ID was not found in the active tenant.'' }

        $state.inputs[''principal-object-id''] = [string]$principal.id

        Save-RunState

        az role definition list --name Reader --query ''[0].{id:id,actions:permissions[0].actions,dataActions:permissions[0].dataActions}''
        --output json

        az role assignment list --scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName" --include-inherited
        --output table

        '
      expectedState: The exact principal resolves, Reader exposes control-plane read actions and no blob dataActions, and
        inherited baseline assignments are visible.
      representativeOutput: principal=<redacted>; Reader.actions=*/read; Reader.dataActions=[]; inheritedBaseline=<count>
      positiveCommand: '$reader = @(az role definition list --name Reader --output json | ConvertFrom-Json)

        if ($reader.Count -ne 1 -or ''*/read'' -notin $reader[0].permissions.actions) { throw ''Built-in Reader definition
        was not resolved as expected.'' }

        $reader[0].permissions

        '
      positiveExpected: Exactly one built-in Reader role definition includes */read.
      negativeCommand: '$baseline = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope --include-inherited
        --output json | ConvertFrom-Json)

        $unexpected = @($baseline | Where-Object { $_.roleDefinitionName -in @(''Owner'',''User Access Administrator'') })

        if ($unexpected.Count -gt 0) { throw ''The disposable principal already has elevated inherited access at the lab scope.''
        }

        $baseline | Select-Object roleDefinitionName,scope

        '
      negativeExpected: The disposable principal has no pre-existing Owner or User Access Administrator assignment effective
        at lab scope.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The object belongs to another tenant or the signed-in administrator cannot read directory objects or
        assignments.
      safeRetry: Correct the exact object ID or authorization, then rerun the read-only baseline without changing assignments.
      cleanupDependency: This task only persists the non-secret principal ID.
    - id: LAB03-CP02
      title: Assign Reader at resource-group scope and persist the assignment ID
      purpose: Create one least-privilege control-plane assignment at the workload lifecycle boundary.
      operationalRelevance: The assignment ID, not its friendly role name, is the deterministic rollback target.
      objectiveIds:
      - IG-ACCESS-02
      command: '$principalObjectId = [string]$state.inputs[''principal-object-id'']

        $scope = "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName"

        $odataType = az rest --method get --url "https://graph.microsoft.com/v1.0/directoryObjects/$principalObjectId" --query
        ''"@odata.type"'' --output tsv

        $principalType = switch ($odataType) { ''#microsoft.graph.user'' { ''User'' } ''#microsoft.graph.group'' { ''Group''
        } default { ''ServicePrincipal'' } }

        $assignment = az role assignment create --assignee-object-id $principalObjectId --assignee-principal-type $principalType
        --role Reader --scope $scope --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB03-CP02'' -Kind ''azure-resource'' -Id ([string]$assignment.id) -Name ''Reader''
        -Type ''Microsoft.Authorization/roleAssignments'' -Scope $scope -OwnershipMethod ''manifest-id''

        '
      expectedState: One direct Reader assignment exists at the exact resource-group scope and its ID is durable in run.json.
      representativeOutput: role=Reader; scope=.../resourceGroups/<redacted>; assignmentId=<redacted>
      positiveCommand: '$direct = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope --output
        json | ConvertFrom-Json | Where-Object { $_.roleDefinitionName -eq ''Reader'' -and $_.scope -eq $scope })

        if ($direct.Count -ne 1) { throw ''Expected one direct Reader assignment at resource-group scope.'' }

        $direct | Select-Object id,roleDefinitionName,scope

        '
      positiveExpected: Exactly one direct Reader assignment matches the principal and exact scope.
      negativeCommand: '$directElevated = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope
        --output json | ConvertFrom-Json | Where-Object roleDefinitionName -in @(''Owner'',''Contributor'',''User Access Administrator''))

        if ($directElevated.Count -gt 0) { throw ''An elevated direct assignment is present at resource-group scope.'' }

        ''No elevated direct assignment.''

        '
      negativeExpected: No direct Owner, Contributor, or User Access Administrator assignment exists at the resource group.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The identity lacks role-assignment write permission or the supplied principal type cannot be resolved.
      safeRetry: List assignments for the exact principal and scope before retrying; record an existing matching assignment
        rather than cloning it.
      cleanupDependency: The assignment is removed with the resource group or by its exact manifest ID before residual validation.
    - id: LAB03-CP03
      title: Add a resource-scoped blob data role
      purpose: Create a tagged storage account and assign Storage Blob Data Reader only at that child resource.
      operationalRelevance: Azure Reader grants control-plane visibility but no blob data access; dataActions require a separate
        data-plane role.
      objectiveIds:
      - IG-ACCESS-03
      command: '$storage = "st03$suffix"

        $createdStorage = az storage account create --name $storage --resource-group $ResourceGroupName --location $Location
        --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false --tags
        purpose=az104-lab labId=03 runId=$RunId --output json | ConvertFrom-Json

        $storageId = [string]$createdStorage.id

        Add-ManagedObject -CheckpointId ''LAB03-CP03'' -Kind ''azure-resource'' -Id $storageId -Name $storage -Type ''Microsoft.Storage/storageAccounts''
        -Scope $scope -OwnershipMethod ''manifest-id-and-tags''

        $dataAssignment = az role assignment create --assignee-object-id $principalObjectId --role ''Storage Blob Data Reader''
        --scope $storageId --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB03-CP03'' -Kind ''azure-resource'' -Id ([string]$dataAssignment.id) -Name ''Storage
        Blob Data Reader'' -Type ''Microsoft.Authorization/roleAssignments'' -Scope $storageId -OwnershipMethod ''manifest-id''

        '
      expectedState: The storage account inherits Reader and has one direct Storage Blob Data Reader assignment for the principal.
      representativeOutput: effectiveRoles=Reader(inherited),Storage Blob Data Reader(direct); dataActions=blob/read
      positiveCommand: '$storageId = az storage account show --name $storage --resource-group $ResourceGroupName --query id
        --output tsv

        $effective = @(az role assignment list --assignee-object-id $principalObjectId --scope $storageId --include-inherited
        --output json | ConvertFrom-Json)

        foreach ($role in @(''Reader'',''Storage Blob Data Reader'')) { if ($role -notin $effective.roleDefinitionName) {
        throw "Missing effective role: $role" } }

        $effective | Select-Object roleDefinitionName,scope

        '
      positiveExpected: Reader is inherited from the resource group and Storage Blob Data Reader is direct at the storage
        account.
      negativeCommand: '$dataRole = @(az role definition list --name ''Storage Blob Data Reader'' --output json | ConvertFrom-Json)

        if (@($dataRole[0].permissions.dataActions).Count -eq 0) { throw ''Blob data role contains no dataActions.'' }

        if (''Microsoft.Storage/storageAccounts/listKeys/action'' -in $dataRole[0].permissions.actions) { throw ''Data reader
        unexpectedly permits key listing.'' }

        $dataRole[0].permissions

        '
      negativeExpected: The data role has blob read dataActions but cannot list storage keys.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Role propagation is delayed or the operator confuses Reader with a storage data-plane role.
      safeRetry: Requery exact assignment IDs and allow propagation; do not add broader roles to bypass delay.
      cleanupDependency: Remove the resource-scoped assignment before or with the storage account and resource group.
    - id: LAB03-CP04
      title: Inject, detect, and remove an over-privileged assignment
      purpose: Create a temporary Contributor assignment, persist it before inspection, detect it by exact scope, and delete
        it by exact ID.
      operationalRelevance: Least-privilege reviews must identify effective excess access and produce an auditable rollback
        target.
      objectiveIds:
      - IG-ACCESS-01
      command: '$risky = az role assignment create --assignee-object-id $principalObjectId --role Contributor --scope $scope
        --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB03-CP04'' -Kind ''azure-resource'' -Id ([string]$risky.id) -Name ''temporary-Contributor''
        -Type ''Microsoft.Authorization/roleAssignments'' -Scope $scope -OwnershipMethod ''manifest-id''

        $detected = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope --output json | ConvertFrom-Json
        | Where-Object id -eq $risky.id)

        if ($detected.Count -ne 1) { throw ''The injected Contributor assignment was not detected.'' }

        az role assignment delete --ids $risky.id

        $record = @($state.managedObjects | Where-Object id -eq $risky.id)[0]

        $record.lifecycleStatus = ''deleted''

        Save-RunState

        '
      expectedState: The Contributor fault is observed once, removed by assignment ID, and retained only as deleted lifecycle
        evidence.
      representativeOutput: injected=Contributor; detected=1; remediated=True; lifecycleStatus=deleted
      positiveCommand: '$remaining = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope --output
        json | ConvertFrom-Json | Where-Object roleDefinitionName -eq ''Reader'')

        if ($remaining.Count -ne 1) { throw ''Least-privilege Reader assignment was damaged during remediation.'' }

        $remaining

        '
      positiveExpected: The intended Reader assignment remains after remediation.
      negativeCommand: '$excess = @(az role assignment list --assignee-object-id $principalObjectId --scope $scope --output
        json | ConvertFrom-Json | Where-Object roleDefinitionName -eq ''Contributor'')

        if ($excess.Count -ne 0) { throw ''Contributor remains after break/fix remediation.'' }

        ''Contributor assignments at exact scope: 0''

        '
      negativeExpected: No direct Contributor assignment remains at resource-group scope.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The assignment already exists, propagation delays detection, or a broad delete selector would remove
        Reader too.
      safeRetry: Query by exact assignment ID; if it exists, delete only that ID and preserve its manifest lifecycle record.
      cleanupDependency: A surviving injected assignment is cleaned by exact ID before the intended assignments or resource
        group.
    - id: LAB03-CP05
      title: Build the final direct-versus-inherited access matrix
      purpose: Correlate role definitions, assignment scopes, inheritance, principal ID, and rollback IDs into one least-privilege
        record.
      operationalRelevance: Effective access is the union of assignments, while the rollback unit is each individual assignment
        ID.
      objectiveIds:
      - IG-ACCESS-01
      - IG-ACCESS-02
      - IG-ACCESS-03
      command: '$storageId = az storage account show --name $storage --resource-group $ResourceGroupName --query id --output
        tsv

        $matrix = @(az role assignment list --assignee-object-id $principalObjectId --scope $storageId --include-inherited
        --output json | ConvertFrom-Json)

        $matrix | Select-Object roleDefinitionName,scope,@{n=''inherited'';e={$_.scope -ne $storageId}}

        '
      expectedState: The final matrix shows only Reader inherited from the resource group and Storage Blob Data Reader direct
        at storage.
      representativeOutput: Reader | rg scope | inherited=True; Storage Blob Data Reader | storage scope | inherited=False
      positiveCommand: '$storageId = az storage account show --name $storage --resource-group $ResourceGroupName --query id
        --output tsv

        $matrix = @(az role assignment list --assignee-object-id $principalObjectId --scope $storageId --include-inherited
        --output json | ConvertFrom-Json)

        if (@($matrix | Where-Object roleDefinitionName -in @(''Reader'',''Storage Blob Data Reader'')).Count -ne 2) { throw
        ''Final role matrix is incomplete.'' }

        $matrix

        '
      positiveExpected: Both intended effective roles are present at their designed scopes.
      negativeCommand: '$all = @(az role assignment list --assignee-object-id $principalObjectId --all --output json | ConvertFrom-Json)

        $labExcess = @($all | Where-Object { $_.scope -like "$scope*" -and $_.roleDefinitionName -in @(''Owner'',''Contributor'',''User
        Access Administrator'') })

        if ($labExcess.Count -gt 0) { throw ''Elevated access remains inside the lab boundary.'' }

        ''Elevated lab-scope assignments: 0''

        '
      negativeExpected: No elevated role remains at or below the lab resource-group scope.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Queries omit --include-inherited or use a broader subscription scope that obscures the workload boundary.
      safeRetry: Repeat the inventory at the storage resource ID and compare each assignment scope literally.
      cleanupDependency: Delete assignments by manifest ID, then the resource group; residual checks query the principal again
        at the former scope.
    breakFix:
      injection: Add Contributor at resource-group scope to the same principal.
      symptom: The effective matrix shows broad write actions in addition to the intended read roles.
      diagnosis: Filter the principal's assignments by exact scope and inspect Contributor actions instead of relying on a
        display name.
      repair: Delete only the injected assignment ID, then prove Reader and the storage data role remain.
    challenge: Produce a least-privilege recommendation for an operator who may read all resources but restart only one VM.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Assign Azure roles using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-cli
    - title: Azure built-in roles reference
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
    - title: List Azure role assignments using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-list-cli
    - title: Check access for an Azure resource
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/check-access
  04-resource-hierarchy-tags-locks:
    role: A governance administrator organizing disposable workloads.
    outcome: Build a tagged workload hierarchy, prove tag non-inheritance, enforce a deletion lock, and optionally exercise
      a tenant-authorized management group.
    primer: Management groups and subscriptions establish hierarchy; resource groups establish lifecycle scope. Tags describe
      resources but do not automatically inherit, and locks protect against control-plane mutation rather than data-plane
      deletion.
    designDecisions:
    - Use merge semantics when updating tags.
    - Test CanNotDelete at the smallest scope.
    - Keep management-group work behind an explicit tenant-change gate.
    architectureWalkthrough: The subscription contains an optional lab management group and a required tagged resource group.
      A child virtual network demonstrates that tags do not inherit automatically. A CanNotDelete lock protects the resource-group
      control plane until dependency-aware cleanup removes the exact lock.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$managementGroupAuthorization = [Environment]::GetEnvironmentVariable(''AZ104_ALLOW_MANAGEMENT_GROUP_CHANGE'')

      '
    preflightChecks:
    - id: preflight.authored.lab04.hierarchy-read
      type: permission
      required: true
      description: Read the subscription and tenant hierarchy without moving a subscription or creating a management group.
      command: '$subscription = az account show --query ''{id:id,tenantId:tenantId}'' --output json | ConvertFrom-Json

        if (-not $subscription.id -or -not $subscription.tenantId) { throw ''Subscription hierarchy context is incomplete.''
        }

        '
      expected: The active subscription and tenant IDs are readable.
    - id: preflight.authored.lab04.management-group-gate
      type: permission
      required: false
      description: When exact tenant authorization is supplied, prove management-group inventory is readable before mutation.
      command: "if ($managementGroupAuthorization -eq 'YES') {\n    $groups = az account management-group list --output json\
        \ | ConvertFrom-Json\n    if ($null -eq $groups) { throw 'Management-group inventory is unavailable.' }\n}\n"
      expected: The optional gate is absent, or management-group inventory is readable under exact YES authorization.
    validationContext: '$rgId = az group show --name $ResourceGroupName --query id --output tsv

      $vnet = "vnet04-$suffix"

      $lockName = "lock-$RunId"

      '
    cleanupContext: '$lockName = "lock-$RunId"

      '
    preCleanupCommand: "$lockRecord = @($state.managedObjects | Where-Object { $_.type -eq 'Microsoft.Authorization/locks'\
      \ -and $_.name -eq $lockName -and $_.lifecycleStatus -eq 'active' })\nif ($lockRecord.Count -eq 1) {\n    $liveLockId\
      \ = az lock show --ids $lockRecord[0].id --query id --output tsv 2>$null\n    if ($LASTEXITCODE -eq 0 -and $liveLockId\
      \ -eq $lockRecord[0].id) {\n        az lock delete --ids $lockRecord[0].id\n    }\n}\n"
    tasks:
    - id: LAB04-CP01
      title: Map management-group, subscription, and resource-group ancestry
      purpose: Read the hierarchy and establish the exact resource-group ID before applying governance controls.
      operationalRelevance: Governance scope mistakes happen when operators reason from names instead of full ARM scope IDs.
      objectiveIds:
      - IG-GOVERN-02
      command: '$rgId = az group show --name $ResourceGroupName --query id --output tsv

        az account management-group list --query ''[].{name:name,displayName:displayName}'' --output table

        az group show --name $ResourceGroupName --query ''{id:id,location:location,tags:tags}'' --output json

        '
      expectedState: The resource group has the expected subscription-qualified ID and initial run-ownership tags.
      representativeOutput: scope=/subscriptions/<redacted>/resourceGroups/<redacted>; purpose=az104-lab; runId=<redacted>
      positiveCommand: '$group = az group show --name $ResourceGroupName --output json | ConvertFrom-Json

        if ($group.id -ne $rgId -or $group.tags.runId -ne $RunId) { throw ''Resource-group ID or run ownership tag mismatch.''
        }

        $group | Select-Object id,location,tags

        '
      positiveExpected: The exact resource-group ID and runId tag match the manifest boundary.
      negativeCommand: '$foreign = @(az group list --tag "runId=$RunId" --output json | ConvertFrom-Json | Where-Object id
        -ne $rgId)

        if ($foreign.Count -gt 0) { throw ''The run ID is already attached to another resource group.'' }

        ''Conflicting resource groups: 0''

        '
      negativeExpected: No second resource group claims the run ID.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The active subscription differs from the manifest or an earlier run reused the same ownership tag.
      safeRetry: Correct context outside the lab or choose a new run ID; never retag an unrelated group as a shortcut.
      cleanupDependency: The resource group is the final Azure deletion boundary after locks and optional hierarchy objects
        are removed.
    - id: LAB04-CP02
      title: Merge governance tags without replacing ownership tags
      purpose: Add environment, cost center, and owner metadata through tag merge semantics.
      operationalRelevance: Replacing the entire tag set can erase cleanup ownership and chargeback metadata.
      objectiveIds:
      - IG-GOVERN-03
      command: 'az tag update --resource-id $rgId --operation Merge --tags environment=training costCenter=az104 owner=learner
        --output none

        '
      expectedState: The three governance tags and the original purpose, labId, runId, and expiresOn ownership tags coexist.
      representativeOutput: environment=training; costCenter=az104; purpose=az104-lab; runId=<redacted>
      positiveCommand: '$tags = az group show --name $ResourceGroupName --query tags --output json | ConvertFrom-Json -AsHashtable

        foreach ($key in @(''environment'',''costCenter'',''owner'',''purpose'',''labId'',''runId'',''expiresOn'')) { if (-not
        $tags.ContainsKey($key)) { throw "Missing tag: $key" } }

        $tags

        '
      positiveExpected: All governance and ownership keys are present after the merge.
      negativeCommand: '$tags = az group show --name $ResourceGroupName --query tags --output json | ConvertFrom-Json -AsHashtable

        if ($tags[''purpose''] -ne ''az104-lab'' -or $tags[''runId''] -ne $RunId) { throw ''Tag update replaced the cleanup
        ownership boundary.'' }

        ''Ownership tags preserved.''

        '
      negativeExpected: The merge did not replace purpose or runId.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: An operator uses az tag create, which replaces rather than merges the existing tag set.
      safeRetry: Read current tags, restore manifest ownership values, then repeat az tag update with Merge.
      cleanupDependency: Tags disappear with the resource group; ownership values must remain until cleanup verifies them.
    - id: LAB04-CP03
      title: Prove that resource-group tags do not inherit automatically
      purpose: Create an untagged child virtual network, observe the empty tag set, then apply only the intended child tags.
      operationalRelevance: Cost and ownership reporting is incomplete unless inheritance is implemented through deployment
        or Policy.
      objectiveIds:
      - IG-GOVERN-04
      command: '$vnet = "vnet04-$suffix"

        $createdVnet = az network vnet create --resource-group $ResourceGroupName --name $vnet --location $Location --address-prefixes
        10.4.0.0/16 --subnet-name workload --subnet-prefixes 10.4.1.0/24 --output json | ConvertFrom-Json

        $createdVnetId = [string]$createdVnet.newVNet.id

        if (-not $createdVnetId) { $createdVnetId = az network vnet show --resource-group $ResourceGroupName --name $vnet
        --query id --output tsv }

        Add-ManagedObject -CheckpointId ''LAB04-CP03'' -Kind ''azure-resource'' -Id $createdVnetId -Name $vnet -Type ''Microsoft.Network/virtualNetworks''
        -Scope $rgId -OwnershipMethod ''manifest-id''

        $before = az network vnet show --resource-group $ResourceGroupName --name $vnet --query tags --output json

        if ($before -notin @(''{}'',''null'')) { throw ''New child unexpectedly inherited tags; investigate policy before
        continuing.'' }

        $vnetId = az network vnet show --resource-group $ResourceGroupName --name $vnet --query id --output tsv

        az tag update --resource-id $vnetId --operation Merge --tags purpose=az104-lab labId=04 runId=$RunId environment=training
        --output none

        '
      expectedState: The before query proves no automatic inheritance; the final virtual network has explicit ownership and
        environment tags.
      representativeOutput: beforeTags={}; afterTags={purpose:az104-lab,labId:04,runId:<redacted>,environment:training}
      positiveCommand: '$child = az network vnet show --resource-group $ResourceGroupName --name $vnet --output json | ConvertFrom-Json

        if ($child.tags.runId -ne $RunId -or $child.tags.environment -ne ''training'') { throw ''Explicit child tags are incomplete.''
        }

        $child | Select-Object id,tags

        '
      positiveExpected: The virtual network contains the explicit run ownership and environment tags.
      negativeCommand: '$rgTags = az group show --name $ResourceGroupName --query tags --output json | ConvertFrom-Json -AsHashtable

        $childTags = az network vnet show --resource-group $ResourceGroupName --name $vnet --query tags --output json | ConvertFrom-Json
        -AsHashtable

        if ($childTags.ContainsKey(''costCenter'')) { throw ''The exercise requires costCenter to remain absent from the child
        to prove non-inheritance.'' }

        [pscustomobject]@{ resourceGroupCostCenter = $rgTags[''costCenter'']; childCostCenter = $null }

        '
      negativeExpected: The child still lacks costCenter, demonstrating that resource-group tags did not propagate automatically.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A tenant Policy modifies tags, or the operator assumes resource-group metadata is inherited by children.
      safeRetry: Record any Policy effect, then use explicit tags that preserve the run boundary; never remove organization
        Policy.
      cleanupDependency: The virtual network is deleted with the unlocked resource group.
    - id: LAB04-CP04
      title: Apply and interpret a CanNotDelete lock
      purpose: Protect the workload lifecycle boundary and inspect the effective lock by its exact ARM ID.
      operationalRelevance: Locks protect control-plane mutations and can block cleanup even when RBAC permits deletion.
      objectiveIds:
      - IG-GOVERN-05
      command: "$lock = az lock create --name $lockName --lock-type CanNotDelete --resource-group $ResourceGroupName --notes\
        \ \"AZ-104 Lab 04 run $RunId\" --output json | ConvertFrom-Json\nAdd-ManagedObject -CheckpointId 'LAB04-CP04' -Kind\
        \ 'azure-resource' -Id ([string]$lock.id) -Name $lockName -Type 'Microsoft.Authorization/locks' -Scope $rgId -OwnershipMethod\
        \ 'manifest-id'\n$PSNativeCommandUseErrorActionPreference = $false\n$denied = az network vnet delete --resource-group\
        \ $ResourceGroupName --name $vnet 2>&1\n$deniedExit = $LASTEXITCODE\n$PSNativeCommandUseErrorActionPreference = $true\n\
        if ($deniedExit -eq 0) {\n    $recreated = az network vnet create --resource-group $ResourceGroupName --name $vnet\
        \ --location $Location --address-prefixes 10.4.0.0/16 --subnet-name workload --subnet-prefixes 10.4.1.0/24 --tags\
        \ purpose=az104-lab labId=04 runId=$RunId environment=training --output json | ConvertFrom-Json\n    throw 'The child\
        \ delete unexpectedly bypassed the resource-group lock; the virtual network was recreated for cleanup.'\n}\n$state.inputs['lock-denial-observed']\
        \ = $true\nSave-RunState\n"
      expectedState: Exactly one CanNotDelete lock exists, its ID is recorded, and a safe child virtual-network delete is
        rejected.
      representativeOutput: lockLevel=CanNotDelete; scope=<resource-group>; childDeleteDenied=True; lockId=<redacted>
      positiveCommand: '$locks = @(az lock list --resource-group $ResourceGroupName --output json | ConvertFrom-Json | Where-Object
        name -eq $lockName)

        if ($locks.Count -ne 1 -or $locks[0].level -ne ''CanNotDelete'') { throw ''Expected one CanNotDelete lab lock.'' }

        $locks[0] | Select-Object id,name,level,notes

        '
      positiveExpected: The exact run lock is present with level CanNotDelete.
      negativeCommand: '$foreignLocks = @(az lock list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object name -ne $lockName)

        if ($foreignLocks.Count -gt 0) { throw ''An unowned lock exists; cleanup must refuse to remove it.'' }

        if (-not $state.inputs[''lock-denial-observed'']) { throw ''The safe child-delete denial was not recorded.'' }

        ''Unowned locks at scope=0; child delete denied=True''

        '
      negativeExpected: No foreign lock exists and the controlled child deletion was denied by the run-owned lock.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Lock write permission is missing or an organization-owned inherited lock already governs the scope.
      safeRetry: List locks first and create only the deterministic lab lock when no name collision exists.
      cleanupDependency: Cleanup removes this exact lock ID before attempting resource-group deletion and refuses foreign
        locks.
    - id: LAB04-CP05
      title: Exercise an optional tenant-authorized management-group node
      purpose: Create one empty child management group only when the explicit tenant-change gate is present, then record its
        ARM ID.
      operationalRelevance: Management groups are tenant-scoped governance boundaries and must not be created as an implicit
        lab side effect.
      required: false
      gateEnvironmentValues:
        AZ104_ALLOW_MANAGEMENT_GROUP_CHANGE: 'YES'
      objectiveIds:
      - IG-GOVERN-02
      - IG-GOVERN-03
      - IG-GOVERN-04
      - IG-GOVERN-05
      - IG-GOVERN-07
      command: 'if ($env:AZ104_ALLOW_MANAGEMENT_GROUP_CHANGE -ne ''YES'') { throw ''Set the management-group gate to the exact
        value YES.'' }

        $managementGroup = "mg-az104-$suffix"

        $mg = az account management-group create --name $managementGroup --display-name "AZ104 $RunId" --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB04-CP05'' -Kind ''azure-resource'' -Id ([string]$mg.id) -Name $managementGroup
        -Type ''Microsoft.Management/managementGroups'' -Scope ''/providers/Microsoft.Management/managementGroups'' -OwnershipMethod
        ''manifest-id''

        '
      expectedState: One empty run-specific management group exists only when tenant change is acknowledged and its ID is
        manifest-recorded.
      representativeOutput: managementGroup=mg-az104-<redacted>; children=0; manifestRecorded=True
      positiveCommand: '$managementGroup = "mg-az104-$suffix"

        $mg = az account management-group show --name $managementGroup --expand --recurse --output json | ConvertFrom-Json

        if ($mg.name -ne $managementGroup) { throw ''Run-specific management group was not found.'' }

        $mg | Select-Object id,name,displayName

        '
      positiveExpected: The exact management group exists and matches the deterministic name.
      negativeCommand: '$managementGroup = "mg-az104-$suffix"

        $children = @(az account management-group show --name $managementGroup --expand --recurse --query children --output
        json | ConvertFrom-Json)

        if ($children.Count -gt 0) { throw ''The lab management group must remain empty for deterministic cleanup.'' }

        ''Management-group children: 0''

        '
      negativeExpected: The lab does not move a subscription or attach child management groups.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The tenant does not permit management-group creation or the deterministic name exists from a prior run.
      safeRetry: Query the exact name and reconcile ownership; never adopt or delete an organization-owned management group.
      cleanupDependency: Delete the empty manifest-recorded management group by name before final residual validation.
    breakFix:
      injection: Try to delete the run-owned child virtual network while the resource-group lock exists.
      symptom: Azure rejects the safe child deletion with a scope-lock error.
      diagnosis: List inherited and direct locks at the target scope.
      repair: Preserve the protected child, then remove only the recorded lab lock during dependency-aware cleanup.
    challenge: Define an ownership and expiry tagging standard and explain which tags need Policy-based inheritance.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Manage Azure resource groups using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-cli
    - title: Manage Azure resource tags using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources-cli
    - title: Lock Azure resources to protect infrastructure
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
    - title: Manage Azure management groups using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage
  05-policy-costs-advisor:
    role: A cloud governance analyst enforcing standards and controlling spend.
    outcome: Enforce a real deny Policy, prove compliant and denied requests, create a resource-group budget wired to an action
      group, and review Advisor cost recommendations.
    primer: Azure Policy evaluates resource compliance; it does not replace RBAC. Budgets signal spend thresholds but do not
      stop resources, and Advisor recommendations are contextual guidance that administrators must review.
    designDecisions:
    - Assign built-in Policy at lab scope.
    - Treat compliance convergence as asynchronous.
    - Always wire the budget to a manifest-owned action group; add email only when an approved address is supplied.
    architectureWalkthrough: A built-in Policy assignment evaluates child resources at resource-group scope. A compliant storage
      account passes and an untagged request is denied. Cost Management evaluates the same resource-group scope and routes
      the 80-percent threshold to an action group, while Advisor supplies independent recommendations.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$storage = "st05$suffix"

      '
    preflightChecks:
    - id: preflight.authored.lab05.policy-and-governance
      type: permission
      required: true
      description: Resolve the built-in deny Policy and verify every governance provider is already registered.
      command: "$definitionGuid = '1e30110a-5ceb-460c-a204-c1c3969c6d62'\n$definition = az policy definition show --name $definitionGuid\
        \ --output json | ConvertFrom-Json\nif ($definition.name -ne $definitionGuid -or $definition.policyRule.then.effect\
        \ -ne 'deny') { throw 'The immutable built-in deny Policy was not resolved.' }\nforeach ($provider in @('Microsoft.PolicyInsights','Microsoft.Consumption','Microsoft.Insights','Microsoft.Advisor'))\
        \ {\n    if ((az provider show --namespace $provider --query registrationState --output tsv) -ne 'Registered') { throw\
        \ \"Provider is not registered: $provider\" }\n}\n"
      expected: One built-in deny definition and four Registered governance providers are observed.
    - id: preflight.authored.lab05.storage-name
      type: service
      required: true
      description: Confirm the compliant storage-account name is globally available before Policy evaluation.
      command: '$availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        '
      expected: The deterministic compliant account name is available.
    validationContext: '$scope = "/subscriptions/$($state.context.subscriptionId)/resourceGroups/$ResourceGroupName"

      $policyName = "require-purpose-$suffix"

      $actionGroupName = "ag05-$suffix"

      $budgetName = "budget05-$suffix"

      $storage = "st05$suffix"

      '
    tasks:
    - id: LAB05-CP01
      title: Resolve the built-in Policy and governance service prerequisites
      purpose: Identify the immutable built-in definition ID and confirm Policy, Cost Management, Monitor, and Advisor providers
        before mutation.
      operationalRelevance: Friendly Policy names can be localized or duplicated; assignments should bind to the exact definition
        ID.
      objectiveIds:
      - IG-GOVERN-01
      command: "$definitionGuid = '1e30110a-5ceb-460c-a204-c1c3969c6d62'\n$definitionId = \"/providers/Microsoft.Authorization/policyDefinitions/$definitionGuid\"\
        \n$definition = az policy definition show --name $definitionGuid --output json | ConvertFrom-Json\nif ($definition.id\
        \ -ne $definitionId -or $definition.policyRule.then.effect -ne 'deny') { throw 'Required immutable built-in tag Policy\
        \ definition was not found.' }\nforeach ($provider in @('Microsoft.PolicyInsights','Microsoft.Consumption','Microsoft.Insights','Microsoft.Advisor'))\
        \ {\n    $stateValue = az provider show --namespace $provider --query registrationState --output tsv\n    if ($stateValue\
        \ -ne 'Registered') { throw \"Provider is not registered: $provider\" }\n}\n"
      expectedState: One built-in definition ID is resolved and every governance provider is already Registered without preflight
        mutation.
      representativeOutput: definitionId=/providers/Microsoft.Authorization/policyDefinitions/<redacted>; providers=4 Registered
      positiveCommand: '$definitionGuid = ''1e30110a-5ceb-460c-a204-c1c3969c6d62''

        $definition = az policy definition show --name $definitionGuid --output json | ConvertFrom-Json

        if ($definition.name -ne $definitionGuid -or $definition.policyRule.then.effect -ne ''deny'') { throw ''Expected the
        immutable built-in deny definition.'' }

        $definition | Select-Object id,displayName,policyType

        '
      positiveExpected: Exactly one built-in definition resolves and its effect is deny.
      negativeCommand: '$existing = @(az policy assignment list --scope $scope --output json | ConvertFrom-Json | Where-Object
        name -eq $policyName)

        if ($existing.Count -ne 1 -or $existing[0].scope -ne $scope) { throw ''Expected exactly one run-specific assignment
        at the exact lab scope.'' }

        ''Run-specific policy assignments at exact scope: 1''

        '
      negativeExpected: Exactly one manifest-recorded assignment uses the run-specific name and exact scope after deployment.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A provider is unregistered or the operator lacks Policy or Cost Management read permission.
      safeRetry: Register providers only through an approved platform process, then rerun this read-only check.
      cleanupDependency: This checkpoint is read-only.
    - id: LAB05-CP02
      title: Assign the built-in tag Policy at resource-group scope
      purpose: Create a manifest-recorded deny assignment requiring purpose=az104-lab on child resources.
      operationalRelevance: Policy assignment scope and parameters determine enforcement; the definition alone changes nothing.
      objectiveIds:
      - IG-GOVERN-06
      command: '$definitionId = ''/providers/Microsoft.Authorization/policyDefinitions/1e30110a-5ceb-460c-a204-c1c3969c6d62''

        $parameters = ''{"tagName":{"value":"purpose"},"tagValue":{"value":"az104-lab"}}''


        $assignment = az policy assignment create --name $policyName --display-name "AZ104 require purpose $RunId" --scope
        $scope --policy $definitionId --params $parameters --enforcement-mode Default --output json | ConvertFrom-Json


        Add-ManagedObject -CheckpointId ''LAB05-CP02'' -Kind ''azure-resource'' -Id ([string]$assignment.id) -Name $policyName
        -Type ''Microsoft.Authorization/policyAssignments'' -Scope $scope -OwnershipMethod ''manifest-id''

        '
      expectedState: One Default-enforcement assignment targets the exact resource group with tagName purpose and tagValue
        az104-lab.
      representativeOutput: assignment=require-purpose-<redacted>; enforcementMode=Default; parameters=purpose:az104-lab
      positiveCommand: '$assignment = az policy assignment show --name $policyName --scope $scope --output json | ConvertFrom-Json

        if ($assignment.enforcementMode -ne ''Default'' -or $assignment.parameters.tagValue.value -ne ''az104-lab'') { throw
        ''Policy enforcement or parameter mismatch.'' }

        $assignment | Select-Object id,name,enforcementMode,parameters

        '
      positiveExpected: The assignment uses Default enforcement and the expected tag parameters.
      negativeCommand: '$duplicates = @(az policy assignment list --scope $scope --output json | ConvertFrom-Json | Where-Object
        { $_.displayName -like "AZ104 require purpose $RunId*" })

        if ($duplicates.Count -ne 1) { throw ''Expected exactly one run-specific Policy assignment.'' }

        ''Run-specific assignments: 1''

        '
      negativeExpected: No duplicate assignment exists for the run.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Policy write permission is missing, the definition lookup is localized, or a prior assignment owns the
        deterministic name.
      safeRetry: Query the assignment by exact scope and name; record a matching result instead of creating a duplicate.
      cleanupDependency: Remove the exact Policy assignment before final resource-group deletion.
    - id: LAB05-CP03
      title: Prove compliant creation and an intentionally denied request
      purpose: Create one correctly tagged storage account and attempt a second untagged account under the deny assignment.
      operationalRelevance: Compliance evidence needs both an allowed state and a controlled failure that exposes the Policy
        effect.
      objectiveIds:
      - IG-GOVERN-07
      command: "$compliant = az storage account create --name $storage --resource-group $ResourceGroupName --location $Location\
        \ --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false\
        \ --tags purpose=az104-lab labId=05 runId=$RunId --output json | ConvertFrom-Json\nAdd-ManagedObject -CheckpointId\
        \ 'LAB05-CP03' -Kind 'azure-resource' -Id ([string]$compliant.id) -Name $storage -Type 'Microsoft.Storage/storageAccounts'\
        \ -Scope $scope -OwnershipMethod 'manifest-id-and-tags'\n$deniedName = \"st05bad$suffix\"\n$PSNativeCommandUseErrorActionPreference\
        \ = $false\n$deniedOutput = az storage account create --name $deniedName --resource-group $ResourceGroupName --location\
        \ $Location --sku Standard_LRS --kind StorageV2 --output json 2>&1\n$deniedExit = $LASTEXITCODE\n$PSNativeCommandUseErrorActionPreference\
        \ = $true\nif ($deniedExit -eq 0) {\n    $unexpected = az storage account show --name $deniedName --resource-group\
        \ $ResourceGroupName --output json | ConvertFrom-Json\n    Add-ManagedObject -CheckpointId 'LAB05-CP03' -Kind 'azure-resource'\
        \ -Id ([string]$unexpected.id) -Name $deniedName -Type 'Microsoft.Storage/storageAccounts' -Scope $scope -OwnershipMethod\
        \ 'manifest-id'\n    throw 'The untagged request was not denied; keep the unexpected resource recorded and wait for\
        \ Policy propagation before repair.'\n}\n$state.inputs['denied-request-observed'] = $true\nSave-RunState\n"
      expectedState: The tagged account exists and the untagged account request returns a Policy denial without creating a
        resource.
      representativeOutput: compliantStorage=created; untaggedRequest=denied; policyAssignment=require-purpose-<redacted>
      positiveCommand: '$account = az storage account show --name $storage --resource-group $ResourceGroupName --output json
        | ConvertFrom-Json

        if ($account.tags.purpose -ne ''az104-lab'' -or $account.tags.runId -ne $RunId) { throw ''Compliant storage tags do
        not match the Policy and run boundary.'' }

        $account | Select-Object id,tags

        '
      positiveExpected: The compliant storage account exists with the exact required value and ownership tags.
      negativeCommand: '$deniedName = "st05bad$suffix"

        $unexpectedId = az storage account show --name $deniedName --resource-group $ResourceGroupName --query id --output
        tsv 2>$null

        if ($LASTEXITCODE -eq 0 -and $unexpectedId) { throw ''The intentionally untagged storage account exists.'' }

        ''Untagged storage resources: 0''

        '
      negativeExpected: The denied account name does not resolve to an active storage resource.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Policy assignment propagation is incomplete, or the request includes inherited/automatic tags from organization
        Policy.
      safeRetry: Query assignment enforcement and Policy events; delete only a manifest-recorded unexpected resource, then
        repeat after convergence.
      cleanupDependency: Delete any recorded unexpected resource and the compliant account before the resource group.
    - id: LAB05-CP04
      title: Create an action group and resource-group budget notification
      purpose: Wire an 80-percent monthly cost threshold to a manifest-owned action group, adding email only through the approved
        input gate.
      operationalRelevance: Budgets notify; they do not stop resources. A receiver path must be tested and cleaned independently.
      objectiveIds:
      - IG-GOVERN-01
      command: "if ($env:AZ104_BUDGET_EMAIL) {\n    $actionGroup = az monitor action-group create --name $actionGroupName\
        \ --resource-group $ResourceGroupName --short-name az104cost --tags purpose=az104-lab labId=05 runId=$RunId --action\
        \ email ApprovedBudgetEmail $env:AZ104_BUDGET_EMAIL usecommonalertschema --output json | ConvertFrom-Json\n} else\
        \ {\n    $actionGroup = az monitor action-group create --name $actionGroupName --resource-group $ResourceGroupName\
        \ --short-name az104cost --tags purpose=az104-lab labId=05 runId=$RunId --output json | ConvertFrom-Json\n}\nAdd-ManagedObject\
        \ -CheckpointId 'LAB05-CP04' -Kind 'azure-resource' -Id ([string]$actionGroup.id) -Name $actionGroupName -Type 'Microsoft.Insights/actionGroups'\
        \ -Scope $scope -OwnershipMethod 'manifest-id-and-tags'\n$startDate = (Get-Date -Day 1 -Hour 0 -Minute 0 -Second 0).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')\n\
        $endDate = (Get-Date -Day 1 -Hour 0 -Minute 0 -Second 0).AddYears(1).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')\n\
        $contacts = if ($env:AZ104_BUDGET_EMAIL) { @($env:AZ104_BUDGET_EMAIL) } else { @() }\n$budgetBody = @{ properties\
        \ = @{ category = 'Cost'; amount = 25; timeGrain = 'Monthly'; timePeriod = @{ startDate = $startDate; endDate = $endDate\
        \ }; notifications = @{ Actual_GreaterThanOrEqualTo_80_Percent = @{ enabled = $true; operator = 'GreaterThanOrEqualTo';\
        \ threshold = 80; thresholdType = 'Actual'; contactEmails = $contacts; contactGroups = @($actionGroup.id); contactRoles\
        \ = @() } } } } | ConvertTo-Json -Depth 12 -Compress\n$budgetUrl = \"https://management.azure.com$scope/providers/Microsoft.Consumption/budgets/$budgetName?api-version=2023-05-01\"\
        \n$budget = az rest --method put --url $budgetUrl --body $budgetBody --output json | ConvertFrom-Json\nAdd-ManagedObject\
        \ -CheckpointId 'LAB05-CP04' -Kind 'azure-resource' -Id ([string]$budget.id) -Name $budgetName -Type 'Microsoft.Consumption/budgets'\
        \ -Scope $scope -OwnershipMethod 'manifest-id'\n"
      expectedState: The monthly 25-unit budget has an enabled actual-cost threshold at 80 percent and references the exact
        action-group ID.
      representativeOutput: amount=25; timeGrain=Monthly; threshold=80; contactGroups=[<redacted action-group ID>]
      positiveCommand: '$budgetUrl = "https://management.azure.com$scope/providers/Microsoft.Consumption/budgets/$budgetName?api-version=2023-05-01"

        $budget = az rest --method get --url $budgetUrl --output json | ConvertFrom-Json

        $notice = $budget.properties.notifications.Actual_GreaterThanOrEqualTo_80_Percent

        if ($budget.properties.amount -ne 25 -or $notice.threshold -ne 80 -or $notice.contactGroups.Count -ne 1) { throw ''Budget
        notification configuration mismatch.'' }

        $budget.properties | Select-Object amount,timeGrain,notifications

        '
      positiveExpected: Budget amount, time grain, threshold, and action-group target match the design.
      negativeCommand: '$groups = @(az monitor action-group list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object name -eq $actionGroupName)

        if ($groups.Count -ne 1) { throw ''Expected exactly one run action group.'' }

        if (-not $env:AZ104_BUDGET_EMAIL -and @($groups[0].emailReceivers).Count -gt 0) { throw ''An email receiver exists
        without the approved input gate.'' }

        $groups[0] | Select-Object id,name,emailReceivers

        '
      negativeExpected: There is one action group and no email receiver unless the approved address input was supplied.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Cost Management permission is unavailable, budget dates are not month-aligned, or the receiver address
        is unapproved.
      safeRetry: GET the exact budget and action group first; update only the mismatched property and preserve the returned
        eTag when required.
      cleanupDependency: Delete the budget before the action group, then verify neither exact ID resolves.
    - id: LAB05-CP05
      title: Correlate Policy compliance, budget state, and Advisor recommendations
      purpose: Trigger a Policy scan, read current compliance and budget configuration, and inventory Advisor cost recommendations
        without auto-applying them.
      operationalRelevance: Policy, budgets, and Advisor answer different governance questions and converge on different schedules.
      objectiveIds:
      - IG-GOVERN-01
      - IG-GOVERN-06
      - IG-GOVERN-07
      command: 'az policy state trigger-scan --resource-group $ResourceGroupName --no-wait

        az policy state list --resource-group $ResourceGroupName --filter "PolicyAssignmentName eq ''$policyName''" --all
        --output table

        az advisor recommendation list --category Cost --query ''[].{impact:impact,resource:resourceMetadata.resourceId,problem:shortDescription.problem}''
        --output table

        '
      expectedState: Governance evidence distinguishes current compliant/non-compliant Policy state, configured budget notification,
        and zero or more contextual Advisor recommendations.
      representativeOutput: policyAssignment=present; deniedResource=absent; budget=active; AdvisorCostRecommendations=<0..n>
      positiveCommand: '$assignment = az policy assignment show --name $policyName --scope $scope --output json | ConvertFrom-Json

        $budgetUrl = "https://management.azure.com$scope/providers/Microsoft.Consumption/budgets/$budgetName?api-version=2023-05-01"

        $budget = az rest --method get --url $budgetUrl --output json | ConvertFrom-Json

        if (-not $assignment.id -or -not $budget.id) { throw ''Policy assignment or budget is missing.'' }

        [pscustomobject]@{ policy = $assignment.id; budget = $budget.id }

        '
      positiveExpected: The exact Policy assignment and budget IDs both resolve.
      negativeCommand: '$deniedName = "st05bad$suffix"

        $bad = az storage account show --name $deniedName --resource-group $ResourceGroupName --query id --output tsv 2>$null

        if ($LASTEXITCODE -eq 0 -and $bad) { throw ''The non-compliant break/fix resource still exists.'' }

        $advisor = @(az advisor recommendation list --category Cost --output json | ConvertFrom-Json)

        [pscustomobject]@{ deniedResourceCount = 0; advisorRecommendationCount = $advisor.Count }

        '
      negativeExpected: The denied resource is absent; zero Advisor recommendations is a valid observed state, not a test
        failure.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Policy compliance is still Unknown or Advisor has no recommendation for this disposable workload.
      safeRetry: Preserve assignment and denial evidence, rerun the scan later, and never fabricate an Advisor result.
      cleanupDependency: Delete budget, action group, Policy assignment, and child resources before the resource group; Advisor
        is read-only.
    breakFix:
      injection: Create a resource without the required purpose tag after policy assignment.
      symptom: The request is denied or the resource is reported non-compliant, depending on effect.
      diagnosis: Inspect the assignment parameters and compliance reason.
      repair: Apply the required tag and retry after confirming the intended effect.
    challenge: Draft a cost-control response that combines tags, a budget threshold, an action group, and Advisor review.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Create an Azure Policy assignment using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/governance/policy/assign-policy-azurecli
    - title: Create and manage Azure budgets
      url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets
    - title: Microsoft.Consumption budgets REST resource
      url: https://learn.microsoft.com/en-us/azure/templates/microsoft.consumption/2023-05-01/budgets
    - title: Azure Advisor cost recommendations
      url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
  06-storage-accounts-security:
    role: A storage administrator hardening a general-purpose account.
    outcome: Select supported redundancy, create an infrastructure-encrypted account, authorize blob access with identity,
      and prove Shared Key denial.
    primer: Storage durability, transport security, authorization, and encryption are independent design choices. Redundancy
      availability is regional; infrastructure encryption is selected at creation; access keys are powerful credentials that
      must never enter evidence.
    designDecisions:
    - Select ZRS from live regional SKU restrictions and apply an explicit LRS fallback before creation.
    - Require HTTPS and TLS 1.2 or later.
    - Disable Shared Key, use a least-privilege blob data role, and rotate the secondary key without displaying it.
    architectureWalkthrough: The control plane creates a ZRS-or-LRS StorageV2 account with two encryption layers. The signed-in
      Entra identity receives a blob data role and writes through OAuth. A separate Shared Key request is intentionally rejected.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$storage = "st06$suffix"

      '
    preflightChecks:
    - id: preflight.authored.lab06.identity-and-skus
      type: capacity
      required: true
      description: Resolve an interactive learner identity and read regional Storage SKU restrictions.
      command: '$learnerId = az ad signed-in-user show --query id --output tsv

        if (-not $learnerId) { throw ''An interactive Entra user is required for the OAuth data lane.'' }

        $skuUrl = "https://management.azure.com/subscriptions/$SubscriptionId/providers/Microsoft.Storage/skus?api-version=2023-05-01"

        $skus = @(az rest --method get --url $skuUrl --output json | ConvertFrom-Json).value

        if (@($skus | Where-Object { $Location -in $_.locations }).Count -eq 0) { throw ''No Storage SKU inventory was returned
        for the selected region.'' }

        '
      expected: An interactive user and at least one regional Storage SKU resolve.
    - id: preflight.authored.lab06.storage-name
      type: service
      required: true
      description: Confirm the hardened account name is globally available.
      command: '$availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        '
      expected: The deterministic account name is available.
    validationContext: '$storage = "st06$suffix"

      $storageId = az storage account show --resource-group $ResourceGroupName --name $storage --query id --output tsv

      '
    tasks:
    - id: LAB06-CP01
      title: Select supported redundancy from regional SKU restrictions
      purpose: Query the Storage resource provider and choose ZRS only when the subscription and region permit it.
      operationalRelevance: Redundancy availability depends on region and subscription restrictions; guessing produces a failed
        deployment.
      objectiveIds:
      - ST-ACCESS-04
      command: '$skuUrl = "https://management.azure.com/subscriptions/$SubscriptionId/providers/Microsoft.Storage/skus?api-version=2023-05-01"

        $skus = @(az rest --method get --url $skuUrl --output json | ConvertFrom-Json).value

        $zrs = @($skus | Where-Object { $_.name -eq ''Standard_ZRS'' -and $Location -in $_.locations -and @($_.restrictions
        | Where-Object { $_.type -eq ''location'' -and $Location -in $_.values }).Count -eq 0 })

        $selectedSku = if ($zrs.Count -gt 0) { ''Standard_ZRS'' } else { ''Standard_LRS'' }

        $state.inputs[''selected-redundancy''] = $selectedSku

        Save-RunState

        [pscustomobject]@{ location = $Location; selectedSku = $selectedSku; fallbackUsed = $selectedSku -eq ''Standard_LRS''
        }

        '
      expectedState: selected-redundancy is Standard_ZRS when unrestricted, otherwise Standard_LRS with fallbackUsed true.
      representativeOutput: location=westeurope; selectedSku=Standard_ZRS; fallbackUsed=False
      positiveCommand: |
        $selectedRedundancy = [string]$state.inputs['selected-redundancy']
        $deployedRedundancy = az storage account show --resource-group $ResourceGroupName --name $storage --query sku.name --output tsv
        if ($selectedRedundancy -notin @('Standard_ZRS', 'Standard_LRS') -or $deployedRedundancy -ne $selectedRedundancy) {
          throw 'The persisted redundancy selection does not match the deployed storage SKU.'
        }
        $deployedRedundancy
      positiveExpected: Exactly one supported selection is stored in run.json before account creation.
      negativeCommand: '$conflict = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object name -eq $storage)

        if ($conflict.Count -ne 1 -or $conflict[0].tags.runId -ne $RunId) { throw ''Expected one run-owned deterministic storage
        account after deployment.'' }

        ''Run-owned deterministic storage accounts: 1''

        '
      negativeExpected: Exactly one account has the deterministic name and current run ownership tag after deployment.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The SKU query is denied or location spelling does not match the provider's canonical location name.
      safeRetry: Correct the approved region and rerun the read-only SKU query; do not silently change regions.
      cleanupDependency: This checkpoint persists only the selected SKU.
    - id: LAB06-CP02
      title: Create the hardened account with the selected redundancy
      purpose: Apply infrastructure encryption, TLS, HTTPS-only transport, public-access denial, Shared Key denial, and managed
        identity at creation.
      operationalRelevance: Infrastructure encryption cannot be enabled after account creation, so it belongs in the immutable
        deployment decision.
      objectiveIds:
      - ST-ACCOUNTS-01
      command: '$storage = "st06$suffix"

        $selectedSku = [string]$state.inputs[''selected-redundancy'']

        $created = az storage account create --name $storage --resource-group $ResourceGroupName --location $Location --kind
        StorageV2 --sku $selectedSku --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false --allow-shared-key-access
        false --require-infrastructure-encryption true --assign-identity --tags purpose=az104-lab labId=06 runId=$RunId --output
        json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB06-CP02'' -Kind ''azure-resource'' -Id ([string]$created.id) -Name $storage -Type
        ''Microsoft.Storage/storageAccounts'' -Scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName" -OwnershipMethod
        ''manifest-id-and-tags''

        '
      expectedState: The account uses the persisted SKU, TLS1_2, HTTPS only, infrastructure encryption, no public blobs, no
        Shared Key, and a system identity.
      representativeOutput: sku=Standard_ZRS; httpsOnly=True; minimumTls=TLS1_2; infrastructureEncryption=True; sharedKey=False
      positiveCommand: '$account = az storage account show --resource-group $ResourceGroupName --name $storage --output json
        | ConvertFrom-Json

        if ($account.sku.name -ne $state.inputs[''selected-redundancy''] -or -not $account.encryption.requireInfrastructureEncryption
        -or $account.allowSharedKeyAccess) { throw ''Storage hardening state mismatch.'' }

        $account | Select-Object sku,minimumTlsVersion,enableHttpsTrafficOnly,allowSharedKeyAccess,encryption,identity

        '
      positiveExpected: Immutable and security properties match the design and the selected redundancy.
      negativeCommand: '$account = az storage account show --resource-group $ResourceGroupName --name $storage --output json
        | ConvertFrom-Json

        if ($account.allowBlobPublicAccess -or -not $account.identity.principalId) { throw ''Public access is enabled or managed
        identity is missing.'' }

        ''Public blob access=False; managed identity present=True''

        '
      negativeExpected: Public blob access is disabled and the account identity exists.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The selected SKU becomes restricted, the globally unique name is unavailable, or infrastructure encryption
        is unsupported for the requested kind.
      safeRetry: Requery SKUs and name availability; choose a new run ID for a new name rather than weakening encryption.
      cleanupDependency: Delete role assignments and data-plane objects before the account and resource group.
    - id: LAB06-CP03
      title: Authorize and exercise identity-based blob access
      purpose: Assign Storage Blob Data Contributor to the signed-in learner, create an encryption scope and private container,
        and upload through OAuth.
      operationalRelevance: Management-plane ownership does not automatically grant blob data-plane authorization.
      objectiveIds:
      - ST-ACCOUNTS-02
      command: '$storageId = az storage account show --resource-group $ResourceGroupName --name $storage --query id --output
        tsv

        $learnerId = az ad signed-in-user show --query id --output tsv

        if (-not $learnerId) { throw ''This interactive lab requires a signed-in Entra user for data-plane authorization.''
        }

        $state.inputs[''learner-object-id''] = $learnerId

        Save-RunState

        $assignment = az role assignment create --assignee-object-id $learnerId --assignee-principal-type User --role ''Storage
        Blob Data Contributor'' --scope $storageId --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB06-CP03'' -Kind ''azure-resource'' -Id ([string]$assignment.id) -Name ''Storage
        Blob Data Contributor'' -Type ''Microsoft.Authorization/roleAssignments'' -Scope $storageId -OwnershipMethod ''manifest-id''

        az storage account encryption-scope create --resource-group $ResourceGroupName --account-name $storage --name confidential
        --key-source Microsoft.Storage --require-infrastructure-encryption true --output none

        az storage container create --account-name $storage --name private --auth-mode login --default-encryption-scope confidential
        --deny-encryption-scope-override true --output none

        $sample = Join-Path $StateDir ''identity-authorized.txt''

        ''Azure CLI OAuth data-plane validation'' | Set-Content -LiteralPath $sample -Encoding utf8

        az storage blob upload --account-name $storage --container-name private --name identity-authorized.txt --file $sample
        --auth-mode login --overwrite true --output none

        '
      expectedState: The learner has one account-scoped blob data role and the private blob was written with login auth into
        the infrastructure-encrypted scope.
      representativeOutput: role=Storage Blob Data Contributor; authMode=login; container=private; encryptionScope=confidential
      positiveCommand: '$blob = az storage blob show --account-name $storage --container-name private --name identity-authorized.txt
        --auth-mode login --output json | ConvertFrom-Json

        if ($blob.properties.encryptionScope -ne ''confidential'') { throw ''Blob does not use the required encryption scope.''
        }

        $blob | Select-Object name,properties

        '
      positiveExpected: OAuth can read the sample blob and its encryptionScope is confidential.
      negativeCommand: '$assignments = @(az role assignment list --assignee-object-id $state.inputs[''learner-object-id'']
        --scope $storageId --output json | ConvertFrom-Json | Where-Object roleDefinitionName -eq ''Storage Blob Data Contributor'')

        if ($assignments.Count -ne 1) { throw ''Expected exactly one learner blob data assignment.'' }

        ''Blob data assignments at account: 1''

        '
      negativeExpected: No duplicate blob data role assignment exists.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: RBAC propagation delays data operations or the active Azure CLI identity is a service principal rather
        than a user.
      safeRetry: Wait for the exact assignment to propagate and retry the OAuth query; never enable Shared Key as a propagation
        workaround.
      cleanupDependency: Delete the data role and container contents before deleting the storage account.
    - id: LAB06-CP04
      title: Prove that Shared Key authorization is denied
      purpose: Keep one account key only in memory, attempt a key-signed data request, require a 403-style failure, and clear
        the variable.
      operationalRelevance: Disabling Shared Key is meaningful only when a key-signed request is actually rejected while OAuth
        still works.
      objectiveIds:
      - ST-ACCOUNTS-04
      command: "$accountKey = az storage account keys list --resource-group $ResourceGroupName --account-name $storage --query\
        \ '[0].value' --output tsv\ntry {\n    $PSNativeCommandUseErrorActionPreference = $false\n    $denied = az storage\
        \ container list --account-name $storage --account-key $accountKey --output none 2>&1\n    $deniedExit = $LASTEXITCODE\n\
        \    $PSNativeCommandUseErrorActionPreference = $true\n    if ($deniedExit -eq 0) { throw 'Shared Key request unexpectedly\
        \ succeeded.' }\n} finally {\n    $accountKey = $null\n}\n"
      expectedState: The key-signed container listing fails, no key appears in output or state, and the OAuth blob query remains
        successful.
      representativeOutput: sharedKeyRequest=denied; keyPersisted=False; oauthRequest=pass
      positiveCommand: '$oauthBlob = az storage blob exists --account-name $storage --container-name private --name identity-authorized.txt
        --auth-mode login --query exists --output tsv

        if ($oauthBlob -ne ''true'') { throw ''OAuth blob validation failed after Shared Key denial.'' }

        ''OAuth blob exists=True''

        '
      positiveExpected: Identity authorization still reads the sample blob.
      negativeCommand: '$allowSharedKey = az storage account show --resource-group $ResourceGroupName --name $storage --query
        allowSharedKeyAccess --output tsv

        if ($allowSharedKey -ne ''false'') { throw ''allowSharedKeyAccess is not false.'' }

        if (Select-String -Path (Join-Path $StateDir ''*.json'') -Pattern ''accountKey|AccountKey|AZURE_STORAGE_KEY'' -ErrorAction
        SilentlyContinue) { throw ''A key-like field was persisted in state.'' }

        ''Shared Key disabled; no key-like state fields found.''

        '
      negativeExpected: Shared Key remains disabled and no key material is persisted.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The script accidentally falls back to account-key discovery or logs the native error with sensitive arguments.
      safeRetry: Verify allowSharedKeyAccess and use explicit --auth-mode login for the positive path; never print or persist
        the key.
      cleanupDependency: No credential cleanup is needed because the key stays in memory; storage data is removed with the
        account.
    - id: LAB06-CP05
      title: Rotate the secondary key and reconcile the hardened account
      purpose: Renew the unused secondary key without returning it, then verify redundancy, encryption, transport, authorization,
        and cleanup scope together.
      operationalRelevance: Key rotation remains necessary for dormant emergency credentials even when Shared Key authorization
        is disabled.
      objectiveIds:
      - ST-ACCESS-04
      - ST-ACCOUNTS-01
      - ST-ACCOUNTS-02
      - ST-ACCOUNTS-04
      command: 'az storage account keys renew --resource-group $ResourceGroupName --account-name $storage --key secondary
        --output none

        az storage account show --resource-group $ResourceGroupName --name $storage --query ''{sku:sku.name,https:enableHttpsTrafficOnly,tls:minimumTlsVersion,sharedKey:allowSharedKeyAccess,publicBlob:allowBlobPublicAccess,infrastructureEncryption:encryption.requireInfrastructureEncryption}''
        --output table

        '
      expectedState: All hardened properties remain intact after a non-disclosing secondary-key rotation and the OAuth blob
        path still passes.
      representativeOutput: sku=<selected>; https=True; tls=TLS1_2; sharedKey=False; publicBlob=False; infrastructureEncryption=True
      positiveCommand: '$account = az storage account show --resource-group $ResourceGroupName --name $storage --output json
        | ConvertFrom-Json

        $pass = $account.sku.name -eq $state.inputs[''selected-redundancy''] -and $account.minimumTlsVersion -eq ''TLS1_2''
        -and $account.enableHttpsTrafficOnly -and -not $account.allowSharedKeyAccess -and -not $account.allowBlobPublicAccess
        -and $account.encryption.requireInfrastructureEncryption

        if (-not $pass) { throw ''One or more hardened account properties drifted.'' }

        $account | Select-Object id,sku,minimumTlsVersion,enableHttpsTrafficOnly,allowSharedKeyAccess,allowBlobPublicAccess,encryption

        '
      positiveExpected: Every security and redundancy property matches the persisted design.
      negativeCommand: '$accounts = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json)

        if ($accounts.Count -ne 1 -or $accounts[0].name -ne $storage) { throw ''Unexpected storage-account inventory in the
        lab group.'' }

        ''Run-owned storage accounts: 1''

        '
      negativeExpected: The lab resource group contains only the intended account.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A security property drifted during troubleshooting or role propagation still blocks the OAuth validation.
      safeRetry: Repair only the mutable drifted property; infrastructure encryption requires account recreation with a new
        run ID.
      cleanupDependency: Remove assignment, blobs, container, encryption scope, account, then resource group and query the
        exact account ID.
    breakFix:
      injection: Attempt a container listing with a current account key after Shared Key authorization is disabled.
      symptom: The key-signed data request is denied while the OAuth blob query still succeeds.
      diagnosis: Compare allowSharedKeyAccess with the two authorization paths and confirm no key was persisted.
      repair: Keep Shared Key disabled and use the least-privilege Entra data role for the retry.
    challenge: Recommend redundancy and encryption settings for a regional business app and justify recovery tradeoffs.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Create an Azure storage account using Azure CLI
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create
    - title: Azure Storage redundancy options
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
    - title: Azure Storage encryption for data at rest
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-service-encryption
    - title: Prevent Shared Key authorization for Azure Storage
      url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
    - title: Authorize access to blobs using Azure CLI and Microsoft Entra ID
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-data-operations-cli
  07-storage-network-sas:
    role: A storage security administrator restricting data-plane access.
    outcome: Build a default-deny storage firewall with one service-endpoint subnet, issue a revocable service SAS, and prove
      network denial precedes authorization.
    primer: A storage firewall controls network origin, while RBAC or SAS controls authorization. A service endpoint keeps
      the public service endpoint but conveys subnet identity; a stored access policy provides a revocation point for service
      SAS tokens.
    designDecisions:
    - Default-deny the storage firewall.
    - Authorize one subnet explicitly.
    - Keep the short-lived SAS in memory only.
    architectureWalkthrough: A workload subnet advertises the Microsoft.Storage service endpoint and is the only virtual-network
      rule on the public storage endpoint. A stored access policy issues a short-lived service SAS, but requests from the
      learner's unapproved workstation are still denied by the firewall before SAS permissions are evaluated.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$storage = "st07$suffix"

      '
    preflightChecks:
    - id: preflight.authored.lab07.endpoint-and-name
      type: service
      required: true
      description: Confirm Microsoft.Storage service-endpoint availability and the deterministic account name without creating
        a network.
      command: '$endpoints = @(az network service-endpoint list --location $Location --output json | ConvertFrom-Json)

        if (@($endpoints | Where-Object service -eq ''Microsoft.Storage'').Count -eq 0) { throw ''Microsoft.Storage service
        endpoint is unavailable in the selected region.'' }

        $availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        '
      expected: Microsoft.Storage is a regional service endpoint and the account name is available.
    validationContext: '$vnet = "vnet-$suffix"

      $storage = "st07$suffix"

      $subnetId = az network vnet subnet show --resource-group $ResourceGroupName --vnet-name $vnet --name storage --query
      id --output tsv

      '
    tasks:
    - id: LAB07-CP01
      title: Establish the network and authorization test model
      purpose: Confirm the provider and deterministic address space, and distinguish firewall origin checks from SAS permissions.
      operationalRelevance: A successful SAS generation does not prove that any network origin can reach the account.
      objectiveIds:
      - ST-ACCESS-01
      command: '$provider = az provider show --namespace Microsoft.Storage --query registrationState --output tsv

        if ($provider -ne ''Registered'') { throw ''Microsoft.Storage must already be Registered.'' }

        [pscustomobject]@{ vnet = "vnet-$suffix"; subnet = ''10.7.1.0/24''; account = "st07$suffix"; firewallTarget = ''Deny''
        }

        '
      expectedState: Storage is registered and the plan contains one non-overlapping subnet and a default-deny target.
      representativeOutput: vnet=vnet-<redacted>; subnet=10.7.1.0/24; firewallTarget=Deny
      positiveCommand: '$location = az account list-locations --query "[?name==''$Location''].name | [0]" --output tsv

        if ($location -ne $Location) { throw ''Requested location is unavailable.'' }

        $location

        '
      positiveExpected: The exact requested location is available.
      negativeCommand: '$existing = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object name -eq "st07$suffix")

        if ($existing.Count -ne 1 -or $existing[0].tags.runId -ne $RunId) { throw ''Expected one run-owned storage firewall
        endpoint after deployment.'' }

        ''Run-owned storage firewall endpoints: 1''

        '
      negativeExpected: Exactly one deterministic account exists and carries the current run ownership tag after deployment.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Provider registration or region availability is missing.
      safeRetry: Resolve prerequisites through an approved platform process and rerun this read-only plan.
      cleanupDependency: This checkpoint is read-only.
    - id: LAB07-CP02
      title: Build the service-endpoint subnet and private container
      purpose: Create the account temporarily open for bootstrap, create the container and stored access policy, then close
        the firewall to one subnet.
      operationalRelevance: Data-plane bootstrap from the administrator workstation must finish before default-deny removes
        that origin.
      objectiveIds:
      - ST-ACCESS-02
      command: "$vnet = \"vnet-$suffix\"; $storage = \"st07$suffix\"\n$createdVnet = az network vnet create --resource-group\
        \ $ResourceGroupName --name $vnet --location $Location --address-prefixes 10.7.0.0/16 --subnet-name storage --subnet-prefixes\
        \ 10.7.1.0/24 --tags purpose=az104-lab labId=07 runId=$RunId --output json | ConvertFrom-Json\n$vnetId = [string]$createdVnet.newVNet.id\n\
        if (-not $vnetId) { $vnetId = az network vnet show --resource-group $ResourceGroupName --name $vnet --query id --output\
        \ tsv }\nAdd-ManagedObject -CheckpointId 'LAB07-CP02' -Kind 'azure-resource' -Id $vnetId -Name $vnet -Type 'Microsoft.Network/virtualNetworks'\
        \ -Scope \"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName\" -OwnershipMethod 'manifest-id-and-tags'\n\
        az network vnet subnet update --resource-group $ResourceGroupName --vnet-name $vnet --name storage --service-endpoints\
        \ Microsoft.Storage --output none\n$subnetId = az network vnet subnet show --resource-group $ResourceGroupName --vnet-name\
        \ $vnet --name storage --query id --output tsv\n$createdStorage = az storage account create --resource-group $ResourceGroupName\
        \ --name $storage --location $Location --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2\
        \ --allow-blob-public-access false --default-action Allow --tags purpose=az104-lab labId=07 runId=$RunId --output\
        \ json | ConvertFrom-Json\nAdd-ManagedObject -CheckpointId 'LAB07-CP02' -Kind 'azure-resource' -Id ([string]$createdStorage.id)\
        \ -Name $storage -Type 'Microsoft.Storage/storageAccounts' -Scope \"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName\"\
        \ -OwnershipMethod 'manifest-id-and-tags'\n$accountKey = az storage account keys list --resource-group $ResourceGroupName\
        \ --account-name $storage --query '[0].value' --output tsv\ntry {\n    az storage container create --name private\
        \ --account-name $storage --account-key $accountKey --public-access off --output none\n    $start = (Get-Date).ToUniversalTime().AddMinutes(-5).ToString('yyyy-MM-ddTHH:mmZ')\n\
        \    $expiry = (Get-Date).ToUniversalTime().AddHours(2).ToString('yyyy-MM-ddTHH:mmZ')\n    az storage container policy\
        \ create --account-name $storage --container-name private --name az104 --permissions rwl --start $start --expiry $expiry\
        \ --account-key $accountKey --output none\n} finally { $accountKey = $null }\naz storage account network-rule add\
        \ --resource-group $ResourceGroupName --account-name $storage --subnet $subnetId --output none\naz storage account\
        \ update --resource-group $ResourceGroupName --name $storage --default-action Deny --bypass None --output none\n"
      expectedState: The subnet exposes Microsoft.Storage, the account is default-deny with one VNet rule, and the private
        container has one stored access policy.
      representativeOutput: serviceEndpoint=Microsoft.Storage; defaultAction=Deny; virtualNetworkRules=1; storedPolicies=1
      positiveCommand: '$rules = az storage account network-rule list --resource-group $ResourceGroupName --account-name $storage
        --output json | ConvertFrom-Json

        if ($rules.defaultAction -ne ''Deny'' -or @($rules.virtualNetworkRules | Where-Object virtualNetworkResourceId -eq
        $subnetId).Count -ne 1) { throw ''Firewall rule set mismatch.'' }

        $rules

        '
      positiveExpected: DefaultAction is Deny and the exact subnet appears once.
      negativeCommand: '$subnet = az network vnet subnet show --resource-group $ResourceGroupName --vnet-name $vnet --name
        storage --output json | ConvertFrom-Json

        if (''Microsoft.Storage'' -notin $subnet.serviceEndpoints.service) { throw ''Storage service endpoint is absent.''
        }

        if (@($subnet.serviceEndpoints).Count -ne 1) { throw ''Unexpected additional service endpoints are configured.'' }

        $subnet.serviceEndpoints

        '
      negativeExpected: The subnet has only the intended Microsoft.Storage service endpoint.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The account is closed before data-plane bootstrap or the subnet update has not converged.
      safeRetry: Inspect management-plane rules; reopen only the exact account long enough to finish missing bootstrap, then
        restore Deny in the same task.
      cleanupDependency: Revoke the stored policy before deleting the container, account, subnet, and VNet.
    - id: LAB07-CP03
      title: Generate a short-lived service SAS from the stored policy
      purpose: Sign a container SAS in memory, confirm its bounded lifetime and policy reference, and persist neither the
        key nor token.
      operationalRelevance: A stored access policy provides a server-side revocation point for a service SAS; a user-delegation
        SAS cannot reference it.
      objectiveIds:
      - ST-ACCESS-03
      command: "$accountKey = az storage account keys list --resource-group $ResourceGroupName --account-name $storage --query\
        \ '[0].value' --output tsv\ntry {\n    $sas = az storage container generate-sas --account-name $storage --name private\
        \ --policy-name az104 --account-key $accountKey --output tsv\n    if (-not $sas -or $sas -notmatch '(^|&)si=az104(&|$)')\
        \ { throw 'Generated SAS does not reference the az104 stored access policy.' }\n    Write-Host \"Generated a policy-bound\
        \ SAS in memory (length=$($sas.Length)); token redacted.\"\n} finally { $sas = $null; $accountKey = $null }\n"
      expectedState: A non-empty service SAS references policy az104 and is cleared without entering command output, state,
        or evidence.
      representativeOutput: policy=az104; sasGenerated=True; token=<redacted>; persisted=False
      positiveCommand: '$rules = az storage account network-rule list --resource-group $ResourceGroupName --account-name $storage
        --output json | ConvertFrom-Json

        if ($rules.defaultAction -ne ''Deny'' -or @($rules.virtualNetworkRules).Count -ne 1) { throw ''Firewall changed during
        SAS generation.'' }

        $rules

        '
      positiveExpected: The account still has defaultAction Deny and exactly one allowed subnet after SAS generation.
      negativeCommand: |
        $accountRunId = az storage account show --resource-group $ResourceGroupName --name $storage --query tags.runId --output tsv
        if ($accountRunId -ne $RunId) {
          throw 'The SAS endpoint does not retain this run ID ownership tag.'
        }
        if (Select-String -Path (Join-Path $StateDir '*.json') -Pattern 'sig=|sasToken|accountKey|AZURE_STORAGE_KEY' -ErrorAction SilentlyContinue) {
          throw 'A SAS or key-like field was persisted.'
        }
        'Owned account=1; secret-like state fields=0'
      negativeExpected: No SAS or account-key field appears in state files.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The learner tries --as-user with --policy-name, which combines incompatible user-delegation and stored-policy
        models.
      safeRetry: Use a service SAS signed in memory for this stored-policy exercise and clear all secret variables immediately.
      cleanupDependency: Revoke the az104 stored access policy before deleting data-plane resources.
    - id: LAB07-CP04
      title: Prove that a valid SAS is denied from an unapproved network
      purpose: Use a freshly signed policy-bound SAS from the learner workstation and require the data-plane request to fail
        while the firewall is Deny.
      operationalRelevance: Storage authorization and network authorization are cumulative; a valid token cannot bypass the
        firewall.
      objectiveIds:
      - ST-ACCESS-04
      command: "$accountKey = az storage account keys list --resource-group $ResourceGroupName --account-name $storage --query\
        \ '[0].value' --output tsv\ntry {\n    $sas = az storage container generate-sas --account-name $storage --name private\
        \ --policy-name az104 --account-key $accountKey --output tsv\n    $PSNativeCommandUseErrorActionPreference = $false\n\
        \    $denied = az storage blob list --account-name $storage --container-name private --sas-token $sas --output none\
        \ 2>&1\n    $deniedExit = $LASTEXITCODE\n    $PSNativeCommandUseErrorActionPreference = $true\n    if ($deniedExit\
        \ -eq 0) { throw 'The learner workstation unexpectedly passed the storage firewall.' }\n} finally { $sas = $null;\
        \ $accountKey = $null }\n"
      expectedState: SAS signing succeeds locally, the data-plane request fails from the unapproved origin, and no token is
        retained.
      representativeOutput: sasSignature=valid; networkOrigin=workstation; request=denied; token=<cleared>
      positiveCommand: '$defaultAction = az storage account show --resource-group $ResourceGroupName --name $storage --query
        networkRuleSet.defaultAction --output tsv

        if ($defaultAction -ne ''Deny'') { throw ''Storage firewall is not default-deny.'' }

        $defaultAction

        '
      positiveExpected: Management-plane state remains Deny.
      negativeCommand: '$rules = az storage account network-rule list --resource-group $ResourceGroupName --account-name $storage
        --output json | ConvertFrom-Json

        if (@($rules.ipRules).Count -gt 0) { throw ''An IP exception bypasses the intended denied-workstation path.'' }

        ''IP firewall exceptions: 0''

        '
      negativeExpected: No IP rule authorizes the learner workstation.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A trusted-service bypass or pre-existing IP rule makes the learner origin unexpectedly reachable.
      safeRetry: Inspect and remove only manifest-owned exceptions; never modify organization-owned network rules.
      cleanupDependency: No token cleanup is required; revoke the stored policy during the next checkpoint.
    - id: LAB07-CP05
      title: Repair a removed subnet rule and revoke the stored policy
      purpose: Remove and restore the exact VNet rule as a deterministic fault, then revoke future SAS use through the stored
        access policy.
      operationalRelevance: Firewall repair and token revocation are separate operational controls and need separate evidence.
      objectiveIds:
      - ST-ACCESS-01
      - ST-ACCESS-02
      - ST-ACCESS-03
      - ST-ACCESS-04
      command: "az storage account network-rule remove --resource-group $ResourceGroupName --account-name $storage --subnet\
        \ $subnetId --output none\n$afterInjection = az storage account network-rule list --resource-group $ResourceGroupName\
        \ --account-name $storage --output json | ConvertFrom-Json\nif (@($afterInjection.virtualNetworkRules).Count -ne 0)\
        \ { throw 'Subnet-rule injection did not produce the expected symptom.' }\naz storage account network-rule add --resource-group\
        \ $ResourceGroupName --account-name $storage --subnet $subnetId --output none\n$accountKey = az storage account keys\
        \ list --resource-group $ResourceGroupName --account-name $storage --query '[0].value' --output tsv\ntry {\n    az\
        \ storage account update --resource-group $ResourceGroupName --name $storage --default-action Allow --output none\n\
        \    az storage container policy delete --account-name $storage --container-name private --name az104 --account-key\
        \ $accountKey --output none\n} finally {\n    az storage account update --resource-group $ResourceGroupName --name\
        \ $storage --default-action Deny --bypass None --output none\n    $accountKey = $null\n}\n"
      expectedState: The exact subnet rule is restored, defaultAction is Deny, and policy az104 is revoked before cleanup.
      representativeOutput: injectedRules=0; repairedRules=1; defaultAction=Deny; storedPolicy=revoked
      positiveCommand: '$rules = az storage account network-rule list --resource-group $ResourceGroupName --account-name $storage
        --output json | ConvertFrom-Json

        if ($rules.defaultAction -ne ''Deny'' -or @($rules.virtualNetworkRules | Where-Object virtualNetworkResourceId -eq
        $subnetId).Count -ne 1) { throw ''Firewall repair is incomplete.'' }

        $rules

        '
      positiveExpected: Deny and the exact subnet rule are restored after the fault.
      negativeCommand: |
        $defaultAction = az storage account show --resource-group $ResourceGroupName --name $storage --query networkRuleSet.defaultAction --output tsv
        if ($defaultAction -ne 'Deny') {
          throw 'The storage firewall is not default-deny after policy revocation.'
        }
        if (Select-String -Path (Join-Path $StateDir '*.json') -Pattern 'sig=|sasToken|accountKey' -ErrorAction SilentlyContinue) {
          throw 'Secret material is present in state.'
        }
        'Firewall=Deny; persisted SAS/key fields=0'
      negativeExpected: No SAS or account key remains in state after revocation.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: A failed policy deletion leaves the account temporarily open or a retry creates a duplicate VNet rule.
      safeRetry: The finally block must restore Deny; query exact rules, reconcile one subnet entry, and retry policy revocation
        with secrets only in memory.
      cleanupDependency: Delete the container and account after policy revocation, then remove subnet and VNet with the resource
        group.
    breakFix:
      injection: Remove the subnet network rule while default action remains Deny.
      symptom: A request from the workload subnet loses network authorization.
      diagnosis: Inspect the account default action and virtual-network rules.
      repair: Restore the exact recorded subnet rule and retest with identity authorization.
    challenge: Compare user-delegation SAS, service SAS, and account SAS for a time-bounded upload workflow.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Configure Azure Storage firewalls and virtual networks
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
    - title: Azure Storage shared access signature overview
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-sas-overview
    - title: Define an Azure Storage stored access policy
      url: https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
  08-blob-lifecycle-replication:
    role: A data-platform administrator managing blob retention and replication.
    outcome: Configure versioning, soft delete, lifecycle tiering, a two-sided object-replication policy, and an Entra-authorized
      AzCopy transfer.
    primer: Blob versions, soft delete, lifecycle management, tiers, and object replication solve different recovery and cost
      problems. Object replication depends on change feed and versioning; AzCopy moves data but does not replace a replication
      policy.
    designDecisions:
    - Enable prerequisites on both accounts before replication.
    - Use lifecycle filters that target known blob types.
    - Keep transfer credentials out of command history and state.
    architectureWalkthrough: AzCopy writes a block blob to the source account with the learner's Azure CLI token. Versioning,
      change feed, and the source/destination copies of one object-replication policy move new versions to the destination.
      Lifecycle rules tier base blobs and delete older versions, while soft delete supplies short-term recovery.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$source = "st08a$suffix"

      $destination = "st08b$suffix"

      '
    preflightChecks:
    - id: preflight.authored.lab08.identity-and-names
      type: service
      required: true
      description: Resolve the interactive AzCopy identity and prove both globally unique endpoint names are available.
      command: "$learnerId = az ad signed-in-user show --query id --output tsv\nif (-not $learnerId) { throw 'An interactive\
        \ Entra user is required for the AZCLI AzCopy lane.' }\nforeach ($account in @($source,$destination)) {\n    $availability\
        \ = az storage account check-name --name $account --output json | ConvertFrom-Json\n    if (-not $availability.nameAvailable)\
        \ { throw \"Storage name unavailable: $account ($($availability.reason))\" }\n}\n"
      expected: The interactive identity resolves and both account names are globally available.
    validationContext: '$source = "st08a$suffix"

      $destination = "st08b$suffix"

      '
    cleanupContext: '$source = "st08a$suffix"

      $destination = "st08b$suffix"

      $replicationPolicyId = [string]$state.inputs[''object-replication-policy-id'']

      '
    preCleanupCommand: "if ($replicationPolicyId) {\n    $cleanupNativePreference = $PSNativeCommandUseErrorActionPreference\n\
      \    $PSNativeCommandUseErrorActionPreference = $false\n    try {\n        foreach ($account in @($source,$destination))\
      \ {\n            $policy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $account\
      \ --policy-id $replicationPolicyId --output json 2>$null\n            if ($LASTEXITCODE -eq 0 -and $policy) {\n    \
      \            az storage account or-policy delete --resource-group $ResourceGroupName --account-name $account --policy-id\
      \ $replicationPolicyId --output none\n                if ($LASTEXITCODE -ne 0) { throw \"Object-replication policy cleanup\
      \ failed on $account.\" }\n            }\n        }\n    } finally {\n        $PSNativeCommandUseErrorActionPreference\
      \ = $cleanupNativePreference\n    }\n}\n"
    tasks:
    - id: LAB08-CP01
      title: Confirm AzCopy, identity, and object-replication prerequisites
      purpose: Validate the local transfer tool, signed-in user, provider, and unique account names before creating endpoints.
      operationalRelevance: Object replication is asynchronous, but missing versioning, change feed, identity roles, or AzCopy
        must be discovered synchronously.
      objectiveIds:
      - ST-ACCOUNTS-03
      command: 'if (-not (Get-Command azcopy -ErrorAction SilentlyContinue)) { throw ''AzCopy v10 is required.'' }

        $learnerId = az ad signed-in-user show --query id --output tsv

        if (-not $learnerId) { throw ''Use an interactive Entra user for the Azure CLI backed AzCopy path.'' }

        $state.inputs[''learner-object-id''] = $learnerId

        Save-RunState

        azcopy --version

        '
      expectedState: AzCopy v10 and an interactive learner object ID are available before any storage account is created.
      representativeOutput: azcopy=10.x; learnerObjectId=<redacted>; sourceNameAvailable=True; destinationNameAvailable=True
      positiveCommand: '$accounts = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json)

        if (@($accounts | Where-Object name -in @($source,$destination)).Count -ne 2) { throw ''Both replication accounts
        must exist during validation.'' }

        $accounts | Where-Object name -in @($source,$destination) | Select-Object id,name

        '
      positiveExpected: During deployment validation, both deterministic account IDs resolve.
      negativeCommand: |
        $unownedAccounts = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json | Where-Object {
          $_.name -in @($source, $destination) -and ($_.tags.labId -ne '08' -or $_.tags.runId -ne $RunId)
        })
        if ($unownedAccounts.Count -gt 0 -or -not $state.inputs['learner-object-id']) {
          throw 'A replication account is unowned or the learner object ID was not persisted.'
        }
        if (Select-String -Path (Join-Path $StateDir '*.json') -Pattern 'sasToken|accountKey|AZCOPY_SPA_CLIENT_SECRET' -ErrorAction SilentlyContinue) {
          throw 'Transfer credentials were persisted.'
        }
        'Owned replication accounts=2; learner ID recorded; transfer secrets recorded=0'
      negativeExpected: The non-secret learner ID is recorded and no transfer credential exists in state.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: AzCopy is missing or the Azure CLI context is a service principal without the planned user data role.
      safeRetry: Correct readiness or use an approved interactive user; do not add a SAS fallback to this identity exercise.
      cleanupDependency: This checkpoint persists only a non-secret principal ID.
    - id: LAB08-CP02
      title: Create and protect the source and destination accounts
      purpose: Persist each account immediately, configure soft delete and change feed, assign data roles, and install the
        source lifecycle rule.
      operationalRelevance: Both endpoints need recovery controls; each returned ID must survive a partial failure of the
        second account.
      objectiveIds:
      - ST-ACCOUNTS-05
      command: "$source = \"st08a$suffix\"; $destination = \"st08b$suffix\"\nforeach ($account in @($source,$destination))\
        \ {\n    $created = az storage account create --name $account --resource-group $ResourceGroupName --location $Location\
        \ --kind StorageV2 --sku Standard_LRS --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false\
        \ --allow-cross-tenant-replication false --tags purpose=az104-lab labId=08 runId=$RunId --output json | ConvertFrom-Json\n\
        \    Add-ManagedObject -CheckpointId 'LAB08-CP02' -Kind 'azure-resource' -Id ([string]$created.id) -Name $account\
        \ -Type 'Microsoft.Storage/storageAccounts' -Scope \"/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName\"\
        \ -OwnershipMethod 'manifest-id-and-tags'\n    az storage account blob-service-properties update --account-name $account\
        \ --resource-group $ResourceGroupName --enable-change-feed true --enable-delete-retention true --delete-retention-days\
        \ 7 --enable-container-delete-retention true --container-delete-retention-days 7 --output none\n    $assignment =\
        \ az role assignment create --assignee-object-id $state.inputs['learner-object-id'] --assignee-principal-type User\
        \ --role 'Storage Blob Data Contributor' --scope $created.id --output json | ConvertFrom-Json\n    Add-ManagedObject\
        \ -CheckpointId 'LAB08-CP02' -Kind 'azure-resource' -Id ([string]$assignment.id) -Name \"BlobContributor-$account\"\
        \ -Type 'Microsoft.Authorization/roleAssignments' -Scope ([string]$created.id) -OwnershipMethod 'manifest-id'\n}\n\
        az storage account blob-service-properties update --account-name $source --resource-group $ResourceGroupName --enable-versioning\
        \ true --output none\naz storage account blob-service-properties update --account-name $destination --resource-group\
        \ $ResourceGroupName --enable-versioning false --output none\naz storage container create --name source --account-name\
        \ $source --auth-mode login --output none\naz storage container create --name destination --account-name $destination\
        \ --auth-mode login --output none\n$policyPath = Join-Path $StateDir 'lifecycle-policy.json'\n@{ rules = @(@{ enabled\
        \ = $true; name = 'tier-and-expire-versions'; type = 'Lifecycle'; definition = @{ actions = @{ baseBlob = @{ tierToCool\
        \ = @{ daysAfterModificationGreaterThan = 30 } }; version = @{ delete = @{ daysAfterCreationGreaterThan = 45 } } };\
        \ filters = @{ blobTypes = @('blockBlob') } } }) } | ConvertTo-Json -Depth 15 | Set-Content -LiteralPath $policyPath\
        \ -Encoding utf8\naz storage account management-policy create --account-name $source --resource-group $ResourceGroupName\
        \ --policy \"@$policyPath\" --output none\n"
      expectedState: Both accounts have change feed and soft delete; source versioning is on, destination versioning is intentionally
        off for the next break/fix, and lifecycle manages base blobs and versions.
      representativeOutput: accounts=2; softDeleteDays=7; changeFeed=True; sourceVersioning=True; destinationVersioning=False;
        lifecycleRules=1
      positiveCommand: '$sourceProps = az storage account blob-service-properties show --resource-group $ResourceGroupName
        --account-name $source --output json | ConvertFrom-Json

        if (-not $sourceProps.changeFeed.enabled -or -not $sourceProps.isVersioningEnabled -or $sourceProps.deleteRetentionPolicy.days
        -ne 7) { throw ''Source protection settings mismatch.'' }

        $sourceProps

        '
      positiveExpected: Source change feed, versioning, and seven-day soft delete are enabled.
      negativeCommand: '$destinationProps = az storage account blob-service-properties show --resource-group $ResourceGroupName
        --account-name $destination --output json | ConvertFrom-Json

        if (-not $destinationProps.changeFeed.enabled -or $destinationProps.isVersioningEnabled) { throw ''Destination must
        have change feed on and versioning off before the injected failure.'' }

        $destinationProps

        '
      negativeExpected: Destination versioning is deliberately false before the replication break/fix.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The second account fails after the first succeeds or data-role propagation delays container creation.
      safeRetry: Reconcile manifest IDs and account properties first; retry only the missing account or OAuth data operation.
      cleanupDependency: Delete object-replication policies before containers, roles, accounts, and the resource group.
    - id: LAB08-CP03
      title: Inject the missing-versioning fault and build both policy copies
      purpose: Require replication creation to fail while destination versioning is off, repair the prerequisite, then apply
        the destination-generated policy to both endpoints.
      operationalRelevance: A destination-only policy is incomplete; the same policy ID and rules must exist on source and
        destination.
      objectiveIds:
      - ST-DATA-02
      command: "$sourceId = az storage account show --resource-group $ResourceGroupName --name $source --query id --output\
        \ tsv\n$destinationId = az storage account show --resource-group $ResourceGroupName --name $destination --query id\
        \ --output tsv\n$minimumCreation = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')\n$PSNativeCommandUseErrorActionPreference\
        \ = $false\n$fault = az storage account or-policy create --resource-group $ResourceGroupName --account-name $destination\
        \ --source-account $sourceId --destination-account $destinationId --source-container source --destination-container\
        \ destination --min-creation-time $minimumCreation --output json 2>&1\n$faultExit = $LASTEXITCODE\n$PSNativeCommandUseErrorActionPreference\
        \ = $true\nif ($faultExit -eq 0) {\n    $unexpectedPolicy = ([string]($fault -join \"`n\") | ConvertFrom-Json)\n \
        \   $state.inputs['object-replication-policy-id'] = [string]$unexpectedPolicy.policyId\n    Save-RunState\n    throw\
        \ 'Object replication unexpectedly succeeded while destination versioning was disabled; its policy ID was recorded\
        \ for cleanup.'\n}\naz storage account blob-service-properties update --account-name $destination --resource-group\
        \ $ResourceGroupName --enable-versioning true --output none\n$destinationPolicy = az storage account or-policy create\
        \ --resource-group $ResourceGroupName --account-name $destination --source-account $sourceId --destination-account\
        \ $destinationId --source-container source --destination-container destination --min-creation-time $minimumCreation\
        \ --output json | ConvertFrom-Json\n$state.inputs['object-replication-policy-id'] = [string]$destinationPolicy.policyId\n\
        Save-RunState\naz storage account or-policy show --resource-group $ResourceGroupName --account-name $destination --policy-id\
        \ $state.inputs['object-replication-policy-id'] --output json |\n    az storage account or-policy create --resource-group\
        \ $ResourceGroupName --account-name $source --policy '@-' --output none\n"
      expectedState: The pre-repair attempt fails, destination versioning becomes true, and the same policy ID with one rule
        exists on both accounts.
      representativeOutput: fault=versioning-disabled; repaired=True; policyId=<redacted>; sourceRules=1; destinationRules=1
      positiveCommand: '$policyId = [string]$state.inputs[''object-replication-policy-id'']

        $sourcePolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $source --policy-id
        $policyId --output json | ConvertFrom-Json

        $destinationPolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $destination
        --policy-id $policyId --output json | ConvertFrom-Json

        if ($sourcePolicy.policyId -ne $destinationPolicy.policyId -or @($sourcePolicy.rules).Count -ne 1 -or @($destinationPolicy.rules).Count
        -ne 1) { throw ''Object-replication policy copies differ.'' }

        [pscustomobject]@{ policyId = $policyId; sourceRules = $sourcePolicy.rules.Count; destinationRules = $destinationPolicy.rules.Count
        }

        '
      positiveExpected: Both policy copies share one policy ID and one container rule.
      negativeCommand: "foreach ($account in @($source,$destination)) {\n    $properties = az storage account blob-service-properties\
        \ show --resource-group $ResourceGroupName --account-name $account --output json | ConvertFrom-Json\n    if (-not\
        \ $properties.isVersioningEnabled -or -not $properties.changeFeed.enabled) { throw \"Replication prerequisite missing\
        \ on $account\" }\n}\n'Versioning and change feed enabled on both accounts.'\n"
      negativeExpected: No endpoint remains without versioning or change feed after repair.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The destination policy is created but not copied to source, or a retry creates a second policy.
      safeRetry: List both endpoints, reuse the recorded policy ID, and copy the existing destination definition to source.
      cleanupDependency: Delete the source policy copy first, then destination policy, containers, roles, and accounts.
    - id: LAB08-CP04
      title: Transfer and version a blob with AzCopy using the Azure CLI token
      purpose: Use AZCLI auto-login, upload two revisions, and place the current version in Cool tier without SAS or account
        keys.
      operationalRelevance: AzCopy moves data; versioning preserves revisions and object replication independently copies
        eligible versions.
      objectiveIds:
      - ST-DATA-03
      command: "$sample = Join-Path $StateDir 'replication-sample.txt'\n$tenantId = az account show --query tenantId --output\
        \ tsv\n$env:AZCOPY_AUTO_LOGIN_TYPE = 'AZCLI'\n$env:AZCOPY_TENANT_ID = $tenantId\ntry {\n    'revision 1' | Set-Content\
        \ -LiteralPath $sample -Encoding utf8\n    azcopy copy $sample \"https://$source.blob.core.windows.net/source/replication-sample.txt\"\
        \ --from-to LocalBlob --overwrite=true\n    'revision 2' | Set-Content -LiteralPath $sample -Encoding utf8\n    azcopy\
        \ copy $sample \"https://$source.blob.core.windows.net/source/replication-sample.txt\" --from-to LocalBlob --overwrite=true\n\
        } finally {\n    Remove-Item Env:AZCOPY_AUTO_LOGIN_TYPE -ErrorAction SilentlyContinue\n    Remove-Item Env:AZCOPY_TENANT_ID\
        \ -ErrorAction SilentlyContinue\n}\naz storage blob set-tier --account-name $source --container-name source --name\
        \ replication-sample.txt --tier Cool --auth-mode login --output none\n"
      expectedState: The source has a current Cool blob plus at least one prior version; eligible versions begin asynchronous
        replication to destination.
      representativeOutput: azcopyAuth=AZCLI; currentRevision=2; priorVersions>=1; accessTier=Cool; replication=asynchronous
      positiveCommand: '$versions = @(az storage blob list --account-name $source --container-name source --include v --auth-mode
        login --output json | ConvertFrom-Json | Where-Object name -eq ''replication-sample.txt'')

        if ($versions.Count -lt 2 -or @($versions | Where-Object properties.accessTier -eq ''Cool'').Count -lt 1) { throw
        ''Expected multiple versions and a Cool current blob.'' }

        $versions | Select-Object name,versionId,isCurrentVersion,properties

        '
      positiveExpected: At least two blob revisions are listed and the current blob is Cool.
      negativeCommand: 'if (Test-Path Env:AZCOPY_AUTO_LOGIN_TYPE) { throw ''AzCopy auto-login environment remained after transfer.''
        }

        if (Select-String -Path (Join-Path $StateDir ''*.json'') -Pattern ''sasToken|accountKey|clientSecret'' -ErrorAction
        SilentlyContinue) { throw ''A transfer secret is persisted.'' }

        ''AzCopy auth environment cleared; persisted transfer secrets=0''

        '
      negativeExpected: Temporary AzCopy environment variables are cleared and no transfer credential is stored.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Blob data-role propagation delays AzCopy or the learner confuses upload completion with replication completion.
      safeRetry: Confirm the exact role and source blob first; retry AzCopy with AZCLI, then observe replication separately.
      cleanupDependency: Delete policy copies before source and destination containers and accounts.
    - id: LAB08-CP05
      title: Reconcile protection, policy, versions, and asynchronous replication state
      purpose: Prove the lifecycle rule, recovery controls, two policy copies, source revisions, and observable replication
        status without pretending asynchronous convergence is immediate.
      operationalRelevance: A completed command is not a completed data-protection design; administrators correlate configuration
        and data state while treating replication latency explicitly.
      objectiveIds:
      - ST-ACCOUNTS-03
      - ST-ACCOUNTS-05
      - ST-DATA-02
      - ST-DATA-03
      - ST-DATA-04
      - ST-DATA-06
      - ST-DATA-07
      command: '$policyId = [string]$state.inputs[''object-replication-policy-id'']

        $sourcePolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $source --policy-id
        $policyId --output json | ConvertFrom-Json

        $destinationPolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $destination
        --policy-id $policyId --output json | ConvertFrom-Json

        $lifecycle = az storage account management-policy show --resource-group $ResourceGroupName --account-name $source
        --output json | ConvertFrom-Json

        $sourceVersions = @(az storage blob list --account-name $source --container-name source --include v --auth-mode login
        --output json | ConvertFrom-Json | Where-Object name -eq ''replication-sample.txt'')

        $destinationCopies = @(az storage blob list --account-name $destination --container-name destination --include v --auth-mode
        login --output json | ConvertFrom-Json | Where-Object name -eq ''replication-sample.txt'')

        if ($sourcePolicy.policyId -ne $destinationPolicy.policyId) { throw ''Replication policy IDs do not match.'' }

        if (@($lifecycle.policy.rules | Where-Object name -eq ''tier-and-expire-versions'').Count -ne 1) { throw ''Lifecycle
        rule is missing.'' }

        if ($sourceVersions.Count -lt 2) { throw ''Source revisions are missing.'' }

        [pscustomobject]@{ policyId = $policyId; lifecycleRules = @($lifecycle.policy.rules).Count; sourceVersions = $sourceVersions.Count;
        destinationCopiesObserved = $destinationCopies.Count; replicationIsAsynchronous = $true }

        '
      expectedState: Both policy copies match, the lifecycle rule and source versions exist, and destination-copy count is
        reported as an observation rather than a synchronous pass gate.
      representativeOutput: policyCopies=2; lifecycleRules=1; sourceVersions>=2; destinationCopiesObserved=0..n; replicationIsAsynchronous=True
      positiveCommand: "$policyId = [string]$state.inputs['object-replication-policy-id']\nforeach ($account in @($source,$destination))\
        \ {\n    $policy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $account --policy-id\
        \ $policyId --output json | ConvertFrom-Json\n    if ($policy.policyId -ne $policyId -or @($policy.rules).Count -ne\
        \ 1) { throw \"Incomplete replication policy on $account\" }\n}\n'Two matching object-replication policy copies are\
        \ active.'\n"
      positiveExpected: Source and destination each expose one rule under the recorded policy ID.
      negativeCommand: '$unownedAccounts = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object { $_.name -in @($source,$destination) -and ($_.tags.labId -ne ''08'' -or $_.tags.runId -ne $RunId)
        })

        if ($unownedAccounts.Count -ne 0) { throw ''A replication endpoint failed ownership validation.'' }

        if (-not $state.inputs[''object-replication-policy-id'']) { throw ''Replication policy ID was not persisted.'' }

        ''Unowned endpoints=0; policy cleanup target recorded=True''

        '
      negativeExpected: Neither endpoint has conflicting ownership and the exact policy cleanup target is recorded.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Learners treat an empty destination immediately after upload as policy failure, or lose the policy ID
        needed for ordered cleanup.
      safeRetry: Requery both policy copies and source versions first; wait for replication separately and never create a
        second policy just to force convergence.
      cleanupDependency: Delete the source policy copy first, then the destination copy, containers, role assignments, accounts,
        and resource group.
    breakFix:
      injection: Disable versioning on one account before creating replication.
      symptom: The replication policy cannot be established.
      diagnosis: Inspect versioning and change-feed properties on both endpoints.
      repair: Restore the prerequisite, then recreate or reconcile the policy.
    challenge: Design a retention plan combining hot/cool tiers, version deletion, soft delete, and cross-account replication.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Azure Blob Storage lifecycle management overview
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
    - title: Azure Blob Storage versioning overview
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
    - title: Soft delete for Azure blobs
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview
    - title: Configure object replication for block blobs with Azure CLI
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-configure-cli
    - title: Authorize AzCopy with Azure CLI credentials
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-authorize-azure-active-directory
  09-azure-files-identity:
    role: A file-services administrator publishing a recoverable team share.
    outcome: Publish a bounded SMB share, protect real content with a snapshot and soft delete, and optionally configure a
      gated Microsoft Entra Kerberos and share-RBAC path.
    primer: Azure Files data protection combines share snapshots with share soft delete. Identity-based SMB access additionally
      requires exactly one directory source, share-level RBAC, client Kerberos prerequisites, and file/directory ACLs; an
      Azure CLI control-plane success alone does not prove that a client can mount the share.
    designDecisions:
    - Use a bounded quota and transaction-optimized tier.
    - Take a snapshot only after sample content exists.
    - Gate Microsoft Entra Kerberos because enabling it creates tenant-integrated state and still requires approved consent,
      Conditional Access, and client configuration outside this lab.
    - Use an account key only in memory for the bootstrap file operation because Azure Files identity authorization is an
      SMB path, not an Azure CLI file-data OAuth demonstration.
    architectureWalkthrough: Azure Resource Manager creates the storage account, file share, snapshot, protection settings,
      and optional share-level RBAC. The bootstrap data path writes one sample file with a key held only in memory. In the
      gated lane, a compatible client obtains an Entra Kerberos ticket and reaches the SMB endpoint, where share RBAC and
      file ACLs form separate authorization layers.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    preflightContext: '$storage = "st09$suffix"

      $requestedIdentitySource = [Environment]::GetEnvironmentVariable(''AZ104_FILES_IDENTITY_SOURCE'')

      $requestedPrincipalId = [Environment]::GetEnvironmentVariable(''AZ104_FILES_PRINCIPAL_OBJECT_ID'')

      '
    preflightChecks:
    - id: preflight.authored.lab09.storage-name
      type: service
      required: true
      description: Confirm the deterministic storage-account name is globally available before mutation.
      command: '$availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        '
      expected: The deterministic storage-account name is available.
    - id: preflight.authored.lab09.identity-gate
      type: permission
      required: false
      description: When the optional identity lane is requested, validate its exact source and resolve the approved principal
        read-only.
      command: "if ($requestedIdentitySource -or $requestedPrincipalId) {\n    if ($requestedIdentitySource -cne 'entra-kerberos')\
        \ { throw 'AZ104_FILES_IDENTITY_SOURCE must be exactly entra-kerberos.' }\n    if ([string]::IsNullOrWhiteSpace($requestedPrincipalId))\
        \ { throw 'AZ104_FILES_PRINCIPAL_OBJECT_ID is required with the identity source.' }\n    $principal = az rest --method\
        \ GET --url \"https://graph.microsoft.com/v1.0/directoryObjects/$requestedPrincipalId?`$select=id\" --output json\
        \ | ConvertFrom-Json\n    if ($principal.id -ne $requestedPrincipalId) { throw 'The approved Azure Files principal\
        \ did not resolve.' }\n}\n"
      expected: The optional lane is absent, or exactly entra-kerberos and a resolvable disposable principal are supplied.
    validationContext: '$storage = "st09$suffix"

      $share = ''teamfiles''

      $identityPrincipalId = [string]$state.inputs[''files-principal-object-id'']

      '
    cleanupContext: '$storage = "st09$suffix"

      '
    preCleanupCommand: "$accountJson = az storage account show --resource-group $ResourceGroupName --name $storage --output\
      \ json 2>$null\nif ($LASTEXITCODE -eq 0 -and $accountJson) {\n    $accountState = $accountJson | ConvertFrom-Json\n\
      \    if ($accountState.tags.labId -ne '09' -or $accountState.tags.runId -ne $RunId) {\n        throw 'Cleanup stopped\
      \ because the Azure Files account ownership tags do not match.'\n    }\n    if ($accountState.azureFilesIdentityBasedAuthentication.directoryServiceOptions\
      \ -eq 'AADKERB') {\n        az storage account update --resource-group $ResourceGroupName --name $storage --enable-files-aadkerb\
      \ false --output none\n        $remainingSource = az storage account show --resource-group $ResourceGroupName --name\
      \ $storage --query azureFilesIdentityBasedAuthentication.directoryServiceOptions --output tsv\n        if ($remainingSource\
      \ -eq 'AADKERB') { throw 'Cleanup stopped because Entra Kerberos was not disabled.' }\n    }\n}\n"
    tasks:
    - id: LAB09-CP01
      title: Baseline name, provider, and optional identity prerequisites
      purpose: Confirm global name availability and inventory the optional directory-source request before any storage mutation.
      operationalRelevance: Name collisions and incomplete tenant prerequisites should fail before a billable endpoint or
        tenant-integrated service principal is created.
      objectiveIds:
      - ST-ACCESS-05
      command: '$storage = "st09$suffix"

        $share = ''teamfiles''

        $availability = az storage account check-name --name $storage --output json | ConvertFrom-Json

        if (-not $availability.nameAvailable) { throw "Storage name unavailable: $($availability.reason)" }

        $requestedIdentitySource = [Environment]::GetEnvironmentVariable(''AZ104_FILES_IDENTITY_SOURCE'')

        if ($requestedIdentitySource -and $requestedIdentitySource -cne ''entra-kerberos'') { throw ''Only the documented
        entra-kerberos optional lane is supported.'' }

        '
      expectedState: The deterministic account name is available and any requested identity source exactly selects the documented
        gated path.
      representativeOutput: storageNameAvailable=True; identityLane=not-requested|entra-kerberos
      positiveCommand: '$account = az storage account show --resource-group $ResourceGroupName --name $storage --output json
        | ConvertFrom-Json

        if ($account.tags.labId -ne ''09'' -or $account.tags.runId -ne $RunId) { throw ''Storage-account ownership tags mismatch.''
        }

        $account | Select-Object id,name,tags

        '
      positiveExpected: During deployment validation, the deterministic account resolves with exact lab and run ownership
        tags.
      negativeCommand: '$duplicates = @(az storage account list --resource-group $ResourceGroupName --output json | ConvertFrom-Json
        | Where-Object name -eq $storage)

        if ($duplicates.Count -ne 1) { throw "Expected exactly one deterministic storage account; found $($duplicates.Count)."
        }

        ''Deterministic storage accounts in run scope: 1''

        '
      negativeExpected: No duplicate or conflicting endpoint exists in the run resource group.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The account name was used by a prior run or a learner supplies an unsupported identity-source label.
      safeRetry: Choose a new run ID for a collision; use exactly entra-kerberos only after the documented tenant prerequisites
        are approved.
      cleanupDependency: This read-only checkpoint creates nothing.
    - id: LAB09-CP02
      title: Create a bounded SMB share and enable share soft delete
      purpose: Create and immediately record the storage account and ARM file-share IDs, then enable seven-day share recovery.
      operationalRelevance: A recoverable ownership trail must exist before a later file, snapshot, or identity operation
        can fail.
      objectiveIds:
      - ST-ACCOUNTS-05
      command: '$created = az storage account create --resource-group $ResourceGroupName --name $storage --location $Location
        --sku Standard_LRS --kind StorageV2 --https-only true --min-tls-version TLS1_2 --allow-blob-public-access false --allow-shared-key-access
        true --tags purpose=az104-lab labId=09 runId=$RunId --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB09-CP02'' -Kind ''azure-resource'' -Id ([string]$created.id) -Name $storage -Type
        ''Microsoft.Storage/storageAccounts'' -Scope "/subscriptions/$SubscriptionId/resourceGroups/$ResourceGroupName" -OwnershipMethod
        ''manifest-id-and-tags''

        az storage account file-service-properties update --resource-group $ResourceGroupName --account-name $storage --enable-delete-retention
        true --delete-retention-days 7 --output none

        $createdShare = az storage share-rm create --resource-group $ResourceGroupName --storage-account $storage --name $share
        --quota 20 --access-tier TransactionOptimized --enabled-protocols SMB --metadata labId=09 runId=$RunId --output json
        | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB09-CP02'' -Kind ''azure-resource'' -Id ([string]$createdShare.id) -Name $share
        -Type ''Microsoft.Storage/storageAccounts/fileServices/shares'' -Scope ([string]$created.id) -OwnershipMethod ''manifest-id''

        '
      expectedState: A tagged Standard_LRS account contains one 20-GiB transaction-optimized SMB share and seven-day share
        soft delete is enabled.
      representativeOutput: account=st09<suffix>; share=teamfiles; quotaGiB=20; tier=TransactionOptimized; softDeleteDays=7
      positiveCommand: '$shareState = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage
        --name $share --output json | ConvertFrom-Json

        $fileService = az storage account file-service-properties show --resource-group $ResourceGroupName --account-name
        $storage --output json | ConvertFrom-Json

        if ($shareState.shareQuota -ne 20 -or $shareState.accessTier -ne ''TransactionOptimized'') { throw ''Share quota or
        access tier mismatch.'' }

        if (-not $fileService.shareDeleteRetentionPolicy.enabled -or $fileService.shareDeleteRetentionPolicy.days -ne 7) {
        throw ''Share soft-delete settings mismatch.'' }

        [pscustomobject]@{ shareId = $shareState.id; quotaGiB = $shareState.shareQuota; tier = $shareState.accessTier; softDeleteDays
        = $fileService.shareDeleteRetentionPolicy.days }

        '
      positiveExpected: The share reports the bounded quota and tier while file-service properties report seven-day retention.
      negativeCommand: '$account = az storage account show --resource-group $ResourceGroupName --name $storage --output json
        | ConvertFrom-Json

        if (-not $account.enableHttpsTrafficOnly -or $account.minimumTlsVersion -ne ''TLS1_2'' -or $account.allowBlobPublicAccess)
        { throw ''Storage transport or public-access baseline mismatch.'' }

        ''HTTPS-only=True; minimumTLS=TLS1_2; blobPublicAccess=False''

        '
      negativeExpected: No insecure transport or public blob access conflicts with the file-service baseline.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Share creation is attempted before the account converges or a retry changes quota without reconciling
        the recorded ID.
      safeRetry: Query the account and share by exact names, preserve any returned IDs, then repeat only the missing idempotent
        property update.
      cleanupDependency: Remove the optional identity role, restored share and snapshots before deleting the account and resource
        group.
    - id: LAB09-CP03
      title: Write sample content and capture a share snapshot
      purpose: Bootstrap one real file using a key held only in memory, then persist the returned snapshot time immediately.
      operationalRelevance: A snapshot taken before content exists proves little, while persisting a key would create a credential
        incident.
      objectiveIds:
      - ST-DATA-01
      command: "$sample = Join-Path $StateDir 'sample.txt'\n'AZ-104 Azure Files protected sample' | Set-Content -LiteralPath\
        \ $sample -Encoding utf8\n$accountKey = az storage account keys list --resource-group $ResourceGroupName --account-name\
        \ $storage --query '[0].value' --output tsv\nif (-not $accountKey) { throw 'A temporary bootstrap key could not be\
        \ obtained.' }\ntry {\n    az storage file upload --account-name $storage --share-name $share --source $sample --path\
        \ sample.txt --account-key $accountKey --output none\n} finally {\n    $accountKey = $null\n    Remove-Variable accountKey\
        \ -ErrorAction SilentlyContinue\n}\n$snapshot = az storage share-rm snapshot --resource-group $ResourceGroupName --storage-account\
        \ $storage --name $share --output json | ConvertFrom-Json\nif ([string]::IsNullOrWhiteSpace([string]$snapshot.snapshotTime))\
        \ { throw 'Snapshot creation returned no snapshot time.' }\n$state.inputs['share-snapshot-time'] = [string]$snapshot.snapshotTime\n\
        Save-RunState\n"
      expectedState: The active share contains sample.txt and an ARM-visible snapshot time is recorded without an account
        key in state.
      representativeOutput: file=sample.txt; snapshotTime=<redacted>; persistedAccountKeys=0
      positiveCommand: "$validationKey = az storage account keys list --resource-group $ResourceGroupName --account-name $storage\
        \ --query '[0].value' --output tsv\ntry {\n    $fileExists = az storage file exists --account-name $storage --share-name\
        \ $share --path sample.txt --account-key $validationKey --output json | ConvertFrom-Json\n    if (-not $fileExists.exists)\
        \ { throw 'The protected sample file is missing.' }\n} finally {\n    $validationKey = $null\n    Remove-Variable\
        \ validationKey -ErrorAction SilentlyContinue\n}\n$snapshots = @(az storage share-rm list --resource-group $ResourceGroupName\
        \ --storage-account $storage --include-snapshot true --output json | ConvertFrom-Json | Where-Object snapshotTime\
        \ -eq $state.inputs['share-snapshot-time'])\nif ($snapshots.Count -ne 1) { throw 'The recorded snapshot is missing.'\
        \ }\n[pscustomobject]@{ fileExists = $true; recordedSnapshotCount = $snapshots.Count }\n"
      positiveExpected: The live file exists and exactly one snapshot matches the recorded snapshot time.
      negativeCommand: |
        $shareId = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage --name $share --query id --output tsv
        if (-not $shareId -or -not $state.inputs['share-snapshot-time']) {
          throw 'The live share or recorded snapshot recovery target is missing.'
        }
        if (Select-String -Path (Join-Path $StateDir '*.json') -Pattern 'accountKey|connectionString|sasToken' -ErrorAction SilentlyContinue) {
          throw 'A storage credential was persisted.'
        }
        'Live share=1; persisted storage credentials=0; snapshot recovery target recorded=True'
      negativeExpected: No account key, connection string, or SAS is persisted, while the non-secret snapshot time is retained.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The sample upload uses an unsupported OAuth assumption for Azure Files, or the snapshot is taken before
        data exists.
      safeRetry: Keep the bootstrap key only in the current variable, verify the active file, and create a new snapshot only
        when the prior snapshot has no recorded time.
      cleanupDependency: Delete snapshots with the share during cleanup; never persist or attempt to purge an account key.
    - id: LAB09-CP04
      title: Configure the gated Entra Kerberos and share-RBAC path
      purpose: With exact authorization inputs, enable the single supported identity source, inject a missing-role fault,
        and restore the least-privileged share data role.
      operationalRelevance: Kerberos authentication and Azure RBAC authorization are distinct; a valid ticket is still denied
        when the share-level data role is absent.
      objectiveIds:
      - ST-DATA-05
      required: false
      gateEnvironmentVariables:
      - AZ104_FILES_PRINCIPAL_OBJECT_ID
      gateEnvironmentValues:
        AZ104_FILES_IDENTITY_SOURCE: entra-kerberos
      command: '$requestedSource = [Environment]::GetEnvironmentVariable(''AZ104_FILES_IDENTITY_SOURCE'')

        if ($requestedSource -cne ''entra-kerberos'') { throw ''Identity mutation requires AZ104_FILES_IDENTITY_SOURCE exactly
        entra-kerberos.'' }

        $identityPrincipalId = [Environment]::GetEnvironmentVariable(''AZ104_FILES_PRINCIPAL_OBJECT_ID'')

        $principal = az rest --method GET --url "https://graph.microsoft.com/v1.0/directoryObjects/$identityPrincipalId?`$select=id,@odata.type"
        --output json | ConvertFrom-Json

        if ($principal.id -ne $identityPrincipalId) { throw ''The approved identity principal did not resolve.'' }

        $principalType = switch ([string]$principal.''@odata.type'') { ''#microsoft.graph.user'' { ''User'' } ''#microsoft.graph.group''
        { ''Group'' } ''#microsoft.graph.servicePrincipal'' { ''ServicePrincipal'' } default { throw ''Unsupported principal
        type for share RBAC.'' } }

        $state.inputs[''files-principal-object-id''] = $identityPrincipalId

        $state.inputs[''files-identity-source''] = $requestedSource

        Save-RunState

        $updatedAccount = az storage account update --name $storage --resource-group $ResourceGroupName --enable-files-aadkerb
        true --output json | ConvertFrom-Json

        if ($updatedAccount.azureFilesIdentityBasedAuthentication.directoryServiceOptions -ne ''AADKERB'') { throw ''Entra
        Kerberos did not become the active identity source.'' }

        $shareId = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage --name $share --query
        id --output tsv

        $injected = az role assignment create --assignee-object-id $identityPrincipalId --assignee-principal-type $principalType
        --role ''Storage File Data SMB Share Contributor'' --scope $shareId --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB09-CP04'' -Kind ''azure-resource'' -Id ([string]$injected.id) -Name ''injected-file-share-contributor''
        -Type ''Microsoft.Authorization/roleAssignments'' -Scope $shareId -OwnershipMethod ''manifest-id''

        az role assignment delete --ids $injected.id

        $injectedRecord = @($state.managedObjects | Where-Object id -eq $injected.id)[0]

        $injectedRecord.lifecycleStatus = ''deleted''

        Save-RunState

        $missing = @(az role assignment list --assignee-object-id $identityPrincipalId --scope $shareId --output json | ConvertFrom-Json
        | Where-Object roleDefinitionName -eq ''Storage File Data SMB Share Contributor'')

        if ($missing.Count -ne 0) { throw ''The missing-role fault was not established.'' }

        $repaired = az role assignment create --assignee-object-id $identityPrincipalId --assignee-principal-type $principalType
        --role ''Storage File Data SMB Share Contributor'' --scope $shareId --output json | ConvertFrom-Json

        Add-ManagedObject -CheckpointId ''LAB09-CP04'' -Kind ''azure-resource'' -Id ([string]$repaired.id) -Name ''file-share-contributor''
        -Type ''Microsoft.Authorization/roleAssignments'' -Scope $shareId -OwnershipMethod ''manifest-id''

        '
      expectedState: AADKERB is the only identity source and the approved principal has exactly the intended share-scoped
        SMB data role after the missing-role fault is repaired.
      representativeOutput: identitySource=AADKERB; injectedRoleRemoved=True; repairedRoleCount=1; clientMountVerification=external-prerequisite
      positiveCommand: '$identity = az storage account show --resource-group $ResourceGroupName --name $storage --query azureFilesIdentityBasedAuthentication
        --output json | ConvertFrom-Json

        if ($identity.directoryServiceOptions -ne ''AADKERB'') { throw ''AADKERB is not the configured identity source.''
        }

        $shareId = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage --name $share --query
        id --output tsv

        $roles = @(az role assignment list --assignee-object-id $identityPrincipalId --scope $shareId --output json | ConvertFrom-Json
        | Where-Object roleDefinitionName -eq ''Storage File Data SMB Share Contributor'')

        if ($roles.Count -ne 1) { throw "Expected one repaired share role; found $($roles.Count)." }

        [pscustomobject]@{ identitySource = $identity.directoryServiceOptions; shareRoleCount = $roles.Count }

        '
      positiveExpected: The account reports AADKERB and the approved principal has exactly one share-scoped SMB Share Contributor
        assignment.
      negativeCommand: '$shareId = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage
        --name $share --query id --output tsv

        $excess = @(az role assignment list --assignee-object-id $identityPrincipalId --scope $shareId --output json | ConvertFrom-Json
        | Where-Object { $_.roleDefinitionName -in @(''Owner'',''Contributor'',''Storage File Data SMB Share Elevated Contributor'')
        })

        if ($excess.Count -ne 0) { throw ''An excessive direct role remains at share scope.'' }

        ''Excessive direct share roles: 0''

        '
      negativeExpected: Owner, Contributor, and elevated SMB ACL-management roles are absent at the exact share scope.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: The storage flag is mistaken for completed client access; missing tenant consent, Conditional Access
        exclusion, client ticket policy, or ACLs still blocks SMB.
      safeRetry: Inspect the identity source and exact share assignment first; complete the named external prerequisites rather
        than granting a broader Azure role.
      cleanupDependency: Delete the recorded role assignment and disable Entra Kerberos before deleting the share, account,
        and resource group.
    - id: LAB09-CP05
      title: Delete and restore the protected share, then reconcile readiness
      purpose: Exercise share soft delete against the real sample, persist the deleted-version recovery target, restore it,
        and prove content survived.
      operationalRelevance: A retention setting is only operationally useful when administrators can identify and restore
        the exact deleted generation.
      objectiveIds:
      - ST-ACCESS-05
      - ST-ACCOUNTS-05
      - ST-DATA-01
      - ST-DATA-05
      command: 'az storage share-rm delete --resource-group $ResourceGroupName --storage-account $storage --name $share --include
        snapshots --yes

        $deleted = @(az storage share-rm list --resource-group $ResourceGroupName --storage-account $storage --include-deleted
        true --output json | ConvertFrom-Json | Where-Object { $_.name -eq $share -and $_.deleted })

        if ($deleted.Count -ne 1 -or [string]::IsNullOrWhiteSpace([string]$deleted[0].deletedVersion)) { throw ''Expected
        one recoverable deleted share generation.'' }

        $state.inputs[''deleted-share-version''] = [string]$deleted[0].deletedVersion

        Save-RunState

        $restored = az storage share-rm restore --resource-group $ResourceGroupName --storage-account $storage --name $share
        --deleted-version $state.inputs[''deleted-share-version''] --output json | ConvertFrom-Json

        if (-not $restored.id) { throw ''Share restore returned no resource ID.'' }

        '
      expectedState: The original share generation is soft-deleted, identified by deletedVersion, restored under the same
        name, and its sample content remains readable.
      representativeOutput: softDeletedGenerations=1; deletedVersion=<redacted>; restored=True; sampleExists=True
      positiveCommand: "$restoredShare = az storage share-rm show --resource-group $ResourceGroupName --storage-account $storage\
        \ --name $share --output json | ConvertFrom-Json\nif (-not $restoredShare.id -or $restoredShare.shareQuota -ne 20)\
        \ { throw 'Restored share state is incomplete.' }\n$validationKey = az storage account keys list --resource-group\
        \ $ResourceGroupName --account-name $storage --query '[0].value' --output tsv\ntry {\n    $fileExists = az storage\
        \ file exists --account-name $storage --share-name $share --path sample.txt --account-key $validationKey --output\
        \ json | ConvertFrom-Json\n    if (-not $fileExists.exists) { throw 'Sample content did not survive share restore.'\
        \ }\n} finally {\n    $validationKey = $null\n    Remove-Variable validationKey -ErrorAction SilentlyContinue\n}\n\
        [pscustomobject]@{ restoredShareId = $restoredShare.id; sampleExists = $true }\n"
      positiveExpected: The restored active share has its original quota and still contains sample.txt.
      negativeCommand: '$deleted = @(az storage share-rm list --resource-group $ResourceGroupName --storage-account $storage
        --include-deleted true --output json | ConvertFrom-Json | Where-Object { $_.name -eq $share -and $_.deleted })

        if ($deleted.Count -ne 0) { throw ''A deleted generation remains after the restore exercise.'' }

        if (-not $state.inputs[''deleted-share-version'']) { throw ''The recovery target was not persisted.'' }

        ''Unrestored deleted generations=0; recovery target recorded=True''

        '
      negativeExpected: No unrestored soft-deleted generation remains and the non-secret deletedVersion evidence is recorded.
      evidence:
      - checkpoint ID and UTC time
      - redacted object/resource ID
      - queried expected property
      - negative-check result
      commonFailure: Cleanup-style deletion is confused with an irreversible purge, or restore is attempted without the exact
        deletedVersion.
      safeRetry: List deleted shares read-only, match the run-owned name, and restore only the recorded generation; never
        purge a recovery item automatically.
      cleanupDependency: Final cleanup may delete the restored share with snapshots, but it must list the expected soft-deleted
        retention item in cleanup.json rather than purge it.
    breakFix:
      injection: Remove the exact share-scoped SMB data role after enabling the optional Entra Kerberos identity source.
      symptom: A compatible client may obtain a Kerberos ticket but is denied at share authorization.
      diagnosis: Separate the account identity-source query from the principal's direct RBAC assignments at the exact share
        ID.
      repair: Recreate only Storage File Data SMB Share Contributor for the approved principal and retain the returned assignment
        ID.
    challenge: Write a migration checklist covering identity source, ACL translation, AzCopy, snapshots, and rollback.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: Create an Azure file share with Azure CLI
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-create-file-share
    - title: Use Azure Files share snapshots
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
    - title: Enable soft delete for Azure file shares
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
    - title: Microsoft Entra Kerberos authentication for Azure Files
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-auth-hybrid-identities-enable
    - title: Assign share-level permissions to an identity
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-identity-assign-share-level-permissions
  10-arm-bicep-lifecycle:
    role: An infrastructure administrator reviewing and deploying Bicep safely.
    outcome: Use Azure CLI in PowerShell to build and lint the versioned bicep template, preview and deploy the arm change
      set, and reconcile deployment output, tags, and ownership state, with recoverable state and deterministic cleanup.
    primer: Bicep is a declarative authoring language compiled to ARM JSON. Build checks syntax; what-if estimates control-plane
      changes; deployment operations provide the authoritative execution record; export and decompile are starting points
      that require review.
    designDecisions:
    - Build before contacting Azure.
    - Run what-if before deployment.
    - Keep generated and decompiled artifacts separate from the maintained source.
    architectureWalkthrough: Bicep source is built locally, previewed with ARM what-if, deployed into the tagged resource
      group, and then exported/decompiled for comparison; deployment outputs and the storage ID flow into manifest validation
      and cleanup.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB10-CP01
      title: Prove Bicep tooling and deployment-scope readiness
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for prove bicep tooling and
        deployment-scope readiness, without changing Azure state.
      operationalRelevance: 'The change is unsafe when an unsupported Bicep syntax or API version prevents the local build
        before Azure is contacted. This checkpoint therefore proves: az bicep can build the local template and the target
        resource group accepts subscription-scoped deployment queries without mutation.'
      objectiveIds:
      - CP-IAC-01
      command: 'az provider show --namespace Microsoft.Resources --query registrationState --output tsv

        az provider show --namespace Microsoft.Storage --query registrationState --output tsv

        az bicep version'
      expectedState: az bicep can build the local template and the target resource group accepts subscription-scoped deployment
        queries without mutation.
      representativeOutput: az bicep can build the local template and the target resource group accepts subscription-scoped
        deployment queries without mutation.
      positiveCommand: '$registration = az provider show --namespace Microsoft.Resources --query registrationState --output
        tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Resources is not registered.'' }'
      positiveExpected: az bicep can build the local template and the target resource group accepts subscription-scoped deployment
        queries without mutation.
      negativeCommand: '$registration = az provider show --namespace Microsoft.Storage --query registrationState --output
        tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Storage is not registered.'' }'
      negativeExpected: 'LAB10-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Microsoft.Storage is not registered.'
      evidence:
      - LAB10-CP01 UTC result for prove bicep tooling and deployment-scope readiness.
      - Exact run-owned resource/object ID returned by the commands in LAB10-CP01.
      - 'Positive assertion proving: az bicep can build the local template and the target resource group accepts subscription-scoped
        deployment queries without mutation.'
      - 'Negative assertion proving absence of: Microsoft.Storage is not registered.'
      commonFailure: An unsupported Bicep syntax or API version prevents the local build before Azure is contacted.
      safeRetry: Retry LAB10-CP01 for prove bicep tooling and deployment-scope readiness only after its exact recorded ID
        and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB10-CP02, LAB10-CP03, LAB10-CP04, LAB10-CP05, remove the exact manifest IDs created or configured
        by LAB10-CP01 for prove bicep tooling and deployment-scope readiness; its residual probe must then return zero active
        IDs.
    - id: LAB10-CP02
      title: Build and lint the versioned Bicep template
      purpose: Provision and immediately inventory the exact run-owned resources needed to build and lint the versioned bicep
        template, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a parameter/type mismatch can compile differently than intended or
        leave the compiled JSON stale. This checkpoint therefore proves: The compiled ARM JSON contains the tagged storage
        account and the source template remains the authoritative artifact.'
      objectiveIds:
      - CP-IAC-02
      command: '$storage = "st10$suffix"

        az bicep build --file "$LabRoot/artifacts/main.bicep" --outfile "$StateDir/main.json"

        az deployment group what-if --resource-group $ResourceGroupName --template-file "$LabRoot/artifacts/main.bicep" --parameters
        storageName=$storage --result-format ResourceIdOnly --no-pretty-print | Set-Content -LiteralPath "$StateDir/what-if.txt"

        az deployment group create --name "deploy-$RunId" --resource-group $ResourceGroupName --template-file "$LabRoot/artifacts/main.bicep"
        --parameters storageName=$storage --output none

        az group export --name $ResourceGroupName --output json | Set-Content -LiteralPath "$StateDir/exported-template.json"

        az bicep decompile --file "$StateDir/exported-template.json" --force'
      expectedState: The compiled ARM JSON contains the tagged storage account and the source template remains the authoritative
        artifact.
      representativeOutput: The compiled ARM JSON contains the tagged storage account and the source template remains the
        authoritative artifact.
      positiveCommand: '$provisioning = az deployment group show --resource-group $ResourceGroupName --name "deploy-$RunId"
        --query properties.provisioningState --output tsv

        if ($provisioning -ne ''Succeeded'') { throw "Deployment state is $provisioning." }'
      positiveExpected: The compiled ARM JSON contains the tagged storage account and the source template remains the authoritative
        artifact.
      negativeCommand: '$failedOperations = az deployment operation group list --resource-group $ResourceGroupName --name
        "deploy-$RunId" --query "[?properties.provisioningState==''Failed''] | length(@)" --output tsv

        if ([int]$failedOperations -ne 0) { throw ''The deployment contains failed operations.'' }'
      negativeExpected: 'LAB10-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        The deployment contains failed operations.'
      evidence:
      - LAB10-CP02 UTC result for build and lint the versioned bicep template.
      - Exact run-owned resource/object ID returned by the commands in LAB10-CP02.
      - 'Positive assertion proving: The compiled ARM JSON contains the tagged storage account and the source template remains
        the authoritative artifact.'
      - 'Negative assertion proving absence of: The deployment contains failed operations.'
      commonFailure: A parameter/type mismatch can compile differently than intended or leave the compiled JSON stale.
      safeRetry: Retry LAB10-CP02 for build and lint the versioned bicep template only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB10-CP03, LAB10-CP04, LAB10-CP05, remove the exact manifest IDs created or configured by
        LAB10-CP02 for build and lint the versioned bicep template; its residual probe must then return zero active IDs.
    - id: LAB10-CP03
      title: Preview and deploy the ARM change set
      purpose: Configure and independently inspect the control-plane and data-path properties needed to preview and deploy
        the arm change set.
      operationalRelevance: 'The change is unsafe when a globally unique storage name collision or denied resource-group permission
        can fail deployment after a valid build. This checkpoint therefore proves: The what-if result is reviewed and the
        completed deployment returns the exact storage account ID recorded for this run.'
      objectiveIds:
      - CP-IAC-03
      command: 'az deployment operation group list --resource-group $ResourceGroupName --name "deploy-$RunId" --query "[].{resource:properties.targetResource.resourceName,state:properties.provisioningState}"
        --output table

        az bicep build --file "$StateDir/exported-template.bicep" --outfile "$StateDir/decompiled-template.json"'
      expectedState: The what-if result is reviewed and the completed deployment returns the exact storage account ID recorded
        for this run.
      representativeOutput: The what-if result is reviewed and the completed deployment returns the exact storage account
        ID recorded for this run.
      positiveCommand: '$storageState = az storage account show --resource-group $ResourceGroupName --name $storage --query
        provisioningState --output tsv

        if ($storageState -ne ''Succeeded'') { throw "Storage state is $storageState." }'
      positiveExpected: The what-if result is reviewed and the completed deployment returns the exact storage account ID recorded
        for this run.
      negativeCommand: '$publicAccess = az storage account show --resource-group $ResourceGroupName --name $storage --query
        allowBlobPublicAccess --output tsv

        if ($publicAccess -ne ''false'') { throw ''Blob public access is not disabled.'' }'
      negativeExpected: 'LAB10-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        Blob public access is not disabled.'
      evidence:
      - LAB10-CP03 UTC result for preview and deploy the arm change set.
      - Exact run-owned resource/object ID returned by the commands in LAB10-CP03.
      - 'Positive assertion proving: The what-if result is reviewed and the completed deployment returns the exact storage
        account ID recorded for this run.'
      - 'Negative assertion proving absence of: Blob public access is not disabled.'
      commonFailure: A globally unique storage name collision or denied resource-group permission can fail deployment after
        a valid build.
      safeRetry: Retry LAB10-CP03 for preview and deploy the arm change set only after its exact recorded ID and current property
        are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create command,
        then rerun both assertions.
      cleanupDependency: After LAB10-CP04, LAB10-CP05, remove the exact manifest IDs created or configured by LAB10-CP03 for
        preview and deploy the arm change set; its residual probe must then return zero active IDs.
    - id: LAB10-CP04
      title: Export and decompile the deployed template
      purpose: Exercise the deterministic operational or denied path needed to export and decompile the deployed template,
        then retain comparable before-and-after results.
      operationalRelevance: 'The change is unsafe when exported templates can contain defaults and generated names that do
        not round-trip cleanly through decompilation. This checkpoint therefore proves: The exported resource-group template
        and decompiled Bicep are local review artifacts; neither is silently treated as the original source.'
      objectiveIds:
      - CP-IAC-04
      command: az deployment group what-if --resource-group $ResourceGroupName --template-file "$LabRoot/artifacts/main.bicep"
        --parameters storageName=$storage --result-format ResourceIdOnly --no-pretty-print
      expectedState: The exported resource-group template and decompiled Bicep are local review artifacts; neither is silently
        treated as the original source.
      representativeOutput: The exported resource-group template and decompiled Bicep are local review artifacts; neither
        is silently treated as the original source.
      positiveCommand: '$tls = az storage account show --resource-group $ResourceGroupName --name $storage --query minimumTlsVersion
        --output tsv

        if ($tls -ne ''TLS1_2'') { throw "Minimum TLS is $tls." }'
      positiveExpected: The exported resource-group template and decompiled Bicep are local review artifacts; neither is silently
        treated as the original source.
      negativeCommand: '$unexpected = az resource list --resource-group $ResourceGroupName --query "[?type!=''Microsoft.Storage/storageAccounts'']
        | length(@)" --output tsv

        if ([int]$unexpected -ne 0) { throw ''Unexpected resource types exist in the deployment.'' }'
      negativeExpected: 'LAB10-CP04 negative boundary: The undesired state is absent; the negative assertion must not report:
        Unexpected resource types exist in the deployment.'
      evidence:
      - LAB10-CP04 UTC result for export and decompile the deployed template.
      - Exact run-owned resource/object ID returned by the commands in LAB10-CP04.
      - 'Positive assertion proving: The exported resource-group template and decompiled Bicep are local review artifacts;
        neither is silently treated as the original source.'
      - 'Negative assertion proving absence of: Unexpected resource types exist in the deployment.'
      commonFailure: Exported templates can contain defaults and generated names that do not round-trip cleanly through decompilation.
      safeRetry: Retry LAB10-CP04 for export and decompile the deployed template only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB10-CP05, remove the exact manifest IDs created or configured by LAB10-CP04 for export and
        decompile the deployed template; its residual probe must then return zero active IDs.
    - id: LAB10-CP05
      title: Reconcile deployment output, tags, and ownership state
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile deployment
        output, tags, and ownership state before handoff.
      operationalRelevance: 'The change is unsafe when a successful ARM deployment can still leave manifest evidence incomplete
        if its returned ID was not persisted. This checkpoint therefore proves: Deployment provisioningState is Succeeded,
        the storage ID matches run.json, and no unexpected resource exists in the run-owned group.'
      objectiveIds:
      - CP-IAC-01
      - CP-IAC-02
      - CP-IAC-03
      - CP-IAC-04
      - CP-IAC-05
      command: az resource list --resource-group $ResourceGroupName --query "[].{name:name,type:type,state:properties.provisioningState}"
        --output table
      expectedState: Deployment provisioningState is Succeeded, the storage ID matches run.json, and no unexpected resource
        exists in the run-owned group.
      representativeOutput: Deployment provisioningState is Succeeded, the storage ID matches run.json, and no unexpected
        resource exists in the run-owned group.
      positiveCommand: '$count = az resource list --resource-group $ResourceGroupName --query "[?type==''Microsoft.Storage/storageAccounts'']
        | length(@)" --output tsv

        if ([int]$count -ne 1) { throw "Expected one storage account; found $count." }'
      positiveExpected: Deployment provisioningState is Succeeded, the storage ID matches run.json, and no unexpected resource
        exists in the run-owned group.
      negativeCommand: '$insecure = az storage account list --resource-group $ResourceGroupName --query ''[?enableHttpsTrafficOnly!=`true`]
        | length(@)'' --output tsv

        if ([int]$insecure -ne 0) { throw ''A storage account permits non-HTTPS traffic.'' }'
      negativeExpected: 'LAB10-CP05 negative boundary: The undesired state is absent; the negative assertion must not report:
        A storage account permits non-HTTPS traffic.'
      evidence:
      - LAB10-CP05 UTC result for reconcile deployment output, tags, and ownership state.
      - Exact run-owned resource/object ID returned by the commands in LAB10-CP05.
      - 'Positive assertion proving: Deployment provisioningState is Succeeded, the storage ID matches run.json, and no unexpected
        resource exists in the run-owned group.'
      - 'Negative assertion proving absence of: A storage account permits non-HTTPS traffic.'
      commonFailure: A successful ARM deployment can still leave manifest evidence incomplete if its returned ID was not persisted.
      safeRetry: Retry LAB10-CP05 for reconcile deployment output, tags, and ownership state only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After all service validation and evidence capture, remove the exact manifest IDs created or configured
        by LAB10-CP05 for reconcile deployment output, tags, and ownership state; its residual probe must then return zero
        active IDs.
    breakFix:
      injection: Change a required parameter name in the deployment command.
      symptom: Validation reports an undeclared or missing parameter.
      diagnosis: Compare the Bicep param declarations with the command arguments.
      repair: Restore the exact parameter name and rerun build plus what-if.
      injectCommand: 'Copy-Item "$LabRoot/artifacts/main.bicep" "$StateDir/main.fault.bicep"

        Add-Content -LiteralPath "$StateDir/main.fault.bicep" -Value "resource broken ''Microsoft.Storage/storageAccounts@2023-05-01''
        = { name: '''' }"

        $PSNativeCommandUseErrorActionPreference = $false

        az bicep build --file "$StateDir/main.fault.bicep" --outfile "$StateDir/main.fault.json"

        $faultExitCode = $LASTEXITCODE

        $PSNativeCommandUseErrorActionPreference = $true'
      diagnoseCommand: az bicep build --file "$StateDir/main.fault.bicep" --outfile "$StateDir/main.fault.json" 2>&1 | Select-Object
        -First 10
      repairCommand: 'Copy-Item "$LabRoot/artifacts/main.bicep" "$StateDir/main.fault.bicep" -Force

        az bicep build --file "$StateDir/main.fault.bicep" --outfile "$StateDir/main.fault.json"'
      verifyCommand: Test-Path -LiteralPath "$StateDir/main.fault.json"
    challenge: Add an allowed-values parameter and an output, then prove what-if shows only the intended delta.
    sources:
    - title: Microsoft AZ-104 study guide
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104
    - title: What is Bicep?
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
    - title: Deploy Bicep files with Azure CLI
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-cli
    - title: Decompile ARM template JSON to Bicep
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/decompile
    validationContext: $storage = "st10$suffix"
    preflightChecks:
    - id: preflight.authored.service
      type: sku
      required: true
      description: Prove prove bicep tooling and deployment-scope readiness with LAB-10's authored read-only provider, feature,
        tool, region, and SKU queries.
      command: '$registration = az provider show --namespace Microsoft.Resources --query registrationState --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Resources is not registered.'' }

        $registration = az provider show --namespace Microsoft.Storage --query registrationState --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Storage is not registered.'' }'
      expected: az bicep can build the local template and the target resource group accepts subscription-scoped deployment
        queries without mutation.
    scenario: 'You are an infrastructure administrator reviewing and deploying bicep safely. Build and prove this disposable service path: Bicep source is built locally, previewed with ARM what-if, deployed
      into the tagged resource group, and then exported/decompiled for comparison; deployment outputs and the storage ID flow
      into manifest validation and cleanup.'
  11-vm-lifecycle-disks-encryption:
    role: A compute administrator maintaining a secured Linux VM.
    outcome: Use Azure CLI in PowerShell to create the private-nic vm with encryption at host, attach and verify the managed
      data disk, and reconcile vm size, disks, host encryption, and private exposure, with recoverable state and deterministic
      cleanup.
    primer: VM size changes can require deallocation; data disks have an independent lifecycle; encryption at host depends
      on subscription feature registration and VM-size support. Recording exact disk and VM IDs makes recovery from partial
      work deterministic.
    designDecisions:
    - Do not expose an inbound management port.
    - Verify host-encryption support before enabling it.
    - Detach and reattach by exact managed-disk ID.
    architectureWalkthrough: A private NIC connects the VM to its workload subnet; the VM security profile enables encryption
      at host, the managed data disk attaches at a declared LUN, and resize operations flow through deallocation before instance-view
      validation.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB11-CP01
      title: Verify VM SKU and encryption-at-host capability
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify vm sku and encryption-at-host
        capability, without changing Azure state.
      operationalRelevance: 'The change is unsafe when encryption at host is not exposed by every VM size, subscription, or
        region even when the size name appears. This checkpoint therefore proves: Standard_B1s is unrestricted in the selected
        region and its capability inventory explicitly supports EncryptionAtHost.'
      objectiveIds:
      - CP-VM-01
      command: 'az provider show --namespace Microsoft.Compute --query registrationState --output tsv

        az vm list-skus --location $Location --size Standard_B2s --all --query ''[?restrictions==null || length(restrictions)==`0`].name''
        --output tsv

        if (-not (Get-Command ssh-keygen -ErrorAction SilentlyContinue)) { throw ''ssh-keygen is required to create the disposable
        key in the run state directory.'' }'
      expectedState: Standard_B1s is unrestricted in the selected region and its capability inventory explicitly supports
        EncryptionAtHost.
      representativeOutput: Standard_B1s is unrestricted in the selected region and its capability inventory explicitly supports
        EncryptionAtHost.
      positiveCommand: '$registration = az provider show --namespace Microsoft.Compute --query registrationState --output
        tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Compute is not registered.'' }'
      positiveExpected: Standard_B1s is unrestricted in the selected region and its capability inventory explicitly supports
        EncryptionAtHost.
      negativeCommand: '$restrictions = az vm list-skus --location $Location --size Standard_B2s --all --query "[?name==''Standard_B2s''].restrictions[]
        | length(@)" --output tsv

        if ($restrictions -and [int]$restrictions -gt 0) { throw ''Standard_B2s is restricted in this region.'' }

