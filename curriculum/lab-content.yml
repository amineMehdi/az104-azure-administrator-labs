      - NW-DNSLB-02
      - NW-DNSLB-03
      - MR-MONITOR-06
      command: 'az network lb show --resource-group $ResourceGroupName --name $loadBalancer --query "{sku:sku.name,frontend:frontendIPConfigurations[0].name,backendPool:backendAddressPools[0].name,probe:probes[0].port,rule:loadBalancingRules[0].frontendPort}"
        --output json

        $sourceIp = az vm list-ip-addresses --resource-group $ResourceGroupName --name $vm1 --query "[0].virtualMachine.network.privateIpAddresses[0]"
        --output tsv

