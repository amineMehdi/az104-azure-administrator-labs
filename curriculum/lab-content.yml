  19-service-private-endpoints:
    role: A network administrator comparing Storage service and private endpoints.
    outcome: Use Azure CLI in PowerShell to create a locked-down storage service and endpoint subnet, create the blob private
      endpoint and dns zone group, and reconcile endpoint approval, dns records, and network policy, with recoverable state
      and deterministic cleanup.
    primer: A service endpoint authorizes a subnet to the public service endpoint. A private endpoint creates a NIC with a
      private IP. Private DNS must map the normal service name to that private IP for clients inside linked VNets.
    designDecisions:
    - Use separate subnets for comparison.
    - Default-deny the storage firewall before adding network authorization.
    - Use a DNS zone group to keep endpoint records synchronized.
    architectureWalkthrough: The storage account denies public access while a blob private endpoint receives an IP from the
      private subnet; its zone group writes records into the linked private DNS zone so VNet clients resolve the private service
      path.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB19-CP01
      title: Verify private-link and private-DNS regional support
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify private-link and
        private-dns regional support, without changing Azure state.
