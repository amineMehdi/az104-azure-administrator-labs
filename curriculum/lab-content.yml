  14-container-apps:
    role: A platform administrator releasing a revisioned serverless container app.
    outcome: Use Azure CLI in PowerShell to create the managed environment and ingress application, create a second revision
      without replacing the first, and reconcile ingress, scaling, revisions, and traffic, with recoverable state and deterministic
      cleanup.
    primer: A Container Apps environment supplies the boundary and observability integration. Revisions are immutable snapshots;
      traffic weights choose active revisions; replicas scale inside each active revision according to the configured rule.
    designDecisions:
    - Use multiple-revision mode for controlled traffic splitting.
    - Create a second revision through a deterministic environment change.
    - Bound minimum and maximum replicas.
    architectureWalkthrough: A Log Analytics workspace feeds the Container Apps environment; the app with external ingress
      creates two active revisions, and the ingress controller splits 90/10 traffic before revision and scaling validation.
    completionCriteria:
