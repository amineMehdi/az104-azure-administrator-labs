    - id: LAB12-CP02
      title: Place a VM in the run-owned availability set
      purpose: Provision and immediately inventory the exact run-owned resources needed to place a vm in the run-owned availability
        set, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when an availability set cannot be assigned after VM creation, so a missed
        placement requires recreating the disposable VM. This checkpoint therefore proves: The VM resource references the
        created availability set and its private NIC remains inside the source resource group.'
      objectiveIds:
      - CP-VM-04
      command: '$availabilitySet = "avset-$suffix"; $vnet = "vnet-$suffix"; $vmss = "vmss-$suffix"; $autoscale = "autoscale-$suffix"

        $availabilityVnet = "av-vnet-$suffix"; $availabilityNic = "av-nic-$suffix"; $availabilityVm = "av-vm-$suffix"; $moveResourceGroup
        = "rg-az104-l12-move-$RunId"

        $keyPath = Join-Path $StateDir ''id_ed25519''

        ssh-keygen -t ed25519 -N '''' -f $keyPath | Out-Null

        az vm availability-set create --resource-group $ResourceGroupName --name $availabilitySet --location $Location --platform-fault-domain-count
        2 --platform-update-domain-count 5 --output none

        az network vnet create --resource-group $ResourceGroupName --name $availabilityVnet --address-prefixes 10.12.16.0/20
        --subnet-name workload --subnet-prefixes 10.12.16.0/24 --output none

        az network nic create --resource-group $ResourceGroupName --name $availabilityNic --vnet-name $availabilityVnet --subnet
        workload --output none

        az vm create --resource-group $ResourceGroupName --name $availabilityVm --image Ubuntu2204 --size Standard_B1s --admin-username
        azureadmin --ssh-key-values "$keyPath.pub" --nics $availabilityNic --availability-set $availabilitySet --output none

        az network vnet create --resource-group $ResourceGroupName --name $vnet --address-prefixes 10.12.0.0/16 --subnet-name
        vmss --subnet-prefixes 10.12.1.0/24 --output none

        az vmss create --resource-group $ResourceGroupName --name $vmss --image Ubuntu2204 --vm-sku Standard_B1s --instance-count
        1 --upgrade-policy-mode Manual --admin-username azureadmin --ssh-key-values "$keyPath.pub" --vnet-name $vnet --subnet
        vmss --output none'
      expectedState: The VM resource references the created availability set and its private NIC remains inside the source
