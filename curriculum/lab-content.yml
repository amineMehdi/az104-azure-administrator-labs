    - id: LAB14-CP03
      title: Create a second revision without replacing the first
      purpose: Configure and independently inspect the control-plane and data-path properties needed to create a second revision
        without replacing the first.
      operationalRelevance: 'The change is unsafe when single-revision mode deactivates the old revision and defeats a controlled
        traffic-split exercise. This checkpoint therefore proves: Multiple-revision mode retains both revisions and the new
        image produces a separately addressable revision.'
      objectiveIds:
      - CP-CONTAINERS-03
      command: 'az containerapp revision set-mode --resource-group $ResourceGroupName --name $app --mode multiple

        az containerapp update --resource-group $ResourceGroupName --name $app --set-env-vars RELEASE=v2 --revision-suffix
        v2 --output none

        $revisions = @(az containerapp revision list --resource-group $ResourceGroupName --name $app --query "[?properties.active].name"
        --output tsv)

        if ($revisions.Count -lt 2) { throw ''Two active revisions are required for traffic splitting.'' }

        az containerapp ingress traffic set --resource-group $ResourceGroupName --name $app --revision-weight "$($revisions[0])=90"
        "$($revisions[-1])=10" --output none'
      expectedState: Multiple-revision mode retains both revisions and the new image produces a separately addressable revision.
      representativeOutput: Multiple-revision mode retains both revisions and the new image produces a separately addressable
        revision.
      positiveCommand: '$active = az containerapp revision list --resource-group $ResourceGroupName --name $app --query "[?properties.active]
        | length(@)" --output tsv

        if ([int]$active -lt 2) { throw "Only $active revision is active." }'
      positiveExpected: Multiple-revision mode retains both revisions and the new image produces a separately addressable
        revision.
      negativeCommand: '$mode = az containerapp show --resource-group $ResourceGroupName --name $app --query properties.configuration.activeRevisionsMode
        --output tsv

        if ($mode -ne ''Multiple'') { throw "Revision mode is $mode." }'
