    - id: LAB16-CP03
      title: Enforce HTTPS and integrate outbound traffic with the VNet
      purpose: Configure and independently inspect the control-plane and data-path properties needed to enforce https and
        integrate outbound traffic with the vnet.
      operationalRelevance: 'The change is unsafe when app Service integration rejects subnets that are too small, already
        delegated incompatibly, or in another region. This checkpoint therefore proves: httpsOnly is true, the minimum TLS
        version matches the target, and the app references the delegated integration subnet.'
