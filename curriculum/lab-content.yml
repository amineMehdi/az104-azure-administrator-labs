        that can be collected.
      representativeOutput: The workspace and diagnostic-setting APIs are available and the planned resource exposes a metric
        category that can be collected.
      positiveCommand: '$insights = az provider show --namespace Microsoft.Insights --query registrationState --output tsv

        if ($insights -ne ''Registered'') { throw ''Microsoft.Insights is not registered.'' }'
      positiveExpected: The workspace and diagnostic-setting APIs are available and the planned resource exposes a metric
        category that can be collected.
      negativeCommand: '$logs = az provider show --namespace Microsoft.OperationalInsights --query registrationState --output
        tsv

        if ($logs -ne ''Registered'') { throw ''Microsoft.OperationalInsights is not registered.'' }'
      negativeExpected: 'LAB22-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Microsoft.OperationalInsights is not registered.'
      evidence:
      - LAB22-CP01 UTC result for verify log analytics, diagnostic, and kql prerequisites.
      - Exact run-owned resource/object ID returned by the commands in LAB22-CP01.
      - 'Positive assertion proving: The workspace and diagnostic-setting APIs are available and the planned resource exposes
        a metric category that can be collected.'
      - 'Negative assertion proving absence of: Microsoft.OperationalInsights is not registered.'
      commonFailure: A diagnostic setting cannot select a category the target resource does not advertise.
      safeRetry: Retry LAB22-CP01 for verify log analytics, diagnostic, and kql prerequisites only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB22-CP02, LAB22-CP03, LAB22-CP04, LAB22-CP05, remove the exact manifest IDs created or configured
        by LAB22-CP01 for verify log analytics, diagnostic, and kql prerequisites; its residual probe must then return zero
        active IDs.
    - id: LAB22-CP02
      title: Create the monitored storage account and workspace
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the monitored storage account
        and workspace, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a workspace can provision successfully while its customer ID or resource
        ID is read from the wrong group. This checkpoint therefore proves: The storage account and Log Analytics workspace
        IDs are immediately recorded in the run manifest.'
      objectiveIds:
      - MR-MONITOR-02
      command: '$workspace = "law-$suffix"; $storage = "st22$suffix"

        az monitor log-analytics workspace create --resource-group $ResourceGroupName --workspace-name $workspace --location
        $Location --retention-time 30 --output none

        az storage account create --resource-group $ResourceGroupName --name $storage --location $Location --sku Standard_LRS
        --kind StorageV2 --https-only true --allow-blob-public-access false --output none

        $workspaceResourceId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name
        $workspace --query id --output tsv

        $workspaceId = az monitor log-analytics workspace show --resource-group $ResourceGroupName --workspace-name $workspace
        --query customerId --output tsv

        $storageId = az storage account show --resource-group $ResourceGroupName --name $storage --query id --output tsv

        $metricCategory = az monitor diagnostic-settings categories list --resource $storageId --query "value[?categoryType==''Metrics''].name
        | [0]" --output tsv

        $metrics = @(@{ category = $metricCategory; enabled = $true }) | ConvertTo-Json -Compress

        az monitor diagnostic-settings create --name "diag-$RunId" --resource $storageId --workspace $workspaceResourceId
        --metrics $metrics --output none'
      expectedState: The storage account and Log Analytics workspace IDs are immediately recorded in the run manifest.
      representativeOutput: The storage account and Log Analytics workspace IDs are immediately recorded in the run manifest.
      positiveCommand: '$destination = az monitor diagnostic-settings show --name "diag-$RunId" --resource $storageId --query
        workspaceId --output tsv

