        | length(@)" --output tsv

        if ([int]$zoneSku -lt 1) { throw ''The selected region does not advertise a zonal Standard_B1s placement.'' }'
      negativeExpected: 'LAB12-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        The selected region does not advertise a zonal Standard_B1s placement.'
      evidence:
