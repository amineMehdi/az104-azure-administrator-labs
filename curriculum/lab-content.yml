    - id: LAB12-CP04
      title: Move the standalone VM boundary to a second resource group
      purpose: Exercise the deterministic operational or denied path needed to move the standalone vm boundary to a second
        resource group, then retain comparable before-and-after results.
      operationalRelevance: 'The change is unsafe when a resource move is rejected when dependent resources are omitted or
        the destination provider state differs. This checkpoint therefore proves: The selected VM and dependent NIC/disk IDs
        resolve only in the tagged destination group recorded in run.json.'
      objectiveIds:
      - CP-VM-07
      command: '$external[''moveResourceGroupName''] = $moveResourceGroup

        az group create --subscription $SubscriptionId --name $moveResourceGroup --location $Location --tags purpose=az104-lab
        labId=12 runId=$RunId --output none

        az vm deallocate --resource-group $ResourceGroupName --name $availabilityVm --output none

        $availabilityVmId = az vm show --resource-group $ResourceGroupName --name $availabilityVm --query id --output tsv

        $availabilityNicId = az network nic show --resource-group $ResourceGroupName --name $availabilityNic --query id --output
        tsv

        $availabilityDiskId = az vm show --resource-group $ResourceGroupName --name $availabilityVm --query storageProfile.osDisk.managedDisk.id
        --output tsv

        $availabilitySetId = az vm availability-set show --resource-group $ResourceGroupName --name $availabilitySet --query
        id --output tsv

        $availabilityVnetId = az network vnet show --resource-group $ResourceGroupName --name $availabilityVnet --query id
        --output tsv

        az resource move --destination-group $moveResourceGroup --ids $availabilityVmId $availabilityNicId $availabilityDiskId
        $availabilitySetId $availabilityVnetId --output none

        az vm start --resource-group $moveResourceGroup --name $availabilityVm --output none

        az vmss get-instance-view --resource-group $ResourceGroupName --name $vmss --output json

        az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query "profiles[0].rules[].{direction:scaleAction.direction,threshold:metricTrigger.threshold}"
        --output table'
      expectedState: The selected VM and dependent NIC/disk IDs resolve only in the tagged destination group recorded in run.json.
      representativeOutput: The selected VM and dependent NIC/disk IDs resolve only in the tagged destination group recorded
        in run.json.
      positiveCommand: '$movedVm = az vm show --resource-group $moveResourceGroup --name $availabilityVm --query id --output
        tsv

        if ($movedVm -notmatch "/resourceGroups/$moveResourceGroup/") { throw ''The availability-set VM did not move to the
        recorded destination group.'' }'
      positiveExpected: The selected VM and dependent NIC/disk IDs resolve only in the tagged destination group recorded in
        run.json.
      negativeCommand: '$sourceVmCount = az vm list --resource-group $ResourceGroupName --query "[?name==''$availabilityVm'']
        | length(@)" --output tsv

        if ([int]$sourceVmCount -ne 0) { throw ''The moved VM remains in the source resource group.'' }'
      negativeExpected: 'LAB12-CP04 negative boundary: The undesired state is absent; the negative assertion must not report:
        The moved VM remains in the source resource group.'
      evidence:
      - LAB12-CP04 UTC result for move the standalone vm boundary to a second resource group.
      - Exact run-owned resource/object ID returned by the commands in LAB12-CP04.
      - 'Positive assertion proving: The selected VM and dependent NIC/disk IDs resolve only in the tagged destination group
        recorded in run.json.'
      - 'Negative assertion proving absence of: The moved VM remains in the source resource group.'
      commonFailure: A resource move is rejected when dependent resources are omitted or the destination provider state differs.
      safeRetry: Retry LAB12-CP04 for move the standalone vm boundary to a second resource group only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After LAB12-CP05, remove the exact manifest IDs created or configured by LAB12-CP04 for move the
        standalone vm boundary to a second resource group; its residual probe must then return zero active IDs.
    - id: LAB12-CP05
      title: Reconcile placement, scaling, and both ownership boundaries
      purpose: Reconcile live service properties, returned IDs, and dependency-aware removal needed to reconcile placement,
        scaling, and both ownership boundaries before handoff.
      operationalRelevance: 'The change is unsafe when checking only the original group after a move can hide active resources
        in the destination group. This checkpoint therefore proves: Availability-set membership, VMSS capacity/autoscale,
        and source/destination group inventories all match the manifest.'
      objectiveIds:
      - CP-VM-03
      - CP-VM-04
      - CP-VM-06
      - CP-VM-07
      command: az vmss show --resource-group $ResourceGroupName --name $vmss --query "{capacity:sku.capacity,upgrade:upgradePolicy.mode,provisioning:provisioningState}"
        --output json
      expectedState: Availability-set membership, VMSS capacity/autoscale, and source/destination group inventories all match
        the manifest.
      representativeOutput: Availability-set membership, VMSS capacity/autoscale, and source/destination group inventories
        all match the manifest.
      positiveCommand: '$stateValue = az vmss show --resource-group $ResourceGroupName --name $vmss --query provisioningState
        --output tsv

        if ($stateValue -ne ''Succeeded'') { throw "VMSS provisioning state is $stateValue." }

        $ruleCount = az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query "profiles[0].rules
        | length(@)" --output tsv

        if ([int]$ruleCount -ne 2) { throw "Expected two autoscale rules; found $ruleCount." }'
      positiveExpected: Availability-set membership, VMSS capacity/autoscale, and source/destination group inventories all
        match the manifest.
      negativeCommand: '$invalidRules = az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query
        ''profiles[0].rules[?scaleAction.value<=`0`] | length(@)'' --output tsv

        if ([int]$invalidRules -ne 0) { throw ''An autoscale rule has a nonpositive scale value.'' }'
      negativeExpected: 'LAB12-CP05 negative boundary: The undesired state is absent; the negative assertion must not report:
        An autoscale rule has a nonpositive scale value.'
      evidence:
      - LAB12-CP05 UTC result for reconcile placement, scaling, and both ownership boundaries.
      - Exact run-owned resource/object ID returned by the commands in LAB12-CP05.
      - 'Positive assertion proving: Availability-set membership, VMSS capacity/autoscale, and source/destination group inventories
        all match the manifest.'
      - 'Negative assertion proving absence of: An autoscale rule has a nonpositive scale value.'
      commonFailure: Checking only the original group after a move can hide active resources in the destination group.
      safeRetry: Retry LAB12-CP05 for reconcile placement, scaling, and both ownership boundaries only after its exact recorded
        ID and current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only
        the owning create command, then rerun both assertions.
      cleanupDependency: After all service validation and evidence capture, remove the exact manifest IDs created or configured
        by LAB12-CP05 for reconcile placement, scaling, and both ownership boundaries; its residual probe must then return
        zero active IDs.
    breakFix:
      injection: Delete the scale-out rule while leaving scale-in configured.
      symptom: The profile cannot increase capacity during sustained load.
      diagnosis: Inspect rule directions and confirm that both Increase and Decrease exist.
      repair: Recreate the missing scale-out rule with the original threshold and cooldown.
      injectCommand: az monitor autoscale rule delete --resource-group $ResourceGroupName --autoscale-name $autoscale --index
        0 --output none
      diagnoseCommand: az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query "profiles[0].rules[].scaleAction.direction"
        --output table
      repairCommand: az monitor autoscale rule create --resource-group $ResourceGroupName --autoscale-name $autoscale --condition
        'Percentage CPU > 70 avg 10m' --scale out 1 --cooldown 5 --output none
      verifyCommand: az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query "profiles[0].rules[].scaleAction.direction"
        --output table
    challenge: Recommend availability zones, an availability set, or a scale set for three workload patterns.
