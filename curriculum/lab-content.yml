        --output table
      repairCommand: az container delete --resource-group $ResourceGroupName --name "aci-fault-$suffix" --yes --output none
      verifyCommand: az container show --resource-group $ResourceGroupName --name $container --query "{image:containers[0].image,state:containers[0].instanceView.currentState.state}"
