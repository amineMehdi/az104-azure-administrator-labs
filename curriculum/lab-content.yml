        az webapp create --resource-group $ResourceGroupName --plan $plan --name $app --runtime ''PYTHON:3.12'' --output none

        az webapp update --resource-group $ResourceGroupName --name $app --https-only true --set siteConfig.minTlsVersion=1.2
        --output none

        az storage account create --resource-group $ResourceGroupName --name $storage --location $Location --sku Standard_LRS
        --kind StorageV2 --https-only true --allow-blob-public-access false --output none

        az network vnet create --resource-group $ResourceGroupName --name $vnet --address-prefixes 10.16.0.0/16 --subnet-name
        integration --subnet-prefixes 10.16.1.0/24 --output none

        az network vnet subnet update --resource-group $ResourceGroupName --vnet-name $vnet --name integration --delegations
        Microsoft.Web/serverFarms --output none

