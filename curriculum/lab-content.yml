        \ --output none\n} finally {\n    if ($null -eq $previousStorageKey) { Remove-Item Env:AZURE_STORAGE_KEY -ErrorAction\
        \ SilentlyContinue } else { $env:AZURE_STORAGE_KEY = $previousStorageKey }\n    Remove-Variable previousStorageKey,\
        \ sas, backupUrl -ErrorAction SilentlyContinue\n}"
      expectedState: httpsOnly is true, the minimum TLS version matches the target, and the app references the delegated integration
