        --output tsv

        az network watcher show-next-hop --resource-group $ResourceGroupName --vm $vm1 --source-ip $sourceIp --dest-ip $destinationIp
        --output json

        az network watcher connection-monitor show --location $Location --name $external.connectionMonitorName
