  15-app-service-scale-slots:
    role: An application-platform administrator operating App Service capacity and releases.
    outcome: Use Azure CLI in PowerShell to create the production web app and deployment slot, configure scale-out and slot-sticky
      settings, and reconcile worker count, slot state, and configuration scope, with recoverable state and deterministic
      cleanup.
    primer: App Service plan scale-up changes worker capability; scale-out changes instance count. Deployment slots isolate
      configuration and content for safer releases, while slot settings remain sticky during a swap.
    designDecisions:
    - Use a SKU that supports slots and autoscale.
    - Warm staging before swap.
    - Mark environment-specific settings as slot settings.
    architectureWalkthrough: A Linux App Service plan hosts production and staging slots; plan autoscale changes worker capacity,
      sticky settings remain slot-scoped, and the staging release flows through a reversible swap into production.
    completionCriteria:
    - All required checkpoints report pass.
    - The deterministic break/fix is injected, diagnosed, and repaired.
    - cleanup.json reports no active run-owned resources, with any retained item explicitly documented.
    tasks:
    - id: LAB15-CP01
      title: Verify App Service plan and slot capacity
      purpose: Read the provider, region, SKU, feature, quota, and companion-tool signals needed for verify app service plan
        and slot capacity, without changing Azure state.
      operationalRelevance: 'The change is unsafe when free or shared App Service tiers do not support the scaling and slot
        features used by this lab. This checkpoint therefore proves: The selected region supports the documented Linux plan
        SKU and the subscription can enumerate web-app deployment slots.'
      objectiveIds:
      - CP-APP-01
      command: 'az provider show --namespace Microsoft.Web --query registrationState --output tsv

        az appservice list-locations --sku S1 --linux-workers-enabled --query "[?name==''$Location''].name" --output tsv'
      expectedState: The selected region supports the documented Linux plan SKU and the subscription can enumerate web-app
        deployment slots.
      representativeOutput: The selected region supports the documented Linux plan SKU and the subscription can enumerate
        web-app deployment slots.
      positiveCommand: '$registration = az provider show --namespace Microsoft.Web --query registrationState --output tsv

        if ($registration -ne ''Registered'') { throw ''Microsoft.Web is not registered.'' }'
      positiveExpected: The selected region supports the documented Linux plan SKU and the subscription can enumerate web-app
        deployment slots.
      negativeCommand: '$supported = az appservice list-locations --sku S1 --linux-workers-enabled --query "[?name==''$Location'']
        | length(@)" --output tsv

        if ([int]$supported -eq 0) { throw ''Linux S1 is unavailable in the selected region.'' }'
      negativeExpected: 'LAB15-CP01 negative boundary: The undesired state is absent; the negative assertion must not report:
        Linux S1 is unavailable in the selected region.'
      evidence:
      - LAB15-CP01 UTC result for verify app service plan and slot capacity.
      - Exact run-owned resource/object ID returned by the commands in LAB15-CP01.
      - 'Positive assertion proving: The selected region supports the documented Linux plan SKU and the subscription can enumerate
        web-app deployment slots.'
      - 'Negative assertion proving absence of: Linux S1 is unavailable in the selected region.'
      commonFailure: Free or shared App Service tiers do not support the scaling and slot features used by this lab.
      safeRetry: Retry LAB15-CP01 for verify app service plan and slot capacity only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB15-CP02, LAB15-CP03, LAB15-CP04, LAB15-CP05, remove the exact manifest IDs created or configured
        by LAB15-CP01 for verify app service plan and slot capacity; its residual probe must then return zero active IDs.
    - id: LAB15-CP02
      title: Create the production web app and deployment slot
      purpose: Provision and immediately inventory the exact run-owned resources needed to create the production web app and
        deployment slot, so partial completion remains recoverable.
      operationalRelevance: 'The change is unsafe when a globally unique app-name collision or incompatible runtime string
        blocks app creation. This checkpoint therefore proves: The production app and staging slot share the run-owned plan
        and each endpoint reports a healthy hostname.'
      objectiveIds:
      - CP-APP-02
      command: '$plan = "plan-$suffix"; $app = "app-$suffix"; $autoscale = "autoscale-$suffix"

        az appservice plan create --resource-group $ResourceGroupName --name $plan --is-linux --sku S1 --output none

        az webapp create --resource-group $ResourceGroupName --plan $plan --name $app --runtime ''PYTHON:3.12'' --output none

        az webapp deployment slot create --resource-group $ResourceGroupName --name $app --slot staging --output none

        az webapp config appsettings set --resource-group $ResourceGroupName --name $app --slot staging --settings LAB_STAGE=staging
        LAB_RUN=$RunId --output none'
      expectedState: The production app and staging slot share the run-owned plan and each endpoint reports a healthy hostname.
      representativeOutput: The production app and staging slot share the run-owned plan and each endpoint reports a healthy
        hostname.
      positiveCommand: '$slotCount = az webapp deployment slot list --resource-group $ResourceGroupName --name $app --query
        "[?name==''$app/staging''] | length(@)" --output tsv

        if ([int]$slotCount -ne 1) { throw ''The staging slot does not exist exactly once.'' }'
      positiveExpected: The production app and staging slot share the run-owned plan and each endpoint reports a healthy hostname.
      negativeCommand: '$stateValue = az webapp show --resource-group $ResourceGroupName --name $app --query state --output
        tsv

        if ($stateValue -ne ''Running'') { throw "Web app state is $stateValue." }'
      negativeExpected: 'LAB15-CP02 negative boundary: The undesired state is absent; the negative assertion must not report:
        Web app state is reported stateValue.'
      evidence:
      - LAB15-CP02 UTC result for create the production web app and deployment slot.
      - Exact run-owned resource/object ID returned by the commands in LAB15-CP02.
      - 'Positive assertion proving: The production app and staging slot share the run-owned plan and each endpoint reports
        a healthy hostname.'
      - 'Negative assertion proving absence of: Web app state is reported stateValue.'
      commonFailure: A globally unique app-name collision or incompatible runtime string blocks app creation.
      safeRetry: Retry LAB15-CP02 for create the production web app and deployment slot only after its exact recorded ID and
        current property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the
        owning create command, then rerun both assertions.
      cleanupDependency: After LAB15-CP03, LAB15-CP04, LAB15-CP05, remove the exact manifest IDs created or configured by
        LAB15-CP02 for create the production web app and deployment slot; its residual probe must then return zero active
        IDs.
    - id: LAB15-CP03
      title: Configure scale-out and slot-sticky settings
      purpose: Configure and independently inspect the control-plane and data-path properties needed to configure scale-out
        and slot-sticky settings.
      operationalRelevance: 'The change is unsafe when a setting becomes production-wide when it is updated without the deployment-slot
        setting flag. This checkpoint therefore proves: The plan worker count matches the target and the designated application
        setting remains sticky to the slot.'
      objectiveIds:
      - CP-APP-03
      command: 'az appservice plan update --resource-group $ResourceGroupName --name $plan --sku S2 --output none

        $planId = az appservice plan show --resource-group $ResourceGroupName --name $plan --query id --output tsv

        az monitor autoscale create --resource-group $ResourceGroupName --name $autoscale --resource $planId --resource-type
        Microsoft.Web/serverfarms --min-count 1 --max-count 3 --count 1 --output none

        az webapp config appsettings set --resource-group $ResourceGroupName --name $app --slot-settings LAB_STAGE=production
        --output none

        az webapp deployment slot swap --resource-group $ResourceGroupName --name $app --slot staging --target-slot production
        --output none'
      expectedState: The plan worker count matches the target and the designated application setting remains sticky to the
        slot.
      representativeOutput: The plan worker count matches the target and the designated application setting remains sticky
        to the slot.
      positiveCommand: '$sku = az appservice plan show --resource-group $ResourceGroupName --name $plan --query sku.name --output
        tsv

        if ($sku -ne ''S2'') { throw "App Service plan SKU is $sku." }'
      positiveExpected: The plan worker count matches the target and the designated application setting remains sticky to
        the slot.
      negativeCommand: '$maximum = az monitor autoscale show --resource-group $ResourceGroupName --name $autoscale --query
        "profiles[0].capacity.maximum" --output tsv

        if ([int]$maximum -ne 3) { throw "Autoscale maximum is $maximum." }'
      negativeExpected: 'LAB15-CP03 negative boundary: The undesired state is absent; the negative assertion must not report:
        Autoscale maximum is reported maximum.'
      evidence:
      - LAB15-CP03 UTC result for configure scale-out and slot-sticky settings.
      - Exact run-owned resource/object ID returned by the commands in LAB15-CP03.
      - 'Positive assertion proving: The plan worker count matches the target and the designated application setting remains
        sticky to the slot.'
      - 'Negative assertion proving absence of: Autoscale maximum is reported maximum.'
      commonFailure: A setting becomes production-wide when it is updated without the deployment-slot setting flag.
      safeRetry: Retry LAB15-CP03 for configure scale-out and slot-sticky settings only after its exact recorded ID and current
        property are read. If the ID exists, reissue only the idempotent update; if it is absent, repeat only the owning create
        command, then rerun both assertions.
      cleanupDependency: After LAB15-CP04, LAB15-CP05, remove the exact manifest IDs created or configured by LAB15-CP03 for
        configure scale-out and slot-sticky settings; its residual probe must then return zero active IDs.
