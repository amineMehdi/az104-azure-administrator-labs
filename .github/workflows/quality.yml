name: Offline quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repository contract
        run: python tools/validate_repository.py

      - name: Confirm inline command documentation is synchronized
        run: python tools/sync_inline_commands.py --check

      - name: Confirm generated indexes are current
        run: python tools/generate_indexes.py --check

      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell command lanes
        shell: pwsh
        run: |
          $scripts = Get-ChildItem labs -Recurse -Filter '*.ps1' |
            Where-Object { $_.FullName -match '[\\/]scripts[\\/]cli[\\/]' }
          $findings = $scripts | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Severity Warning,Error
          }
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw 'PSScriptAnalyzer reported warning or error findings.'
          }

      - name: Run offline Pester safety contracts
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path labs -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s)."
          }

  static-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.14.0

      - name: Spell-check documentation
        run: npx --yes cspell@8.14.4 --no-progress "**/*.md"

      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.1
          "$(go env GOPATH)/bin/actionlint"

      - name: Scan for committed secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.18.4
          "$(go env GOPATH)/bin/gitleaks" detect --source . --redact --no-banner

      - name: Build and lint Bicep artifacts
        run: |
          az bicep install
          find labs -type f -name '*.bicep' -print0 | xargs -0 -r -n1 -I{} az bicep build --file {} --outdir /tmp
