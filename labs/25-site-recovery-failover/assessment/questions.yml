    D: "Choose the most suitable recovery point, start failover, and validate the application before commit. In the Azure-to-Azure disaster-recovery pilot, this action changes unplanned failover. Azure-to-Azure disaster-recovery pilot instead needs source and target regions: Choose a supported target region and validate VM, disk, network, quota, and feature compatibility. The unplanned failover action omits that source and target regions work."
