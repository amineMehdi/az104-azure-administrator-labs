  difficulty: foundational
  stem: Which principle is most important when working on 'Configure Azure Site Recovery for Azure resources' in Lab 25?
  options:
    A: A recognizable resource name removes the need for validation and scoped cleanup.
    B: Test failover validates recovery without committing production direction, while planned/unplanned failover, commit,
      reprotect, and failback are separate state transitions with cost and data-loss implications.
    C: The shortest command is always correct even when it changes a broader scope.
    D: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
  correctOption: B
  explanation: 'The lab establishes this design principle: Test failover validates recovery without committing production
    direction, while planned/unplanned failover, commit, reprotect, and failback are separate state transitions with cost
    and data-loss implications.'
  distractorExplanations:
    A: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    B: 'Correct. The lab establishes this design principle: Test failover validates recovery without committing production
      direction, while planned/unplanned failover, commit, reprotect, and failback are separate state transitions with cost
      and data-loss implications.'
    C: This choice changes or trusts a broader scope than the recorded lab boundary.
    D: This choice skips independent evidence or relies on ambiguous resource identity.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-powershell
  lastVerified: '2026-08-30'
