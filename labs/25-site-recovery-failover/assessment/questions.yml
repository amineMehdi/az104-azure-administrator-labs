    B: "The Recovery Services vault for Azure-to-Azure replication is placed outside the source VM's failure region according to scenario guidance."
    C: "A protected item must complete initial replication and reach a healthy protected state before it can meet recovery expectations."
    D: "An unplanned failover recovers from an unavailable source using a selected available recovery point and may have data loss."
  correctOption: "B"
  optionExplanations:
    A: "A Site Recovery replication policy defines settings such as recovery-point retention and app-consistent snapshot frequency. In the Azure-to-Azure disaster-recovery pilot, this statement describes replication policies. The replication policies statement accurately describes replication policies; however, Azure-to-Azure disaster-recovery pilot needs Site Recovery vault placement to place recovery orchestration outside the failure boundary it must survive; replication policies cannot replace Site Recovery vault placement."
    B: "The Recovery Services vault for Azure-to-Azure replication is placed outside the source VM's failure region according to scenario guidance. This Site Recovery vault placement fact resolves the Azure-to-Azure disaster-recovery pilot design question about how to place recovery orchestration outside the failure boundary it must survive."
    C: "A protected item must complete initial replication and reach a healthy protected state before it can meet recovery expectations. In the Azure-to-Azure disaster-recovery pilot, this statement describes replication health. Site Recovery vault placement governs Azure-to-Azure disaster-recovery pilot; replication health cannot support Site Recovery vault placement when operators must place recovery orchestration outside the failure boundary it must survive."
    D: "An unplanned failover recovers from an unavailable source using a selected available recovery point and may have data loss. In the Azure-to-Azure disaster-recovery pilot, this statement describes unplanned failover. Azure-to-Azure disaster-recovery pilot asks about Site Recovery vault placement; this unplanned failover choice leaves the Site Recovery vault placement explanation missing."
  sources:
    - title: "Azure-to-Azure disaster recovery architecture"
      url: "https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture"
  lastVerified: "2026-08-31"
