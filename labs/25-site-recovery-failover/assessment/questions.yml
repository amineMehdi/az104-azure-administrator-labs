- id: LAB25-Q01
  objectiveIds:
  - MR-RECOVERY-05
  difficulty: foundational
  stem: Which statement best captures the key design principle for replicate and fail over an azure vm with site
    recovery?
  options:
    A: Test failover validates recovery without committing production direction, while planned/unplanned failover,
      commit, reprotect, and failback are separate state transitions with cost and data-loss implications.
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
  explanation: 'The lab''s central distinction is: Test failover validates recovery without committing production
    direction, while planned/unplanned failover, commit, reprotect, and failback are separate state transitions
    with cost and data-loss implications.'
  distractorExplanations:
    A: 'Correct. The lab''s central distinction is: Test failover validates recovery without committing production
      direction, while planned/unplanned failover, commit, reprotect, and failback are separate state transitions
      with cost and data-loss implications.'
    B: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-powershell
  lastVerified: '2026-08-30'
