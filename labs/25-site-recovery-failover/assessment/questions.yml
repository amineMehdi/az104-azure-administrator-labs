  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "For the Azure-to-Azure disaster-recovery pilot, the failover pilot plan must replicate supported virtual-machine disks from one region to recovery resources in another. Which statement about failover pilot belongs in the Azure-to-Azure disaster-recovery pilot record?"
  options:
    A: "The Recovery Services vault for Azure-to-Azure replication is placed outside the source VM's failure region according to scenario guidance."
    B: "Recovery settings map protected machines to target virtual networks, subnets, and optional target IP configuration."
    C: "A planned failover coordinates shutdown and final synchronization when the source is available to minimize data loss."
    D: "Azure-to-Azure Site Recovery replicates supported VM disks from a source region into configured target-region resources."
  correctOption: "D"
  optionExplanations:
    A: "The Recovery Services vault for Azure-to-Azure replication is placed outside the source VM's failure region according to scenario guidance. In the Azure-to-Azure disaster-recovery pilot, this statement describes Site Recovery vault placement. Azure-to-Azure disaster-recovery pilot asks about source and target regions; this Site Recovery vault placement choice leaves the source and target regions explanation missing."
    B: "Recovery settings map protected machines to target virtual networks, subnets, and optional target IP configuration. In the Azure-to-Azure disaster-recovery pilot, this statement describes target network mapping. The target network mapping statement accurately describes target network mapping; however, Azure-to-Azure disaster-recovery pilot needs source and target regions to replicate supported virtual-machine disks from one region to recovery resources in another; target network mapping cannot replace source and target regions."
    C: "A planned failover coordinates shutdown and final synchronization when the source is available to minimize data loss. In the Azure-to-Azure disaster-recovery pilot, this statement describes planned failover. Selecting planned failover for Azure-to-Azure disaster-recovery pilot leaves source and target regions unanswered in Azure-to-Azure disaster-recovery pilot; the Azure-to-Azure disaster-recovery pilot lacks a source and target regions basis to replicate supported virtual-machine disks from one region to recovery resources in another."
    D: "The Azure-to-Azure disaster-recovery pilot needs source and target regions to replicate supported virtual-machine disks from one region to recovery resources in another; this option states the applicable source and target regions rule: Azure-to-Azure Site Recovery replicates supported VM disks from a source region into configured target-region resources."
  sources:
    - title: "Azure-to-Azure disaster recovery architecture"
      url: "https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture"
  lastVerified: "2026-08-31"
- id: "LAB25-Q02"
