    A: "First, Use planned failover for an intentional migration or outage when source coordination is possible. Then, Track shutdown, synchronization, failover job completion, active location, and recovery point. The Azure-to-Azure disaster-recovery pilot uses its planned failover mutation gate and planned failover verification gate before it can shut down the source and capture its latest changes for low-loss recovery."
    B: "First, Validate recovery, commit deliberately, reprotect to the original region, and plan failback as a separate controlled change. Then, Query activeLocation, allowedOperations, protectionState, and reverse-replication health after each phase. This Azure-to-Azure disaster-recovery pilot pair serves commit, reprotect, and failback. Commit, reprotect, and failback cannot replace planned failover in Azure-to-Azure disaster-recovery pilot. Use this planned failover pair instead: First, Use planned failover for an intentional migration or outage when source coordination is possible. Then, Track shutdown, synchronization, failover job completion, active location, and recovery point."
    C: "First, Select a compatible cache account in the source region and avoid unsupported firewall or performance constraints. Then, Query the protected disk's cache storage account ID and confirm region, kind, and network reachability. This Azure-to-Azure disaster-recovery pilot pair serves cache storage accounts. Azure-to-Azure disaster-recovery pilot proves cache storage accounts, but planned failover lacks implementation in Azure-to-Azure disaster-recovery pilot and planned failover proof; the planned failover outcome to shut down the source and capture its latest changes for low-loss recovery remains open."
    D: "First, Prepare nonoverlapping target networking and map every protected NIC before failover. Then, Query target network and subnet IDs for each replicated NIC and validate DNS and security dependencies. This Azure-to-Azure disaster-recovery pilot pair serves target network mapping. Azure-to-Azure disaster-recovery pilot uses target network mapping for both steps; planned failover remains untouched in Azure-to-Azure disaster-recovery pilot, so its planned failover gate to shut down the source and capture its latest changes for low-loss recovery fails."
