  <title id="lab24-title">LAB-24 architecture: Configure Azure Backup policies, protection, restore, reports, and alerts</title>
  <desc id="lab24-desc">Left-to-right service topology with 10 components and 10 directed relationships. Components: Private Azure VM, Vault protection item, Recovery Services vault, On-demand backup job, Recovery point, Disk restore job, Staging storage, Restore artifacts, Item, job, point, and restore assertions, Protection removal and deleted-vault proof. Relationships: Private Azure VM to Vault protection item; Recovery Services vault to Vault protection item; Vault protection item to On-demand backup job; On-demand backup job to Recovery point; Recovery point to Disk restore job; Staging storage to Disk restore job; Disk restore job to Restore artifacts; Vault protection item to Item, job, point, and restore assertions; Restore artifacts to Item, job, point, and restore assertions; Item, job, point, and restore assertions to Protection removal and deleted-vault proof.</desc>
