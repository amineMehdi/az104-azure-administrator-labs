- id: "LAB24-Q01"
  objectiveIds:
    - "MR-RECOVERY-01"
  checkpointIds:
    - "LAB24-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "A restore rehearsal incident review of the test-VM protection and restore drill depends on the ability to store supported Azure VM protection metadata in the correct vault type. Which platform description is reliable?"
  options:
    A: "A Backup vault is the newer management entity used by Azure Data Protection for supported datasource types."
    B: "An on-demand backup creates a recovery point outside the normal schedule and can use an allowed retention date."
    C: "A Recovery Services vault stores management data and recovery points for supported workloads such as Azure VM backup and Site Recovery."
    D: "Azure VM restore can create a new VM, restore disks, or replace disks depending on workload and recovery requirements."
  correctOption: "C"
  optionExplanations:
    A: "A Backup vault is the newer management entity used by Azure Data Protection for supported datasource types. In the test-VM protection and restore drill, this statement describes Backup vaults. Test-VM protection and restore drill asks about Recovery Services vaults; this Backup vaults choice leaves the Recovery Services vaults explanation missing."
    B: "An on-demand backup creates a recovery point outside the normal schedule and can use an allowed retention date. In the test-VM protection and restore drill, this statement describes on-demand backups. The on-demand backups statement accurately describes on-demand backups; however, test-VM protection and restore drill needs Recovery Services vaults to store supported Azure VM protection metadata in the correct vault type; on-demand backups cannot replace Recovery Services vaults."
    C: "A Recovery Services vault stores management data and recovery points for supported workloads such as Azure VM backup and Site Recovery. The test-VM protection and restore drill applies that Recovery Services vaults boundary when operators must store supported Azure VM protection metadata in the correct vault type."
    D: "Azure VM restore can create a new VM, restore disks, or replace disks depending on workload and recovery requirements. In the test-VM protection and restore drill, this statement describes VM restore choices. Recovery Services vaults governs test-VM protection and restore drill; VM restore choices cannot support Recovery Services vaults when operators must store supported Azure VM protection metadata in the correct vault type."
  sources:
    - title: "Create a Recovery Services vault"
      url: "https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault"
  lastVerified: "2026-08-31"
- id: "LAB24-Q02"
  objectiveIds:
    - "MR-RECOVERY-02"
  checkpointIds:
    - "LAB24-CP02"
  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "A recovery administrator protecting and restoring a test VM is updating the restore rehearsal runbook. The requirement is to use the vault type designed for newer data-source protection workloads. Which statement describes Azure behavior correctly?"
  options:
    A: "A backup policy defines when recovery points are created and how long daily, weekly, monthly, or yearly points are retained."
    B: "A restore operation must select a successful recovery point compatible with the desired restore type."
    C: "Backup soft delete retains deleted backup data for a recovery period and may require explicit handling before vault deletion."
    D: "A Backup vault is the newer management entity used by Azure Data Protection for supported datasource types."
  correctOption: "D"
  optionExplanations:
    A: "A backup policy defines when recovery points are created and how long daily, weekly, monthly, or yearly points are retained. In the test-VM protection and restore drill, this statement describes backup frequency and retention. The backup frequency and retention statement accurately describes backup frequency and retention; however, test-VM protection and restore drill needs Backup vaults to use the vault type designed for newer data-source protection workloads; backup frequency and retention cannot replace Backup vaults."
    B: "A restore operation must select a successful recovery point compatible with the desired restore type. In the test-VM protection and restore drill, this statement describes recovery-point selection. Selecting recovery-point selection for test-VM protection and restore drill leaves Backup vaults unanswered in test-VM protection and restore drill; the test-VM protection and restore drill lacks a Backup vaults basis to use the vault type designed for newer data-source protection workloads."
    C: "Backup soft delete retains deleted backup data for a recovery period and may require explicit handling before vault deletion. In the test-VM protection and restore drill, this statement describes backup soft delete. Backup vaults governs test-VM protection and restore drill; backup soft delete cannot support Backup vaults when operators must use the vault type designed for newer data-source protection workloads."
    D: "The test-VM protection and restore drill needs Backup vaults to use the vault type designed for newer data-source protection workloads; this option states the applicable Backup vaults rule: a Backup vault is the newer management entity used by Azure Data Protection for supported datasource types."
  sources:
    - title: "Create and manage an Azure Backup vault"
      url: "https://learn.microsoft.com/en-us/azure/backup/create-manage-backup-vault"
  lastVerified: "2026-08-31"
- id: "LAB24-Q03"
  objectiveIds:
    - "MR-RECOVERY-03"
  checkpointIds:
    - "LAB24-CP03"
  remediationAnchor: "#task-3"
  difficulty: "foundational"
  stem: "A restore rehearsal peer review asks how the test-VM protection and restore drill should handle this outcome: define how often recovery points are created and how long they remain. Which explanation is accurate?"
  options:
    A: "A backup policy defines when recovery points are created and how long daily, weekly, monthly, or yearly points are retained."
    B: "A backup policy has no effect on a workload until a backup instance or protected item associates that policy with the datasource."
    C: "Azure VM file recovery mounts or exposes a recovery point so selected files can be copied without restoring the entire VM."
    D: "Backup Center, jobs, built-in alerts, Azure Monitor, and reports expose protection health and operational failures."
  correctOption: "A"
  optionExplanations:
    A: "A backup policy defines when recovery points are created and how long daily, weekly, monthly, or yearly points are retained. This backup frequency and retention fact resolves the test-VM protection and restore drill design question about how to define how often recovery points are created and how long they remain."
    B: "A backup policy has no effect on a workload until a backup instance or protected item associates that policy with the datasource. In the test-VM protection and restore drill, this statement describes policy association. Backup frequency and retention governs test-VM protection and restore drill; policy association cannot support backup frequency and retention when operators must define how often recovery points are created and how long they remain."
    C: "Azure VM file recovery mounts or exposes a recovery point so selected files can be copied without restoring the entire VM. In the test-VM protection and restore drill, this statement describes file-level recovery. Test-VM protection and restore drill asks about backup frequency and retention; this file-level recovery choice leaves the backup frequency and retention explanation missing."
    D: "Backup Center, jobs, built-in alerts, Azure Monitor, and reports expose protection health and operational failures. In the test-VM protection and restore drill, this statement describes backup monitoring and alerts. The backup monitoring and alerts statement accurately describes backup monitoring and alerts; however, test-VM protection and restore drill needs backup frequency and retention to define how often recovery points are created and how long they remain; backup monitoring and alerts cannot replace backup frequency and retention."
  sources:
    - title: "Azure Backup policy fundamentals"
      url: "https://learn.microsoft.com/en-us/azure/backup/backup-architecture"
  lastVerified: "2026-08-31"
