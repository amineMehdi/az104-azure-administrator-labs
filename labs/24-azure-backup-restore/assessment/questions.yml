    B: "Configure frequency, time zone, and retention ranges from the recovery objectives."
    C: "List recovery points and choose one captured before the simulated data loss."
    D: "Keep soft delete enabled and document retained items rather than attempting irreversible purge in routine cleanup."
  correctOption: "A"
  optionExplanations:
    A: "Create the vault in the approved region and resource group before protecting the VM. The test-VM protection and restore drill uses this Recovery Services vaults operation to store supported Azure VM protection metadata in the correct vault type within the approved scope."
    B: "Configure frequency, time zone, and retention ranges from the recovery objectives. In the test-VM protection and restore drill, this action changes backup frequency and retention. Test-VM protection and restore drill requires Recovery Services vaults; changing backup frequency and retention leaves Recovery Services vaults absent in test-VM protection and restore drill; test-VM protection and restore drill cannot store supported Azure VM protection metadata in the correct vault type."
