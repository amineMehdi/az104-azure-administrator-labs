    recovery points, and vault deletion requires ordered removal of protected items, soft-delete state, and dependencies.'
  distractorExplanations:
    A: 'Correct. The lab establishes this design principle: Vault type must match the workload, protection creates retained
      recovery points, and vault deletion requires ordered removal of protected items, soft-delete state, and dependencies.'
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
  lastVerified: '2026-08-30'
