    D: "Keep soft delete enabled and document retained items rather than attempting irreversible purge in routine cleanup. In the test-VM protection and restore drill, this action changes backup soft delete. Test-VM protection and restore drill instead needs Recovery Services vaults: Create the vault in the approved region and resource group before protecting the VM. The backup soft delete action omits that Recovery Services vaults work."
