- id: LAB13-Q01
  objectiveIds:
  - CP-CONTAINERS-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Create and manage an Azure Container Registry' in Lab
    13?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: ACR stores image artifacts and ACI runs container groups; registry admin credentials are not required when
      managed identities or scoped tokens are available.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: C
  explanation: 'The lab establishes this design principle: ACR stores image artifacts and ACI runs container groups;
    registry admin credentials are not required when managed identities or scoped tokens are available.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: 'Correct. The lab establishes this design principle: ACR stores image artifacts and ACI runs container groups;
      registry admin credentials are not required when managed identities or scoped tokens are available.'
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/container-registry/container-registry-get-started-azure-cli
  lastVerified: '2026-08-30'
