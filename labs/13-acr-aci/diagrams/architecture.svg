  <title id="lab13-title">LAB-13 architecture: Publish images with ACR and run Azure Container Instances</title>
  <desc id="lab13-desc">Left-to-right service topology with 8 components and 8 directed relationships. Components: Operator and Azure CLI, ACR cloud build, Run-tagged ACR image, User-assigned identity, AcrPull at registry scope, Azure Container Instance, Image, identity, and state assertions, Role and resource cleanup. Relationships: Operator and Azure CLI to ACR cloud build; ACR cloud build to Run-tagged ACR image; User-assigned identity to AcrPull at registry scope; AcrPull at registry scope to Run-tagged ACR image; Run-tagged ACR image to Azure Container Instance; User-assigned identity to Azure Container Instance; Azure Container Instance to Image, identity, and state assertions; Image, identity, and state assertions to Role and resource cleanup.</desc>
