  <title id="lab01-title">LAB-01 architecture: Create and manage Microsoft Entra users and groups</title>
  <desc id="lab01-desc">Left-to-right service topology with 8 components and 9 directed relationships. Components: Identity administrator, Microsoft Graph v1.0, Alex cloud user, Blair cloud user, Operations security group, Local run.json users and group, Independent validation, Scoped cleanup. Relationships: Identity administrator to Microsoft Graph v1.0 (az rest); Microsoft Graph v1.0 to Alex cloud user (create); Microsoft Graph v1.0 to Blair cloud user (create); Microsoft Graph v1.0 to Operations security group (create); Alex cloud user to Operations security group (direct member); Blair cloud user to Operations security group (explicit owner); Microsoft Graph v1.0 to Local run.json users and group (returned immutable IDs); Local run.json users and group to Independent validation (exact-ID queries); Local run.json users and group to Scoped cleanup (group first, then users).</desc>
