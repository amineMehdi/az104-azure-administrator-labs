- id: LAB01-Q16
  objectiveIds:
  - IG-USERS-01
  - IG-USERS-02
  difficulty: applied
  stem: You create a temporary cloud user for a lab. Which password-profile choice most directly reduces the risk of the bootstrap
    password remaining valid as the user's long-term secret?
  options:
    A: Set forceChangePasswordNextSignIn to true and avoid persisting the password.
    B: Store the password in the group's description for the owner.
    C: Disable password expiration for the account.
    D: Reuse the administrator's password and delete shell history.
  correctOption: A
  explanation: The bootstrap password should be handled as a secret, omitted from state, and changed at the user's first sign-in
    by setting forceChangePasswordNextSignIn.
  distractorExplanations:
    A: Correct. The setting forces replacement of the temporary password at first sign-in.
    B: Group descriptions are visible directory data and must never hold passwords.
    C: Disabling expiration does not replace the temporary bootstrap secret.
    D: Password reuse is unsafe and deleting history does not correct the design.
  sourceUrls:
  - https://learn.microsoft.com/en-us/graph/api/user-post-users?view=graph-rest-1.0
  - https://learn.microsoft.com/en-us/cli/azure/ad/user?view=azure-cli-latest
  lastVerified: '2026-08-30'
- id: LAB01-Q17
  objectiveIds:
  - IG-USERS-02
  difficulty: applied
  stem: A script has the exact object ID of a security group and the exact object ID of a user. Which Azure CLI operation
    creates the intended direct membership?
  options:
    A: az group update --name <group-id> --add members <user-id>
    B: az ad group member add --group <group-id> --member-id <user-id>
    C: az role assignment create --assignee <group-id> --scope <user-id>
    D: az ad user update --id <user-id> --group <group-id>
  correctOption: B
  explanation: The az ad group member command group manages Microsoft Entra group membership, and member add accepts the group
    and member object IDs.
  distractorExplanations:
    A: az group manages Azure resource groups, not Microsoft Entra groups.
    B: Correct. This adds the recorded directory object as a direct member.
    C: Azure role assignments grant resource access; they do not edit directory membership.
    D: az ad user update does not expose a group-membership parameter.
  sourceUrls:
  - https://learn.microsoft.com/en-us/cli/azure/ad/group/member?view=azure-cli-latest
  lastVerified: '2026-08-30'
- id: LAB01-Q18
  objectiveIds:
  - IG-USERS-02
  difficulty: applied
  stem: The simplified az ad user update command does not expose the department and jobTitle properties you must change. What
    is the most appropriate command-first approach?
  options:
    A: Rename the Azure subscription so that its tags become user properties.
    B: Create a second user with the desired properties and leave the first user active.
    C: Send an authenticated Microsoft Graph PATCH request for the recorded user ID with az rest.
    D: Edit the local Azure CLI token cache and repeat az ad user show.
  correctOption: C
  explanation: Azure CLI can authenticate an az rest request to Microsoft Graph. PATCHing the exact user object exposes writable
    properties not offered by a simplified command.
  distractorExplanations:
    A: Azure subscription metadata has no relationship to Microsoft Entra user properties.
    B: Creating duplicates introduces drift and does not manage the existing identity.
    C: Correct. Microsoft Graph is the appropriate supported property-management surface.
    D: Credential caches must not be edited and a show operation is read-only.
  sourceUrls:
  - https://learn.microsoft.com/en-us/cli/azure/reference-index?view=azure-cli-latest#az-rest
  - https://learn.microsoft.com/en-us/graph/api/user-update?view=graph-rest-1.0
  lastVerified: '2026-08-30'
- id: LAB01-Q19
  objectiveIds:
  - IG-USERS-02
  difficulty: applied
  stem: User B is added as an owner of a security group but is intentionally not added as a member. Which statement correctly
    describes the result?
  options:
    A: A group cannot have an owner unless that owner is also a direct member.
    B: Ownership converts the security group into a Microsoft 365 group.
    C: The owner is always treated as a transitive member for every access assignment.
    D: Ownership and membership are separate relationships; ownership does not automatically grant member-based access.
  correctOption: D
  explanation: Owners manage a group according to directory policy, while members receive access or app behavior associated
    with membership. One relationship does not imply the other.
  distractorExplanations:
    A: Microsoft Entra supports group owners who are not direct members.
    B: Changing an owner does not alter mail or group-type properties.
    C: Owner status does not universally create direct or transitive membership.
    D: Correct. Validate owners and members independently.
  sourceUrls:
  - https://learn.microsoft.com/en-us/cli/azure/ad/group/owner?view=azure-cli-latest
  - https://learn.microsoft.com/en-us/cli/azure/ad/group/member?view=azure-cli-latest
  lastVerified: '2026-08-30'
- id: LAB01-Q20
  objectiveIds:
  - IG-USERS-01
  - IG-USERS-02
  difficulty: applied
  stem: A tenant contains two groups with similar display names. Which value should an automated cleanup use to delete only
    the group created by its own run?
  options:
    A: The exact immutable group object ID recorded immediately after creation
    B: The first group returned by a display-name prefix search
    C: The group's position in the Microsoft Entra admin center list
    D: The Azure subscription ID active when the group was created
  correctOption: A
  explanation: Display names can be duplicated or changed. A run manifest should record the returned object ID and cleanup
    should verify that exact object before deletion.
  distractorExplanations:
    A: Correct. Exact recorded object IDs provide the safest cleanup boundary.
    B: Prefix search results are ambiguous and can target an unrelated group.
    C: Portal list ordering is not a stable identity or automation input.
    D: Microsoft Entra groups are tenant objects and are not owned by an Azure subscription.
  sourceUrls:
  - https://learn.microsoft.com/en-us/graph/api/resources/group?view=graph-rest-1.0
  - https://learn.microsoft.com/en-us/cli/azure/ad/group?view=azure-cli-latest
  lastVerified: '2026-08-30'
