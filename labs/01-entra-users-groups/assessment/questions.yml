  difficulty: applied
  stem: 'During a maintenance window, an engineer must decide how to respond: The simplified az ad user update command does
    not expose the department and jobTitle properties you must change. What is the most appropriate command-first approach?'
  options:
    A: Edit the local Azure CLI token cache and repeat az ad user show.
    B: Rename the Azure subscription so that its tags become user properties.
    C: Create a second user with the desired properties and leave the first user active.
    D: Send an authenticated Microsoft Graph PATCH request for the recorded user ID with az rest.
  correctOption: D
  explanation: Azure CLI can authenticate an az rest request to Microsoft Graph. PATCHing the exact user object exposes writable
    properties not offered by a simplified command.
  distractorExplanations:
    A: Credential caches must not be edited and a show operation is read-only.
    B: Azure subscription metadata has no relationship to Microsoft Entra user properties.
    C: Creating duplicates introduces drift and does not manage the existing identity.
    D: Correct. Microsoft Graph is the appropriate supported property-management surface.
  sourceUrls:
  - https://learn.microsoft.com/en-us/cli/azure/reference-index?view=azure-cli-latest#az-rest
