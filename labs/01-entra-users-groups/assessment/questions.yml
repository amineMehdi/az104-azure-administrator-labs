  difficulty: advanced
  stem: A validation report must prove the intended group relationships and detect accidental privilege expansion. Which pair
    of checks provides the strongest evidence for this lab design?
  options:
    A: Confirm both users exist and skip group relationship queries to reduce API calls.
    B: Confirm user B is an owner and automatically add every owner as a member.
    C: Confirm user A is a direct member and independently confirm user B is an owner but not a direct member.
    D: Confirm the group display name starts with AZ104 and assume all relationships are correct.
  correctOption: C
  explanation: The design has a positive membership assertion and a negative membership control while ownership is validated
    separately. Together they detect missing access and unintended expansion.
  distractorExplanations:
    A: Object existence alone does not prove the required relationships.
    B: Automatic repair would destroy the negative control and broaden access.
    C: Correct. Independent positive, negative, and ownership checks prove the intended relationship model.
    D: A naming convention cannot establish membership or ownership state.
