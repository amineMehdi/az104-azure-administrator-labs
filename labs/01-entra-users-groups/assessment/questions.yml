  difficulty: "foundational"
  stem: "An identity administrator onboarding a small operations team is updating the identity onboarding runbook. The requirement is to use a custom tenant suffix when creating an operations account. Which statement describes Azure behavior correctly?"
  options:
    A: "A cloud-only user is a directory object and does not depend on an Azure subscription resource group."
    B: "A cloud user's UPN suffix must be a verified domain in the tenant."
    C: "A non-mail-enabled security group uses securityEnabled true and mailEnabled false."
    D: "The userType property distinguishes tenant members from business-to-business guest identities."
  correctOption: "B"
  optionExplanations:
    A: "A cloud-only user is a directory object and does not depend on an Azure subscription resource group. In the operations-team identity onboarding, this statement describes cloud-only user creation. Operations-team identity onboarding asks about verified UPN suffixes; this cloud-only user creation choice leaves the verified UPN suffixes explanation missing."
    B: "A cloud user's UPN suffix must be a verified domain in the tenant. In the operations-team identity onboarding, this verified UPN suffixes rule supports the need to use a custom tenant suffix when creating an operations account."
    C: "A non-mail-enabled security group uses securityEnabled true and mailEnabled false. In the operations-team identity onboarding, this statement describes security group creation. Selecting security group creation for operations-team identity onboarding leaves verified UPN suffixes unanswered in operations-team identity onboarding; the operations-team identity onboarding lacks a verified UPN suffixes basis to use a custom tenant suffix when creating an operations account."
    D: "The userType property distinguishes tenant members from business-to-business guest identities. In the operations-team identity onboarding, this statement describes member and guest user types. Verified UPN suffixes governs operations-team identity onboarding; member and guest user types cannot support verified UPN suffixes when operators must use a custom tenant suffix when creating an operations account."
  sources:
    - title: "List domains with Microsoft Graph"
      url: "https://learn.microsoft.com/en-us/graph/api/domain-list?view=graph-rest-1.0"
