  difficulty: "advanced"
  stem: "To satisfy the identity onboarding requirement, operators must change the operations-team identity onboarding configuration and prove it can create a user whose identity exists only in this tenant. Which sequence is coherent?"
  options:
    A: "First, Create the user with a unique UPN, display name, and initial password through Azure CLI. Then, Query the returned object ID and confirm the displayName, userPrincipalName, and accountEnabled values."
    B: "First, Set accountEnabled on the target user while leaving its identity and group memberships intact. Then, Read accountEnabled from Microsoft Graph and confirm it matches the intended sign-in state."
    C: "First, Read userType before applying automation that should target only member or only guest accounts. Then, Query userType and externalUserState for the exact directory object under review."
    D: "First, Locate the deleted directory object and restore it before the retention window expires. Then, Query the restored object ID and verify that it has returned to the active users collection."
  correctOption: "A"
  optionExplanations:
    A: "First, Create the user with a unique UPN, display name, and initial password through Azure CLI. Then, Query the returned object ID and confirm the displayName, userPrincipalName, and accountEnabled values. For operations-team identity onboarding, the cloud-only user creation operation precedes its cloud-only user creation read-back check, allowing it to create a user whose identity exists only in this tenant."
    B: "First, Set accountEnabled on the target user while leaving its identity and group memberships intact. Then, Read accountEnabled from Microsoft Graph and confirm it matches the intended sign-in state. This operations-team identity onboarding pair serves account enabled state. Operations-team identity onboarding uses account enabled state for both steps; cloud-only user creation remains untouched in operations-team identity onboarding, so its cloud-only user creation gate to create a user whose identity exists only in this tenant fails."
    C: "First, Read userType before applying automation that should target only member or only guest accounts. Then, Query userType and externalUserState for the exact directory object under review. This operations-team identity onboarding pair serves member and guest user types. Operations-team identity onboarding closes member and guest user types, not cloud-only user creation; without the cloud-only user creation workflow, it cannot create a user whose identity exists only in this tenant."
    D: "First, Locate the deleted directory object and restore it before the retention window expires. Then, Query the restored object ID and verify that it has returned to the active users collection. This operations-team identity onboarding pair serves deleted-user recovery. Deleted-user recovery cannot replace cloud-only user creation in operations-team identity onboarding. Use this cloud-only user creation pair instead: First, Create the user with a unique UPN, display name, and initial password through Azure CLI. Then, Query the returned object ID and confirm the displayName, userPrincipalName, and accountEnabled values."
  sources:
    - title: "Azure CLI reference for Microsoft Entra users"
      url: "https://learn.microsoft.com/en-us/cli/azure/ad/user?view=azure-cli-latest"
  lastVerified: "2026-08-31"
