    D: "A soft-deleted Microsoft Entra user can normally be restored during the directory retention window. In the operations-team identity onboarding, this statement describes deleted-user recovery. Operations-team identity onboarding asks about cloud-only user creation; this deleted-user recovery choice leaves the cloud-only user creation explanation missing."
