- id: LAB01-Q01
  objectiveIds:
  - IG-USERS-01
  difficulty: foundational
  stem: An administrator is creating a cloud-only Microsoft Entra user. Which UPN requirement must be satisfied?
  options:
    A: The UPN must use the tenant's initial domain only.
    B: The UPN suffix must be one of the tenant's verified domains.
    C: The UPN must use the same name as an Azure subscription.
    D: The UPN must match the administrator's email address.
  correctOption: B
  explanation: A cloud user's userPrincipalName uses an Internet-style alias@domain format, and the domain must belong to
    the tenant's verified domains collection.
  distractorExplanations:
    A: Any suitable verified tenant domain can be used; it is not limited to the initial domain.
    B: Correct. Microsoft Graph and Azure CLI require a verified-domain UPN suffix.
    C: Azure subscription names do not determine Microsoft Entra UPN suffixes.
    D: The new identity is independent of the administrator's email address.
  sourceUrls:
  - https://learn.microsoft.com/en-us/graph/api/user-post-users?view=graph-rest-1.0
  - https://learn.microsoft.com/en-us/cli/azure/ad/user?view=azure-cli-latest
  lastVerified: '2026-08-30'
- id: LAB01-Q02
  objectiveIds:
  - IG-USERS-01
  difficulty: foundational
  stem: You need a Microsoft Entra group for assigning access to Azure resources, without creating an email collaboration
    group. Which group properties fit the requirement?
  options:
    A: securityEnabled=false and mailEnabled=false
    B: securityEnabled=true and mailEnabled=true with dynamic membership
    C: securityEnabled=true and mailEnabled=false
    D: securityEnabled=false and mailEnabled=true
  correctOption: C
  explanation: A standard security group used for access assignments is security-enabled and can be non-mail-enabled. Microsoft
    365 collaboration capabilities are not required.
  distractorExplanations:
    A: A group that is not security-enabled cannot satisfy the access-assignment requirement.
    B: Mail and dynamic membership add capabilities that the requirement does not request.
    C: Correct. These values describe a non-mail-enabled security group.
    D: This describes a mail-enabled object without the required security capability.
  sourceUrls:
  - https://learn.microsoft.com/en-us/graph/api/group-post-groups?view=graph-rest-1.0
  - https://learn.microsoft.com/en-us/cli/azure/ad/group?view=azure-cli-latest
  lastVerified: '2026-08-30'
- id: LAB01-Q03
  objectiveIds:
  - IG-USERS-01
  - IG-USERS-02
  difficulty: foundational
  stem: A learner is Owner of an Azure subscription but receives an authorization error when creating Microsoft Entra users.
    What is the best explanation?
  options:
    A: Cloud-only users can be created only by Microsoft Support.
    B: The subscription must be moved to the same region as the tenant.
    C: The Owner role works only after the Microsoft.Graph resource provider is registered.
    D: Azure RBAC Owner does not grant Microsoft Entra directory-management permissions.
  correctOption: D
  explanation: Azure RBAC and Microsoft Entra roles protect different resource systems. A suitable directory role such as
    User Administrator is normally required for the exercise.
  distractorExplanations:
    A: Authorized tenant administrators can create cloud-only users directly.
    B: Microsoft Entra user creation is tenant-scoped and not tied to an Azure region.
    C: Microsoft Graph access is not enabled by registering an Azure resource provider.
    D: Correct. Subscription ownership and tenant identity administration are separate authorization planes.
  sourceUrls:
  - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/concept-understand-roles
  - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
  lastVerified: '2026-08-30'
