- id: LAB01-Q24
  objectiveIds:
  - IG-USERS-02
  difficulty: applied
  stem: 'A deployment pipeline reaches this decision point: User B is added as an owner of a security group but is intentionally
    not added as a member. Which statement correctly describes the result?'
  options:
    A: Ownership and membership are separate relationships; ownership does not automatically grant member-based access.
    B: A group cannot have an owner unless that owner is also a direct member.
    C: Ownership converts the security group into a Microsoft 365 group.
    D: The owner is always treated as a transitive member for every access assignment.
  correctOption: A
  explanation: Owners manage a group according to directory policy, while members receive access or app behavior associated
    with membership. One relationship does not imply the other.
  distractorExplanations:
    A: Correct. Validate owners and members independently.
    B: Microsoft Entra supports group owners who are not direct members.
    C: Changing an owner does not alter mail or group-type properties.
    D: Owner status does not universally create direct or transitive membership.
  sourceUrls:
  - https://learn.microsoft.com/en-us/cli/azure/ad/group/owner?view=azure-cli-latest
  - https://learn.microsoft.com/en-us/cli/azure/ad/group/member?view=azure-cli-latest
  lastVerified: '2026-08-30'
