  - IG-USERS-02
  difficulty: advanced
  stem: Cleanup deletes the lab security group and both cloud users by exact ID. Validation can no longer read the active
    users, but they appear under Deleted users. How should this state be interpreted?
  options:
    A: Cleanup failed because user deletion is unsupported in Microsoft Entra ID.
    B: Active cleanup succeeded; user deletion is recoverable until retention expires or an authorized permanent deletion
      occurs.
    C: The users automatically became external guests and must be invited again.
    D: The Azure subscription must be deleted to remove the user objects permanently.
  correctOption: B
  explanation: Microsoft Entra normally soft-deletes users so they can be restored during a retention window. Permanent deletion
    is a separate, irreversible operation with its own authorization needs.
  distractorExplanations:
    A: The presence of recoverable deleted users is expected lifecycle behavior, not proof of failure.
    B: Correct. Audit active-object cleanup separately from deleted-item retention.
    C: Deletion does not transform a member user into a B2B guest.
    D: Microsoft Entra users are tenant objects and are not removed by deleting a subscription.
  sourceUrls:
  - https://learn.microsoft.com/en-us/entra/fundamentals/users-restore
  - https://learn.microsoft.com/en-us/graph/api/directory-deleteditems-delete?view=graph-rest-1.0
  lastVerified: '2026-08-30'
- id: LAB01-Q42
  objectiveIds:
