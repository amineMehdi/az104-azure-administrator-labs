  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "The guest collaboration architecture note requires the external-collaboration and SSPR pilot environment to supply the regional attribute required before a cloud license is assigned. Which statement defines the relevant guest collaboration boundary?"
  options:
    A: "Direct licensing adds a SKU to one user and can disable selected service plans within that SKU."
    B: "externalUserState changes from PendingAcceptance after the invited guest successfully redeems access."
    C: "A user's usageLocation must be set before Microsoft Entra can assign many commercial licenses."
    D: "The tenant policy determines how many and which registered methods a user needs for password reset."
  correctOption: "C"
  optionExplanations:
    A: "Direct licensing adds a SKU to one user and can disable selected service plans within that SKU. In the external-collaboration and SSPR pilot, this statement describes direct license assignment. The direct license assignment statement accurately describes direct license assignment; however, external-collaboration and SSPR pilot needs usage location prerequisite to supply the regional attribute required before a cloud license is assigned; direct license assignment cannot replace usage location prerequisite."
    B: "externalUserState changes from PendingAcceptance after the invited guest successfully redeems access. In the external-collaboration and SSPR pilot, this statement describes guest redemption state. Selecting guest redemption state for external-collaboration and SSPR pilot leaves usage location prerequisite unanswered in external-collaboration and SSPR pilot; the external-collaboration and SSPR pilot lacks a usage location prerequisite basis to supply the regional attribute required before a cloud license is assigned."
    C: "A user's usageLocation must be set before Microsoft Entra can assign many commercial licenses. In the external-collaboration and SSPR pilot, this usage location prerequisite rule supports the need to supply the regional attribute required before a cloud license is assigned."
    D: "The tenant policy determines how many and which registered methods a user needs for password reset. In the external-collaboration and SSPR pilot, this statement describes SSPR authentication methods. External-collaboration and SSPR pilot asks about usage location prerequisite; this SSPR authentication methods choice leaves the usage location prerequisite explanation missing."
  sources:
    - title: "Assign licenses to a user with Microsoft Graph"
      url: "https://learn.microsoft.com/en-us/graph/api/user-assignlicense?view=graph-rest-1.0"
  lastVerified: "2026-08-31"
- id: "LAB02-Q03"
  objectiveIds:
    - "IG-USERS-03"
  checkpointIds:
    - "LAB02-CP03"
  remediationAnchor: "#task-3"
  difficulty: "foundational"
  stem: "A new guest collaboration operator must explain why the external-collaboration and SSPR pilot can license one pilot user without depending on group membership. Which explanation is accurate?"
  options:
    A: "Group-based licensing applies assigned product licenses to eligible members of a licensed group."
    B: "A guest remains a tenant directory object whose display name, sponsors, groups, and access require lifecycle governance."
    C: "Direct licensing adds a SKU to one user and can disable selected service plans within that SKU."
    D: "SSPR capabilities depend on eligible licensing, policy scope, and special rules for administrator accounts."
  correctOption: "C"
  optionExplanations:
    A: "Group-based licensing applies assigned product licenses to eligible members of a licensed group. In the external-collaboration and SSPR pilot, this statement describes group-based licensing. Selecting group-based licensing for external-collaboration and SSPR pilot leaves direct license assignment unanswered in external-collaboration and SSPR pilot; the external-collaboration and SSPR pilot lacks a direct license assignment basis to license one pilot user without depending on group membership."
    B: "A guest remains a tenant directory object whose display name, sponsors, groups, and access require lifecycle governance. In the external-collaboration and SSPR pilot, this statement describes guest lifecycle properties. Direct license assignment governs external-collaboration and SSPR pilot; guest lifecycle properties cannot support direct license assignment when operators must license one pilot user without depending on group membership."
    C: "For the external-collaboration and SSPR pilot, the rule for direct license assignment is defined by this statement: direct licensing adds a SKU to one user and can disable selected service plans within that SKU. It supports the required outcome to license one pilot user without depending on group membership."
    D: "SSPR capabilities depend on eligible licensing, policy scope, and special rules for administrator accounts. In the external-collaboration and SSPR pilot, this statement describes SSPR licensing and role gates. The SSPR licensing and role gates statement accurately describes SSPR licensing and role gates; however, external-collaboration and SSPR pilot needs direct license assignment to license one pilot user without depending on group membership; SSPR licensing and role gates cannot replace direct license assignment."
  sources:
    - title: "Assign licenses to a user with Microsoft Graph"
      url: "https://learn.microsoft.com/en-us/graph/api/user-assignlicense?view=graph-rest-1.0"
  lastVerified: "2026-08-31"
