    C: "First, Configure permitted reset methods and require users to register enough approved methods. Then, Compare the user's registered authentication methods with the tenant's SSPR method requirements. For external-collaboration and SSPR pilot, the SSPR authentication methods operation precedes its SSPR authentication methods read-back check, allowing it to allow only the approved proofs during password reset."
    D: "First, Track the guest by object ID and wait for redemption before depending on interactive access. Then, Query externalUserState and its change timestamp for the invited user. This external-collaboration and SSPR pilot pair serves guest redemption state. External-collaboration and SSPR pilot closes guest redemption state, not SSPR authentication methods; without the SSPR authentication methods workflow, it cannot allow only the approved proofs during password reset."
