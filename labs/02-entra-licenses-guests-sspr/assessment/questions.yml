    C: "SSPR can target all users or selected groups, subject to tenant licensing and authentication-method policy. In the external-collaboration and SSPR pilot, this statement describes SSPR registration scope. The SSPR registration scope statement accurately describes SSPR registration scope; however, external-collaboration and SSPR pilot needs group-based licensing to license a rotating team through membership rather than individual assignments; SSPR registration scope cannot replace group-based licensing."
    D: "A tenant can assign a product license only when its subscribed quantity has an unconsumed unit. In the external-collaboration and SSPR pilot, this statement describes available license capacity. Selecting available license capacity for external-collaboration and SSPR pilot leaves group-based licensing unanswered in external-collaboration and SSPR pilot; the external-collaboration and SSPR pilot lacks a group-based licensing basis to license a rotating team through membership rather than individual assignments."
