- id: LAB02-Q01
  objectiveIds:
  - IG-USERS-03
  difficulty: foundational
  stem: Which principle is most important when working on 'Manage licenses in Microsoft Entra ID' in Lab 02?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: SSPR and group-based licensing are tenant capabilities with role and license gates; inventory and scoped pilots are
      safer than tenant-wide changes.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: C
  explanation: 'The lab establishes this design principle: SSPR and group-based licensing are tenant capabilities with role
    and license gates; inventory and scoped pilots are safer than tenant-wide changes.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: 'Correct. The lab establishes this design principle: SSPR and group-based licensing are tenant capabilities with role
      and license gates; inventory and scoped pilots are safer than tenant-wide changes.'
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/entra/fundamentals/how-to-manage-user-profile-info
  lastVerified: '2026-08-30'
