  difficulty: "foundational"
  stem: "A guest collaboration dry run shows no external-collaboration and SSPR pilot command will confirm that the tenant has an unused product unit before assignment. Which action belongs before execution?"
  options:
    A: "Submit addLicenses for the target user with the required SKU ID and any disabled plan IDs."
    B: "Track the guest by object ID and wait for redemption before depending on interactive access."
    C: "Configure permitted reset methods and require users to register enough approved methods."
    D: "Read subscribedSkus and calculate enabled units minus consumed units before assigning a license."
  correctOption: "D"
  optionExplanations:
    A: "Submit addLicenses for the target user with the required SKU ID and any disabled plan IDs. In the external-collaboration and SSPR pilot, this action changes direct license assignment. External-collaboration and SSPR pilot approved available license capacity, not direct license assignment; only the available license capacity change can confirm that the tenant has an unused product unit before assignment."
    B: "Track the guest by object ID and wait for redemption before depending on interactive access. In the external-collaboration and SSPR pilot, this action changes guest redemption state. External-collaboration and SSPR pilot requires available license capacity; changing guest redemption state leaves available license capacity absent in external-collaboration and SSPR pilot; external-collaboration and SSPR pilot cannot confirm that the tenant has an unused product unit before assignment."
    C: "Configure permitted reset methods and require users to register enough approved methods. In the external-collaboration and SSPR pilot, this action changes SSPR authentication methods. SSPR authentication methods does not implement available license capacity for external-collaboration and SSPR pilot; the external-collaboration and SSPR pilot still cannot confirm that the tenant has an unused product unit before assignment."
    D: "The external-collaboration and SSPR pilot must confirm that the tenant has an unused product unit before assignment; this option performs its direct available license capacity change: read subscribedSkus and calculate enabled units minus consumed units before assigning a license."
