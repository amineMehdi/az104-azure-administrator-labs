  optionExplanations:
    A: "Assign the SKU to the licensing group and add eligible users as members. In the external-collaboration and SSPR pilot, this action changes group-based licensing. External-collaboration and SSPR pilot requires usage location prerequisite; changing group-based licensing leaves usage location prerequisite absent in external-collaboration and SSPR pilot; external-collaboration and SSPR pilot cannot supply the regional attribute required before a cloud license is assigned."
    B: "Set the user's two-letter usage location before submitting the license assignment. It is the least-change usage location prerequisite path for the external-collaboration and SSPR pilot requirement to supply the regional attribute required before a cloud license is assigned."
    C: "Record the guest object ID and assign only the groups needed for the collaboration period. In the external-collaboration and SSPR pilot, this action changes guest lifecycle properties. External-collaboration and SSPR pilot instead needs usage location prerequisite: Set the user's two-letter usage location before submitting the license assignment. The guest lifecycle properties action omits that usage location prerequisite work."
    D: "Verify licensing and use a nonprivileged pilot identity before validating the standard SSPR path. In the external-collaboration and SSPR pilot, this action changes SSPR licensing and role gates. External-collaboration and SSPR pilot approved usage location prerequisite, not SSPR licensing and role gates; only the usage location prerequisite change can supply the regional attribute required before a cloud license is assigned."
