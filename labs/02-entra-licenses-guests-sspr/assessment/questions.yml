- id: "LAB02-Q01"
  objectiveIds:
    - "IG-USERS-03"
  checkpointIds:
    - "LAB02-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The guest collaboration review compares four claims for the external-collaboration and SSPR pilot requirement to confirm that the tenant has an unused product unit before assignment. Which claim is technically sound?"
  options:
    A: "A user's usageLocation must be set before Microsoft Entra can assign many commercial licenses."
    B: "A B2B invitation creates an external user object and sends or returns a redemption invitation."
    C: "A tenant can assign a product license only when its subscribed quantity has an unconsumed unit."
    D: "SSPR can target all users or selected groups, subject to tenant licensing and authentication-method policy."
  correctOption: "C"
  optionExplanations:
    A: "A user's usageLocation must be set before Microsoft Entra can assign many commercial licenses. In the external-collaboration and SSPR pilot, this statement describes usage location prerequisite. External-collaboration and SSPR pilot asks about available license capacity; this usage location prerequisite choice leaves the available license capacity explanation missing."
    B: "A B2B invitation creates an external user object and sends or returns a redemption invitation. In the external-collaboration and SSPR pilot, this statement describes B2B guest invitations. The B2B guest invitations statement accurately describes B2B guest invitations; however, external-collaboration and SSPR pilot needs available license capacity to confirm that the tenant has an unused product unit before assignment; B2B guest invitations cannot replace available license capacity."
    C: "A tenant can assign a product license only when its subscribed quantity has an unconsumed unit. For external-collaboration and SSPR pilot, available license capacity supplies the service rule needed to confirm that the tenant has an unused product unit before assignment."
    D: "SSPR can target all users or selected groups, subject to tenant licensing and authentication-method policy. In the external-collaboration and SSPR pilot, this statement describes SSPR registration scope. Available license capacity governs external-collaboration and SSPR pilot; SSPR registration scope cannot support available license capacity when operators must confirm that the tenant has an unused product unit before assignment."
  sources:
    - title: "List subscribed SKUs with Microsoft Graph"
      url: "https://learn.microsoft.com/en-us/graph/api/subscribedsku-list?view=graph-rest-1.0"
  lastVerified: "2026-08-31"
- id: "LAB02-Q02"
  objectiveIds:
