<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="554" viewBox="0 0 1148 554" role="img" aria-labelledby="lab06-title lab06-desc">
  <title id="lab06-title">LAB-06 architecture: Secure storage accounts, redundancy, encryption, and keys</title>
  <desc id="lab06-desc">Left-to-right service topology with 9 components and 8 directed relationships. Components: Azure CLI control plane, Hardened StorageV2 ZRS or LRS, Regional SKU inventory, Managed identity, Confidential encryption scope, Entra learner identity, Private blob container, OAuth uploaded blob, Shared Key request. Relationships: Azure CLI control plane to Hardened StorageV2 ZRS or LRS; Regional SKU inventory to Hardened StorageV2 ZRS or LRS (select supported redundancy); Hardened StorageV2 ZRS or LRS to Managed identity (system assigned); Hardened StorageV2 ZRS or LRS to Confidential encryption scope (two encryption layers); Entra learner identity to Private blob container (Blob Data Contributor); Confidential encryption scope to Private blob container (default scope); Private blob container to OAuth uploaded blob; Shared Key request to Hardened StorageV2 ZRS or LRS (denied).</desc>
  <metadata id="lab06-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/1.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;b60699e21abce0de0653c25e28115b123c0ce7470d9401320a28529ee0ebdc14&quot;}</metadata>
