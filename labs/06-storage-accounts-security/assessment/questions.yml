    D: "Disabling shared-key authorization forces supported data operations to use Microsoft Entra authorization or another approved mechanism. In the hardened general-purpose storage account, this statement describes shared key authorization. StorageV2 accounts governs hardened general-purpose storage account; shared key authorization cannot support StorageV2 accounts when operators must create the general-purpose account type that supports current storage services."
  sources:
