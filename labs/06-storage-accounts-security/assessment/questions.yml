  difficulty: foundational
  stem: Which statement best captures the key design principle for secure storage accounts, redundancy, encryption,
    and keys?
  options:
    A: Redundancy protects copies of data, encryption protects data at rest, and access keys are broad secrets that
      must be rotated without entering state or command evidence.
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
  explanation: 'The lab''s central distinction is: Redundancy protects copies of data, encryption protects data
    at rest, and access keys are broad secrets that must be rotated without entering state or command evidence.'
  distractorExplanations:
    A: 'Correct. The lab''s central distinction is: Redundancy protects copies of data, encryption protects data
      at rest, and access keys are broad secrets that must be rotated without entering state or command evidence.'
    B: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create
  lastVerified: '2026-08-30'
