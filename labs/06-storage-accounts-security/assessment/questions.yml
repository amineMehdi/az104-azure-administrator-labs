- id: LAB06-Q01
  objectiveIds:
  - ST-ACCESS-04
  difficulty: foundational
  stem: Which principle is most important when working on 'Manage access keys' in Lab 06?
  options:
    A: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    B: A recognizable resource name removes the need for validation and scoped cleanup.
    C: Redundancy protects copies of data, encryption protects data at rest, and access keys are broad secrets that must be
      rotated without entering state or command evidence.
    D: The shortest command is always correct even when it changes a broader scope.
  correctOption: C
  explanation: 'The lab establishes this design principle: Redundancy protects copies of data, encryption protects data at
    rest, and access keys are broad secrets that must be rotated without entering state or command evidence.'
  distractorExplanations:
    A: This choice skips independent evidence or relies on ambiguous resource identity.
    B: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    C: 'Correct. The lab establishes this design principle: Redundancy protects copies of data, encryption protects data at
      rest, and access keys are broad secrets that must be rotated without entering state or command evidence.'
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-account-create
  lastVerified: '2026-08-30'
