  <title id="lab26-title">LAB-26 architecture: Capstone — Build a governed, secure, observable Azure workload</title>
  <desc id="lab26-desc">Left-to-right service topology with 12 components and 13 directed relationships. Components: Bicep governed foundation, Segmented VNet and NSG, Private backend VM 1, Private backend VM 2, Standard load balancer, Blob private endpoint and DNS, Public-disabled storage, Diagnostics to Log Analytics, Scoped Policy, Optional scoped RBAC, Traffic, data, and governance assertions, Dependency-aware capstone cleanup. Relationships: Bicep governed foundation to Segmented VNet and NSG; Segmented VNet and NSG to Private backend VM 1; Segmented VNet and NSG to Private backend VM 2; Standard load balancer to Private backend VM 1; Standard load balancer to Private backend VM 2; Segmented VNet and NSG to Blob private endpoint and DNS; Blob private endpoint and DNS to Public-disabled storage; Public-disabled storage to Diagnostics to Log Analytics; Scoped Policy to Bicep governed foundation; Optional scoped RBAC to Public-disabled storage; Standard load balancer to Traffic, data, and governance assertions; Diagnostics to Log Analytics to Traffic, data, and governance assertions; Traffic, data, and governance assertions to Dependency-aware capstone cleanup.</desc>
