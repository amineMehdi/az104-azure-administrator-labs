  difficulty: foundational
  stem: Which statement best captures the key design principle for capstone — build a governed, secure, observable
    azure workload?
  options:
    A: The build capstone proves that governance, identity, networking, compute, storage, and observability are
      coupled design decisions and must share a recorded deployment and cleanup boundary.
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
