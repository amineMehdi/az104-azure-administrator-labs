      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-cli
