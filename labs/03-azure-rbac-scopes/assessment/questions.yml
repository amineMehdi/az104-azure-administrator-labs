  difficulty: foundational
  stem: Which principle is most important when working on 'Manage built-in Azure roles' in Lab 03?
  options:
    A: A role definition describes allowed actions; a role assignment binds that definition to a principal at a
      scope, with inheritance flowing downward.
    B: The shortest command is always correct even when it changes a broader scope.
    C: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: A
  explanation: 'The lab establishes this design principle: A role definition describes allowed actions; a role assignment
    binds that definition to a principal at a scope, with inheritance flowing downward.'
  distractorExplanations:
    A: 'Correct. The lab establishes this design principle: A role definition describes allowed actions; a role
      assignment binds that definition to a principal at a scope, with inheritance flowing downward.'
    B: This choice changes or trusts a broader scope than the recorded lab boundary.
    C: This choice skips independent evidence or relies on ambiguous resource identity.
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-powershell
  lastVerified: '2026-08-30'
