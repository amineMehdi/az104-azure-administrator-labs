    D: "Inspect applicable deny assignments when an apparently authorized action is rejected. In the least-privilege workload delegation, this action changes deny assignments. Least-privilege workload delegation approved Reader role, not deny assignments; only the Reader role change can let an auditor inspect configuration without changing it."
