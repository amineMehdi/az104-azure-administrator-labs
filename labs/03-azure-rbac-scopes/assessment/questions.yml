- id: LAB03-Q01
  objectiveIds:
  - IG-ACCESS-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Manage built-in Azure roles' in Lab 03?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: A role definition describes allowed actions; a role assignment binds that definition to a principal at a scope, with
      inheritance flowing downward.
  correctOption: D
  explanation: 'The lab establishes this design principle: A role definition describes allowed actions; a role assignment
    binds that definition to a principal at a scope, with inheritance flowing downward.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: 'Correct. The lab establishes this design principle: A role definition describes allowed actions; a role assignment
      binds that definition to a principal at a scope, with inheritance flowing downward.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-powershell
  lastVerified: '2026-08-30'
