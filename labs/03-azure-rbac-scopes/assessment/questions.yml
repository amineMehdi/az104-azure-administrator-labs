- id: "LAB03-Q01"
  objectiveIds:
    - "IG-ACCESS-01"
  checkpointIds:
    - "LAB03-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The least-privilege workload delegation acceptance criteria require operators to separate a role's permissions from the principal and scope that receive them. Which service fact supports that requirement?"
  options:
    A: "Reader can view control-plane resources but cannot change them or automatically read protected data-plane content."
    B: "Least privilege chooses the narrowest role whose actions satisfy the required work."
    C: "Assigning a role to a group lets eligible members receive access through group membership."
    D: "A role definition lists permitted actions, while a role assignment binds that definition to a principal at a scope."
  correctOption: "D"
  optionExplanations:
    A: "Reader can view control-plane resources but cannot change them or automatically read protected data-plane content. In the least-privilege workload delegation, this statement describes Reader role. Least-privilege workload delegation asks about role definitions and assignments; this Reader role choice leaves the role definitions and assignments explanation missing."
    B: "Least privilege chooses the narrowest role whose actions satisfy the required work. In the least-privilege workload delegation, this statement describes least-privilege role selection. The least-privilege role selection statement accurately describes least-privilege role selection; however, least-privilege workload delegation needs role definitions and assignments to separate a role's permissions from the principal and scope that receive them; least-privilege role selection cannot replace role definitions and assignments."
    C: "Assigning a role to a group lets eligible members receive access through group membership. In the least-privilege workload delegation, this statement describes group-based role assignment. Selecting group-based role assignment for least-privilege workload delegation leaves role definitions and assignments unanswered in least-privilege workload delegation; the least-privilege workload delegation lacks a role definitions and assignments basis to separate a role's permissions from the principal and scope that receive them."
    D: "A role definition lists permitted actions, while a role assignment binds that definition to a principal at a scope. For least-privilege workload delegation, role definitions and assignments supplies the service rule needed to separate a role's permissions from the principal and scope that receive them."
  sources:
    - title: "Understand Azure role definitions"
      url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions"
  lastVerified: "2026-08-31"
- id: "LAB03-Q02"
  objectiveIds:
    - "IG-ACCESS-01"
  checkpointIds:
    - "LAB03-CP02"
  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "An access delegation reviewer challenges whether the least-privilege workload delegation can let an auditor inspect configuration without changing it. Which response resolves the concern?"
  options:
    A: "Contributor can manage resources but cannot grant Azure RBAC access to other principals."
    B: "Reader can view control-plane resources but cannot change them or automatically read protected data-plane content."
    C: "An assignment at a parent scope is inherited by child resource groups and resources unless another control denies access."
    D: "Effective access combines direct assignments, group assignments, and assignments inherited from parent scopes."
  correctOption: "B"
  optionExplanations:
    A: "Contributor can manage resources but cannot grant Azure RBAC access to other principals. In the least-privilege workload delegation, this statement describes Contributor role. The Contributor role statement accurately describes Contributor role; however, least-privilege workload delegation needs Reader role to let an auditor inspect configuration without changing it; Contributor role cannot replace Reader role."
    B: "Reader can view control-plane resources but cannot change them or automatically read protected data-plane content. In the least-privilege workload delegation, this Reader role rule supports the need to let an auditor inspect configuration without changing it."
    C: "An assignment at a parent scope is inherited by child resource groups and resources unless another control denies access. In the least-privilege workload delegation, this statement describes scope inheritance. Reader role governs least-privilege workload delegation; scope inheritance cannot support Reader role when operators must let an auditor inspect configuration without changing it."
    D: "Effective access combines direct assignments, group assignments, and assignments inherited from parent scopes. In the least-privilege workload delegation, this statement describes effective access interpretation. Least-privilege workload delegation asks about Reader role; this effective access interpretation choice leaves the Reader role explanation missing."
  sources:
    - title: "Azure built-in general roles"
      url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/general"
  lastVerified: "2026-08-31"
- id: "LAB03-Q03"
