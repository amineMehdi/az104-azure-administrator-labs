    A: "Contributor can manage resources but cannot grant Azure RBAC access to other principals."
    B: "User Access Administrator manages access assignments without granting general resource-management permissions."
    C: "A resource-level role assignment limits the authorization boundary to one resource."
    D: "A deny assignment can block an operation even when a role assignment otherwise allows that action."
  correctOption: "A"
  optionExplanations:
    A: "For the least-privilege workload delegation, the rule for Contributor role is defined by this statement: contributor can manage resources but cannot grant Azure RBAC access to other principals. It supports the required outcome to let an operator manage resources without granting access to other principals."
    B: "User Access Administrator manages access assignments without granting general resource-management permissions. In the least-privilege workload delegation, this statement describes User Access Administrator role. Contributor role governs least-privilege workload delegation; User Access Administrator role cannot support Contributor role when operators must let an operator manage resources without granting access to other principals."
    C: "A resource-level role assignment limits the authorization boundary to one resource. In the least-privilege workload delegation, this statement describes resource-level assignments. Least-privilege workload delegation asks about Contributor role; this resource-level assignments choice leaves the Contributor role explanation missing."
    D: "A deny assignment can block an operation even when a role assignment otherwise allows that action. In the least-privilege workload delegation, this statement describes deny assignments. The deny assignments statement accurately describes deny assignments; however, least-privilege workload delegation needs Contributor role to let an operator manage resources without granting access to other principals; deny assignments cannot replace Contributor role."
  sources:
    - title: "Azure built-in general roles"
      url: "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/general"
  lastVerified: "2026-08-31"
