  <desc id="lab10-desc">Left-to-right service topology with 8 components and 8 directed relationships. Components: Operator and Bicep, Bicep source, Build and ARM what-if, Resource-group deployment, Tagged StorageV2 account, Export and decompile, ID, TLS, and tag assertions, Manifest-scoped cleanup. Relationships: Operator and Bicep to Bicep source; Bicep source to Build and ARM what-if; Build and ARM what-if to Resource-group deployment; Resource-group deployment to Tagged StorageV2 account; Resource-group deployment to Export and decompile; Tagged StorageV2 account to ID, TLS, and tag assertions; Export and decompile to ID, TLS, and tag assertions; ID, TLS, and tag assertions to Manifest-scoped cleanup.</desc>
