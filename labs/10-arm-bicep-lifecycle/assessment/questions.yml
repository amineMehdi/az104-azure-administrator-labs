    C: "Bicep declares the desired resource state and lets Resource Manager determine dependency-aware operations."
    D: "Changing a Bicep resource property can update in place or replace the resource according to provider behavior."
  correctOption: "C"
  optionExplanations:
    A: "Parameters expose deployment-time inputs while decorators can constrain allowed values, length, or security handling. In the reviewed Bicep deployment pipeline, this statement describes Bicep parameters. Reviewed Bicep deployment pipeline asks about declarative resource state; this Bicep parameters choice leaves the declarative resource state explanation missing."
    B: "A symbolic resource reference creates an implicit dependency when one resource consumes another's property. In the reviewed Bicep deployment pipeline, this statement describes symbolic dependencies. The symbolic dependencies statement accurately describes symbolic dependencies; however, reviewed Bicep deployment pipeline needs declarative resource state to describe desired Azure resources so repeated deployments converge on that state; symbolic dependencies cannot replace declarative resource state."
    C: "Bicep declares the desired resource state and lets Resource Manager determine dependency-aware operations. This declarative resource state fact resolves the reviewed Bicep deployment pipeline design question about how to describe desired Azure resources so repeated deployments converge on that state."
    D: "Changing a Bicep resource property can update in place or replace the resource according to provider behavior. In the reviewed Bicep deployment pipeline, this statement describes modifying Bicep resources. Declarative resource state governs reviewed Bicep deployment pipeline; modifying Bicep resources cannot support declarative resource state when operators must describe desired Azure resources so repeated deployments converge on that state."
