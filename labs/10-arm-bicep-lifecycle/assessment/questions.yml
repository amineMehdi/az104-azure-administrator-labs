- id: LAB10-Q01
  objectiveIds:
  - CP-IAC-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Interpret an Azure Resource Manager template or a Bicep file' in
    Lab 10?
  options:
    A: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    B: A recognizable resource name removes the need for validation and scoped cleanup.
    C: Bicep compiles to ARM JSON, what-if predicts control-plane changes, and exported/decompiled templates require human
      review rather than being treated as pristine source.
    D: The shortest command is always correct even when it changes a broader scope.
  correctOption: C
  explanation: 'The lab establishes this design principle: Bicep compiles to ARM JSON, what-if predicts control-plane changes,
    and exported/decompiled templates require human review rather than being treated as pristine source.'
  distractorExplanations:
    A: This choice skips independent evidence or relies on ambiguous resource identity.
    B: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    C: 'Correct. The lab establishes this design principle: Bicep compiles to ARM JSON, what-if predicts control-plane changes,
      and exported/decompiled templates require human review rather than being treated as pristine source.'
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview
  lastVerified: '2026-08-30'
