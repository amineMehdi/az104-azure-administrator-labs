    B: 'Correct. Least privilege requires the documented boundary: Contributor plus Storage Account Contributor on the lab
      resource group'
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/rest/api/storageservices/define-stored-access-policy
  lastVerified: '2026-08-30'
