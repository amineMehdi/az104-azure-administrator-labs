- id: "LAB07-Q01"
  objectiveIds:
    - "ST-ACCESS-01"
  checkpointIds:
    - "LAB07-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The restricted storage data-plane design handoff omits the network perimeter rule needed to deny public-endpoint traffic unless an explicit network exception allows it. Which statement should the team add?"
  options:
    A: "An IP network rule permits public-endpoint requests originating from a listed public IPv4 address or CIDR range."
    B: "A service SAS delegates access to one storage service, whereas an account SAS can cover multiple services and resource types."
    C: "A default action of Deny restricts the public endpoint to explicitly allowed networks and exceptions."
    D: "A stored access policy on a container or share can supply constraints for service SAS tokens that reference its identifier."
  correctOption: "C"
  optionExplanations:
    A: "An IP network rule permits public-endpoint requests originating from a listed public IPv4 address or CIDR range. In the restricted storage data-plane design, this statement describes storage IP network rules. Restricted storage data-plane design asks about storage firewall default action; this storage IP network rules choice leaves the storage firewall default action explanation missing."
    B: "A service SAS delegates access to one storage service, whereas an account SAS can cover multiple services and resource types. In the restricted storage data-plane design, this statement describes service and account SAS scope. The service and account SAS scope statement accurately describes service and account SAS scope; however, restricted storage data-plane design needs storage firewall default action to deny public-endpoint traffic unless an explicit network exception allows it; service and account SAS scope cannot replace storage firewall default action."
    C: "A default action of Deny restricts the public endpoint to explicitly allowed networks and exceptions. In the restricted storage data-plane design, this storage firewall default action rule supports the need to deny public-endpoint traffic unless an explicit network exception allows it."
    D: "A stored access policy on a container or share can supply constraints for service SAS tokens that reference its identifier. In the restricted storage data-plane design, this statement describes stored access policies. Storage firewall default action governs restricted storage data-plane design; stored access policies cannot support storage firewall default action when operators must deny public-endpoint traffic unless an explicit network exception allows it."
  sources:
    - title: "Configure Azure Storage firewalls and virtual networks"
      url: "https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security"
  lastVerified: "2026-08-31"
