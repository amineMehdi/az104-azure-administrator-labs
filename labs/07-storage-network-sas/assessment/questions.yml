  correctOption: "C"
  optionExplanations:
    A: "A Microsoft.Storage service endpoint lets a selected subnet identity be authorized on a storage firewall while traffic reaches the service public endpoint. In the restricted storage data-plane design, this statement describes virtual-network service endpoints. The virtual-network service endpoints statement accurately describes virtual-network service endpoints; however, restricted storage data-plane design needs storage IP network rules to permit traffic at the public service address only from an approved IPv4 range; virtual-network service endpoints cannot replace storage IP network rules."
    B: "A user delegation SAS for Blob Storage is signed with a Microsoft Entra user delegation key rather than an account key. In the restricted storage data-plane design, this statement describes user delegation SAS. Selecting user delegation SAS for restricted storage data-plane design leaves storage IP network rules unanswered in restricted storage data-plane design; the restricted storage data-plane design lacks a storage IP network rules basis to permit traffic at the public service address only from an approved IPv4 range."
    C: "For the restricted storage data-plane design, the rule for storage IP network rules is defined by this statement: an IP network rule permits public-endpoint requests originating from a listed public IPv4 address or CIDR range. It supports the required outcome to permit traffic at the public service address only from an approved IPv4 range."
    D: "Changing or deleting a stored access policy can revoke service SAS tokens associated with that policy after propagation. In the restricted storage data-plane design, this statement describes stored-policy revocation. Restricted storage data-plane design asks about storage IP network rules; this stored-policy revocation choice leaves the storage IP network rules explanation missing."
