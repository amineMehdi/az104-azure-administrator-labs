- id: LAB07-Q01
  objectiveIds:
  - ST-ACCESS-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Configure Azure Storage firewalls and virtual networks'
    in Lab 07?
  options:
    A: A stored access policy can revoke or change a service SAS, while account SAS and access keys have broader
      authority and require stricter handling.
    B: The shortest command is always correct even when it changes a broader scope.
    C: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: A
  explanation: 'The lab establishes this design principle: A stored access policy can revoke or change a service
    SAS, while account SAS and access keys have broader authority and require stricter handling.'
  distractorExplanations:
    A: 'Correct. The lab establishes this design principle: A stored access policy can revoke or change a service
      SAS, while account SAS and access keys have broader authority and require stricter handling.'
    B: This choice changes or trusts a broader scope than the recorded lab boundary.
    C: This choice skips independent evidence or relies on ambiguous resource identity.
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
  lastVerified: '2026-08-30'
