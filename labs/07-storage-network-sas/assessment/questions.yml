- id: LAB07-Q01
  objectiveIds:
  - ST-ACCESS-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Configure Azure Storage firewalls and virtual networks' in Lab
    07?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: A stored access policy can revoke or change a service SAS, while account SAS and access keys have broader authority
      and require stricter handling.
  correctOption: D
  explanation: 'The lab establishes this design principle: A stored access policy can revoke or change a service SAS, while
    account SAS and access keys have broader authority and require stricter handling.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: 'Correct. The lab establishes this design principle: A stored access policy can revoke or change a service SAS, while
      account SAS and access keys have broader authority and require stricter handling.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
  lastVerified: '2026-08-30'
