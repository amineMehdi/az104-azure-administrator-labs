    D: "First, Create required records before the validation window and account for prior negative responses. Then, Query the authoritative name servers directly and compare with the recursive resolver response. This authoritative DNS and Bastion rollout pair serves DNS negative caching. Authoritative DNS and Bastion rollout closes DNS negative caching, not Bastion public IP; without the Bastion public IP workflow, it cannot attach the supported public address configuration to the managed jump host."
