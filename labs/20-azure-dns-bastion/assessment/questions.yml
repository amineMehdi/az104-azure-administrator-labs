  stem: "The authoritative DNS and Bastion rollout handoff omits the name-resolution verification rule needed to make the parent domain direct queries to the Azure-hosted child zone. Which statement should the team add?"
  options:
    A: "A DNS record set groups records of one type and name and applies a shared TTL at that label."
    B: "Delegation requires the parent zone or registrar to publish NS records naming the child zone's Azure DNS name servers."
    C: "Resolvers can cache a nonexistent-name response according to the zone's SOA negative caching behavior."
    D: "Azure Bastion uses a supported Standard, static public IP configuration for its managed host."
  correctOption: "B"
  optionExplanations:
    A: "A DNS record set groups records of one type and name and applies a shared TTL at that label. In the authoritative DNS and Bastion rollout, this statement describes DNS record sets. The DNS record sets statement accurately describes DNS record sets; however, authoritative DNS and Bastion rollout needs DNS delegation to make the parent domain direct queries to the Azure-hosted child zone; DNS record sets cannot replace DNS delegation."
    B: "Delegation requires the parent zone or registrar to publish NS records naming the child zone's Azure DNS name servers. In the authoritative DNS and Bastion rollout, this DNS delegation rule supports the need to make the parent domain direct queries to the Azure-hosted child zone."
    C: "Resolvers can cache a nonexistent-name response according to the zone's SOA negative caching behavior. In the authoritative DNS and Bastion rollout, this statement describes DNS negative caching. DNS delegation governs authoritative DNS and Bastion rollout; DNS negative caching cannot support DNS delegation when operators must make the parent domain direct queries to the Azure-hosted child zone."
    D: "Azure Bastion uses a supported Standard, static public IP configuration for its managed host. In the authoritative DNS and Bastion rollout, this statement describes Bastion public IP. Authoritative DNS and Bastion rollout asks about DNS delegation; this Bastion public IP choice leaves the DNS delegation explanation missing."
