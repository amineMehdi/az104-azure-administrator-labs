    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: 'Correct. The lab establishes this design principle: Bastion provides managed administrative connectivity
      without VM public IPs, while Azure DNS becomes authoritative only after the parent domain delegates to its
      assigned name servers.'
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/bastion/tutorial-create-host-cli
