  difficulty: "foundational"
  stem: "A name-resolution verification reviewer challenges whether the authoritative DNS and Bastion rollout can publish internet records by using Azure-hosted DNS authority. Which response resolves the concern?"
  options:
    A: "Delegation requires the parent zone or registrar to publish NS records naming the child zone's Azure DNS name servers."
    B: "Resolver caches can retain an earlier DNS answer until its TTL expires even after the authoritative record changes."
    C: "Current Azure Bastion deployments require a sufficiently large dedicated subnet, commonly /26 or larger for supported scaling and features."
    D: "An Azure public DNS zone hosts authoritative records but does not register or purchase the domain name."
  correctOption: "D"
  optionExplanations:
    A: "Delegation requires the parent zone or registrar to publish NS records naming the child zone's Azure DNS name servers. In the authoritative DNS and Bastion rollout, this statement describes DNS delegation. Authoritative DNS and Bastion rollout asks about public DNS zones; this DNS delegation choice leaves the public DNS zones explanation missing."
    B: "Resolver caches can retain an earlier DNS answer until its TTL expires even after the authoritative record changes. In the authoritative DNS and Bastion rollout, this statement describes DNS TTL behavior. The DNS TTL behavior statement accurately describes DNS TTL behavior; however, authoritative DNS and Bastion rollout needs public DNS zones to publish internet records by using Azure-hosted DNS authority; DNS TTL behavior cannot replace public DNS zones."
    C: "Current Azure Bastion deployments require a sufficiently large dedicated subnet, commonly /26 or larger for supported scaling and features. In the authoritative DNS and Bastion rollout, this statement describes Bastion subnet sizing. Selecting Bastion subnet sizing for authoritative DNS and Bastion rollout leaves public DNS zones unanswered in authoritative DNS and Bastion rollout; the authoritative DNS and Bastion rollout lacks a public DNS zones basis to publish internet records by using Azure-hosted DNS authority."
    D: "An Azure public DNS zone hosts authoritative records but does not register or purchase the domain name. For authoritative DNS and Bastion rollout, public DNS zones supplies the service rule needed to publish internet records by using Azure-hosted DNS authority."
  sources:
    - title: "Host a DNS zone in Azure DNS"
      url: "https://learn.microsoft.com/en-us/azure/dns/dns-getstarted-cli"
  lastVerified: "2026-08-31"
