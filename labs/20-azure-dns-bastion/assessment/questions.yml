  difficulty: foundational
  stem: Which principle is most important when working on 'Implement Azure Bastion' in Lab 20?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: Bastion provides managed administrative connectivity without VM public IPs, while Azure DNS becomes authoritative
      only after the parent domain delegates to its assigned name servers.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: C
