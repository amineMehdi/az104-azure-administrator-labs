- id: LAB27-Q01
  objectiveIds:
  - IG-ACCESS-03
  difficulty: foundational
  stem: Which statement best captures the key design principle for capstone — operate, troubleshoot, back up, and
    recover an azure workload?
  options:
    A: 'Operations should follow evidence: establish baseline, detect and scope the fault, repair the smallest cause,
      validate service state, then prove backup or recovery objectives before cleanup.'
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
  explanation: 'The lab''s central distinction is: Operations should follow evidence: establish baseline, detect
    and scope the fault, repair the smallest cause, validate service state, then prove backup or recovery objectives
    before cleanup.'
  distractorExplanations:
    A: 'Correct. The lab''s central distinction is: Operations should follow evidence: establish baseline, detect
      and scope the fault, repair the smallest cause, validate service state, then prove backup or recovery objectives
      before cleanup.'
    B: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-ip-flow-verify-overview
  lastVerified: '2026-08-30'
