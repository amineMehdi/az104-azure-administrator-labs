    B: "The App Service minimum TLS setting rejects client handshakes below the configured protocol version."
    C: "App Service requires proof of custom-domain ownership before binding the hostname."
    D: "App Service VNet integration gives the app outbound access through a delegated integration subnet; it does not make inbound traffic private."
  correctOption: "B"
  optionExplanations:
    A: "Enabling HTTPS Only redirects ordinary HTTP requests to HTTPS but does not itself bind a custom certificate. In the hardened and recoverable web application, this statement describes HTTPS-only redirection. Hardened and recoverable web application asks about minimum inbound TLS; this HTTPS-only redirection choice leaves the minimum inbound TLS explanation missing."
    B: "The hardened and recoverable web application needs minimum inbound TLS to reject inbound clients that negotiate a protocol below the approved TLS version; this option states the applicable minimum inbound TLS rule: the App Service minimum TLS setting rejects client handshakes below the configured protocol version."
    C: "App Service requires proof of custom-domain ownership before binding the hostname. In the hardened and recoverable web application, this statement describes domain ownership verification. Selecting domain ownership verification for hardened and recoverable web application leaves minimum inbound TLS unanswered in hardened and recoverable web application; the hardened and recoverable web application lacks a minimum inbound TLS basis to reject inbound clients that negotiate a protocol below the approved TLS version."
    D: "App Service VNet integration gives the app outbound access through a delegated integration subnet; it does not make inbound traffic private. In the hardened and recoverable web application, this statement describes regional VNet integration. Minimum inbound TLS governs hardened and recoverable web application; regional VNet integration cannot support minimum inbound TLS when operators must reject inbound clients that negotiate a protocol below the approved TLS version."
