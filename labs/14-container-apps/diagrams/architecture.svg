  <title id="lab14-title">LAB-14 architecture: Deploy and scale Azure Container Apps</title>
  <desc id="lab14-desc">Left-to-right service topology with 8 components and 8 directed relationships. Components: Operator and Azure CLI, Log Analytics workspace, Container Apps environment, Externally ingressed app, Revision v1 at 90 percent, Revision v2 at 10 percent, Health, weights, and replica assertions, Environment-first cleanup. Relationships: Operator and Azure CLI to Log Analytics workspace; Log Analytics workspace to Container Apps environment; Container Apps environment to Externally ingressed app; Externally ingressed app to Revision v1 at 90 percent; Externally ingressed app to Revision v2 at 10 percent; Revision v1 at 90 percent to Health, weights, and replica assertions; Revision v2 at 10 percent to Health, weights, and replica assertions; Health, weights, and replica assertions to Environment-first cleanup.</desc>
