- id: LAB14-Q01
  objectiveIds:
  - CP-CONTAINERS-03
  difficulty: foundational
  stem: Which principle is most important when working on 'Provision a container by using Azure Container Apps' in Lab 14?
  options:
    A: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    B: A recognizable resource name removes the need for validation and scoped cleanup.
    C: Container Apps revisions are immutable deployment snapshots, while replicas scale within an active revision according
      to minimum, maximum, and event rules.
    D: The shortest command is always correct even when it changes a broader scope.
  correctOption: C
  explanation: 'The lab establishes this design principle: Container Apps revisions are immutable deployment snapshots, while
    replicas scale within an active revision according to minimum, maximum, and event rules.'
  distractorExplanations:
    A: This choice skips independent evidence or relies on ambiguous resource identity.
    B: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    C: 'Correct. The lab establishes this design principle: Container Apps revisions are immutable deployment snapshots, while
      replicas scale within an active revision according to minimum, maximum, and event rules.'
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/container-apps/get-started
  lastVerified: '2026-08-30'
