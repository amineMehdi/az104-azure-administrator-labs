  difficulty: applied
  stem: 'Within Lab 14, the team evaluates this scenario: A learner previews the implementation for ''Manage sizing and scaling
    for containers, including Azure Container Instances and Azure Container Apps''. What behavior is required?'
  options:
    A: Create the baseline immediately and request approval only before cleanup.
    B: Display the context, intended changes, cost and gated branches without mutating Azure.
    C: Select the first accessible subscription and hide the resulting context.
    D: Delete any older resource whose name resembles the new run ID.
  correctOption: B
  explanation: Preview mode is deliberately non-mutating and exposes the complete intended boundary.
  distractorExplanations:
