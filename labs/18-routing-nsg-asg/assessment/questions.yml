    C: 'Correct. The lab establishes this design principle: NSG evaluation uses priority and direction, ASGs replace hard-coded
      IP membership, and route selection uses longest-prefix matching before connectivity diagnostics explain the result.'
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
  lastVerified: '2026-08-30'
