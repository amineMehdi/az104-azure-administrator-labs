    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: NSG evaluation uses priority and direction, ASGs replace hard-coded IP membership, and route selection uses
      longest-prefix matching before connectivity diagnostics explain the result.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: C
  explanation: 'The lab establishes this design principle: NSG evaluation uses priority and direction, ASGs replace
    hard-coded IP membership, and route selection uses longest-prefix matching before connectivity diagnostics explain
    the result.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: 'Correct. The lab establishes this design principle: NSG evaluation uses priority and direction, ASGs replace
      hard-coded IP membership, and route selection uses longest-prefix matching before connectivity diagnostics
      explain the result.'
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
