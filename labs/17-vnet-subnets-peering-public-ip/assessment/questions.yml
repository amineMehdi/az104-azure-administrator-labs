  remediationAnchor: "#task-3"
  difficulty: "foundational"
  stem: "A network administrator connecting hub and spoke address spaces is updating the network peering runbook. The requirement is to create both directional control-plane links required for connected networks. Which statement describes Azure behavior correctly?"
  options:
    A: "Gateway transit requires one side to allow gateway transit and the other to use the remote gateway, with topology constraints."
    B: "A static public IP retains its assigned address while the resource exists, subject to platform lifecycle behavior."
    C: "A usable virtual-network peering relationship has one peering resource in each direction."
    D: "Virtual-network peering is not transitive; peering A to B and B to C does not automatically connect A to C."
  correctOption: "C"
  optionExplanations:
    A: "Gateway transit requires one side to allow gateway transit and the other to use the remote gateway, with topology constraints. In the hub-and-spoke network build, this statement describes gateway transit peering. Selecting gateway transit peering for hub-and-spoke network build leaves bidirectional peering objects unanswered in hub-and-spoke network build; the hub-and-spoke network build lacks a bidirectional peering objects basis to create both directional control-plane links required for connected networks."
    B: "A static public IP retains its assigned address while the resource exists, subject to platform lifecycle behavior. In the hub-and-spoke network build, this statement describes static public IP allocation. Bidirectional peering objects governs hub-and-spoke network build; static public IP allocation cannot support bidirectional peering objects when operators must create both directional control-plane links required for connected networks."
    C: "For the hub-and-spoke network build, the rule for bidirectional peering objects is defined by this statement: a usable virtual-network peering relationship has one peering resource in each direction. It supports the required outcome to create both directional control-plane links required for connected networks."
    D: "Virtual-network peering is not transitive; peering A to B and B to C does not automatically connect A to C. In the hub-and-spoke network build, this statement describes nontransitive peering. The nontransitive peering statement accurately describes nontransitive peering; however, hub-and-spoke network build needs bidirectional peering objects to create both directional control-plane links required for connected networks; nontransitive peering cannot replace bidirectional peering objects."
