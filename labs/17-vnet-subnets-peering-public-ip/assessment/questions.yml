    B: "First, Enable forwarded traffic only on the peering directions required by the approved routing design. Then, Read allowForwardedTraffic on both directional peering resources. This hub-and-spoke network build pair serves forwarded traffic on peering. Hub-and-spoke network build proves forwarded traffic on peering, but custom virtual-network DNS servers lacks implementation in hub-and-spoke network build and custom virtual-network DNS servers proof; the custom virtual-network DNS servers outcome to make virtual machines use approved custom DNS resolvers remains open."
    C: "First, Configure approved resolver IP addresses and renew affected clients when required. Then, Query dhcpOptions.dnsServers and test resolution from a VM after renewing its configuration. For hub-and-spoke network build, the custom virtual-network DNS servers operation precedes its custom virtual-network DNS servers read-back check, allowing it to make virtual machines use approved custom DNS resolvers."
    D: "First, Use Standard SKU and add only the required inbound NSG exposure. Then, Query sku.name, publicIPAllocationMethod, ipAddress, and associated IP configuration. This hub-and-spoke network build pair serves Standard public IP SKU. Hub-and-spoke network build closes Standard public IP SKU, not custom virtual-network DNS servers; without the custom virtual-network DNS servers workflow, it cannot make virtual machines use approved custom DNS resolvers."
