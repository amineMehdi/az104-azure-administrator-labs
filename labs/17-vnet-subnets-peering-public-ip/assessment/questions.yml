    B: "Use Standard SKU and add only the required inbound NSG exposure. In the hub-and-spoke network build, this action changes Standard public IP SKU. Hub-and-spoke network build requires nonoverlapping address spaces; changing Standard public IP SKU leaves nonoverlapping address spaces absent in hub-and-spoke network build; hub-and-spoke network build cannot connect networks without overlapping their address ranges."
