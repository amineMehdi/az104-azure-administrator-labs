- id: "LAB17-Q01"
  objectiveIds:
    - "NW-VNET-01"
  checkpointIds:
    - "LAB17-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The hub-and-spoke network build handoff omits the network peering rule needed to connect networks without overlapping their address ranges. Which statement should the team add?"
  options:
    A: "Peered virtual networks require nonoverlapping IP address spaces for routable connectivity."
    B: "Each subnet prefix must fit inside its virtual network address space and cannot overlap another subnet in that network."
    C: "The allowForwardedTraffic setting controls whether traffic forwarded by a network virtual appliance can cross a peering."
    D: "A Standard public IP can be zone-redundant or zonal in supported regions, and its zone choice must fit the attached resource design."
  correctOption: "A"
  optionExplanations:
    A: "Peered virtual networks require nonoverlapping IP address spaces for routable connectivity. For hub-and-spoke network build, nonoverlapping address spaces supplies the service rule needed to connect networks without overlapping their address ranges."
    B: "Each subnet prefix must fit inside its virtual network address space and cannot overlap another subnet in that network. In the hub-and-spoke network build, this statement describes subnet address planning. The subnet address planning statement accurately describes subnet address planning; however, hub-and-spoke network build needs nonoverlapping address spaces to connect networks without overlapping their address ranges; subnet address planning cannot replace nonoverlapping address spaces."
    C: "The allowForwardedTraffic setting controls whether traffic forwarded by a network virtual appliance can cross a peering. In the hub-and-spoke network build, this statement describes forwarded traffic on peering. Selecting forwarded traffic on peering for hub-and-spoke network build leaves nonoverlapping address spaces unanswered in hub-and-spoke network build; the hub-and-spoke network build lacks a nonoverlapping address spaces basis to connect networks without overlapping their address ranges."
    D: "A Standard public IP can be zone-redundant or zonal in supported regions, and its zone choice must fit the attached resource design. In the hub-and-spoke network build, this statement describes zonal public IP configuration. Nonoverlapping address spaces governs hub-and-spoke network build; zonal public IP configuration cannot support nonoverlapping address spaces when operators must connect networks without overlapping their address ranges."
  sources:
    - title: "Plan Azure virtual networks"
      url: "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm"
  lastVerified: "2026-08-31"
- id: "LAB17-Q02"
  objectiveIds:
    - "NW-VNET-01"
  checkpointIds:
    - "LAB17-CP02"
  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "A network peering incident review of the hub-and-spoke network build depends on the ability to reserve subnet ranges that do not collide with future network segments. Which platform description is reliable?"
  options:
    A: "Each subnet prefix must fit inside its virtual network address space and cannot overlap another subnet in that network."
    B: "A usable virtual-network peering relationship has one peering resource in each direction."
    C: "Standard public IP addresses are secure by default and require an NSG rule to permit inbound traffic to an attached resource."
    D: "Custom DNS server addresses configured on a virtual network are inherited by attached interfaces after renewal, and the DNS servers must be reachable."
  correctOption: "A"
  optionExplanations:
    A: "Each subnet prefix must fit inside its virtual network address space and cannot overlap another subnet in that network. In the hub-and-spoke network build, this subnet address planning rule supports the need to reserve subnet ranges that do not collide with future network segments."
    B: "A usable virtual-network peering relationship has one peering resource in each direction. In the hub-and-spoke network build, this statement describes bidirectional peering objects. Selecting bidirectional peering objects for hub-and-spoke network build leaves subnet address planning unanswered in hub-and-spoke network build; the hub-and-spoke network build lacks a subnet address planning basis to reserve subnet ranges that do not collide with future network segments."
    C: "Standard public IP addresses are secure by default and require an NSG rule to permit inbound traffic to an attached resource. In the hub-and-spoke network build, this statement describes Standard public IP SKU. Subnet address planning governs hub-and-spoke network build; Standard public IP SKU cannot support subnet address planning when operators must reserve subnet ranges that do not collide with future network segments."
    D: "Custom DNS server addresses configured on a virtual network are inherited by attached interfaces after renewal, and the DNS servers must be reachable. In the hub-and-spoke network build, this statement describes custom virtual-network DNS servers. Hub-and-spoke network build asks about subnet address planning; this custom virtual-network DNS servers choice leaves the subnet address planning explanation missing."
  sources:
    - title: "Plan Azure virtual networks"
      url: "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm"
