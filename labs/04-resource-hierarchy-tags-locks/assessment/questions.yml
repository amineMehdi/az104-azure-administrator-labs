  difficulty: foundational
  stem: Which statement best captures the key design principle for manage hierarchy, resource groups, tags, and
    locks?
  options:
    A: Tags are metadata rather than access controls, and resource locks protect the control plane without replacing
      RBAC or data-plane protection.
