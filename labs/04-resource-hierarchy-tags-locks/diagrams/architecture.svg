<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="656" viewBox="0 0 768 656" role="img" aria-labelledby="lab04-title lab04-desc">
  <title id="lab04-title">LAB-04 architecture: Manage hierarchy, resource groups, tags, and locks</title>
  <desc id="lab04-desc">Left-to-right service topology with 8 components and 8 directed relationships. Components: Tenant root management group, Subscription, Empty lab management group, Tagged resource group, Virtual network, Governance and ownership tags, CanNotDelete lock, Dependency-aware cleanup. Relationships: Tenant root management group to Subscription (existing hierarchy); Tenant root management group to Empty lab management group (optional exact-YES gate); Subscription to Tagged resource group (contains); Tagged resource group to Virtual network (contains); Governance and ownership tags to Tagged resource group (merge); Governance and ownership tags to Virtual network (explicit apply
no inheritance); CanNotDelete lock to Tagged resource group (protects control plane); Dependency-aware cleanup to CanNotDelete lock (remove exact lock first).</desc>
  <metadata id="lab04-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/1.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;280fd82cd512b0ad6d74efd8f22ce078b54dbbe0054f88e1a0503b9851cef24e&quot;}</metadata>
