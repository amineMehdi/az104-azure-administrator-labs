  <title id="lab00-title">LAB-00 architecture: Safe Azure lab bootstrap</title>
  <desc id="lab00-desc">Left-to-right service topology with 7 components and 8 directed relationships. Components: Learner, Environment initializer, Version and dependency checks, Read-only Azure CLI context, Ignored run manifest, Setup and cleanup previews, Validation and residual audit. Relationships: Learner to Environment initializer (run one PowerShell command); Environment initializer to Version and dependency checks (inspect only); Version and dependency checks to Read-only Azure CLI context (required tools pass); Read-only Azure CLI context to Ignored run manifest (approved cloud and subscription); Ignored run manifest to Setup and cleanup previews (exact IDs, tags, and gates); Setup and cleanup previews to Validation and residual audit (no mutation in Lab 00); Validation and residual audit to Ignored run manifest (readiness and cleanup results); Ignored run manifest to Learner (safe boundary understood).</desc>
