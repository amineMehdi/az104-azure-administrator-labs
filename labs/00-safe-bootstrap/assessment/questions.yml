- id: LAB00-Q01
  objectiveIds:
    - FD-TOOLS-01
  difficulty: foundational
  stem: >-
    A learner is writing an AZ-104 lab in Bash. The solution must use JMESPath
    queries and return tab-separated values to later shell commands. Which Azure
    management command surface is the most direct fit?
  options:
    A: Az PowerShell, because every Az cmdlet returns tab-separated text by default.
    B: Azure CLI, because it runs naturally in Bash and supports --query with --output tsv.
    C: Azure portal, because every portal action can be exported as a reusable Bash command.
    D: Azure Resource Manager REST API entered manually in a web browser.
  correctOption: B
  explanation: >-
    Azure CLI is designed for command-line shells, including Bash, and supports
    JMESPath through --query plus tab-separated output through --output tsv. That
    makes it the direct fit for this particular shell workflow. Az PowerShell is
    equally valid for Azure administration, but it is a PowerShell-native object
    pipeline rather than the requested Bash/JMESPath/TSV workflow.
  distractorExplanations:
    A: >-
      Az PowerShell returns .NET objects by default, not TSV, and would change the
      scripting model described in the scenario.
    B: >-
      This is the correct option. Azure CLI supplies both the requested query and
      output capabilities in Bash.
    C: >-
      The portal is useful for visual inspection, but it does not guarantee an
      exportable Bash command for every action.
    D: >-
      REST APIs can manage Azure, but manually issuing requests in a browser is not
      the direct, reusable command surface requested here.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/cli/azure/what-is-azure-cli?view=azure-cli-latest"
    - "https://learn.microsoft.com/en-us/cli/azure/use-azure-cli-successfully-query?view=azure-cli-latest"
    - "https://learn.microsoft.com/en-us/cli/azure/format-output-azure-cli?view=azure-cli-latest"
  lastVerified: "2026-08-30"

- id: LAB00-Q02
  objectiveIds:
    - FD-CONTEXT-01
    - FD-SAFETY-01
  difficulty: foundational
  stem: >-
    You are signed in through Az PowerShell and can access several subscriptions.
    Before a script creates any resources, which sequence most safely establishes
    and verifies the intended subscription context?
  options:
    A: Run Connect-AzAccount, accept whichever subscription is selected, and begin creating resources.
    B: Set a default location and assume that this also selects the Azure subscription.
    C: Run Get-AzResourceGroup and infer the active subscription from familiar resource names.
    D: List accessible subscriptions with Get-AzSubscription, set the target tenant and subscription with Set-AzContext, then compare Get-AzContext with the expected IDs.
  correctOption: D
  explanation: >-
    Az PowerShell cmdlets use the current context. A safe preflight lists the
    accessible subscriptions, explicitly sets the intended tenant and subscription,
    and then reads the resulting context to compare both IDs with expected values
    before any mutation.
  distractorExplanations:
    A: >-
      Interactive sign-in can select a subscription, but silently trusting that
      selection is unsafe when the account can access several subscriptions.
    B: >-
      A default Azure region affects location parameters; it does not select an
      Azure subscription context.
    C: >-
      Resource names are not authoritative identity or scope evidence and might be
      duplicated across subscriptions.
    D: >-
      This is the correct option. It explicitly sets the target and verifies the
      exact tenant and subscription identifiers before changes begin.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/powershell/module/az.accounts/get-azsubscription?view=azps-15.6.0"
    - "https://learn.microsoft.com/en-us/powershell/module/az.accounts/set-azcontext?view=azps-15.6.0"
    - "https://learn.microsoft.com/en-us/powershell/module/az.accounts/get-azcontext?view=azps-15.6.0"
  lastVerified: "2026-08-30"

- id: LAB00-Q03
  objectiveIds:
    - FD-COST-01
  difficulty: foundational
  stem: >-
    A learner creates a monthly Azure Cost Management budget of EUR 10 with an
    alert at 100 percent. What should the learner expect when evaluated cost
    reaches the threshold?
  options:
    A: The configured notification is triggered, but Azure resources keep running unless a separate action is designed to affect them.
    B: Azure immediately deallocates every virtual machine in the budget scope.
    C: Azure converts the budget into a hard spending cap and rejects all subsequent requests.
    D: The resource group is automatically deleted at the end of the evaluation period.
  correctOption: A
  explanation: >-
    Azure Cost Management budgets track cost and trigger configured notifications
    when thresholds are met. Microsoft states that resources are not affected and
    consumption is not stopped. A budget therefore is an alerting and governance
    mechanism, not a general-purpose hard spending cap.
  distractorExplanations:
    A: >-
      This is the correct option. The budget notifies; it does not itself stop the
      resources in scope.
    B: >-
      Budget evaluation does not automatically deallocate virtual machines.
    C: >-
      A Cost Management budget is not automatically converted into a hard spending
      cap.
    D: >-
      A budget expiration or period boundary does not delete the resource group it
      monitors.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/tutorial-acm-create-budgets"
  lastVerified: "2026-08-30"

- id: LAB00-Q04
  objectiveIds:
    - FD-CONTEXT-01
    - FD-SAFETY-01
  difficulty: applied
  stem: >-
    An administrator belongs to Tenant A and Tenant B. The sandbox subscription is
    in Tenant B, but the current Azure CLI context points to Tenant A. Which action
    sequence is safest before running a lab setup script?
  options:
    A: Pass only --location to the setup commands, because a region uniquely identifies the tenant.
    B: Run az account clear and start the setup script without signing in again.
    C: Sign in with az login --tenant for Tenant B, set the sandbox subscription by ID, and verify both IDs with az account show.
    D: Create the resource group first, then use its deployment history to discover which tenant received it.
  correctOption: C
  explanation: >-
    Azure CLI supports tenant-specific interactive sign-in. After signing in to
    Tenant B, the administrator should select the sandbox subscription by its
    immutable ID and verify the resulting tenant and subscription metadata before
    running any mutating command.
  distractorExplanations:
    A: >-
      Azure regions are shared across many tenants and subscriptions; a location
      cannot establish identity or subscription context.
    B: >-
      Clearing the local subscription cache removes the usable context. The user
      must sign in again before Azure CLI commands can run.
    C: >-
      This is the correct option. It establishes the intended tenant, selects the
      exact subscription, and performs a read-only verification.
    D: >-
      Creating a resource to discover scope is an unsafe mutation and can place
      resources in the wrong subscription.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/cli/azure/authenticate-azure-cli-interactively?view=azure-cli-latest"
    - "https://learn.microsoft.com/en-us/cli/azure/manage-azure-subscriptions-azure-cli?view=azure-cli-latest"
  lastVerified: "2026-08-30"

- id: LAB00-Q05
  objectiveIds:
    - FD-SAFETY-01
    - FD-CLEANUP-01
  difficulty: applied
  stem: >-
    Two learners may run the same lab concurrently in one subscription. Which
    design best reduces naming collisions and makes later cleanup safely scoped to
    one run?
  options:
    A: Use identical resource names for every run and delete whichever resources were created most recently.
    B: Include a unique run ID in eligible names, tag taggable resources with labId and runId, and record the exact created resource IDs in run-local state.
    C: Put the learner's email address in every resource name and tag, then delete all resources with that email address.
    D: Use random names without recording them because Azure Activity Log can always reconstruct every dependency immediately.
  correctOption: B
  explanation: >-
    A unique run ID distinguishes concurrent runs. Consistent labId and runId tags
    support inventory and cost analysis, while exact resource IDs in run-local
    state give cleanup an authoritative scope. Tags should contain management
    metadata rather than personal or secret values.
  distractorExplanations:
    A: >-
      Shared names can collide, and creation time is not reliable evidence of
      ownership.
    B: >-
      This is the correct option. It combines collision-resistant naming,
      searchable metadata, and exact cleanup identifiers.
    C: >-
      Personal information should not be embedded in resource names or tags, and
      an email address is not a unique run identifier.
    D: >-
      Unrecorded random names make deterministic cleanup difficult; the Activity
      Log is not a substitute for an explicit state manifest.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/resource-naming"
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources"
  lastVerified: "2026-08-30"

- id: LAB00-Q06
  objectiveIds:
    - FD-SAFETY-01
  difficulty: applied
  stem: >-
    A lab will deploy a D-family virtual machine in West Europe. Which preflight is
    most likely to catch subscription-specific blockers before the deployment
    starts?
  options:
    A: Check the Microsoft.Compute provider state, register it only if required, verify the requested SKU is available in the region, and inspect both total regional and D-family vCPU usage and limits.
    B: Check only whether azure.microsoft.com is reachable from the learner's browser.
    C: Register every resource provider in the subscription and skip quota checks.
    D: Check quota in any one Azure region because vCPU quota is shared globally across all regions.
  correctOption: A
  explanation: >-
    The subscription must be able to use the relevant resource provider, the VM SKU
    must be available in the target region, and the deployment must fit both total
    regional and VM-family vCPU quotas. Provider registration should be limited to
    services the lab is ready to use.
  distractorExplanations:
    A: >-
      This is the correct option. It checks the provider, regional availability,
      and both enforced tiers of compute quota.
    B: >-
      General website reachability says nothing about subscription provider state,
      regional SKU availability, or quota.
    C: >-
      Microsoft recommends registering providers only when ready to use them, and
      registration does not replace quota checks.
    D: >-
      VM vCPU quotas are enforced per subscription and per region, including a
      regional total and a VM-family tier.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/resource-providers-and-types"
    - "https://learn.microsoft.com/en-us/azure/virtual-machines/quotas"
    - "https://learn.microsoft.com/en-us/cli/azure/vm?view=azure-cli-latest#az-vm-list-usage"
  lastVerified: "2026-08-30"

- id: LAB00-Q07
  objectiveIds:
    - FD-SAFETY-01
  difficulty: applied
  stem: >-
    A lab needs a local state file so validation and cleanup can resume after an
    interruption. Which content is safest to persist in that file?
  options:
    A: The current Azure CLI access token and refresh token so another learner can resume the run.
    B: The administrator's password together with the tenant ID and subscription ID.
    C: Storage account keys and service principal client secrets, committed to Git for portability.
    D: Nonsecret metadata such as tenant ID, subscription ID, run ID, tags, exact resource IDs, timestamps, and lifecycle status; credentials remain outside the file.
  correctOption: D
  explanation: >-
    A run state file needs identifiers and lifecycle metadata, not credentials.
    Tokens, passwords, access keys, and client secrets are sensitive and must not be
    stored in a repository state file. Interactive authentication is appropriate
    for a learner's local session; application secrets belong in a secure secret
    store when they are genuinely required.
  distractorExplanations:
    A: >-
      Access and refresh tokens are credentials. Persisting them in transferable
      lab state exposes the signed-in identity.
    B: >-
      A password must never be stored in the lab state file.
    C: >-
      Microsoft explicitly warns against putting credentials and secrets in source
      code or GitHub.
    D: >-
      This is the correct option. It preserves enough nonsecret evidence to resume
      validation and scoped cleanup without persisting credentials.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/cli/azure/authenticate-azure-cli?view=azure-cli-latest"
    - "https://learn.microsoft.com/en-us/azure/security/fundamentals/paas-deployments"
    - "https://learn.microsoft.com/en-us/azure/key-vault/secrets/secure-secrets"
  lastVerified: "2026-08-30"

- id: LAB00-Q08
  objectiveIds:
    - FD-SAFETY-01
  difficulty: applied
  stem: >-
    An optional validation check requires a role the learner does not have. The
    read-only query returns AuthorizationFailed, and the lab documentation clearly
    declared the role as an optional prerequisite. How should the validation report
    represent this result?
  options:
    A: Mark it pass because no Azure resources changed.
    B: Mark the check skipped with the permission reason and keep the overall lab partial unless every required check still passed independently.
    C: Mark it warning but silently report the whole lab as live-verified.
    D: Retry the request indefinitely until Azure grants the missing permission.
  correctOption: B
  explanation: >-
    AuthorizationFailed indicates that the current identity lacks permission at the
    requested scope. Because the declared check is gated by an optional role, the
    honest result is skipped with evidence of the reason. A gated check must not be
    converted into a pass or hidden inside an unqualified live-verification claim.
  distractorExplanations:
    A: >-
      A nonmutating failed query did not prove the intended state, so it cannot be a
      pass.
    B: >-
      This is the correct option. It preserves the distinction between unavailable
      evidence and a successful assertion.
    C: >-
      Reporting the whole lab as live-verified would overstate the evidence when a
      declared check could not run.
    D: >-
      Missing authorization is not a transient condition that unbounded retries can
      safely solve.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/role-based-access-control/troubleshooting#access-denied-or-permission-errors"
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/troubleshooting/common-deployment-errors"
  lastVerified: "2026-08-30"

- id: LAB00-Q09
  objectiveIds:
    - FD-CLEANUP-01
    - FD-SAFETY-01
  difficulty: advanced
  stem: >-
    A lab run created a resource group, a CanNotDelete lock on that group, and a
    subscription-scope role assignment. Which cleanup workflow has the narrowest
    safe deletion scope?
  options:
    A: Delete every resource group whose name begins with az104, then remove all role assignments for the learner.
    B: Unregister the resource providers used by the lab and assume Azure removes the resources that depended on them.
    C: Verify the recorded tenant and subscription, print the exact deletion plan, remove the recorded role assignment and lock by ID, delete the recorded resource group, wait for deletion, and query for residual run resources.
    D: Delete the subscription-scope role assignment by matching only its role name, then issue a subscription-wide resource deletion.
  correctOption: C
  explanation: >-
    Cleanup should first confirm scope and show its intended changes. A resource
    group protected by CanNotDelete must have the lock removed before deletion, and
    a role assignment outside the group must be removed at its own recorded scope.
    Exact IDs plus a residual check avoid broad, assumption-based deletion.
  distractorExplanations:
    A: >-
      A name prefix and learner identity do not prove that resources belong to this
      run; this could delete unrelated work and unrelated access.
    B: >-
      Unregistering a provider is not a cleanup mechanism, and Azure prevents
      unregistration while dependent resource types still exist.
    C: >-
      This is the correct option. It handles the out-of-group dependency and lock,
      deletes only recorded targets, and verifies the final state.
    D: >-
      Role names are not unique assignment identifiers, and a subscription-wide
      deletion is far broader than the lab's ownership.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/manage-resource-groups-powershell#delete-resource-groups"
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/delete-resource-group"
    - "https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-remove"
  lastVerified: "2026-08-30"

- id: LAB00-Q10
  objectiveIds:
    - FD-CLEANUP-01
  difficulty: advanced
  stem: >-
    Cleanup was interrupted after Azure accepted deletion of the lab's recorded
    resource group but before the script updated local state. What behavior makes a
    second cleanup run safely idempotent?
  options:
    A: Reconfirm context, read the same recorded IDs, treat an already-absent target as clean, resume only remaining exact deletions with bounded handling for asynchronous operations, and finish with a residual check.
    B: Generate a new run ID and delete resources associated with both the old and new IDs.
    C: Fail immediately whenever a recorded resource returns not found, leaving all remaining cleanup steps unattempted.
    D: Search the subscription for similarly named resources and delete them all to guarantee that nothing remains.
  correctOption: A
  explanation: >-
    An idempotent cleanup converges on the same clean state when rerun. It verifies
    the target context, reuses the original ownership evidence, accepts an
    already-absent target as complete, and continues with only the remaining exact
    work. Azure deletions can be asynchronous, so bounded polling and a final
    residual inventory provide stronger evidence than assuming the first request
    finished.
  distractorExplanations:
    A: >-
      This is the correct option. Repeating it converges safely without expanding
      ownership or turning an already-complete deletion into a failure.
    B: >-
      A new run ID creates new ownership metadata and must not broaden cleanup of
      the interrupted run.
    C: >-
      Not found can mean that the first deletion succeeded; aborting prevents the
      script from completing other recorded cleanup work.
    D: >-
      Similar names are not proof of ownership, so this approach risks deleting
      unrelated resources.
  sourceUrls:
    - "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/delete-resource-group"
    - "https://learn.microsoft.com/en-us/azure/well-architected/design-guides/handle-transient-faults"
    - "https://learn.microsoft.com/en-us/azure/architecture/patterns/retry"
  lastVerified: "2026-08-30"
