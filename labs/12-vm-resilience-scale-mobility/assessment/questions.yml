  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The compute resilience review compares four claims for the resilient compute capacity design requirement to place instances in separate datacenter fault boundaries within one region. Which claim is technically sound?"
  options:
    A: "Availability sets distribute classic VM deployments across fault and update domains within one datacenter scope."
    B: "Deploying VM instances across distinct availability zones protects against a datacenter-level failure within a supported region."
    C: "Autoscale changes scale-set capacity from metric rules while respecting configured minimum, maximum, and default values."
    D: "A cross-subscription move requires compatible tenants, providers, quotas, and dependent-resource support in the destination."
  correctOption: "B"
  optionExplanations:
    A: "Availability sets distribute classic VM deployments across fault and update domains within one datacenter scope. In the resilient compute capacity design, this statement describes availability sets. Resilient compute capacity design asks about availability zones; this availability sets choice leaves the availability zones explanation missing."
    B: "Deploying VM instances across distinct availability zones protects against a datacenter-level failure within a supported region. For resilient compute capacity design, availability zones supplies the service rule needed to place instances in separate datacenter fault boundaries within one region."
    C: "Autoscale changes scale-set capacity from metric rules while respecting configured minimum, maximum, and default values. In the resilient compute capacity design, this statement describes VM scale-set autoscale. Selecting VM scale-set autoscale for resilient compute capacity design leaves availability zones unanswered in resilient compute capacity design; the resilient compute capacity design lacks a availability zones basis to place instances in separate datacenter fault boundaries within one region."
    D: "A cross-subscription move requires compatible tenants, providers, quotas, and dependent-resource support in the destination. In the resilient compute capacity design, this statement describes cross-subscription VM moves. Availability zones governs resilient compute capacity design; cross-subscription VM moves cannot support availability zones when operators must place instances in separate datacenter fault boundaries within one region."
  sources:
    - title: "Azure availability zones overview"
      url: "https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview"
  lastVerified: "2026-08-31"
