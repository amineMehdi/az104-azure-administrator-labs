  difficulty: "foundational"
  stem: "The endpoint comparison architecture note requires the private Storage connectivity evaluation environment to keep service traffic on the Azure backbone while using the service's public endpoint. Which statement defines the relevant endpoint comparison boundary?"
  options:
    A: "Enabling a service endpoint alone does not grant data access or automatically update the destination service firewall."
    B: "Private endpoint DNS commonly maps the service hostname through a privatelink zone to the endpoint's private IP."
    C: "Disabling public network access makes the approved private path and DNS resolution prerequisites for service connectivity."
    D: "A service endpoint extends subnet identity to a PaaS service while the service still uses its public endpoint address."
  correctOption: "D"
  optionExplanations:
    A: "Enabling a service endpoint alone does not grant data access or automatically update the destination service firewall. In the private Storage connectivity evaluation, this statement describes service endpoint authorization. Private Storage connectivity evaluation asks about service endpoint traffic; this service endpoint authorization choice leaves the service endpoint traffic explanation missing."
    B: "Private endpoint DNS commonly maps the service hostname through a privatelink zone to the endpoint's private IP. In the private Storage connectivity evaluation, this statement describes private endpoint DNS zones. The private endpoint DNS zones statement accurately describes private endpoint DNS zones; however, private Storage connectivity evaluation needs service endpoint traffic to keep service traffic on the Azure backbone while using the service's public endpoint; private endpoint DNS zones cannot replace service endpoint traffic."
    C: "Disabling public network access makes the approved private path and DNS resolution prerequisites for service connectivity. In the private Storage connectivity evaluation, this statement describes public network access. Selecting public network access for private Storage connectivity evaluation leaves service endpoint traffic unanswered in private Storage connectivity evaluation; the private Storage connectivity evaluation lacks a service endpoint traffic basis to keep service traffic on the Azure backbone while using the service's public endpoint."
    D: "A service endpoint extends subnet identity to a PaaS service while the service still uses its public endpoint address. This service endpoint traffic fact resolves the private Storage connectivity evaluation design question about how to keep service traffic on the Azure backbone while using the service's public endpoint."
  sources:
    - title: "Virtual network service endpoints"
      url: "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview"
  lastVerified: "2026-08-31"
