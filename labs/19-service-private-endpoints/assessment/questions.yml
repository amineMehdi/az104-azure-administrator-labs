- id: LAB19-Q01
  objectiveIds:
  - ST-ACCESS-01
  difficulty: foundational
  stem: Which statement best captures the key design principle for compare service endpoints and private endpoints?
  options:
    A: Service endpoints keep the service's public endpoint while adding subnet identity, whereas private endpoints
      place a private NIC in the VNet and depend on correct private DNS resolution.
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
  explanation: 'The lab''s central distinction is: Service endpoints keep the service''s public endpoint while adding
    subnet identity, whereas private endpoints place a private NIC in the VNet and depend on correct private DNS
    resolution.'
  distractorExplanations:
    A: 'Correct. The lab''s central distinction is: Service endpoints keep the service''s public endpoint while
      adding subnet identity, whereas private endpoints place a private NIC in the VNet and depend on correct private
      DNS resolution.'
    B: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  lastVerified: '2026-08-30'
