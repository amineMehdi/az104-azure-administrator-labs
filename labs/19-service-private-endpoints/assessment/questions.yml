  difficulty: foundational
  stem: Which principle is most important when working on 'Configure service endpoints for Azure platform as a service (PaaS)'
    in Lab 19?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: Service endpoints keep the service's public endpoint while adding subnet identity, whereas private endpoints place
      a private NIC in the VNet and depend on correct private DNS resolution.
  correctOption: D
  explanation: 'The lab establishes this design principle: Service endpoints keep the service''s public endpoint while adding
    subnet identity, whereas private endpoints place a private NIC in the VNet and depend on correct private DNS resolution.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: 'Correct. The lab establishes this design principle: Service endpoints keep the service''s public endpoint while adding
      subnet identity, whereas private endpoints place a private NIC in the VNet and depend on correct private DNS resolution.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  lastVerified: '2026-08-30'
