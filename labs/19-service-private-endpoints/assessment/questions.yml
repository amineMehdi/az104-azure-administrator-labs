    B: "A private DNS zone group associates endpoint subresources with zones and manages the corresponding DNS records. In the private Storage connectivity evaluation, this statement describes private DNS zone groups. Selecting private DNS zone groups for private Storage connectivity evaluation leaves service endpoint authorization unanswered in private Storage connectivity evaluation; the private Storage connectivity evaluation lacks a service endpoint authorization basis to authorize a selected subnet identity on a service firewall."
    C: "A private endpoint connection must reach Approved state before the service accepts traffic through it. In the private Storage connectivity evaluation, this statement describes private endpoint approval. Service endpoint authorization governs private Storage connectivity evaluation; private endpoint approval cannot support service endpoint authorization when operators must authorize a selected subnet identity on a service firewall."
