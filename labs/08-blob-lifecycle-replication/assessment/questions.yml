  stem: "The approach for the blob retention and replication service is approved, but the blob retention environment still cannot keep private data from being read without an authorization header. Which implementation step closes the gap?"
  options:
    A: "Create the container with private access unless anonymous blob access is explicitly required."
    B: "Constrain the lifecycle rule to the intended container prefix and blob type before enabling destructive actions."
    C: "Enable blob soft delete with the approved retention days before testing deletion recovery."
    D: "Enable prerequisites on both accounts and create a replication policy with matching source and destination container rules."
  correctOption: "A"
  optionExplanations:
    A: "Create the container with private access unless anonymous blob access is explicitly required. This changes blob containers in the blob retention and replication service, supplying the missing state needed to keep private data from being read without an authorization header."
    B: "Constrain the lifecycle rule to the intended container prefix and blob type before enabling destructive actions. In the blob retention and replication service, this action changes lifecycle rule filters. Blob retention and replication service requires blob containers; changing lifecycle rule filters leaves blob containers absent in blob retention and replication service; blob retention and replication service cannot keep private data from being read without an authorization header."
    C: "Enable blob soft delete with the approved retention days before testing deletion recovery. In the blob retention and replication service, this action changes blob soft delete. Blob soft delete does not implement blob containers for blob retention and replication service; the blob retention and replication service still cannot keep private data from being read without an authorization header."
    D: "Enable prerequisites on both accounts and create a replication policy with matching source and destination container rules. In the blob retention and replication service, this action changes object replication. Blob retention and replication service instead needs blob containers: Create the container with private access unless anonymous blob access is explicitly required. The object replication action omits that blob containers work."
