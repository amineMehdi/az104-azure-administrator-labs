  difficulty: "foundational"
  stem: "A blob retention peer review asks how the blob retention and replication service should handle this outcome: keep private data from being read without an authorization header. Which explanation is accurate?"
  options:
    A: "Hot, cool, cold, and archive tiers trade storage cost against access and rehydration characteristics."
    B: "A blob container organizes blobs inside one storage account and its public access setting is independent of account authorization controls."
    C: "A lifecycle delete action permanently removes eligible current or previous versions after its age condition."
    D: "Blob versioning preserves a new immutable version when a block blob is modified or deleted."
  correctOption: "B"
  optionExplanations:
    A: "Hot, cool, cold, and archive tiers trade storage cost against access and rehydration characteristics. In the blob retention and replication service, this statement describes blob access tiers. Blob retention and replication service asks about blob containers; this blob access tiers choice leaves the blob containers explanation missing."
    B: "A blob container organizes blobs inside one storage account and its public access setting is independent of account authorization controls. This blob containers fact resolves the blob retention and replication service design question about how to keep private data from being read without an authorization header."
    C: "A lifecycle delete action permanently removes eligible current or previous versions after its age condition. In the blob retention and replication service, this statement describes lifecycle deletion. Selecting lifecycle deletion for blob retention and replication service leaves blob containers unanswered in blob retention and replication service; the blob retention and replication service lacks a blob containers basis to keep private data from being read without an authorization header."
    D: "Blob versioning preserves a new immutable version when a block blob is modified or deleted. In the blob retention and replication service, this statement describes blob versioning. Blob containers governs blob retention and replication service; blob versioning cannot support blob containers when operators must keep private data from being read without an authorization header."
  sources:
