  objectiveIds:
  - ST-DATA-02
  required: true
  expectedState: The pre-repair attempt fails, destination versioning becomes true, and the same policy ID with one rule exists
    on both accounts.
  scriptMarkers:
    setup: LAB08-CP03
    validate: LAB08-CP03
    cleanup: LAB08-CP03
  validation:
    positive:
      id: cp03.positive
      description: Read the service properties for inject the missing-versioning fault and build both policy copies by using
        exact run-owned identifiers.
      command: '$validationId=''LAB08-CP03-positive''; $policyId = [string]$state.inputs[''object-replication-policy-id'']

        $sourcePolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $source --policy-id
        $policyId --output json | ConvertFrom-Json

        $destinationPolicy = az storage account or-policy show --resource-group $ResourceGroupName --account-name $destination
        --policy-id $policyId --output json | ConvertFrom-Json

        if ($sourcePolicy.policyId -ne $destinationPolicy.policyId -or @($sourcePolicy.rules).Count -ne 1 -or @($destinationPolicy.rules).Count
