<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="594" viewBox="0 0 1148 594" role="img" aria-labelledby="lab08-title lab08-desc">
  <title id="lab08-title">LAB-08 architecture: Manage Blob lifecycle, tiers, versioning, replication, and AzCopy</title>
  <desc id="lab08-desc">Left-to-right service topology with 9 components and 9 directed relationships. Components: AzCopy AZCLI token, Source container, Source account versioning and change feed, Object replication policy, Destination container, Destination account versioning and change feed, Lifecycle policy Cool and version expiry, Soft delete both accounts, run.json policy ID. Relationships: AzCopy AZCLI token to Source container (two revisions); Source account versioning and change feed to Source container; Source container to Object replication policy (matching policy ID); Object replication policy to Destination container (asynchronous copies); Destination account versioning and change feed to Destination container; Lifecycle policy Cool and version expiry to Source container; Soft delete both accounts to Source account versioning and change feed; Soft delete both accounts to Destination account versioning and change feed; run.json policy ID to Object replication policy (source copy first at cleanup).</desc>
  <metadata id="lab08-metadata">{&quot;renderer&quot;:&quot;az104-mermaid-flowchart-svg/1.0.0&quot;,&quot;source&quot;:&quot;architecture.mmd&quot;,&quot;sourceSha256&quot;:&quot;f8be96e274231d79b5041db2a60d594bd6461b0add31703be875609f6ae02634&quot;}</metadata>
