    B: 'Correct. The lab establishes this design principle: A load-balancing rule depends on a healthy probe and reachable
      backend, while Network Watcher distinguishes DNS, routing, NSG, guest firewall, and application-listener failures.'
    C: This choice changes or trusts a broader scope than the recorded lab boundary.
    D: This choice skips independent evidence or relies on ambiguous resource identity.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/load-balancer/quickstart-load-balancer-standard-public-powershell
  lastVerified: '2026-08-30'
