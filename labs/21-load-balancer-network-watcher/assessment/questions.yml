  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "A network operations administrator publishing a resilient HTTP backend is updating the backend readiness runbook. The requirement is to expose one ingress IP for incoming balanced traffic. Which statement describes Azure behavior correctly?"
  options:
    A: "A backend pool identifies the NIC configurations or IP addresses eligible to receive balanced flows."
    B: "Standard Load Balancer health probes use the AzureLoadBalancer service tag and must reach the probed backend port through effective NSG rules."
    C: "When every backend probe is unhealthy, the load balancer cannot select a healthy target for new client flows."
    D: "A load-balancer frontend IP configuration is the client-facing address used by load-balancing and inbound NAT rules."
  correctOption: "D"
  optionExplanations:
    A: "A backend pool identifies the NIC configurations or IP addresses eligible to receive balanced flows. In the resilient HTTP backend publication, this statement describes backend address pools. Resilient HTTP backend publication asks about load balancer frontends; this backend address pools choice leaves the load balancer frontends explanation missing."
    B: "Standard Load Balancer health probes use the AzureLoadBalancer service tag and must reach the probed backend port through effective NSG rules. In the resilient HTTP backend publication, this statement describes health probe NSG traffic. The health probe NSG traffic statement accurately describes health probe NSG traffic; however, resilient HTTP backend publication needs load balancer frontends to expose one ingress IP for incoming balanced traffic; health probe NSG traffic cannot replace load balancer frontends."
    C: "When every backend probe is unhealthy, the load balancer cannot select a healthy target for new client flows. In the resilient HTTP backend publication, this statement describes all-backend probe failure. Selecting all-backend probe failure for resilient HTTP backend publication leaves load balancer frontends unanswered in resilient HTTP backend publication; the resilient HTTP backend publication lacks a load balancer frontends basis to expose one ingress IP for incoming balanced traffic."
    D: "A load-balancer frontend IP configuration is the client-facing address used by load-balancing and inbound NAT rules. In the resilient HTTP backend publication, this load balancer frontends rule supports the need to expose one ingress IP for incoming balanced traffic."
  sources:
    - title: "Azure Load Balancer components"
      url: "https://learn.microsoft.com/en-us/azure/load-balancer/components"
