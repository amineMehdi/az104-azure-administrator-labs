  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "The actionable alert-routing design acceptance criteria require operators to evaluate a numeric signal against a threshold over a defined window. Which service fact supports that requirement?"
  options:
    A: "An alert rule evaluates only the resources included in its configured scopes and supported regional model."
    B: "An alert processing rule can suppress actions for matching fired alerts without disabling alert evaluation."
    C: "A metric alert evaluates a metric, aggregation, operator, threshold, window, and frequency against one or more scopes."
    D: "A stateful metric alert fires when its condition is met and resolves after the signal no longer meets the rule's resolution logic."
  correctOption: "C"
  optionExplanations:
    A: "An alert rule evaluates only the resources included in its configured scopes and supported regional model. In the actionable alert-routing design, this statement describes alert target scopes. Actionable alert-routing design asks about metric alert conditions; this alert target scopes choice leaves the metric alert conditions explanation missing."
    B: "An alert processing rule can suppress actions for matching fired alerts without disabling alert evaluation. In the actionable alert-routing design, this statement describes alert suppression rules. The alert suppression rules statement accurately describes alert suppression rules; however, actionable alert-routing design needs metric alert conditions to evaluate a numeric signal against a threshold over a defined window; alert suppression rules cannot replace metric alert conditions."
    C: "A metric alert evaluates a metric, aggregation, operator, threshold, window, and frequency against one or more scopes. The actionable alert-routing design applies that metric alert conditions boundary when operators must evaluate a numeric signal against a threshold over a defined window."
    D: "A stateful metric alert fires when its condition is met and resolves after the signal no longer meets the rule's resolution logic. In the actionable alert-routing design, this statement describes stateful metric alerts. Metric alert conditions governs actionable alert-routing design; stateful metric alerts cannot support metric alert conditions when operators must evaluate a numeric signal against a threshold over a defined window."
  sources:
    - title: "Azure Monitor metric alerts"
      url: "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types"
  lastVerified: "2026-08-31"
