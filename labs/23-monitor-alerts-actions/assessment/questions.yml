- id: LAB23-Q01
  objectiveIds:
  - MR-MONITOR-04
  difficulty: foundational
  stem: Which principle is most important when working on 'Set up alert rules, action groups, and alert processing rules in
    Azure Monitor' in Lab 23?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: Alert rules evaluate signals, action groups deliver notifications or automation, and processing rules change action
      behavior without disabling signal evaluation.
  correctOption: D
  explanation: 'The lab establishes this design principle: Alert rules evaluate signals, action groups deliver notifications
    or automation, and processing rules change action behavior without disabling signal evaluation.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: 'Correct. The lab establishes this design principle: Alert rules evaluate signals, action groups deliver notifications
      or automation, and processing rules change action behavior without disabling signal evaluation.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
  lastVerified: '2026-08-30'
