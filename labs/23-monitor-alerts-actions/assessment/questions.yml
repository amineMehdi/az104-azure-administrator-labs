    C: "The actionable alert-routing design needs alert target scopes to attach an alert rule to the resource that emits the monitored signal; this option states the applicable alert target scopes rule: an alert rule evaluates only the resources included in its configured scopes and supported regional model."
    D: "Dynamic-threshold metric alerts learn historical behavior and require enough suitable data before producing meaningful anomaly decisions. In the actionable alert-routing design, this statement describes dynamic thresholds. Actionable alert-routing design asks about alert target scopes; this dynamic thresholds choice leaves the alert target scopes explanation missing."
