<svg xmlns="http://www.w3.org/2000/svg" width="1148" height="818" viewBox="0 0 1148 818" role="img" aria-labelledby="lab09-title lab09-desc">
  <title id="lab09-title">LAB-09 architecture: Configure Azure Files, snapshots, soft delete, and identity access</title>
  <desc id="lab09-desc">Left-to-right service topology with 10 components and 9 directed relationships. Components: Azure CLI control plane, StorageV2 account, Bounded SMB file share, Account key memory only, Share snapshot after content, Seven-day soft delete, Approved Entra principal, Azure Files SMB endpoint, SMB Share Contributor exact share scope, Tenant consent, CA, client and ACL gates. Relationships: Azure CLI control plane to StorageV2 account; StorageV2 account to Bounded SMB file share; Account key memory only to Bounded SMB file share (bootstrap sample); Bounded SMB file share to Share snapshot after content; Seven-day soft delete to Bounded SMB file share (delete and restore); Approved Entra principal to Azure Files SMB endpoint (Kerberos ticket); Azure Files SMB endpoint to Bounded SMB file share; SMB Share Contributor exact share scope to Bounded SMB file share (authorizes principal); Tenant consent, CA, client and ACL gates to Azure Files SMB endpoint.</desc>
