  difficulty: foundational
  stem: Which principle is most important when working on 'Configure identity-based access for Azure Files' in Lab 09?
  options:
    A: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    B: Share snapshots and soft delete solve different recovery problems, while identity-based SMB authentication requires
      an approved directory source and data-plane authorization.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: The shortest command is always correct even when it changes a broader scope.
  correctOption: B
  explanation: 'The lab establishes this design principle: Share snapshots and soft delete solve different recovery problems,
    while identity-based SMB authentication requires an approved directory source and data-plane authorization.'
  distractorExplanations:
    A: This choice skips independent evidence or relies on ambiguous resource identity.
    B: 'Correct. The lab establishes this design principle: Share snapshots and soft delete solve different recovery problems,
      while identity-based SMB authentication requires an approved directory source and data-plane authorization.'
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/storage/files/storage-how-to-create-file-share
  lastVerified: '2026-08-30'
