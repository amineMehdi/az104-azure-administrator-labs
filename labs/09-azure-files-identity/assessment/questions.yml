    B: "For identity-based SMB access, effective authorization combines share-level permission with Windows ACLs."
    C: "An Azure file share quota limits the maximum provisioned capacity for that share."
    D: "Soft delete retains a deleted file share for the configured retention period but does not replace file-level snapshots."
  correctOption: "C"
  optionExplanations:
    A: "The enabled file-share protocol and account configuration determine which clients and identity options can connect. In the recoverable team file share, this statement describes SMB and NFS share protocols. Recoverable team file share asks about file share quota; this SMB and NFS share protocols choice leaves the file share quota explanation missing."
    B: "For identity-based SMB access, effective authorization combines share-level permission with Windows ACLs. In the recoverable team file share, this statement describes file and directory ACLs. The file and directory ACLs statement accurately describes file and directory ACLs; however, recoverable team file share needs file share quota to cap the capacity available to a team file share; file and directory ACLs cannot replace file share quota."
    C: "For the recoverable team file share, the rule for file share quota is defined by this statement: an Azure file share quota limits the maximum provisioned capacity for that share. It supports the required outcome to cap the capacity available to a team file share."
    D: "Soft delete retains a deleted file share for the configured retention period but does not replace file-level snapshots. In the recoverable team file share, this statement describes file share soft delete. File share quota governs recoverable team file share; file share soft delete cannot support file share quota when operators must cap the capacity available to a team file share."
