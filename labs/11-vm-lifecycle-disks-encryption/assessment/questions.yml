    D: "A managed disk snapshot is a point-in-time copy used to create another disk and should be coordinated with application consistency needs. In the secured Linux VM maintenance window, this statement describes managed disk snapshots. The managed disk snapshots statement accurately describes managed disk snapshots; however, secured Linux VM maintenance window needs encryption at host to encrypt supported host caches and temporary storage at the compute host; managed disk snapshots cannot replace encryption at host."
