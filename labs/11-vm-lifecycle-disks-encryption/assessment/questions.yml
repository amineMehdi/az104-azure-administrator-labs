  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "A compute administrator maintaining a secured Linux VM is updating the VM maintenance runbook. The requirement is to choose a regionally available Marketplace image reference. Which statement describes Azure behavior correctly?"
  options:
    A: "A VM image determines the operating-system publisher, offer, SKU, version, and applicable purchase terms."
    B: "A VM network interface must reference a valid subnet and satisfy regional and attachment constraints."
    C: "Managed disk type and size determine supported performance, cost, and workload characteristics."
    D: "Some VM resizes require deallocation when the target size is unavailable on the current cluster."
  correctOption: "A"
  optionExplanations:
    A: "A VM image determines the operating-system publisher, offer, SKU, version, and applicable purchase terms. The secured Linux VM maintenance window applies that virtual machine image selection boundary when operators must choose a regionally available Marketplace image reference."
    B: "A VM network interface must reference a valid subnet and satisfy regional and attachment constraints. In the secured Linux VM maintenance window, this statement describes network interface dependency. The network interface dependency statement accurately describes network interface dependency; however, secured Linux VM maintenance window needs virtual machine image selection to choose a regionally available Marketplace image reference; network interface dependency cannot replace virtual machine image selection."
    C: "Managed disk type and size determine supported performance, cost, and workload characteristics. In the secured Linux VM maintenance window, this statement describes managed disk performance tiers. Selecting managed disk performance tiers for secured Linux VM maintenance window leaves virtual machine image selection unanswered in secured Linux VM maintenance window; the secured Linux VM maintenance window lacks a virtual machine image selection basis to choose a regionally available Marketplace image reference."
    D: "Some VM resizes require deallocation when the target size is unavailable on the current cluster. In the secured Linux VM maintenance window, this statement describes resize deallocation. Virtual machine image selection governs secured Linux VM maintenance window; resize deallocation cannot support virtual machine image selection when operators must choose a regionally available Marketplace image reference."
  sources:
    - title: "Find Azure Marketplace image information with Azure CLI"
      url: "https://learn.microsoft.com/en-us/azure/virtual-machines/linux/cli-ps-findimage"
  lastVerified: "2026-08-31"
- id: "LAB11-Q02"
