    A: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    B: This choice changes or trusts a broader scope than the recorded lab boundary.
    C: This choice skips independent evidence or relies on ambiguous resource identity.
    D: 'Correct. The lab establishes this design principle: VM resize can require deallocation, managed disks have independent
      lifecycles, and encryption at host depends on subscription registration, region, and VM size support.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/linux/quick-create-cli
  lastVerified: '2026-08-30'
