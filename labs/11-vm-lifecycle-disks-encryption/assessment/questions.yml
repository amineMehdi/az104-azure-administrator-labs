  difficulty: foundational
  stem: Which principle is most important when working on 'Create a virtual machine' in Lab 11?
  options:
    A: A recognizable resource name removes the need for validation and scoped cleanup.
    B: The shortest command is always correct even when it changes a broader scope.
    C: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    D: VM resize can require deallocation, managed disks have independent lifecycles, and encryption at host depends on subscription
      registration, region, and VM size support.
  correctOption: D
