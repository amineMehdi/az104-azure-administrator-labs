  difficulty: "foundational"
  stem: "A VM maintenance peer review asks how the secured Linux VM maintenance window should handle this outcome: attach the virtual machine to the intended subnet through its network interface. Which explanation is accurate?"
  options:
    A: "A VM network interface must reference a valid subnet and satisfy regional and attachment constraints."
    B: "Encryption at host encrypts supported VM host caches and temporary disks in addition to managed disk server-side encryption."
    C: "A managed data disk must be attached at a unique LUN and then initialized and mounted inside the guest."
    D: "A stopped VM can remain allocated and billed for compute, while a deallocated VM releases compute allocation."
  correctOption: "A"
  optionExplanations:
    A: "The secured Linux VM maintenance window needs network interface dependency to attach the virtual machine to the intended subnet through its network interface; this option states the applicable network interface dependency rule: a VM network interface must reference a valid subnet and satisfy regional and attachment constraints."
    B: "Encryption at host encrypts supported VM host caches and temporary disks in addition to managed disk server-side encryption. In the secured Linux VM maintenance window, this statement describes encryption at host. Selecting encryption at host for secured Linux VM maintenance window leaves network interface dependency unanswered in secured Linux VM maintenance window; the secured Linux VM maintenance window lacks a network interface dependency basis to attach the virtual machine to the intended subnet through its network interface."
    C: "A managed data disk must be attached at a unique LUN and then initialized and mounted inside the guest. In the secured Linux VM maintenance window, this statement describes attaching data disks. Network interface dependency governs secured Linux VM maintenance window; attaching data disks cannot support network interface dependency when operators must attach the virtual machine to the intended subnet through its network interface."
    D: "A stopped VM can remain allocated and billed for compute, while a deallocated VM releases compute allocation. In the secured Linux VM maintenance window, this statement describes stopped and deallocated states. Secured Linux VM maintenance window asks about network interface dependency; this stopped and deallocated states choice leaves the network interface dependency explanation missing."
