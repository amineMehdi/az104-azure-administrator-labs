  difficulty: "foundational"
  stem: "The slot release architecture note requires the App Service capacity and slot release environment to increase worker CPU or memory without adding worker instances. Which statement defines the relevant slot release boundary?"
  options:
    A: "Scaling up changes the App Service plan worker size or pricing tier for all apps on that plan."
    B: "Scaling out changes the number of worker instances available to apps on an App Service plan."
    C: "A deployment-slot setting remains with its slot during a swap instead of moving with swappable configuration."
    D: "Per-app scaling on supported plans controls how many plan workers a specific app can use but does not create a separate plan."
  correctOption: "A"
  optionExplanations:
    A: "The App Service capacity and slot release needs vertical plan scaling to increase worker CPU or memory without adding worker instances; this option states the applicable vertical plan scaling rule: scaling up changes the App Service plan worker size or pricing tier for all apps on that plan."
    B: "Scaling out changes the number of worker instances available to apps on an App Service plan. In the App Service capacity and slot release, this statement describes horizontal plan scaling. Vertical plan scaling governs App Service capacity and slot release; horizontal plan scaling cannot support vertical plan scaling when operators must increase worker CPU or memory without adding worker instances."
    C: "A deployment-slot setting remains with its slot during a swap instead of moving with swappable configuration. In the App Service capacity and slot release, this statement describes slot-specific settings. App Service capacity and slot release asks about vertical plan scaling; this slot-specific settings choice leaves the vertical plan scaling explanation missing."
    D: "Per-app scaling on supported plans controls how many plan workers a specific app can use but does not create a separate plan. In the App Service capacity and slot release, this statement describes per-app scaling. The per-app scaling statement accurately describes per-app scaling; however, App Service capacity and slot release needs vertical plan scaling to increase worker CPU or memory without adding worker instances; per-app scaling cannot replace vertical plan scaling."
