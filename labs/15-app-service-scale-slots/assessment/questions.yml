  difficulty: foundational
  stem: Which principle is most important when working on 'Provision an App Service plan' in Lab 15?
  options:
    A: App Service plan scale affects workers shared by apps, while deployment slots isolate deployable content
      and selected sticky configuration before a controlled swap.
    B: The shortest command is always correct even when it changes a broader scope.
    C: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: A
  explanation: 'The lab establishes this design principle: App Service plan scale affects workers shared by apps,
    while deployment slots isolate deployable content and selected sticky configuration before a controlled swap.'
  distractorExplanations:
    A: 'Correct. The lab establishes this design principle: App Service plan scale affects workers shared by apps,
      while deployment slots isolate deployable content and selected sticky configuration before a controlled swap.'
    B: This choice changes or trusts a broader scope than the recorded lab boundary.
    C: This choice skips independent evidence or relies on ambiguous resource identity.
    D: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/app-service/quickstart-powershell
  lastVerified: '2026-08-30'
