  difficulty: foundational
  stem: Which statement best captures the key design principle for scale app service and operate deployment slots?
  options:
    A: App Service plan scale affects workers shared by apps, while deployment slots isolate deployable content
      and selected sticky configuration before a controlled swap.
    B: Every related control is interchangeable, so choose whichever command is shortest.
    C: A command surface automatically supplies any missing authorization or configuration.
    D: Cleanup evidence is unnecessary when a resource group has a recognizable name.
  correctOption: A
  explanation: 'The lab''s central distinction is: App Service plan scale affects workers shared by apps, while
    deployment slots isolate deployable content and selected sticky configuration before a controlled swap.'
  distractorExplanations:
    A: 'Correct. The lab''s central distinction is: App Service plan scale affects workers shared by apps, while
      deployment slots isolate deployable content and selected sticky configuration before a controlled swap.'
    B: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    C: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
    D: This choice either exceeds the declared scope, skips required evidence, or confuses offline validation with
      live Azure state.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/app-service/quickstart-powershell
  lastVerified: '2026-08-30'
