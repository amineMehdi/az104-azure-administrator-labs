  checkpointIds:
    - "LAB15-CP01"
  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "For the App Service capacity and slot release, the slot release plan must understand which web apps share workers and scale together. Which statement about slot release belongs in the App Service capacity and slot release record?"
  options:
    A: "The App Service plan tier controls worker capability and features such as deployment slots, autoscale, backups, and private endpoints."
    B: "Metric autoscale uses threshold, aggregation, duration, cooldown, and capacity settings to adjust plan instances."
    C: "Swap with preview applies target-slot configuration to the source for validation before completing the swap."
    D: "Apps in one App Service plan share the plan's compute workers, region, operating-system type, and scaling boundary."
  correctOption: "D"
  optionExplanations:
    A: "The App Service plan tier controls worker capability and features such as deployment slots, autoscale, backups, and private endpoints. In the App Service capacity and slot release, this statement describes App Service pricing tiers. App Service capacity and slot release asks about App Service plan boundaries; this App Service pricing tiers choice leaves the App Service plan boundaries explanation missing."
    B: "Metric autoscale uses threshold, aggregation, duration, cooldown, and capacity settings to adjust plan instances. In the App Service capacity and slot release, this statement describes App Service autoscale rules. The App Service autoscale rules statement accurately describes App Service autoscale rules; however, App Service capacity and slot release needs App Service plan boundaries to understand which web apps share workers and scale together; App Service autoscale rules cannot replace App Service plan boundaries."
    C: "Swap with preview applies target-slot configuration to the source for validation before completing the swap. In the App Service capacity and slot release, this statement describes swap with preview. Selecting swap with preview for App Service capacity and slot release leaves App Service plan boundaries unanswered in App Service capacity and slot release; the App Service capacity and slot release lacks a App Service plan boundaries basis to understand which web apps share workers and scale together."
    D: "For the App Service capacity and slot release, the rule for App Service plan boundaries is defined by this statement: apps in one App Service plan share the plan's compute workers, region, operating-system type, and scaling boundary. It supports the required outcome to understand which web apps share workers and scale together."
  sources:
    - title: "Azure App Service plans overview"
      url: "https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans"
  lastVerified: "2026-08-31"
- id: "LAB15-Q02"
  objectiveIds:
    - "CP-APP-01"
  checkpointIds:
    - "LAB15-CP02"
  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "The slot release review compares four claims for the App Service capacity and slot release requirement to select a hosting tier that supplies the required production capabilities. Which claim is technically sound?"
  options:
    A: "Scaling up changes the App Service plan worker size or pricing tier for all apps on that plan."
    B: "The App Service plan tier controls worker capability and features such as deployment slots, autoscale, backups, and private endpoints."
    C: "A deployment slot is a live app with its own hostname and configurable settings that can be swapped with another slot."
    D: "An App Service app must match its plan's region and operating-system type and has a globally unique default hostname."
  correctOption: "B"
  optionExplanations:
    A: "Scaling up changes the App Service plan worker size or pricing tier for all apps on that plan. In the App Service capacity and slot release, this statement describes vertical plan scaling. The vertical plan scaling statement accurately describes vertical plan scaling; however, App Service capacity and slot release needs App Service pricing tiers to select a hosting tier that supplies the required production capabilities; vertical plan scaling cannot replace App Service pricing tiers."
    B: "The App Service plan tier controls worker capability and features such as deployment slots, autoscale, backups, and private endpoints. The App Service capacity and slot release applies that App Service pricing tiers boundary when operators must select a hosting tier that supplies the required production capabilities."
    C: "A deployment slot is a live app with its own hostname and configurable settings that can be swapped with another slot. In the App Service capacity and slot release, this statement describes deployment slots. App Service pricing tiers governs App Service capacity and slot release; deployment slots cannot support App Service pricing tiers when operators must select a hosting tier that supplies the required production capabilities."
    D: "An App Service app must match its plan's region and operating-system type and has a globally unique default hostname. In the App Service capacity and slot release, this statement describes web app creation. App Service capacity and slot release asks about App Service pricing tiers; this web app creation choice leaves the App Service pricing tiers explanation missing."
  sources:
    - title: "Azure App Service plans overview"
      url: "https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans"
  lastVerified: "2026-08-31"
- id: "LAB15-Q03"
