- id: LAB15-Q01
  objectiveIds:
  - CP-APP-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Provision an App Service plan' in Lab 15?
  options:
    A: The shortest command is always correct even when it changes a broader scope.
    B: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    C: A recognizable resource name removes the need for validation and scoped cleanup.
    D: App Service plan scale affects workers shared by apps, while deployment slots isolate deployable content and selected
      sticky configuration before a controlled swap.
  correctOption: D
  explanation: 'The lab establishes this design principle: App Service plan scale affects workers shared by apps, while deployment
    slots isolate deployable content and selected sticky configuration before a controlled swap.'
  distractorExplanations:
    A: This choice changes or trusts a broader scope than the recorded lab boundary.
    B: This choice skips independent evidence or relies on ambiguous resource identity.
    C: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    D: 'Correct. The lab establishes this design principle: App Service plan scale affects workers shared by apps, while deployment
      slots isolate deployable content and selected sticky configuration before a controlled swap.'
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/app-service/quickstart-powershell
  lastVerified: '2026-08-30'
