  <title id="lab15-title">LAB-15 architecture: Scale App Service and operate deployment slots</title>
  <desc id="lab15-desc">Left-to-right service topology with 9 components and 10 directed relationships. Components: Operator and Azure CLI, Linux App Service plan, Production slot, Staging slot, Autoscale profile, Reversible slot swap, Slot-sticky settings, Capacity, slot, and sticky assertions, Slot before plan cleanup. Relationships: Operator and Azure CLI to Linux App Service plan; Linux App Service plan to Production slot; Linux App Service plan to Staging slot; Autoscale profile to Linux App Service plan; Staging slot to Reversible slot swap; Reversible slot swap to Production slot; Slot-sticky settings to Staging slot; Production slot to Capacity, slot, and sticky assertions; Staging slot to Capacity, slot, and sticky assertions; Capacity, slot, and sticky assertions to Slot before plan cleanup.</desc>
