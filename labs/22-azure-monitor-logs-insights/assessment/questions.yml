      add curated collection and interpretation for particular resource types.
    B: The shortest command is always correct even when it changes a broader scope.
    C: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    D: A recognizable resource name removes the need for validation and scoped cleanup.
  correctOption: A
  explanation: 'The lab establishes this design principle: Metrics are numeric time series, logs are queryable records
    with ingestion delay and cost, and Insights packages add curated collection and interpretation for particular
    resource types.'
  distractorExplanations:
