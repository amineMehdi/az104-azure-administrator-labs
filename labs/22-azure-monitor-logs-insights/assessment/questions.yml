  difficulty: "foundational"
  stem: "The telemetry assessment review compares four claims for the evidence-based monitoring workspace requirement to decide whether a measurement belongs in metrics or queryable events. Which claim is technically sound?"
  options:
    A: "A metric chart or query combines samples using an aggregation over a selected time grain and interval."
    B: "Metrics are numeric time-series values, while logs contain timestamped records that support richer correlation and querying."
    C: "A Log Analytics workspace stores Azure Monitor Logs data with workspace configuration for access, retention, and cost behavior."
    D: "Azure Monitor Insights packages curated workbooks, metrics, logs, and configuration for supported resource types."
  correctOption: "B"
  optionExplanations:
    A: "A metric chart or query combines samples using an aggregation over a selected time grain and interval. In the evidence-based monitoring workspace, this statement describes metric aggregation and time grain. Evidence-based monitoring workspace asks about metrics and logs; this metric aggregation and time grain choice leaves the metrics and logs explanation missing."
    B: "The evidence-based monitoring workspace needs metrics and logs to decide whether a measurement belongs in metrics or queryable events; this option states the applicable metrics and logs rule: metrics are numeric time-series values, while logs contain timestamped records that support richer correlation and querying."
    C: "A Log Analytics workspace stores Azure Monitor Logs data with workspace configuration for access, retention, and cost behavior. In the evidence-based monitoring workspace, this statement describes Log Analytics workspaces. Selecting Log Analytics workspaces for evidence-based monitoring workspace leaves metrics and logs unanswered in evidence-based monitoring workspace; the evidence-based monitoring workspace lacks a metrics and logs basis to decide whether a measurement belongs in metrics or queryable events."
    D: "Azure Monitor Insights packages curated workbooks, metrics, logs, and configuration for supported resource types. In the evidence-based monitoring workspace, this statement describes Azure Monitor Insights. Metrics and logs governs evidence-based monitoring workspace; Azure Monitor Insights cannot support metrics and logs when operators must decide whether a measurement belongs in metrics or queryable events."
  sources:
    - title: "Azure Monitor data platform"
      url: "https://learn.microsoft.com/en-us/azure/azure-monitor/data-platform"
