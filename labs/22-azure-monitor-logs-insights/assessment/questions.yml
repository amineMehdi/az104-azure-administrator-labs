- id: LAB22-Q01
  objectiveIds:
  - MR-MONITOR-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Interpret metrics in Azure Monitor' in Lab 22?
  options:
    A: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
    B: A recognizable resource name removes the need for validation and scoped cleanup.
    C: Metrics are numeric time series, logs are queryable records with ingestion delay and cost, and Insights packages add
      curated collection and interpretation for particular resource types.
    D: The shortest command is always correct even when it changes a broader scope.
  correctOption: C
  explanation: 'The lab establishes this design principle: Metrics are numeric time series, logs are queryable records with
    ingestion delay and cost, and Insights packages add curated collection and interpretation for particular resource types.'
  distractorExplanations:
    A: This choice skips independent evidence or relies on ambiguous resource identity.
    B: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    C: 'Correct. The lab establishes this design principle: Metrics are numeric time series, logs are queryable records with
      ingestion delay and cost, and Insights packages add curated collection and interpretation for particular resource types.'
    D: This choice changes or trusts a broader scope than the recorded lab boundary.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/metrics-getting-started
  lastVerified: '2026-08-30'
