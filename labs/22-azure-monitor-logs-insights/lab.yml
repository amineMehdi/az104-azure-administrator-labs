- id: LAB22-CP04
  title: Generate a transaction and prove KQL ingestion
  purpose: Exercise the deterministic operational or denied path needed to generate a transaction and prove kql ingestion,
    then retain comparable before-and-after results.
  objectiveIds:
  - MR-MONITOR-05
  required: true
  expectedState: A harmless storage data-plane operation is followed by a bounded query that finds at least one matching AzureMetrics
    row for the exact resource ID.
  scriptMarkers:
    setup: LAB22-CP04
    validate: LAB22-CP04
    cleanup: LAB22-CP04
  validation:
    positive:
      id: cp04.positive
      description: Read the service properties for generate a transaction and prove KQL ingestion by using exact run-owned
        identifiers.
      command: '$validationId=''LAB22-CP04-positive''; $metricRows = az monitor log-analytics query --workspace $workspaceId
        --analytics-query "AzureMetrics | where TimeGenerated > ago(30m) | where ResourceId =~ ''$storageId'' | where MetricName
        == ''Transactions'' | summarize Rows=count()" --query "tables[0].rows[0][0]" --output tsv

        if (-not $metricRows -or [int]$metricRows -lt 1) { throw ''AzureMetrics contains no transaction row for the run-owned
        storage account.'' }'
      expected: A harmless storage data-plane operation is followed by a bounded query that finds at least one matching AzureMetrics
        row for the exact resource ID.
    negative:
      id: cp04.negative
      description: Search for conflicting, unowned, or excessive state after generate a transaction and prove KQL ingestion.
      command: '$validationId=''LAB22-CP04-negative''; $disabledMetrics = az monitor diagnostic-settings show --name "diag-$RunId"
        --resource $storageId --query ''metrics[?enabled==`false`] | length(@)'' --output tsv

