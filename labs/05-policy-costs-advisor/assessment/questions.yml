  remediationAnchor: "#task-1"
  difficulty: "foundational"
  stem: "For the policy-and-cost governance rollout, the cost governance plan must package a governance rule and apply it at the intended scope. Which statement about cost governance belongs in the policy-and-cost governance rollout record?"
  options:
    A: "An initiative groups multiple policy definitions so they can be assigned and reported together."
    B: "Modify can correct supported properties and existing resources require a remediation task with an authorized managed identity."
    C: "A policy definition expresses a rule, while an assignment applies that rule at a selected scope."
    D: "Budget notifications require supported contact emails, roles, or action groups at the budget scope."
  correctOption: "C"
  optionExplanations:
    A: "An initiative groups multiple policy definitions so they can be assigned and reported together. In the policy-and-cost governance rollout, this statement describes policy initiatives. Policy-and-cost governance rollout asks about policy definitions and assignments; this policy initiatives choice leaves the policy definitions and assignments explanation missing."
    B: "Modify can correct supported properties and existing resources require a remediation task with an authorized managed identity. In the policy-and-cost governance rollout, this statement describes modify and remediation. The modify and remediation statement accurately describes modify and remediation; however, policy-and-cost governance rollout needs policy definitions and assignments to package a governance rule and apply it at the intended scope; modify and remediation cannot replace policy definitions and assignments."
    C: "A policy definition expresses a rule, while an assignment applies that rule at a selected scope. In the policy-and-cost governance rollout, this policy definitions and assignments rule supports the need to package a governance rule and apply it at the intended scope."
    D: "Budget notifications require supported contact emails, roles, or action groups at the budget scope. In the policy-and-cost governance rollout, this statement describes budget notification contacts. Policy definitions and assignments governs policy-and-cost governance rollout; budget notification contacts cannot support policy definitions and assignments when operators must package a governance rule and apply it at the intended scope."
  sources:
    - title: "Azure Policy overview"
      url: "https://learn.microsoft.com/en-us/azure/governance/policy/overview"
  lastVerified: "2026-08-31"
- id: "LAB05-Q02"
