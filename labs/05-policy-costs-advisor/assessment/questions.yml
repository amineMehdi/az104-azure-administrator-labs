- id: LAB05-Q01
  objectiveIds:
  - IG-GOVERN-01
  difficulty: foundational
  stem: Which principle is most important when working on 'Implement and manage Azure Policy' in Lab 05?
  options:
    A: A recognizable resource name removes the need for validation and scoped cleanup.
    B: Policy compliance is eventually evaluated, budgets notify rather than stop spending, and Advisor recommendations remain
      advisory until an administrator acts.
    C: The shortest command is always correct even when it changes a broader scope.
    D: A successful sign-in automatically supplies every required Azure and Microsoft Entra role.
  correctOption: B
  explanation: 'The lab establishes this design principle: Policy compliance is eventually evaluated, budgets notify rather
    than stop spending, and Advisor recommendations remain advisory until an administrator acts.'
  distractorExplanations:
    A: This choice conflicts with the lab's authorization, safety, or truthful-status contract.
    B: 'Correct. The lab establishes this design principle: Policy compliance is eventually evaluated, budgets notify rather
      than stop spending, and Advisor recommendations remain advisory until an administrator acts.'
    C: This choice changes or trusts a broader scope than the recorded lab boundary.
    D: This choice skips independent evidence or relies on ambiguous resource identity.
  sourceUrls:
  - https://learn.microsoft.com/en-us/azure/governance/policy/assign-policy-powershell
  lastVerified: '2026-08-30'
