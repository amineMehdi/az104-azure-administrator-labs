    B: "A forecast threshold warns when projected spend is expected to cross a percentage of the budget."
    C: "Azure Policy compliance state can lag a change until the next evaluation or an explicit scan completes."
    D: "A management-group policy assignment affects descendant subscriptions except explicitly excluded scopes."
  correctOption: "C"
  optionExplanations:
    A: "The deny effect rejects a noncompliant create or update request before the resource provider completes it. In the policy-and-cost governance rollout, this statement describes deny policy effect. Selecting deny policy effect for policy-and-cost governance rollout leaves policy compliance evaluation unanswered in policy-and-cost governance rollout; the policy-and-cost governance rollout lacks a policy compliance evaluation basis to measure existing resources against an assigned governance rule."
    B: "A forecast threshold warns when projected spend is expected to cross a percentage of the budget. In the policy-and-cost governance rollout, this statement describes forecast budget alerts. Policy compliance evaluation governs policy-and-cost governance rollout; forecast budget alerts cannot support policy compliance evaluation when operators must measure existing resources against an assigned governance rule."
    C: "Azure Policy compliance state can lag a change until the next evaluation or an explicit scan completes. The policy-and-cost governance rollout applies that policy compliance evaluation boundary when operators must measure existing resources against an assigned governance rule."
    D: "A management-group policy assignment affects descendant subscriptions except explicitly excluded scopes. In the policy-and-cost governance rollout, this statement describes governance scope and exclusions. The governance scope and exclusions statement accurately describes governance scope and exclusions; however, policy-and-cost governance rollout needs policy compliance evaluation to measure existing resources against an assigned governance rule; governance scope and exclusions cannot replace policy compliance evaluation."
