  remediationAnchor: "#task-2"
  difficulty: "foundational"
  stem: "The cost governance review compares four claims for the policy-and-cost governance rollout requirement to deploy several related governance rules as one versioned assignment. Which claim is technically sound?"
  options:
    A: "Azure Policy compliance state can lag a change until the next evaluation or an explicit scan completes."
    B: "An Azure budget tracks actual or forecast cost and sends notifications but does not stop resource consumption."
    C: "Azure Advisor analyzes resource use and publishes recommendations; it does not automatically apply cost changes."
    D: "An initiative groups multiple policy definitions so they can be assigned and reported together."
  correctOption: "D"
  optionExplanations:
    A: "Azure Policy compliance state can lag a change until the next evaluation or an explicit scan completes. In the policy-and-cost governance rollout, this statement describes policy compliance evaluation. The policy compliance evaluation statement accurately describes policy compliance evaluation; however, policy-and-cost governance rollout needs policy initiatives to deploy several related governance rules as one versioned assignment; policy compliance evaluation cannot replace policy initiatives."
    B: "An Azure budget tracks actual or forecast cost and sends notifications but does not stop resource consumption. In the policy-and-cost governance rollout, this statement describes budget behavior. Selecting budget behavior for policy-and-cost governance rollout leaves policy initiatives unanswered in policy-and-cost governance rollout; the policy-and-cost governance rollout lacks a policy initiatives basis to deploy several related governance rules as one versioned assignment."
    C: "Azure Advisor analyzes resource use and publishes recommendations; it does not automatically apply cost changes. In the policy-and-cost governance rollout, this statement describes Advisor cost recommendations. Policy initiatives governs policy-and-cost governance rollout; Advisor cost recommendations cannot support policy initiatives when operators must deploy several related governance rules as one versioned assignment."
    D: "For the policy-and-cost governance rollout, the rule for policy initiatives is defined by this statement: an initiative groups multiple policy definitions so they can be assigned and reported together. It supports the required outcome to deploy several related governance rules as one versioned assignment."
  sources:
    - title: "Azure Policy initiative definition structure"
      url: "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/initiative-definition-structure"
